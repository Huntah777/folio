/* ── SyncSettings (Admin → Sync tab) ── */
function SyncSettings({ onConnected, onSync, syncStatus }) {
  const [token, setToken] = useState(Sync.getToken() || '');
  const [status, setStatus] = useState('');

  const save = async e => {
    e.preventDefault();
    const t = token.trim();
    if (!t) { Sync.setToken(null); setStatus('cleared'); return; }
    Sync.setToken(t);
    setStatus('testing…');
    try {
      const remote = await Sync.load();
      setStatus('✓ Connected!');
      onConnected && onConnected(remote);
    } catch(err) {
      if (err.message === 'UNAUTHORIZED') {
        const health = await fetch('/api/health').then(r => r.json()).catch(() => ({}));
        setStatus(!health.sync_configured
          ? '✗ Server SYNC_TOKEN not set — add it in Cloudflare Pages → Settings → Environment variables (Production)'
          : '✗ Wrong token — must match SYNC_TOKEN exactly');
      } else if (err.message === 'HTTP_413') {
        setStatus('✗ Data too large to sync (over 5 MB)');
      } else if (err.message.startsWith('HTTP_5')) {
        setStatus('✗ Server error — check D1 binding in Cloudflare Pages');
      } else {
        setStatus('✗ Could not reach API');
      }
    }
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:18,maxWidth:520}}>
      <div style={{fontSize:12,color:'var(--text-secondary)'}}>Connect to Cloudflare D1 for cross-device sync.</div>

      {Sync.configured() && onSync && (
        <div style={{padding:'12px 14px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <div style={{fontSize:12}}>
            <span style={{color:syncStatus==='synced'?'var(--success)':syncStatus==='offline'?'var(--danger)':syncStatus==='unauth'?'var(--warning)':'var(--text-secondary)',fontWeight:600}}>
              {syncStatus==='synced'?'Synced':syncStatus==='syncing'?'Syncing…':syncStatus==='saving'?'Saving…':syncStatus==='offline'?'Offline':syncStatus==='unauth'?'Auth error':'Connected'}
            </span>
            <span style={{color:'var(--text-muted)',marginLeft:6}}>· pull latest from D1</span>
          </div>
          <button type="button" onClick={onSync}
            style={{background:'linear-gradient(135deg,var(--accent),var(--accent-strong))',border:'none',borderRadius:7,color:'#fff',fontSize:12,fontWeight:700,padding:'6px 14px',cursor:'pointer',fontFamily:'Manrope,sans-serif',flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
            <svg style={{width:11,height:11,animation:(syncStatus==='syncing'||syncStatus==='saving')?'spin 0.8s linear infinite':'none'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            Sync now
          </button>
        </div>
      )}

      <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:6}}>Sync token <span style={{color:'var(--text-muted)'}}>(set as SYNC_TOKEN in Cloudflare Pages env vars)</span></label>
          <input className="input" type="password" value={token} onChange={e=>setToken(e.target.value)}
            placeholder="Paste your secret token…"/>
        </div>
        {status && (
          <div style={{fontSize:12,color:status.startsWith('✓')?'var(--success)':status.startsWith('✗')?'var(--danger)':'var(--warning)',wordBreak:'break-word',overflowWrap:'anywhere'}}>{status}</div>
        )}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          {token && <button type="button" className="btn-ghost" onClick={()=>{Sync.setToken(null);setToken('');setStatus('cleared');}}>Disconnect</button>}
          <button type="submit" className="btn-primary">Save &amp; test</button>
        </div>
      </form>
    </div>
  );
}

/* ── NotificationsSettings (Admin → Notifications tab) ──
   Subscribe control + real diagnostics (what THIS device thinks vs. what the
   SERVER has on file — they can disagree for weeks with no error, see the
   GET handler in functions/api/push.js) + a local test notification, plus a
   view of what's coming up and what's actually fired recently. */
function NotificationsSettings({ state }) {
  const [notifPerm, setNotifPerm] = useState(() => ('Notification' in window) ? Notification.permission : 'denied');
  const [enabling, setEnabling]   = useState(false);
  const [deviceSub, setDeviceSub] = useState(null);   /* null=checking, false=none, PushSubscription */
  const [serverInfo, setServerInfo] = useState(null); /* null=checking, false=not registered, {updatedAt,sentToday} */
  const [pushBusy, setPushBusy]   = useState(false);
  const [msg, setMsg]             = useState(null);   /* plain string — reconnect and test share one slot */
  const [upcoming, setUpcoming]   = useState(null);
  const [history, setHistory]     = useState(null);

  const refreshDeviceStatus = useCallback(async () => {
    if (notifPerm !== 'granted' || !('serviceWorker' in navigator)) { setDeviceSub(false); return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      setDeviceSub(sub || false);
    } catch { setDeviceSub(false); }
  }, [notifPerm]);

  useEffect(() => { refreshDeviceStatus(); }, [refreshDeviceStatus]);

  useEffect(() => {
    if (deviceSub === null) return;
    if (!deviceSub) { setServerInfo(false); return; }
    const token = Sync.getToken();
    if (!token) { setServerInfo(false); return; }
    (async () => {
      try {
        const r = await fetch(`/api/push?id=${encodeURIComponent(deviceSub.endpoint)}`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await r.json();
        setServerInfo(data.registered ? data : false);
      } catch { setServerInfo(false); }
    })();
  }, [deviceSub]);

  useEffect(() => {
    (async () => {
      if (!state?.meetings) { setUpcoming([]); return; }
      try {
        const all = await buildSchedule(state.meetings, state.salah);
        const now = Date.now();
        setUpcoming(all.filter(n => n.fireAt > now).sort((a,b) => a.fireAt - b.fireAt).slice(0, 10));
      } catch { setUpcoming([]); }
    })();
  }, [state?.meetings, state?.salah]);

  useEffect(() => { readNotificationLog().then(setHistory); }, []);

  const enableNotifications = async () => {
    if (!('Notification' in window)) return;
    setEnabling(true);
    try {
      const perm = await Notification.requestPermission();
      setNotifPerm(perm);
      if (perm === 'granted') {
        scheduleNotifications(state);
        await activatePush();
        await refreshDeviceStatus();
      }
    } finally { setEnabling(false); }
  };

  /* Tear the existing subscription down and build a fresh one. Unsubscribing
     first matters: if the old subscription is the broken one, re-POSTing it
     would just re-register the same dead endpoint. */
  const reconnectPush = async () => {
    setPushBusy(true); setMsg(null);
    try {
      const reg = await navigator.serviceWorker.ready;
      const old = await reg.pushManager.getSubscription();
      if (old) {
        const token = Sync.getToken();
        if (token) {
          fetch('/api/push', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ endpoint: old.endpoint }),
          }).catch(()=>{});
        }
        await old.unsubscribe().catch(()=>{});
      }
      const ok = await registerPush();
      await refreshDeviceStatus();
      setMsg(ok
        ? 'Reconnected — this device is registered for background alerts.'
        : 'Could not reconnect. Check the sync token and notification permission.');
    } catch (e) {
      setMsg(e?.message || 'Could not reconnect.');
    }
    setPushBusy(false);
  };

  const sendTestNotification = async () => {
    setMsg(null);
    const ok = await showNotificationViaSW('Test notification', 'If you can see this, notifications are working on this device.', 'folio-test');
    setMsg(ok ? 'Sent — check your notification tray.' : 'Could not show a test notification.');
  };

  const fmtWhen = ms => new Date(ms).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

  return (
    <div style={{display:'flex',flexDirection:'column',gap:22,maxWidth:640}}>
      {notifPerm !== 'granted' ? (
        <div style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:13,fontWeight:600}}>Notifications are off</div>
            <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>Enable them for meeting and prayer-time alerts, even when Folio isn't open.</div>
          </div>
          <button className="btn-primary" onClick={enableNotifications} disabled={enabling}>{enabling ? 'Requesting…' : 'Enable notifications'}</button>
        </div>
      ) : (
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Status</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8}}>
              <span style={{fontSize:12,color:'var(--text-secondary)',flex:1}}>This device</span>
              {deviceSub===null && <span style={{fontSize:11,color:'var(--text-muted)'}}>checking…</span>}
              {deviceSub===false && <span style={{fontSize:11,color:'var(--text-muted)'}}>Not registered</span>}
              {deviceSub && <span style={{fontSize:11,fontWeight:700,color:'var(--warning)',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:4,padding:'2px 8px'}}>ACTIVE</span>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8,flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:'var(--text-secondary)',flex:1,minWidth:80}}>Server</span>
              {serverInfo===null && <span style={{fontSize:11,color:'var(--text-muted)'}}>checking…</span>}
              {serverInfo===false && <span style={{fontSize:11,color:'var(--text-muted)'}}>Not registered</span>}
              {serverInfo && (
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>
                  Confirmed {fmtWhen(serverInfo.updatedAt)} · {serverInfo.sentToday} sent today
                </span>
              )}
            </div>
            {/* A push subscription can be silently invalidated by the browser
                (site data cleared, PWA reinstalled, key rotation) and there's
                no event for most of these cases — the device just stops
                receiving. Re-subscribing is the fix. */}
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button type="button" className="btn-ghost" onClick={reconnectPush} disabled={pushBusy}>{pushBusy ? 'Reconnecting…' : 'Reconnect'}</button>
              <button type="button" className="btn-ghost" onClick={sendTestNotification}>Send test notification</button>
            </div>
            {msg && <div data-testid="push-msg" style={{fontSize:11,color:'var(--text-secondary)',padding:'6px 10px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:6}}>{msg}</div>}
          </div>
        </div>
      )}

      <div className="divider"/>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Upcoming</div>
        {!upcoming?.length ? (
          <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing scheduled in the next 14 days.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {upcoming.map(n=>(
              <div key={n.id} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'6px 10px',background:'var(--bg-surface)',borderRadius:7,fontSize:12}}>
                <span style={{color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</span>
                <span style={{color:'var(--text-muted)',flexShrink:0,fontFamily:'"JetBrains Mono",monospace'}}>{fmtWhen(n.fireAt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Recently delivered</div>
        {!history?.length ? (
          <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing delivered on this device yet.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {history.map((n,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'6px 10px',background:'var(--bg-surface)',borderRadius:7,fontSize:12}}>
                <span style={{color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</span>
                <span style={{color:'var(--text-muted)',flexShrink:0,fontFamily:'"JetBrains Mono",monospace'}}>{fmtWhen(n.firedAt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── DataSettings (Admin → Data tab) ── */
function DataSettings({ state, hydrate, replaceState }) {
  const [confirmClear, setConfirmClear] = useState(null); /* 'data' | 'cache' | null */
  const [pendingImportFile, setPendingImportFile] = useState(null);
  const [importMsg, setImportMsg] = useState(null);
  const fileInputRef = useRef(null);

  const exportState = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `folio-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const confirmImport = async () => {
    if (!pendingImportFile) return;
    try {
      const parsed = JSON.parse(await pendingImportFile.text());
      replaceState(tombMissing(state, hydrate(parsed)));
      setImportMsg({ text: 'Backup restored.' });
    } catch {
      setImportMsg({ text: "Could not read that file — is it a folio backup JSON?", error: true });
    }
    setPendingImportFile(null);
  };

  const clearLocalData = () => {
    localStorage.removeItem('folio_v1');
    window.location.reload();
  };
  const clearCacheAndReload = async () => {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations().catch(() => []);
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys().catch(() => []);
    await Promise.all(keys.map(k => caches.delete(k)));
    window.location.reload();
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:22,maxWidth:560}}>
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Backup</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>Download everything as a JSON file, or restore from one.</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button type="button" className="btn-ghost" onClick={exportState}>Export data</button>
            {!pendingImportFile && (
              <button type="button" className="btn-ghost" onClick={()=>fileInputRef.current?.click()}>Import data…</button>
            )}
            <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}}
              onChange={e=>{ const f=e.target.files?.[0]; e.target.value=''; setImportMsg(null); if (f) setPendingImportFile(f); }}/>
          </div>
          {pendingImportFile && (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--warning)',flex:1}}>Restoring "{pendingImportFile.name}" replaces current data — anything it doesn't have will be deleted on next sync.</span>
              <button type="button" onClick={()=>setPendingImportFile(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={confirmImport}
                style={{background:'var(--warning)',border:'none',borderRadius:6,color:'var(--bg-app)',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm restore</button>
            </div>
          )}
          {importMsg && <div style={{fontSize:11,color:importMsg.error?'var(--danger)':'var(--success)'}}>{importMsg.text}</div>}
        </div>
      </div>

      <div className="divider"/>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Reset</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>Use these if the PWA is showing stale data or won't load correctly.</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {confirmClear === 'data' ? (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--warning)',flex:1}}>This will delete local data and reload — sync will pull it back if connected.</span>
              <button type="button" onClick={()=>setConfirmClear(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={clearLocalData}
                style={{background:'var(--warning)',border:'none',borderRadius:6,color:'var(--bg-app)',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm</button>
            </div>
          ) : (
            <button type="button" onClick={()=>setConfirmClear('data')}
              style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:7,color:'var(--text-secondary)',fontSize:12,padding:'7px 12px',cursor:'pointer',textAlign:'left',fontFamily:'Manrope,sans-serif',transition:'all 120ms'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--warning)';e.currentTarget.style.color='var(--warning)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-strong)';e.currentTarget.style.color='var(--text-secondary)'}}>
              Clear local data &amp; reload
              <span style={{display:'block',fontSize:10,color:'var(--text-muted)',marginTop:1}}>Removes cached app state — re-pulled from D1 on next open</span>
            </button>
          )}

          {confirmClear === 'cache' ? (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--danger)',flex:1}}>This unregisters the service worker and clears all caches. App will reload fresh.</span>
              <button type="button" onClick={()=>setConfirmClear(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={clearCacheAndReload}
                style={{background:'var(--danger)',border:'none',borderRadius:6,color:'#fff',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm</button>
            </div>
          ) : (
            <button type="button" onClick={()=>setConfirmClear('cache')}
              style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:7,color:'var(--text-secondary)',fontSize:12,padding:'7px 12px',cursor:'pointer',textAlign:'left',fontFamily:'Manrope,sans-serif',transition:'all 120ms'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--danger)';e.currentTarget.style.color='var(--danger)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-strong)';e.currentTarget.style.color='var(--text-secondary)'}}>
              Clear PWA cache &amp; reload
              <span style={{display:'block',fontSize:10,color:'var(--text-muted)',marginTop:1}}>Unregisters service worker and wipes all cached assets — fixes stale PWA installs</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* Shared: delete cards with tombstones so the delete syncs. */
function deleteStudyCards(update, ids) {
  const set = new Set(ids), t = Date.now();
  update('cards', prev => (prev || []).filter(c => !set.has(c.id)));
  update('cardsDeleted', prev => [...(prev || []), ...ids.map(id => ({ id, deletedAt:t }))]);
}

/* Apply a blank-recall result to the note's recall card (created on first
   use). The card is the note's own spaced-repetition schedule for "write it
   all from memory", separate from its Q&A cards. */
function upsertRecallCard(F, state, update, note, { rating, coverage }) {
  const id = `r_${note.id}`, now = Date.now();
  const existing = (state.cards || []).find(c => c.id === id) || {
    id, kind:'recall', noteId:note.id, front:note.title || 'Untitled', back:'', fsrs:newCardFsrs(now),
    firstReview:null, suspended:false, created:now, updated:now,
  };
  const next = { ...rateCard(F, existing, rating, studyNum(state, 'retention')), front: note.title || existing.front, coverage, coverageAt: now };
  update('cards', prev => (prev || []).some(c => c.id === id) ? prev.map(c => c.id === id ? next : c) : [...(prev || []), next], { lazy:true });
}

function StudyView({ state, update, isMobile, flushSave }) {
  const { F, fsrsError } = useFsrs();
  const [screen, setScreen] = useState({ type:'home' });
  const [modal, setModal]   = useState(null);   /* {type:'new', scope?} | {type:'source', mode?} */
  const [jobs, setJobs]     = useState([]);
  const [busy, setBusy]     = useState(null);   /* {label, error?} */
  const [notice, setNotice] = useState(null);   /* {label, error?} */
  const [addingFolder, setAddingFolder] = useState(false);
  const stateRef = useRef(state);
  stateRef.current = state;
  const sets = state.studySets || [];
  const pendingJobs = jobs.filter(j => ['submitted','ended','collecting'].includes(j.status));
  const failedJobs  = jobs.filter(j => j.status === 'error');

  /* A transcript sent by the "Send to Folio" bookmarklet (see App). */
  useEffect(() => {
    const take = () => {
      const p = window.__folioYtImport;
      if (!p) return;
      window.__folioYtImport = null;
      setScreen({ type:'home' });
      setModal({ type:'source', mode:'youtube', prefill:p });
    };
    take();
    window.addEventListener('folio-yt-import', take);
    return () => window.removeEventListener('folio-yt-import', take);
  }, []);

  /* "Study this note/folder" from elsewhere arrives as ui.studyIntent and is
     consumed here (same hand-off pattern as ui.filterTag). */
  useEffect(() => {
    const intent = state.ui.studyIntent;
    if (!intent) return;
    update('ui', { ...state.ui, studyIntent:null });
    const existing = sets.find(s => sameScope(s.scope, intent.scope));
    if (existing) setScreen({ type:'set', setId:existing.id });
    else setModal({ type:'new', scope:intent.scope });
  }, [state.ui.studyIntent]);

  /* Cards whose note was deleted can never be reviewed again — tombstone
     them here, in one place, rather than in every note-delete path. */
  useEffect(() => {
    const noteIds = new Set(state.notes.map(n => n.id));
    const orphans = (state.cards || []).filter(c => !noteIds.has(c.noteId)).map(c => c.id);
    if (orphans.length) deleteStudyCards(update, orphans);
  }, []);

  const pollJobs = useCallback(async () => {
    if (!Sync.configured()) return [];
    try {
      const { jobs: list } = await StudyAPI.jobs();
      const done = list.filter(j => j.status === 'done' && j.result);
      if (done.length) {
        const msgs = [];
        for (const j of done) {
          const d = describeAdded(importStudyJob(stateRef.current, update, j));
          if (d) msgs.push(`${j.title || 'Study set'}: ${d}`);
        }
        await StudyAPI.ack(done.map(j => j.id)).catch(() => {});
        if (msgs.length) setNotice({ label:`Ready — ${msgs.join(' · ')}` });
      }
      const rest = list.filter(j => !(j.status === 'done' && j.result));
      setJobs(rest);
      return rest;
    } catch {
      return null;
    }
  }, [update]);

  useEffect(() => {
    let timer, stopped = false;
    const loop = async () => {
      const rest = await pollJobs();
      if (stopped) return;
      const pending = (rest || []).some(j => ['submitted','ended','collecting'].includes(j.status));
      timer = setTimeout(loop, pending ? 20000 : 120000);
    };
    loop();
    return () => { stopped = true; clearTimeout(timer); };
  }, [pollJobs]);

  const ensureSet = (scope, title, folderId = null) => {
    const cur = stateRef.current;
    const existing = (cur.studySets || []).find(s => sameScope(s.scope, scope));
    if (existing) return { id: existing.id, state: cur };
    const now = Date.now();
    const set = { id:uid(), title: title || scopeTitle(cur, scope), scope, folderId, sourceHashes:{}, quiz:[], exams:[], quizAttempts:[], created:now, updated:now };
    update('studySets', prev => [...(prev || []), set]);
    return { id: set.id, state: { ...cur, studySets: [...(cur.studySets || []), set] } };
  };

  const generate = async ({ setId, snapshot, kinds, noteIds, overrides, newOnly = true, examOptions, title }) => {
    if (busy && !busy.error) return null;
    setNotice(null);
    setBusy({ label:'Starting…' });
    try {
      const res = await runStudyGeneration({
        state: snapshot || stateRef.current, update, setId, kinds, noteIds, overrides, newOnly, examOptions, title,
        onProgress: label => setBusy({ label }),
      });
      setBusy(null);
      const parts = [];
      const d = describeAdded(res.added);
      if (d) parts.push(`Added ${d}`);
      if (res.submitted) parts.push('Batch queued — you’ll get a notification when it’s ready (usually a few minutes)');
      if (res.upToDate) parts.push('Already up to date — no notes have changed since the last cards were made');
      if (res.cost) parts.push(`cost ${fmtUsd(res.cost)}`);
      if (res.errors?.length) parts.push(res.errors.join(' · '));
      setNotice({ label: parts.join(' · '), error: !!res.errors?.length && !d && !res.submitted });
      if (res.submitted) pollJobs();
      return res;
    } catch (e) {
      setBusy({ label: studyErrorLabel(e), error:true });
      return null;
    }
  };

  const startReview = (noteIdSet, mode) => {
    const { queue } = buildStudyQueue(stateRef.current, noteIdSet);
    if (!queue.length) { setNotice({ label:'Nothing due right now — come back later, or add cards.' }); return; }
    setScreen({ type:'review', cardIds: queue.map(c => c.id), mode, back: screen });
  };

  const back = s => () => { setScreen(s || { type:'home' }); };

  /* ── sub-screens ── */
  if (screen.type === 'review') {
    return F
      ? <ReviewSession F={F} state={state} update={update} cardIds={screen.cardIds} mode={screen.mode}
          isMobile={isMobile} flushSave={flushSave} onExit={back(screen.back)}/>
      : <div style={{padding:32,color:'var(--text-muted)'}}>{fsrsError || 'Loading…'}</div>;
  }
  if (screen.type === 'recall') {
    const note = state.notes.find(n => n.id === screen.noteId);
    if (!note) return <div style={{padding:32}}><button className="btn-ghost" onClick={back(screen.back)}>Back</button></div>;
    return (
      <StudyPage isMobile={isMobile}>
        <BlankRecall state={state} update={update} note={note} isMobile={isMobile}
          onCancel={back(screen.back)}
          onDone={res => { if (F) upsertRecallCard(F, stateRef.current, update, note, res); flushSave?.(); setScreen(screen.back || { type:'home' }); }}/>
      </StudyPage>
    );
  }
  if (screen.type === 'quiz') {
    const set = sets.find(s => s.id === screen.setId);
    if (!set) return null;
    return <StudyPage isMobile={isMobile}><QuizRunner set={set} update={update} onExit={back(screen.back)}/></StudyPage>;
  }
  if (screen.type === 'exam') {
    const set = sets.find(s => s.id === screen.setId);
    const exam = set?.exams?.find(e => e.id === screen.examId);
    if (!set || !exam) return null;
    return <StudyPage isMobile={isMobile}><ExamRunner state={state} update={update} set={set} exam={exam} isMobile={isMobile} onExit={back(screen.back)}/></StudyPage>;
  }

  const banners = (<>
    {fsrsError && <StudyBanner error>Couldn’t load the scheduler ({fsrsError}). Reload the app to try again.</StudyBanner>}
    {busy && <StudyBanner busy={!busy.error} error={busy.error} onClose={busy.error ? ()=>setBusy(null) : null}>{busy.label}</StudyBanner>}
    {notice && !busy && <StudyBanner error={notice.error} onClose={()=>setNotice(null)}>{notice.label}</StudyBanner>}
  </>);

  const modals = (<>
    {modal?.type === 'new' && (
      <NewStudySetModal state={state} initialScope={modal.scope} onClose={()=>setModal(null)}
        onCreate={({ scope, title, kinds, overrides, examOptions }) => {
          const folderCtx = screen.type === 'folder' ? screen.folderId : null;
          const backCtx   = screen.type === 'folder' ? screen : null;
          setModal(null);
          const { id, state: snap } = ensureSet(scope, title, folderCtx);
          setScreen({ type:'set', setId:id, back: backCtx });
          if (kinds.length) generate({ setId:id, snapshot:snap, kinds, noteIds: scopeNoteIds(snap, scope), overrides, examOptions, title });
        }}/>
    )}
    {modal?.type === 'source' && (
      <StudySourceModal state={state} update={update} initialMode={modal.mode} prefill={modal.prefill} onClose={()=>setModal(null)}
        onCreated={({ note, kinds }) => {
          const folderCtx = screen.type === 'folder' ? screen.folderId : null;
          const backCtx   = screen.type === 'folder' ? screen : null;
          setModal(null);
          const cur = { ...stateRef.current, notes: stateRef.current.notes.some(n => n.id === note.id) ? stateRef.current.notes : [note, ...stateRef.current.notes] };
          stateRef.current = cur;
          const { id, state: snap } = ensureSet({ type:'note', id:note.id }, note.title, folderCtx);
          setScreen({ type:'set', setId:id, back: backCtx });
          if (kinds.length) generate({ setId:id, snapshot:snap, kinds, noteIds:[note.id], title: note.title });
        }}/>
    )}
  </>);

  if (screen.type === 'set') {
    const set = sets.find(s => s.id === screen.setId);
    if (!set) { setTimeout(() => setScreen({ type:'home' })); return null; }
    return (
      <StudyPage isMobile={isMobile}>
        {banners}
        <StudySetPage F={F} state={state} update={update} set={set} jobs={jobs} busy={busy} isMobile={isMobile}
          onBack={()=>setScreen(screen.back || { type:'home' })}
          onReview={(ids, mode) => startReview(ids, mode)}
          onRecall={noteId => setScreen({ type:'recall', noteId, back: screen })}
          onQuiz={() => setScreen({ type:'quiz', setId:set.id, back: screen })}
          onExam={examId => setScreen({ type:'exam', setId:set.id, examId, back: screen })}
          onGenerate={opts => generate({ setId:set.id, title:set.title, noteIds: scopeNoteIds(stateRef.current, set.scope), ...opts })}/>
        {modals}
      </StudyPage>
    );
  }

  if (screen.type === 'folder') {
    const folder = (state.studyFolders || []).find(f => f.id === screen.folderId);
    if (!folder) { setTimeout(() => setScreen({ type:'home' })); return null; }
    const folderSets = sets.filter(s => s.folderId === folder.id).sort((a,b) => b.updated - a.updated);
    const fNoteIds = new Set(folderSets.flatMap(s => scopeNoteIds(state, s.scope)));
    const fDue = buildStudyQueue(state, fNoteIds).due.length;
    return (
      <StudyPage isMobile={isMobile}>
        {banners}
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}}>
          <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12}} onClick={()=>setScreen({ type:'home' })}>← Study</button>
          <div style={{fontFamily:'Fraunces,serif',fontSize:isMobile?20:24,fontWeight:600}}>{folder.name}</div>
          <div style={{display:'flex',gap:8,marginLeft:'auto',flexWrap:'wrap',alignItems:'center'}}>
            {fDue > 0 && <span style={{fontSize:12,color:'var(--accent)'}}>{fDue} due</span>}
            <button className="btn-ghost" style={{fontSize:12}} onClick={()=>setModal({ type:'source', mode:'record' })}>● Record</button>
            <button className="btn-ghost" style={{fontSize:12}} onClick={()=>setModal({ type:'source', mode:'pdf' })}>Add material</button>
            <button className="btn-primary" style={{fontSize:12}} onClick={()=>setModal({ type:'new' })}>New set</button>
          </div>
        </div>
        {folderSets.length === 0 && <div style={studyMuted}>No study sets in this folder yet — open a set and assign it here.</div>}
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,minmax(0,1fr))',gap:12}}>
          {folderSets.map(s => {
            const ids = new Set(scopeNoteIds(state, s.scope));
            const q = buildStudyQueue(state, ids);
            const pending = pendingJobs.some(j => j.setId === s.id);
            const changed = studySetChangedNotes(state, s).length;
            return (
              <div key={s.id} className="card note-card" onClick={()=>setScreen({ type:'set', setId:s.id, back:screen })}>
                <div style={{fontSize:14,fontWeight:600,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
                <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:10}}>{scopeLabel(state, s.scope)} · {ids.size} note{ids.size===1?'':'s'}</div>
                <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:12,color:'var(--text-secondary)'}}>
                  <span><b style={{color:'var(--accent)'}}>{q.due.length}</b> due</span>
                  <span>{q.total} cards</span>
                  <span>{(s.quiz || []).length} quiz</span>
                  <span>{(s.exams || []).length} exam{(s.exams || []).length===1?'':'s'}</span>
                </div>
                {(pending || changed > 0) && (
                  <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                    {pending && <span className="pill" style={{padding:'3px 9px',fontSize:11}}>Generating…</span>}

                  </div>
                )}
              </div>
            );
          })}
        </div>
        {modals}
      </StudyPage>
    );
  }

  /* ── home ── */
  const { due, fresh, total } = buildStudyQueue(state);
  return (
    <StudyPage isMobile={isMobile}>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <div>
          <div style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600}}>Study</div>
          <div style={studyMuted}>Spaced-repetition flashcards, recall practice, quizzes and mock exams — made from your notes.</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn-ghost" onClick={()=>setModal({ type:'source', mode:'record' })}>● Record lecture</button>
          <button className="btn-ghost" onClick={()=>setModal({ type:'source', mode:'pdf' })}>Add material</button>
          <button className="btn-ghost" onClick={()=>setAddingFolder(true)}>New folder</button>
          <button className="btn-primary" onClick={()=>setModal({ type:'new' })}>New study set</button>

      <div className="card" style={{padding:'18px 20px',marginBottom:16}}>
        <div style={studyEyebrow('var(--accent)')}>Today</div>
        <div style={{display:'flex',gap:26,alignItems:'baseline',flexWrap:'wrap',margin:'10px 0 16px'}}>
          <StudyStat n={due.length} label="due" color="var(--accent)"/>
          <StudyStat n={fresh.length} label="new"/>
          <StudyStat n={total} label="cards in total" color="var(--text-secondary)"/>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn-primary" disabled={!F || !(due.length + fresh.length)} onClick={()=>startReview(null, 'flip')}>Review · flip cards</button>
          <button className="btn-ghost" disabled={!F || !(due.length + fresh.length)} onClick={()=>startReview(null, 'type')}>Review · type answers</button>
        </div>
        {total === 0 && (
          <div style={{...studyMuted,marginTop:12}}>
            No cards yet. Make a study set from a note, folder or tag — or record a lecture and Folio will write the notes and cards for you.
          </div>
        )}

      {(pendingJobs.length > 0 || failedJobs.length > 0) && (
        <div className="card" style={{padding:'14px 18px',marginBottom:16}}>
          <div style={{...studyEyebrow('var(--warning)'),marginBottom:8}}>In the batch queue</div>
          {pendingJobs.map(j => (
            <div key={j.id} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',fontSize:13}}>
              <span style={{width:10,height:10,borderRadius:99,border:'2px solid var(--warning)',borderTopColor:'transparent',animation:'spin 1s linear infinite',flexShrink:0}}/>
              <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.title || 'Study set'} · {j.kinds.map(k => studyKind(k)?.label || k).join(', ')}</span>
              <span style={{fontSize:11.5,color:'var(--text-muted)'}}>
                {j.counts ? `${j.counts.succeeded || 0}/${(j.counts.processing || 0) + (j.counts.succeeded || 0) + (j.counts.errored || 0)} done` : 'queued'}
              </span>
            </div>
          ))}
          {failedJobs.map(j => (
            <div key={j.id} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',fontSize:13,color:'var(--danger)'}}>
              <span style={{flex:1,minWidth:0}}>{j.title || 'Study set'} failed: {j.error || 'unknown error'}</span>
              <button className="btn-ghost" style={{padding:'4px 10px',fontSize:12}}
                onClick={()=>{ StudyAPI.ack([j.id]).catch(()=>{}); setJobs(js => js.filter(x => x.id !== j.id)); }}>Dismiss</button>
            </div>
          ))}
        </div>
      )}

      {/* ── Folders ── */}
      {((state.studyFolders || []).length > 0 || addingFolder) && (<>
        <div style={{...studyEyebrow('var(--text-secondary)'),margin:'22px 0 10px'}}>Folders</div>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,minmax(0,1fr))',gap:12,marginBottom:4}}>
          {[...(state.studyFolders || [])].sort((a,b) => a.name.localeCompare(b.name)).map(f => {
            const fSets = sets.filter(s => s.folderId === f.id);
            const fNoteIds = new Set(fSets.flatMap(s => scopeNoteIds(state, s.scope)));

            return (
              <div key={f.id} className="card note-card" onClick={()=>setScreen({ type:'folder', folderId:f.id })}>

              <form onSubmit={e => {
                e.preventDefault();

                if (name) { const t = Date.now(); update('studyFolders', prev => [...(prev || []), { id:uid(), name, created:t, updated:t }]); }

              }}>
                <input name="n" className="input" autoFocus placeholder="Folder name" style={{marginBottom:8,display:'block',width:'100%'}}

                <div style={{display:'flex',gap:6}}>
                  <button type="submit" className="btn-primary" style={{fontSize:12,padding:'5px 12px'}}>Create</button>
                  <button type="button" className="btn-ghost" style={{fontSize:12,padding:'5px 12px'}} onClick={()=>setAddingFolder(false)}>Cancel</button>
                </div>

      </>)}

      {/* ── Study sets ── */}
      <div style={{...studyEyebrow('var(--text-secondary)'),margin:'22px 0 10px'}}>Study sets</div>
      {sets.length === 0 && <div style={studyMuted}>No study sets yet.</div>}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,minmax(0,1fr))',gap:12}}>
        {(()=>{
          const folderIds = new Set((state.studyFolders || []).map(f => f.id));
          return [...sets].filter(s => !folderIds.has(s.folderId)).sort((a,b) => b.updated - a.updated).map(s => {
            const ids = new Set(scopeNoteIds(state, s.scope));
            const q = buildStudyQueue(state, ids);
            const pending = pendingJobs.some(j => j.setId === s.id);
            const changed = studySetChangedNotes(state, s).length;
            return (
              <div key={s.id} className="card note-card" onClick={()=>setScreen({ type:'set', setId:s.id })}>
                <div style={{fontSize:14,fontWeight:600,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
                <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:10}}>{scopeLabel(state, s.scope)} · {ids.size} note{ids.size===1?'':'s'}</div>
                <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:12,color:'var(--text-secondary)'}}>
                  <span><b style={{color:'var(--accent)'}}>{q.due.length}</b> due</span>
                  <span>{q.total} cards</span>
                  <span>{(s.quiz || []).length} quiz</span>
                  <span>{(s.exams || []).length} exam{(s.exams || []).length===1?'':'s'}</span>
                </div>
                {(pending || changed > 0) && (
                  <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                    {pending && <span className="pill" style={{padding:'3px 9px',fontSize:11}}>Generating…</span>}
                    {changed > 0 && <span className="pill" style={{padding:'3px 9px',fontSize:11,color:'var(--warning)'}}>{changed} note{changed===1?'':'s'} changed</span>}
                  </div>
                )}
              </div>
            );
          });
        })()}
      </div>
      {modals}
    </StudyPage>
  );
}

function StudyPage({ isMobile, children }) {
  return (
    <div style={{flex:1,minHeight:0,overflow:'auto'}} className="scrollbar">
      <div style={{maxWidth:880,margin:'0 auto',padding:isMobile?'18px 16px 48px':'28px 32px 64px'}}>{children}</div>
    </div>
  );
}

/* Notes in the set's scope whose content changed since their cards were
   made (only meaningful once cards have been generated for the set). */
function studySetChangedNotes(state, set) {
  const hashes = set.sourceHashes || {};
  if (!Object.keys(hashes).length) return [];
  return scopeNoteIds(state, set.scope).filter(id => {
    const n = state.notes.find(x => x.id === id);
    return n && hashes[id] !== noteHash(n);
  });
}

/* ── new study set ── */
function NewStudySetModal({ state, initialScope, onClose, onCreate }) {
  const [scopeType, setScopeType] = useState(initialScope?.type || 'folder');
  const [scopeId, setScopeId] = useState(initialScope?.id || '');
  const [title, setTitle] = useState('');
  const [kinds, setKinds] = useState({ flashcards:true, quiz:true, exam:false });
  const [overrides, setOverrides] = useState({});
  const [examOptions, setExamOptions] = useState({ durationMin:30, mcq:6, written:3 });

  const folders = state.folders || [];
  const folderOptions = useMemo(() => {
    const out = [];
    const walk = (nodes, depth) => nodes.forEach(n => { out.push({ id:n.id, label:`${'  '.repeat(depth)}${n.name}` }); walk(n.children || [], depth + 1); });
    walk(buildFolderTree(folders), 0);
    return out;
  }, [folders]);
  const tags = useMemo(() => [...new Set(state.notes.flatMap(n => n.tags || []))].sort(), [state.notes]);
  const notes = useMemo(() => [...state.notes].sort((a,b) => b.updated - a.updated), [state.notes]);

  useEffect(() => {
    if (initialScope && scopeType === initialScope.type) return;
    setScopeId(scopeType === 'folder' ? (folderOptions[0]?.id || '') : scopeType === 'tag' ? (tags[0] || '') : scopeType === 'note' ? (notes[0]?.id || '') : '');
  }, [scopeType]);

  const scope = scopeType === 'all' ? { type:'all', id:null } : { type:scopeType, id:scopeId };
  const noteIds = scopeNoteIds(state, scope);
  const chars = noteIds.reduce((s, id) => s + (state.notes.find(n => n.id === id)?.body?.length || 0), 0);
  const tokens = Math.ceil(chars / 3.5);
  const chosen = Object.keys(kinds).filter(k => kinds[k]);
  const cfgFor = k => ({ ...studyCfg(state, k), ...(overrides[k] || {}) });
  const estimate = chosen.reduce((sum, k) => {
    const cfg = cfgFor(k), m = studyModel(cfg.model);
    if (m.free) return sum;
    const out = k === 'flashcards' ? tokens * 0.5 : k === 'quiz' ? Math.min(tokens * 0.3, 6000) : 5000;
    return sum + ((tokens + 800) * m.price.in + out * (m.thinks ? 1.4 : 1) * m.price.out) / 1e6 / (cfg.batch ? 2 : 1);
  }, 0);
  const existing = (state.studySets || []).find(s => sameScope(s.scope, scope));

  return (
    <StudyModal title="New study set" onClose={onClose} width={560}>
      <div style={{...studyEyebrow('var(--text-secondary)'),marginBottom:8}}>What to study</div>
      <div className="seg" style={{marginBottom:10,flexWrap:'wrap'}}>
        {[['folder','Folder'],['tag','Tag'],['note','Note'],['all','All notes']].map(([id,label]) => (
          <button key={id} aria-pressed={scopeType===id} onClick={()=>setScopeType(id)}>{label}</button>
        ))}
      </div>
      {scopeType === 'folder' && (
        <select className="input" value={scopeId} onChange={e=>setScopeId(e.target.value)}>
          {folderOptions.length === 0 && <option value="">No folders yet</option>}
          {folderOptions.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
        </select>
      )}
      {scopeType === 'tag' && (
        <select className="input" value={scopeId} onChange={e=>setScopeId(e.target.value)}>
          {tags.length === 0 && <option value="">No tags in use</option>}
          {tags.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
      )}
      {scopeType === 'note' && (
        <select className="input" value={scopeId} onChange={e=>setScopeId(e.target.value)}>
          {notes.map(n => <option key={n.id} value={n.id}>{(n.emoji || '📝') + ' ' + (n.title || 'Untitled')}</option>)}
        </select>
      )}
      <div style={{...studyMuted,margin:'8px 0 16px'}}>
        {noteIds.length} note{noteIds.length===1?'':'s'}{scopeType==='folder' ? ' (including subfolders)' : ''} · about {tokens.toLocaleString()} tokens of text
        {existing && <> · <b style={{color:'var(--warning)'}}>a set for this already exists</b> — new material is added to it</>}
      </div>

      <div style={{...studyEyebrow('var(--text-secondary)'),marginBottom:4}}>Title</div>
      <input className="input" placeholder={scopeTitle(state, scope) || 'Study set'} value={title} onChange={e=>setTitle(e.target.value)} style={{marginBottom:16}}/>

      <div style={{...studyEyebrow('var(--text-secondary)'),marginBottom:8}}>Generate now</div>
      {['flashcards','quiz','exam'].map(k => (
        <div key={k} className="row-soft" style={{marginBottom:8,flexWrap:'wrap'}}>
          <label style={{display:'flex',alignItems:'center',gap:8,flex:'1 1 160px',cursor:'pointer',fontSize:13,fontWeight:600}}>
            <input type="checkbox" checked={!!kinds[k]} onChange={e=>setKinds(v=>({ ...v, [k]:e.target.checked }))}/>
            {studyKind(k).label}
          </label>
          {kinds[k] && <StudyModelPicker kindId={k} cfg={cfgFor(k)} onChange={cfg=>setOverrides(o=>({ ...o, [k]:cfg }))}/>}
          {k === 'exam' && kinds.exam && (
            <div style={{display:'flex',gap:8,width:'100%',flexWrap:'wrap',fontSize:12,color:'var(--text-secondary)'}}>
              <label>Minutes <input className="input" type="number" min="5" max="180" value={examOptions.durationMin} style={{width:70,padding:'4px 8px'}} onChange={e=>setExamOptions(o=>({ ...o, durationMin:Math.max(5, +e.target.value || 30) }))}/></label>
              <label>Multiple choice <input className="input" type="number" min="0" max="30" value={examOptions.mcq} style={{width:60,padding:'4px 8px'}} onChange={e=>setExamOptions(o=>({ ...o, mcq:Math.max(0, +e.target.value || 0) }))}/></label>
              <label>Written <input className="input" type="number" min="0" max="15" value={examOptions.written} style={{width:60,padding:'4px 8px'}} onChange={e=>setExamOptions(o=>({ ...o, written:Math.max(0, +e.target.value || 0) }))}/></label>
            </div>
          )}
        </div>
      ))}
      <div style={{...studyMuted,margin:'6px 0 16px'}}>
        Estimated cost {estimate ? `≈ ${fmtUsd(estimate)}` : 'free'} · defaults come from Admin → Study &amp; AI
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
        <button className="btn-ghost" onClick={onClose}>Cancel</button>
        <button className="btn-primary" disabled={!noteIds.length}
          onClick={()=>onCreate({ scope, title: title.trim(), kinds: chosen, overrides, examOptions })}>
          {chosen.length ? 'Create & generate' : 'Create set'}
        </button>
      </div>
    </StudyModal>
  );
}

/* ── study set page ── */
function StudySetPage({ F, state, update, set, jobs, busy, isMobile, onBack, onReview, onRecall, onQuiz, onExam, onGenerate }) {
  const [confirmDel, setConfirmDel] = useState(false);
  const [examOpts, setExamOpts] = useState({ durationMin:30, mcq:6, written:3 });
  const [renaming, setRenaming] = useState(false);
  const noteIds = scopeNoteIds(state, set.scope);
  const idSet = new Set(noteIds);
  const q = buildStudyQueue(state, idSet);
  const cards = (state.cards || []).filter(c => idSet.has(c.noteId));
  const changed = studySetChangedNotes(state, set);
  const pending = jobs.filter(j => j.setId === set.id && ['submitted','ended','collecting'].includes(j.status));
  const working = !!busy && !busy.error;

  const deleteSet = (withCards) => {
    const t = Date.now();
    update('studySets', prev => prev.filter(s => s.id !== set.id));
    update('studySetsDeleted', prev => [...(prev || []), { id:set.id, deletedAt:t }]);
    if (withCards) deleteStudyCards(update, cards.map(c => c.id));
    onBack();
  };
  const rename = e => {
    e.preventDefault();
    const v = e.target.elements.t.value.trim();
    if (v) update('studySets', prev => prev.map(s => s.id === set.id ? { ...s, title:v, updated:Date.now() } : s));
    setRenaming(false);
  };
  const deleteExam = id => update('studySets', prev => prev.map(s => s.id === set.id ? { ...s, exams:(s.exams || []).filter(e => e.id !== id), updated:Date.now() } : s));
  const cfgLabel = k => { const c = studyCfg(state, k); return `${studyModel(c.model).short}${c.batch ? ' · batch' : ''}`; };

  return (
    <div>
      <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12,marginBottom:14}} onClick={onBack}>← Study</button>

        <div style={{minWidth:0}}>
          {renaming
            ? <form onSubmit={rename}><input name="t" className="input" autoFocus defaultValue={set.title} onBlur={e=>e.target.form.requestSubmit()}/></form>
            : <div onClick={()=>setRenaming(true)} title="Rename" style={{fontFamily:'Fraunces,serif',fontSize:isMobile?21:25,fontWeight:600,cursor:'text',wordBreak:'break-word'}}>{set.title}</div>}
          <div style={studyMuted}>{scopeLabel(state, set.scope)} · {noteIds.length} note{noteIds.length===1?'':'s'} · {cards.filter(c=>c.kind==='qa').length} cards</div>
          {(state.studyFolders || []).length > 0 && (
            <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8,fontSize:12}}>
              <span style={{color:'var(--text-muted)'}}>Folder:</span>
              <select className="input" style={{fontSize:12,padding:'3px 8px',height:'auto'}} value={set.folderId || ''}
                onChange={e => update('studySets', prev => prev.map(s => s.id === set.id ? { ...s, folderId:e.target.value||null, updated:Date.now() } : s))}>
                <option value="">No folder</option>
                {[...(state.studyFolders || [])].sort((a,b) => a.name.localeCompare(b.name)).map(f => (
                  <option key={f.id} value={f.id}>{f.name}</option>
                ))}
              </select>
            </div>
          )}
        </div>
        {!confirmDel
          ? <button className="btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setConfirmDel(true)}>Delete set</button>
          : <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
              <button className="btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>deleteSet(false)}>Delete set, keep cards</button>
              <button className="btn-primary" style={{fontSize:12,padding:'6px 12px',background:'var(--danger)'}} onClick={()=>deleteSet(true)}>Delete set and {cards.length} cards</button>
              <button className="btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setConfirmDel(false)}>Cancel</button>
            </div>}
      </div>

      {pending.length > 0 && <StudyBanner busy>Generating in the batch queue — results appear here automatically.</StudyBanner>}
      {changed.length > 0 && (
        <StudyBanner>
          {changed.length} note{changed.length===1?' has':'s have'} changed since the cards were made.{' '}
          <button className="btn-ghost" style={{padding:'3px 10px',fontSize:12,marginLeft:6}} disabled={working}
            onClick={()=>onGenerate({ kinds:['flashcards'], newOnly:true })}>Add cards for the changes</button>
        </StudyBanner>
      )}

      <div className="card" style={{padding:'18px 20px',marginBottom:14}}>
        <div style={studyEyebrow('var(--accent)')}>Spaced repetition</div>
        <div style={{display:'flex',gap:24,alignItems:'baseline',flexWrap:'wrap',margin:'10px 0 14px'}}>

        <div className="card" style={{padding:'18px 20px'}}>
          <div style={studyEyebrow('var(--warning)')}>Mock exams</div>
          <div style={{margin:'8px 0 10px'}}>
            {(set.exams || []).length === 0 && <div style={studyMuted}>No exams yet.</div>}
            {(set.exams || []).map(ex => {
              const marks = ex.questions.reduce((s, q) => s + (q.marks || 1), 0);
              const last = (ex.attempts || []).slice(-1)[0];
              return (
                <div key={ex.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex.title}</div>
                    <div style={{fontSize:11.5,color:'var(--text-muted)'}}>{ex.durationMin} min · {ex.questions.length} questions · {marks} marks{last ? ` · last ${Math.round(last.score*10)/10}/${last.max}` : ''}</div>
                  </div>
                  <button className="btn-primary" style={{padding:'5px 12px',fontSize:12}} onClick={()=>onExam(ex.id)}>Start</button>
                  <button className="icon-btn danger" title="Delete exam" onClick={()=>deleteExam(ex.id)}>{Ic.trash}</button>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',fontSize:12,color:'var(--text-secondary)'}}>
            <select className="input" style={{width:'auto',padding:'5px 8px'}} value={examOpts.durationMin} onChange={e=>setExamOpts(o=>({ ...o, durationMin:+e.target.value }))}>
              {[15,30,45,60,90].map(m => <option key={m} value={m}>{m} min</option>)}
            </select>
            <button className="btn-ghost" disabled={working || !noteIds.length}
              onClick={()=>onGenerate({ kinds:['exam'], newOnly:false, examOptions:{ ...examOpts, mcq: Math.round(examOpts.durationMin / 5), written: Math.max(1, Math.round(examOpts.durationMin / 10)) } })}>
              New exam · {cfgLabel('exam')}
            </button>
          </div>
        </div>
      </div>

      <div style={{...studyEyebrow('var(--text-secondary)'),margin:'20px 0 8px'}}>Notes · blank-page recall</div>
      <div style={{...studyMuted,marginBottom:10}}>Write everything you remember about a note, then see what you missed. Each note gets its own recall schedule.</div>
      {noteIds.map(id => {
        const n = state.notes.find(x => x.id === id);
        if (!n) return null;
        const nc = cards.filter(c => c.noteId === id && c.kind === 'qa');
        const rc = cards.find(c => c.id === `r_${id}`);
        const dueRecall = rc && rc.fsrs.due <= Date.now();
        return (
          <div key={id} className="row-soft" style={{marginBottom:6,flexWrap:isMobile?'wrap':'nowrap'}}>
            <span style={{fontSize:16}}>{n.emoji || '📝'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title || 'Untitled'}</div>
              <div style={{fontSize:11.5,color:'var(--text-muted)'}}>
                {nc.length} card{nc.length===1?'':'s'}
                {rc ? ` · recall ${rc.coverage ?? '–'}% · ${dueRecall ? 'due now' : `next ${new Date(rc.fsrs.due).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`}` : ''}
              </div>
            </div>
            <button className={dueRecall ? 'btn-primary' : 'btn-ghost'} style={{padding:'5px 12px',fontSize:12}} onClick={()=>onRecall(id)}>Recall</button>
            <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12}} disabled={!F || !nc.length} onClick={()=>onReview(new Set([id]), 'flip')}>Cards</button>
          </div>
        );
      })}
    </div>
  );
}

/* ── review session ──
   Flip: answer in your head, reveal, rate. Type: write the answer first; an
   exact/near match is marked locally for free, anything else goes to the
   cardCheck model, which suggests a rating you can override. Ratings write
   with {lazy:true} so a long session doesn't re-upload the blob per card. */
function ReviewSession({ F, state, update, cardIds, mode: initialMode, isMobile, flushSave, onExit }) {
  const [queue, setQueue]       = useState(cardIds);
  const [pos, setPos]           = useState(0);
  const [mode, setMode]         = useState(initialMode);
  const [revealed, setRevealed] = useState(false);
  const [typed, setTyped]       = useState('');
  const [check, setCheck]       = useState(null);   /* {status, verdict?, feedback?, missing?, suggested?, message?} */
  const [history, setHistory]   = useState([]);
  const [stats, setStats]       = useState({ reviewed:0, again:0 });
  const [editing, setEditing]   = useState(null);   /* {front, back} */
  const [recalling, setRecalling] = useState(false);
  const checkFor = useRef(null);
  const answerRef = useRef(null);

  const cardsById = useMemo(() => new Map((state.cards || []).map(c => [c.id, c])), [state.cards]);
  /* Skip cards deleted mid-session (here or by a sync). */
  useEffect(() => {
    if (pos < queue.length && !cardsById.has(queue[pos])) setPos(p => p + 1);
  }, [pos, queue, cardsById]);
  useEffect(() => () => { flushSave?.(); }, []);

  const card = cardsById.get(queue[pos]);
  const note = card && state.notes.find(n => n.id === card.noteId);
  const retention = studyNum(state, 'retention');
  const intervals = useMemo(() => card ? previewIntervals(F, card, retention) : null, [card, retention]);

  const resetCardUi = () => { setRevealed(false); setTyped(''); setCheck(null); setEditing(null); setRecalling(false); checkFor.current = null; };

  const rate = useCallback((rating) => {
    if (!card) return;
    const now = new Date();
    const next = rateCard(F, card, rating, retention, now);
    setHistory(h => [...h.slice(-30), { prev: card, pos, queue, stats }]);
    update('cards', prev => prev.map(c => c.id === card.id ? next : c), { lazy:true });
    /* Short learning steps come back within this session, like Anki. */
    setQueue(q => next.fsrs.due - +now < 20 * 60 * 1000 ? [...q, card.id] : q);
    setPos(p => p + 1);
    setStats(s => ({ reviewed: s.reviewed + 1, again: s.again + (rating === 1 ? 1 : 0) }));
    resetCardUi();
  }, [card, pos, queue, stats, retention]);

  const undo = () => {
    const last = history[history.length - 1];
    if (!last) return;
    update('cards', prev => prev.map(c => c.id === last.prev.id ? { ...last.prev, updated: Date.now() } : c), { lazy:true });
    setQueue(last.queue); setPos(last.pos); setStats(last.stats);
    setHistory(h => h.slice(0, -1));
    resetCardUi();
  };

  const submitTyped = async () => {
    if (!card || !typed.trim() || revealed) return;
    setRevealed(true);
    if (fuzzyMatch(typed, card.back)) {
      setCheck({ status:'done', verdict:'correct', feedback:'Matches the answer.', suggested:3 });
      return;
    }
    if (!Sync.configured() || !navigator.onLine) { setCheck({ status:'self' }); return; }
    const id = card.id;
    checkFor.current = id;
    setCheck({ status:'checking' });
    try {
      const r = await StudyAPI.check({ model: studyCfg(state, 'cardCheck').model, question: card.front, expected: card.back, answer: typed });
      if (checkFor.current !== id) return;
      const v = r.result;
      setCheck({ status:'done', ...v, suggested: v.verdict === 'correct' ? 3 : v.verdict === 'partial' ? 2 : 1 });
    } catch (e) {
      if (checkFor.current === id) setCheck({ status:'error', message: studyErrorLabel(e) });
    }
  };

  useEffect(() => {
    const onKey = e => {
      if (editing || recalling) return;
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      if (inField) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitTyped(); }
        return;
      }
      if (e.key === 'Escape') { onExit(); return; }
      if ((e.key === 'z' || e.key === 'u') && !e.ctrlKey && !e.metaKey) { undo(); return; }
      if (!card) return;
      if (!revealed && (e.key === ' ' || e.key === 'Enter') && mode === 'flip') { e.preventDefault(); setRevealed(true); return; }
      if (revealed && ['1','2','3','4'].includes(e.key) && check?.status !== 'checking') { e.preventDefault(); rate(+e.key); return; }
      if (revealed && (e.key === ' ' || e.key === 'Enter') && check?.suggested) { e.preventDefault(); rate(check.suggested); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  useEffect(() => { if (mode === 'type' && card?.kind === 'qa' && !revealed) answerRef.current?.focus(); }, [pos, mode]);

  const done = pos >= queue.length;
  const remaining = queue.length - pos;

  if (recalling && card && note) {
    return (
      <StudyPage isMobile={isMobile}>
        <BlankRecall state={state} update={update} note={note} isMobile={isMobile}
          onCancel={()=>setRecalling(false)}
          onDone={res => { setRecalling(false); rate(res.rating); }}/>
      </StudyPage>
    );
  }

  return (
    <div style={{flex:1,minHeight:0,overflow:'auto',display:'flex',flexDirection:'column'}} className="scrollbar">
      <div style={{display:'flex',alignItems:'center',gap:10,padding:isMobile?'12px 16px':'14px 32px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12}} onClick={onExit}>← Done</button>
        <div style={{flex:1,height:4,borderRadius:99,background:'var(--fill)',overflow:'hidden'}}>
          <div style={{height:'100%',width:`${queue.length ? Math.min(100, pos / queue.length * 100) : 100}%`,background:'var(--accent)',transition:'width 200ms var(--ease)'}}/>
        </div>
        <span style={{fontSize:12,color:'var(--text-secondary)',fontVariantNumeric:'tabular-nums'}}>{Math.max(0, remaining)} left</span>
        <div className="seg">
          <button aria-pressed={mode==='flip'} onClick={()=>{ setMode('flip'); resetCardUi(); }}>Flip</button>
          <button aria-pressed={mode==='type'} onClick={()=>{ setMode('type'); resetCardUi(); }}>Type</button>
        </div>
        <button className="icon-btn" title="Undo last rating (Z)" disabled={!history.length} onClick={undo}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
        </button>
      </div>

      <div style={{flex:1,display:'flex',justifyContent:'center',padding:isMobile?'20px 16px 40px':'40px 32px'}}>
        <div style={{width:'100%',maxWidth:680}}>
          {done ? (
            <div className="card fadeUp" style={{padding:'28px 26px',textAlign:'center'}}>
              <div style={{fontFamily:'Fraunces,serif',fontSize:24,fontWeight:600,marginBottom:6}}>Session complete</div>
              <div style={{...studyMuted,marginBottom:18}}>
                {stats.reviewed} review{stats.reviewed===1?'':'s'}{stats.reviewed ? ` · ${Math.round((1 - stats.again / stats.reviewed) * 100)}% remembered` : ''}
              </div>
              <button className="btn-primary" onClick={onExit}>Back to study</button>
            </div>
          ) : !card ? null : card.kind === 'recall' ? (
            <div className="card fadeUp" style={{padding:'26px 24px'}}>
              <div style={studyEyebrow('var(--warning)')}>Blank-page recall</div>
              <div style={{fontFamily:'Fraunces,serif',fontSize:22,fontWeight:600,margin:'10px 0 6px'}}>{note?.emoji || '📝'} {note?.title || 'Untitled'}</div>
              <div style={{...studyMuted,marginBottom:16}}>Write down everything you remember about this note, without looking. Last time: {card.coverage ?? '–'}%.</div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn-primary" onClick={()=>setRecalling(true)}>Start recall</button>
                <button className="btn-ghost" onClick={()=>{ setQueue(q => [...q, card.id]); setPos(p => p + 1); resetCardUi(); }}>Later</button>
              </div>
            </div>
          ) : (
            <div key={`${card.id}-${pos}`} className="card fadeUp" style={{padding:isMobile?'22px 18px':'30px 30px 24px'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                <span style={{fontSize:11.5,color:'var(--text-muted)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {note?.emoji || '📝'} {note?.title || 'Untitled'}{card.fsrs.state === 0 ? ' · new' : ''}
                </span>
                {!editing && <button className="icon-btn" title="Edit card" onClick={()=>setEditing({ front:card.front, back:card.back })}>{Ic.edit}</button>}
                {!editing && <button className="icon-btn danger" title="Delete card"
                  onClick={()=>{ deleteStudyCards(update, [card.id]); resetCardUi(); }}>{Ic.trash}</button>}
              </div>

              {editing ? (
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <textarea className="input" rows={2} value={editing.front} onChange={e=>setEditing(v=>({ ...v, front:e.target.value }))}/>
                  <textarea className="input" rows={3} value={editing.back} onChange={e=>setEditing(v=>({ ...v, back:e.target.value }))}/>
                  <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                    <button className="btn-ghost" onClick={()=>setEditing(null)}>Cancel</button>
                    <button className="btn-primary" onClick={()=>{
                      update('cards', prev => prev.map(c => c.id === card.id ? { ...c, front:editing.front.trim() || c.front, back:editing.back.trim() || c.back, updated:Date.now() } : c));
                      setEditing(null);
                    }}>Save</button>
                  </div>
                </div>
              ) : (<>
                <div style={{fontSize:isMobile?18:21,fontWeight:600,lineHeight:1.45,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{card.front}</div>

                {mode === 'type' && (
                  <div style={{marginTop:16}}>
                    <textarea ref={answerRef} className="input" rows={3} placeholder="Type your answer…  (Ctrl/⌘ + Enter to check)"
                      value={typed} disabled={revealed} onChange={e=>setTyped(e.target.value)}/>
                    {!revealed && (
                      <div style={{display:'flex',gap:8,marginTop:8}}>
                        <button className="btn-primary" disabled={!typed.trim()} onClick={submitTyped}>Check</button>
                        <button className="btn-ghost" onClick={()=>{ setRevealed(true); setCheck({ status:'self' }); }}>I don’t know</button>
                      </div>
                    )}
                  </div>
                )}

                {revealed ? (
                  <div className="fadeUp" style={{marginTop:18,paddingTop:16,borderTop:'1px solid var(--border)'}}>
                    <div style={{...studyEyebrow('var(--text-muted)'),marginBottom:6}}>Answer</div>
                    <div style={{fontSize:15.5,lineHeight:1.6,whiteSpace:'pre-wrap',wordBreak:'break-word',color:'var(--text-quaternary)'}}>{card.back}</div>
                    {check?.status === 'checking' && <div style={{...studyMuted,marginTop:12}}>Checking your answer…</div>}
                    {check?.status === 'error' && <div style={{fontSize:12.5,color:'var(--danger)',marginTop:12}}>{check.message} — rate yourself.</div>}
                    {check?.status === 'done' && (
                      <div style={{marginTop:12,padding:'10px 12px',borderRadius:'var(--r-md)',
                        background: check.verdict === 'correct' ? 'rgba(16,185,129,.1)' : check.verdict === 'partial' ? 'rgba(245,158,11,.1)' : 'rgba(244,63,94,.1)'}}>
                        <div style={{fontSize:13,fontWeight:600,color: check.verdict === 'correct' ? 'var(--success)' : check.verdict === 'partial' ? 'var(--warning)' : 'var(--danger)'}}>
                          {check.verdict === 'correct' ? 'Correct' : check.verdict === 'partial' ? 'Partly right' : 'Not quite'}
                        </div>
                        {check.feedback && <div style={{fontSize:12.5,color:'var(--text-tertiary)',marginTop:2}}>{check.feedback}</div>}
                        {check.missing && <div style={{fontSize:12.5,color:'var(--text-secondary)',marginTop:2}}>Missing: {check.missing}</div>}
                      </div>
                    )}
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginTop:18}}>
                      {RATINGS.map(({ r, label, color }) => {
                        const suggested = check?.suggested === r;
                        return (
                          <button key={r} onClick={()=>rate(r)} disabled={check?.status === 'checking'}
                            style={{border:`1px solid ${suggested ? color : 'var(--hairline)'}`,background: suggested ? `color-mix(in srgb, ${color} 18%, transparent)` : 'var(--fill)',
                              borderRadius:'var(--r-md)',padding:'10px 4px',cursor:'pointer',color:'var(--text-primary)',fontFamily:'Manrope,sans-serif',
                              display:'flex',flexDirection:'column',alignItems:'center',gap:2,opacity: check?.status === 'checking' ? .5 : 1}}>
                            <span style={{fontSize:13,fontWeight:700,color}}>{label}</span>
                            <span style={{fontSize:11,color:'var(--text-muted)'}}>{intervals ? fmtInterval(intervals[r]) : ''} · {r}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ) : mode === 'flip' && (
                  <button className="btn-primary" style={{marginTop:22,width:'100%'}} onClick={()=>setRevealed(true)}>Show answer · Space</button>
                )}
              </>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── blank-page recall ── */
function BlankRecall({ state, update, note, isMobile, onDone, onCancel }) {
  const [text, setText]     = useState('');
  const [phase, setPhase]   = useState('write');  /* write | checking | result */
  const [error, setError]   = useState(null);
  const [result, setResult] = useState(null);
  const [showNote, setShowNote] = useState(false);
  const [cardsAdded, setCardsAdded] = useState(false);
  const started = useRef(Date.now());
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const secs = Math.floor((now - started.current) / 1000);

  const submit = async () => {
    setPhase('checking'); setError(null);
    try {
      const material = await noteToStudyText(note);
      const r = await StudyAPI.recall({ model: studyCfg(state, 'blankRecall').model, noteId: note.id, material: noteBlock(note, material), recall: text });
      setResult(r.result); setPhase('result');
    } catch (e) {
      setError(studyErrorLabel(e)); setPhase('write');
    }
  };
  const addCards = () => {
    const now = Date.now(), tag = Math.random().toString(36).slice(2, 8);
    const fresh = (result.cards || []).map((c, i) => ({
      id:`g_${tag}_${i}`, kind:'qa', noteId:note.id, front:c.front, back:c.back, fsrs:newCardFsrs(now),
      firstReview:null, suspended:false, created:now, updated:now,
    }));
    update('cards', prev => [...(prev || []), ...fresh]);
    setCardsAdded(true);
  };
  const List = ({ items, color, mark }) => items?.length ? (
    <ul style={{listStyle:'none',padding:0,margin:'6px 0 0'}}>
      {items.map((s, i) => <li key={i} style={{display:'flex',gap:8,fontSize:13.5,lineHeight:1.55,padding:'2px 0'}}><span style={{color,flexShrink:0}}>{mark}</span><span>{s}</span></li>)}
    </ul>
  ) : <div style={{...studyMuted,marginTop:4}}>None</div>;

  return (
    <div className="fadeUp">
      <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12,marginBottom:14}} onClick={onCancel}>← Back</button>
      <div style={studyEyebrow('var(--warning)')}>Blank-page recall</div>
      <div style={{fontFamily:'Fraunces,serif',fontSize:isMobile?21:25,fontWeight:600,margin:'6px 0 4px'}}>{note.emoji || '📝'} {note.title || 'Untitled'}</div>

      {phase !== 'result' ? (<>
        <div style={{...studyMuted,marginBottom:12}}>
          Write everything you can remember — key ideas, definitions, examples, how things connect. Don’t look at the note. {Math.floor(secs / 60)}:{String(secs % 60).padStart(2,'0')}
        </div>
        <textarea className="input" autoFocus rows={isMobile ? 12 : 16} value={text} onChange={e=>setText(e.target.value)}
          placeholder="Start writing…" style={{lineHeight:1.6,fontSize:14}} disabled={phase === 'checking'}/>
        {error && <div style={{fontSize:12.5,color:'var(--danger)',marginTop:8}}>{error}</div>}
        <div style={{display:'flex',gap:8,marginTop:12,alignItems:'center'}}>
          <button className="btn-primary" disabled={!text.trim() || phase === 'checking'} onClick={submit}>
            {phase === 'checking' ? 'Comparing with your note…' : 'Check my recall'}
          </button>
          <span style={{fontSize:11.5,color:'var(--text-muted)'}}>{studyModel(studyCfg(state, 'blankRecall').model).short}</span>
        </div>
      </>) : (<>
        <div className="card" style={{padding:'16px 18px',margin:'14px 0'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:8}}>
            <span style={{fontFamily:'Fraunces,serif',fontSize:34,fontWeight:600,color: result.coverage >= 70 ? 'var(--success)' : result.coverage >= 40 ? 'var(--warning)' : 'var(--danger)'}}>{result.coverage}%</span>
            <span style={studyMuted}>of the key ideas recalled · next recall scheduled as “{RATINGS[coverageRating(result.coverage) - 1].label}”</span>
          </div>
          <div style={{height:6,borderRadius:99,background:'var(--fill)',overflow:'hidden'}}>
            <div style={{height:'100%',width:`${result.coverage}%`,background:'var(--accent)'}}/>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:14}}>
          <div className="card" style={{padding:'14px 16px'}}><div style={studyEyebrow('var(--success)')}>You remembered</div><List items={result.recalled} color="var(--success)" mark="✓"/></div>
          <div className="card" style={{padding:'14px 16px'}}><div style={studyEyebrow('var(--danger)')}>You missed</div><List items={result.missed} color="var(--danger)" mark="✗"/></div>
        </div>
        {result.misconceptions?.length > 0 && (
          <div className="card" style={{padding:'14px 16px',marginTop:14}}><div style={studyEyebrow('var(--warning)')}>Check these</div><List items={result.misconceptions} color="var(--warning)" mark="!"/></div>
        )}
        <div style={{display:'flex',gap:8,marginTop:16,flexWrap:'wrap'}}>
          {(result.cards || []).length > 0 && (
            <button className="btn-ghost" disabled={cardsAdded} onClick={addCards}>
              {cardsAdded ? `Added ${result.cards.length} cards` : `Make ${result.cards.length} cards from what I missed`}
            </button>
          )}
          <button className="btn-ghost" onClick={()=>setShowNote(v=>!v)}>{showNote ? 'Hide note' : 'Show note'}</button>
          <button className="btn-primary" onClick={()=>onDone({ rating: coverageRating(result.coverage), coverage: result.coverage })}>Done</button>
        </div>
        {showNote && <div className="card" style={{padding:'16px 18px',marginTop:14}}><MarkdownView content={parseBody(note.body).filter(p=>p.type==='text').map(p=>p.content).join('\n')}/></div>}
      </>)}
    </div>
  );
}

/* ── quiz ── marked locally; the set keeps the last 10 scores. */
function QuizRunner({ set, update, onExit }) {
  const [questions] = useState(() => [...(set.quiz || [])].sort(() => Math.random() - 0.5).slice(0, 10));
  const [i, setI]           = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore]   = useState(0);
  const [missed, setMissed] = useState([]);
  const q = questions[i];
  const finished = i >= questions.length;

  useEffect(() => {
    if (!finished || !questions.length) return;
    update('studySets', prev => prev.map(s => s.id === set.id
      ? { ...s, quizAttempts: [...(s.quizAttempts || []), { at:Date.now(), score, max:questions.length }].slice(-10), updated:Date.now() } : s));
  }, [finished]);

  const pick = idx => {
    if (picked !== null) return;
    setPicked(idx);
    if (idx === q.answer) setScore(s => s + 1); else setMissed(m => [...m, q]);
  };

  return (
    <div className="fadeUp">
      <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12,marginBottom:14}} onClick={onExit}>← {set.title}</button>
      {finished ? (
        <div className="card" style={{padding:'24px 22px'}}>
