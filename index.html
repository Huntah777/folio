function TagsView({ state, update, isMobile }) {
  const [query, setQuery]   = useState('');
  const [sort, setSort]     = useState('used'); /* 'used' | 'az' */
  const [source, setSource] = useState('all');  /* see TAG_SOURCES */

  /* Tags live on notes, tasks and journal entries. Counting all three is the
     difference between "1 note" on almost every card — the old view's problem
     — and a number that reflects how much a tag is actually carrying. */
  const ranked = useMemo(() => {
    const counts = new Map();
    const bump = (t, kind) => {
      const c = counts.get(t) || { tag:t, notes:0, tasks:0, journal:0, total:0 };
      c[kind]++; c.total++; counts.set(t, c);
    };
    state.notes.forEach(n => (n.tags||[]).forEach(t => bump(t,'notes')));
    state.tasks.forEach(t2 => (t2.tags||[]).forEach(t => bump(t,'tasks')));
    (state.journal||[]).forEach(j => (j.tags||[]).forEach(t => bump(t,'journal')));
    return [...counts.values()];
  }, [state.notes, state.tasks, state.journal]);

  /* Which count the screen is ranking and showing. Filtering by source is not
     the same as filtering the list: a tag used on ten notes and one task is a
     different thing under Notes than under Tasks, so the count switches with
     the source and the ordering follows it. */
  const src   = TAG_SOURCES.find(s => s.id === source) || TAG_SOURCES[0];
  const countOf = c => src.key ? c[src.key] : c.total;

  const inSource = useMemo(
    () => src.key ? ranked.filter(c => c[src.key] > 0) : ranked,
    [ranked, src.key],
  );

  const visible = useMemo(() => {
    const q = query.trim().replace(/^#/, '').toLowerCase();
    const list = q ? inSource.filter(c => c.tag.toLowerCase().includes(q)) : inSource;
    return [...list].sort(sort === 'az'
      ? (a,b) => a.tag.localeCompare(b.tag)
      : (a,b) => countOf(b) - countOf(a) || a.tag.localeCompare(b.tag));
  }, [inSource, query, sort, src.key]);

  const openTag = t => update('ui', { ...state.ui, view:'notes', filterTag:t, noteId:null });

  /* The most-used handful get a real card with a breakdown; everything else
     becomes a dense capsule. A tag used once doesn't need the same footprint
     as one used twenty times, and giving it that footprint is exactly what
     made this screen a wall to scan. Suppressed while searching or sorting
     A–Z, where a single uniform list is what you actually want. */
  const featured = (sort === 'used' && !query.trim()) ? visible.slice(0, 6) : [];
  const rest     = featured.length ? visible.slice(featured.length) : visible;

  const totalUses = inSource.reduce((n,c) => n + countOf(c), 0);
  /* Where a tag click should land. Following the source you're browsing is the
     only behaviour that isn't a surprise — clicking a tag under Tasks used to
     drop you into filtered Notes. */
  const openTagIn = t => source === 'tasks'
    ? update('ui', { ...state.ui, view:'tasks', filterTag:t })
    : source === 'journal'
      ? update('ui', { ...state.ui, view:'journal', filterTag:t })
      : openTag(t);

  return (
    <div style={{flex:1,overflow:'auto',padding:isMobile?'18px 16px':'28px 32px'}} className="scrollbar">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:18}}>
        <div>
          <h1 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600}}>Tags</h1>
          <div style={{fontSize:12.5,color:'var(--text-secondary)',marginTop:3}}>
            {inSource.length} tag{inSource.length!==1?'s':''} · {totalUses} {plural(totalUses, src.noun)}
          </div>
        </div>
        {ranked.length > 1 && (
          <div className="seg" role="group" aria-label="Sort tags">
            <button aria-pressed={sort==='used'} onClick={()=>setSort('used')}>Most used</button>
            <button aria-pressed={sort==='az'}   onClick={()=>setSort('az')}>A–Z</button>
          </div>
        )}
      </div>

      {ranked.length === 0 ? (
        <div style={{color:'var(--text-muted)',fontSize:13}}>No tags yet. Add tags to your notes.</div>
      ) : (<>
        {/* Where a tag is used is usually the question — a task tag and a note
            tag do different jobs even when they share a name. */}
        <div className="no-scrollbar" style={{display:'flex',gap:6,marginBottom:18,overflowX:'auto',paddingBottom:2}}>
          {TAG_SOURCES.map(o => {
            const n = o.key ? ranked.filter(c => c[o.key] > 0).length : ranked.length;
            const on = source === o.id;
            return (
              <button key={o.id} onClick={()=>setSource(o.id)} aria-pressed={on}
                className={`pill${on ? ' on' : ''}`} disabled={n === 0 && !on}
                style={n === 0 && !on ? {opacity:.4,cursor:'default'} : undefined}>
                {o.label}<span className="pill-count">{n}</span>
              </button>
            );
          })}
        </div>

        {inSource.length > 8 && (
          <div style={{position:'relative',maxWidth:340,marginBottom:22}}>
            <svg style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',width:13,height:13,color:'var(--text-muted)',pointerEvents:'none'}}
              viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input className="input" value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Filter tags…" style={{paddingLeft:32,borderRadius:'var(--r-pill)'}}/>
            {query && (
              <button onClick={()=>setQuery('')} className="icon-btn"
                style={{position:'absolute',right:4,top:'50%',transform:'translateY(-50%)',width:24,height:24}} title="Clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            )}
          </div>
        )}

        {featured.length > 0 && (
          <div style={{marginBottom:26}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.09em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Most used</div>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
              {featured.map(c => (
                <button key={c.tag} onClick={()=>openTagIn(c.tag)} className="card"
                  style={{padding:'14px 15px',cursor:'pointer',textAlign:'left',border:'1px solid var(--border)',
                          fontFamily:'Manrope,sans-serif',transition:'transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=`${tagColor(c.tag)}66`;e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='var(--shadow-2)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='var(--shadow-1)';}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9}}>
                    <span style={{width:26,height:26,borderRadius:'var(--r-sm)',background:`${tagColor(c.tag)}24`,color:tagColor(c.tag),
                                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13,fontWeight:700}}>#</span>
                    <span style={{fontSize:13.5,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',minWidth:0,flex:1}}>
                      {c.tag.replace(/^#/,'')}
                    </span>
                    <span style={{fontSize:15,fontWeight:700,color:tagColor(c.tag),fontFamily:'"JetBrains Mono",monospace'}}>{countOf(c)}</span>
                  </div>
                  {/* Under All, the breakdown is the interesting part; under a
                      single source there is nothing to break down. */}
                  <div style={{display:'flex',gap:8,fontSize:11,color:'var(--text-secondary)',flexWrap:'wrap'}}>
                    {src.key
                      ? <span>{countOf(c)} {plural(countOf(c), src.noun)}</span>
                      : <>
                          {c.notes>0   && <span>{c.notes} {plural(c.notes,'note')}</span>}
                          {c.tasks>0   && <span>{c.tasks} {plural(c.tasks,'task')}</span>}
                          {c.journal>0 && <span>{c.journal} {plural(c.journal,'entry')}</span>}
                        </>}
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {rest.length > 0 && (
          <div>
            {featured.length > 0 && (
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.09em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>
                Everything else
              </div>
            )}
            {/* A capsule cloud, not a card grid: one line each, so thirty tags
                read as one block you can scan rather than thirty objects. */}
            <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
              {rest.map(c => (
                <button key={c.tag} onClick={()=>openTagIn(c.tag)} className="pill"
                  style={{color:tagColor(c.tag),background:`${tagColor(c.tag)}14`}}
                  title={`${c.notes} notes · ${c.tasks} tasks · ${c.journal} journal`}
                  onMouseEnter={e=>e.currentTarget.style.background=`${tagColor(c.tag)}26`}
                  onMouseLeave={e=>e.currentTarget.style.background=`${tagColor(c.tag)}14`}>
                  {c.tag}<span className="pill-count">{countOf(c)}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {visible.length === 0 && (
          <div style={{color:'var(--text-muted)',fontSize:13}}>
            {query.trim() ? `No tags match "${query}".` : `No tags used on ${src.label.toLowerCase()} yet.`}
          </div>
        )}
      </>)}
    </div>
  );
}

/* ── JournalView ── */
/* `allTags` is every tag used across journal history (most-used first — see
   JournalView), so a previously-typed tag like #gratitude becomes a one-click
   pick instead of retyping it on every entry. Suggestions show as soon as the
   input is focused, even before typing anything, same as the note-tag picker. */
function JournalEntryTags({ tags, onChange, allTags=[] }) {
  const [input, setInput]     = useState('');
  const [focused, setFocused] = useState(false);
  const add = raw => {
    const clean = (raw ?? input).trim().replace(/^#*/,'#');
    if (clean.length > 1 && !tags.includes(clean)) onChange([...tags, clean]);
    setInput('');
  };
  const suggestions = allTags.filter(t =>
    !tags.includes(t) &&
    (!input || t.toLowerCase().includes(input.replace(/^#/,'').toLowerCase()))
  ).slice(0,8);
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
      {tags.map(t=>(
        <span key={t} className="tag" style={{background:`${tagColor(t)}18`,color:tagColor(t)}}>
          {t}<span onClick={()=>onChange(tags.filter(x=>x!==t))} style={{cursor:'pointer',opacity:.7,marginLeft:2}}>×</span>
        </span>
      ))}
      <div style={{position:'relative'}}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setTimeout(()=>setFocused(false),150)}
          onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();add();}}}
          placeholder="#tag"
          style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,padding:'2px 8px',color:'var(--text-primary)',fontSize:12,width:80,outline:'none'}}/>
        {focused && suggestions.length>0 && (
          <div style={{position:'absolute',top:'100%',left:0,marginTop:4,background:'var(--modal-bg)',border:'1px solid var(--border-strong)',borderRadius:8,padding:'4px',zIndex:20,minWidth:140,boxShadow:'0 8px 24px rgba(0,0,0,.5)'}}>
            {suggestions.map(t=>(
              <div key={t} onMouseDown={()=>add(t)}
                style={{display:'flex',alignItems:'center',gap:6,padding:'5px 8px',borderRadius:5,cursor:'pointer',transition:'background 100ms'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--border)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <span style={{width:7,height:7,borderRadius:99,background:tagColor(t),flexShrink:0,display:'inline-block'}}/>
                <span style={{fontSize:12,color:'var(--text-tertiary)'}}>{t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function JournalView({ state, update, isMobile }) {
  const entries = state.journal || [];
  const [composerText, setComposerText]   = useState('');
  const [composerMood, setComposerMood]   = useState(null);
  const [composerTags, setComposerTags]   = useState([]);
  const [usePrompt, setUsePrompt]         = useState(false);
  const [editingId, setEditingId]         = useState(null);
  const [editText, setEditText]           = useState('');
  const [editMood, setEditMood]           = useState(null);
  const [editTags, setEditTags]           = useState([]);
  const [search, setSearch]               = useState(() => state.ui.filterTag || '');
  const [tagFilter, setTagFilter]         = useState('');
  const [timeRange, setTimeRange]         = useState('all');
  /* Handed over from the Tags view — journal search already matches tags, so
     the tag becomes the query. Cleared once consumed. */
  useEffect(() => {
    if (!state.ui.filterTag) return;
    setSearch(state.ui.filterTag);
    update('ui', { ...state.ui, filterTag:'' });
  }, [state.ui.filterTag]);
  /* Which Monday–Sunday week the feed shows. Defaults to the week containing
     today, so a fresh week starts empty and fills in day by day — browsing
     history via JournalWeekNav moves this without touching "today" itself. */
  const [viewDate, setViewDate]           = useState(todayKey());

  const streak   = useMemo(() => computeStreak(entries), [entries]);
  const prompt   = useMemo(() => dailyPrompt(), []);
  const usedPromptToday = useMemo(() => entries.some(e => e.date === todayKey() && e.prompt != null), [entries]);
  const onThisDay = useMemo(() => entriesOnThisDay(entries), [entries]);
  /* Every tag ever used on a journal entry, most-used first, so a tag you
     reach for constantly (#gratitude…) sits at the top of the suggestion list
     — see JournalEntryTags. Built from the whole history, not the currently
     viewed week, so it doesn't thin out to nothing right after a new week starts. */
  const { allJournalTags, journalTagCounts } = useMemo(() => {
    const counts = {};
    entries.forEach(e => (e.tags||[]).forEach(t => { counts[t] = (counts[t]||0) + 1; }));
    const sorted = Object.keys(counts).sort((a,b) => counts[b]-counts[a] || a.localeCompare(b));
    return { allJournalTags: sorted, journalTagCounts: new Map(sorted.map(t=>[t, counts[t]])) };
  }, [entries]);

  const getTimeCutoff = range => {
    const now = new Date();
    if (range === 'week') {
      const d = new Date(now);
      const day = d.getDay();
      d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      return fmtKey(d);
    }
    if (range === 'month') return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    if (range === '3months') { const d = new Date(now); d.setMonth(d.getMonth()-3); return fmtKey(d); }
    return null;
  };
  const { startKey: weekStart, endKey: weekEnd } = useMemo(() => weekRangeKeys(viewDate), [viewDate]);

  const grouped = useMemo(() => {
    const q = search.trim().toLowerCase();
    const isFiltering = q || tagFilter;
    let visible = isFiltering
      ? entries.filter(e => {
          const textMatch = !q || e.body.toLowerCase().includes(q) || (e.prompt||'').toLowerCase().includes(q);
          const tagMatch  = !tagFilter || (e.tags||[]).includes(tagFilter);
          return textMatch && tagMatch;
        })
      : entries.filter(e => e.date >= weekStart && e.date <= weekEnd);
    /* Time range only applies when filtering by text */
    if (q && timeRange !== 'all') {
      const cutoff = getTimeCutoff(timeRange);
      if (cutoff) visible = visible.filter(e => (e.date||'') >= cutoff);
    }
    const today = todayKey();
    const yesterday = fmtKey(new Date(Date.now() - 86400000));
    const byKey = {};
    [...visible].sort((a,b)=>(b.created||0)-(a.created||0)).forEach(e => {
      const key = e.date || '0000-00-00';
      const label = key === today ? 'Today' : key === yesterday ? 'Yesterday' : parseKey(key).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
      if (!byKey[key]) byKey[key] = { label, items: [] };
      byKey[key].items.push(e);
    });
    return Object.entries(byKey).sort(([a],[b])=>b.localeCompare(a)).map(([,v])=>v);
  }, [entries, search, tagFilter, timeRange, weekStart, weekEnd]);

  const addEntry = () => {
    if (!composerText.trim()) return;
    const entry = { id:uid(), date:todayKey(), created:Date.now(), updated:Date.now(), body:composerText.trim(), prompt:usePrompt?prompt:null, mood:composerMood, tags:composerTags };
    update('journal', [entry, ...entries]);
    setComposerText(''); setComposerMood(null); setUsePrompt(false);
    /* A new entry is always dated today — jump the view back to this week so
       it's actually visible, rather than landing silently in a week you're
       not looking at because you were browsing old entries when you wrote it. */
    setViewDate(todayKey());
  };
  const startEdit = e => { setEditingId(e.id); setEditText(e.body); setEditMood(e.mood); setEditTags(e.tags||[]); };
  const saveEdit = () => {
    update('journal', entries.map(e=>e.id===editingId?{...e,body:editText.trim(),mood:editMood,tags:editTags,updated:Date.now()}:e));
    setEditingId(null);
  };
  const deleteEntry = id => {
    update('journal', entries.filter(e=>e.id!==id));
    update('journalDeleted', [...(state.journalDeleted||[]), { id, deletedAt: Date.now() }]);
  };

  const cardLabel = { fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:10 };

  return (
    <div style={{flex:1,overflowY:'auto',overflowX:'hidden',padding:isMobile?'20px 16px':'32px 36px'}} className="scrollbar">
      <h1 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600,marginBottom:20}}>Journal</h1>

      {/* insight cards */}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:14,maxWidth:900,marginBottom:22}}>
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{...cardLabel,color:'var(--warning)'}}>Streak</div>
          <div style={{fontSize:26,fontWeight:700,fontFamily:'Fraunces,serif'}}>{streak} {streak===1?'day':'days'}</div>
        </div>
        <div className="card" style={{padding:'16px 18px',gridColumn:isMobile?'auto':'span 2'}}>
          <div style={{...cardLabel,color:'var(--accent)'}}>Today's prompt</div>
          <div style={{fontSize:13.5,color:'var(--text-tertiary)',lineHeight:1.5}}>{prompt}</div>
        </div>
      </div>

      {onThisDay.length > 0 && (
        <div className="card" style={{padding:'16px 18px',maxWidth:900,marginBottom:22}}>
          <div style={{...cardLabel,color:'var(--success)'}}>On this day</div>
          {onThisDay.map(e=>(
            <div key={e.id} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:11.5,color:'var(--text-secondary)',marginBottom:3}}>{e.yearsAgo} year{e.yearsAgo!==1?'s':''} ago</div>
              <div style={{fontSize:13,color:'var(--text-quaternary)',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{e.body}</div>
            </div>
          ))}
        </div>
      )}

      {/* composer */}
      <div className="card" style={{padding:'16px 18px',maxWidth:900,marginBottom:26,display:'flex',flexDirection:'column',gap:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <span style={{fontSize:11.5,color:'var(--text-muted)'}}>{usePrompt ? "Replying to today's prompt" : 'Writing freely'}</span>
          {!usedPromptToday && (
            <span onClick={()=>setUsePrompt(v=>!v)} style={{fontSize:11.5,color:'var(--accent)',cursor:'pointer',userSelect:'none'}}>
              {usePrompt ? 'Skip prompt' : "Use today's prompt"}
            </span>
          )}
        </div>
        <textarea value={composerText} onChange={e=>setComposerText(e.target.value)}
          placeholder={usePrompt ? prompt : "Write whatever's on your mind…"} rows={3}
          style={{background:'transparent',border:'none',outline:'none',resize:'vertical',fontFamily:'Manrope,sans-serif',fontSize:14,color:'var(--text-primary)',lineHeight:1.6,width:'100%'}}/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <MoodPicker value={composerMood} onChange={setComposerMood}/>
            <JournalEntryTags tags={composerTags} onChange={setComposerTags} allTags={allJournalTags}/>
          </div>
          <button className="btn-primary" onClick={addEntry} disabled={!composerText.trim()}
            style={{opacity:composerText.trim()?1:.5}}>Save entry</button>
        </div>
      </div>

      {/* tag filter bar — filter entries by journal tags */}
      {allJournalTags.length > 0 && (
        <div style={{maxWidth:900,marginBottom:14}}>
          <TagFilterBar tags={allJournalTags} counts={journalTagCounts} value={tagFilter} onChange={setTagFilter}/>
        </div>
      )}

      {/* search + time range */}
      <div style={{maxWidth:900,marginBottom:18,display:'flex',flexDirection:'column',gap:8}}>
        <input className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search entries by text…"/>
        {search.trim() && (
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {[['all','All time'],['week','This week'],['month','This month'],['3months','3 months']].map(([val,label])=>(
              <button key={val} onClick={()=>setTimeRange(val)}
                style={{fontSize:11,padding:'4px 11px',borderRadius:99,border:`1px solid ${timeRange===val?'var(--accent)':'var(--border-strong)'}`,background:timeRange===val?'var(--accent)':'transparent',color:timeRange===val?'#fff':'var(--text-secondary)',cursor:'pointer',fontFamily:'Manrope,sans-serif',transition:'all 100ms'}}>
                {label}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* week navigator */}
      {!search.trim() && !tagFilter && <JournalWeekNav viewDate={viewDate} onChange={setViewDate}/>}

      {/* entries feed */}
      {grouped.map(({label,items})=>(
        <div key={label} style={{marginBottom:22,maxWidth:900}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>{label}</div>
          {items.map(e=>{
            const mood = moodById(e.mood);
            const isEditing = editingId===e.id;
            return (
              <div key={e.id} className="card" style={{padding:'16px 18px',marginBottom:10,position:'relative'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  {mood && <span title={mood.label} style={{fontSize:16}}>{mood.emoji}</span>}
                  <span style={{fontSize:11.5,color:'var(--text-muted)'}}>{new Date(e.created).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>
                  <div style={{flex:1}}/>
                  {!isEditing && (<>
                    <button className="del-btn" onClick={()=>startEdit(e)} title="Edit">
                      <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button className="del-btn" onClick={()=>deleteEntry(e.id)} title="Delete">
                      <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    </button>
                  </>)}
                </div>
                {e.prompt && !isEditing && (
                  <div style={{fontSize:13.5,fontFamily:'Fraunces,serif',fontStyle:'italic',color:'var(--text-secondary)',marginBottom:8}}>{e.prompt}</div>
                )}
                {isEditing ? (
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <textarea value={editText} onChange={ev=>setEditText(ev.target.value)} rows={4}
                      style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:8,padding:10,outline:'none',fontFamily:'Manrope,sans-serif',fontSize:14,color:'var(--text-primary)',lineHeight:1.6,width:'100%',resize:'vertical'}}/>
                    <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
                      <MoodPicker value={editMood} onChange={setEditMood}/>
                      <JournalEntryTags tags={editTags} onChange={setEditTags} allTags={allJournalTags}/>
                    </div>
                    <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                      <button className="btn-ghost" onClick={()=>setEditingId(null)}>Cancel</button>
                      <button className="btn-primary" onClick={saveEdit}>Save</button>
                    </div>
                  </div>
                ) : (<>
                  <MarkdownView content={e.body}/>
                  {e.tags?.length>0 && (
                    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                      {e.tags.map(t=>(
                        <span key={t} className="tag" onClick={()=>setTagFilter(tagFilter===t?'':t)}
                          style={{background:`${tagColor(t)}18`,color:tagColor(t),cursor:'pointer',outline:tagFilter===t?`1px solid ${tagColor(t)}`:'none'}}>
                          {t}
                        </span>
                      ))}
                    </div>
                  )}
                </>)}
              </div>
            );
          })}
        </div>
      ))}
      {entries.length===0 && (
        <div style={{color:'var(--text-muted)',fontSize:13}}>No entries yet — write your first one above.</div>
      )}
      {entries.length>0 && grouped.length===0 && (search.trim()||tagFilter) && (
        <div style={{color:'var(--text-muted)',fontSize:13}}>
          No entries match{search.trim()?` "${search}"`:''}
          {tagFilter ? ` tagged ${tagFilter}` : ''}
          {search.trim() && timeRange!=='all' ? ` in this time range` : ''}.
        </div>
      )}
      {/* Week has entries elsewhere but none in the currently viewed range —
          this is the expected state right after a new week starts, not an
          error, so it reads as a plain status rather than a dead end. */}
      {entries.length>0 && grouped.length===0 && !search.trim() && (
        <div style={{color:'var(--text-muted)',fontSize:13}}>
          {weekLabel(weekStart,weekEnd)==='This week' ? 'No entries yet this week.' : `No entries for ${weekLabel(weekStart,weekEnd)}.`}
        </div>
      )}
    </div>
  );
}

/* ── SyncIconBtn ── */
function SyncIconBtn({ onClick, syncStatus }) {
  const dotColor =
    syncStatus==='synced'  ? 'var(--success)' :
    syncStatus==='saving'  ? 'var(--warning)' :
    syncStatus==='syncing' ? 'var(--accent)' :
    syncStatus==='offline' ? 'var(--danger)' :
    syncStatus==='unauth'  ? 'var(--warning)' : null;
  const spinning = syncStatus==='syncing' || syncStatus==='saving';
  const label =
    syncStatus==='synced'  ? 'Synced — click to pull latest' :
    syncStatus==='syncing' ? 'Syncing…' :
    syncStatus==='saving'  ? 'Saving…' :
    syncStatus==='offline' ? 'Offline — click to retry' :
    syncStatus==='unauth'  ? 'Auth error — click to reconnect' : 'Set up sync';
  return (
    <button onClick={onClick} title={label}
      style={{background:'linear-gradient(135deg,var(--accent),var(--accent-strong))',border:'none',borderRadius:7,cursor:'pointer',width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,position:'relative',boxShadow:'0 4px 10px rgba(99,102,241,.35)',transition:'box-shadow 120ms'}}
      onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 16px rgba(99,102,241,.6)'}
      onMouseLeave={e=>e.currentTarget.style.boxShadow='0 4px 10px rgba(99,102,241,.35)'}>
      <svg style={{width:13,height:13,animation:spinning?'spin 0.8s linear infinite':'none'}} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      {dotColor && <span style={{position:'absolute',top:-3,right:-3,width:8,height:8,borderRadius:99,background:dotColor,border:'2px solid var(--bg-sidebar)'}}/>}
    </button>
  );
}
/* ── InstallBanner ── */
function InstallBanner() {
  const [prompt, setPrompt] = useState(window._installPrompt || null);

  useEffect(() => {
    const onReady = () => setPrompt(window._installPrompt);
    const onDone  = () => setPrompt(null);
    window.addEventListener('installpromptready', onReady);
    window.addEventListener('appinstalled_done', onDone);
    return () => {
      window.removeEventListener('installpromptready', onReady);
      window.removeEventListener('appinstalled_done', onDone);
    };
  }, []);

  if (!prompt) return null;

  const install = async () => {
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === 'accepted') setPrompt(null);
  };

  return (
    <div style={{
      position:'fixed',top:0,left:0,right:0,zIndex:110,
      background:'var(--bg-sidebar)',borderBottom:'1px solid var(--border)',
      padding:'10px 16px',
      display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,
      boxShadow:'0 8px 32px rgba(0,0,0,.5)',
    }}>
      <div style={{display:'flex',alignItems:'center',gap:10,minWidth:0}}>
        <img src="/folio-icon.svg" alt="" style={{width:28,height:28,borderRadius:7,flexShrink:0}}/>
        <div style={{minWidth:0}}>
          <div style={{fontSize:12,fontWeight:600,color:'var(--text-primary)'}}>Add to Home Screen</div>
          <div style={{fontSize:10,color:'var(--text-secondary)'}}>Install Folio for offline access</div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <button onClick={()=>setPrompt(null)} className="btn-ghost" style={{fontSize:10,padding:'5px 10px'}}>Not now</button>
        <button onClick={install} className="btn-primary" style={{fontSize:11,padding:'6px 14px'}}>Install</button>
      </div>
    </div>
  );
}

/* ── Sidebar ── */
function Sidebar({ state, update, syncStatus, onSync, collapsed, onToggle }) {
  const { view } = state.ui;
  const recent = [...state.notes].sort((a,b)=>b.updated-a.updated).slice(0,5);
  const folders = state.folders || [];
  const [addingRootFolder, setAddingRootFolder] = useState(false);
  const [addingSubId, setAddingSubId] = useState(null);
  const [newFolderName, setNewFolderName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');
  const [hoveredFolder, setHoveredFolder] = useState(null);
  const [expandedFolders, setExpandedFolders] = useState(() => new Set());
  const [pickerOpenId, setPickerOpenId] = useState(null);

  const folderTree = useMemo(() => buildFolderTree(folders), [folders]);

  /* Note counts per folder ID (direct only; descendants accumulated at render) */
  const noteCounts = useMemo(() => {
    const c = {};
    state.notes.forEach(n => { if (n.folderId) c[n.folderId] = (c[n.folderId]||0)+1; });
    return c;
  }, [state.notes]);

  const countWithDesc = fid => getFolderDescIds(fid, folders).reduce((s,id)=>s+(noteCounts[id]||0),0);

  /* Auto-expand ancestors when navigating to a nested folder */
  useEffect(() => {
    if (!state.ui.folderId) return;
    const ancestors = new Set();
    let cur = folders.find(f=>f.id===state.ui.folderId);
    while (cur?.parentId) { ancestors.add(cur.parentId); cur = folders.find(f=>f.id===cur.parentId); }
    if (ancestors.size) setExpandedFolders(prev => new Set([...prev,...ancestors]));
  }, [state.ui.folderId]);

  const toggleExpand = (fid, e) => {
    e.stopPropagation();
    setExpandedFolders(prev => { const n=new Set(prev); n.has(fid)?n.delete(fid):n.add(fid); return n; });
  };

  const nav = v => update('ui',{...state.ui,view:v,folderId:null,...(v==='calendar'?{calDate:todayKey()}:{})});
  const navFolder = fid => update('ui',{...state.ui,view:'notes',folderId:fid});

  const newNote = () => {
    const n={id:uid(),emoji:'📝',title:'',body:'',tags:[],links:[],images:[],folderId:state.ui.folderId||null,created:Date.now(),updated:Date.now()};
    update('notes',[n,...state.notes]);
    update('ui',{...state.ui,view:'notes',noteId:n.id});
  };

  const createFolder = (e, parentId = null) => {
    e.preventDefault();
    if (!newFolderName.trim()) return;
    const nf = {id:uid(), name:newFolderName.trim(), parentId};
    update('folders',[...folders, nf]);
    setNewFolderName(''); setAddingRootFolder(false); setAddingSubId(null);
    if (parentId) setExpandedFolders(prev => new Set([...prev, parentId]));
  };

  const deleteFolder = fid => {
    const allIds = getFolderDescIds(fid, folders);
    update('folders', folders.filter(f=>!allIds.includes(f.id)));
    update('notes', state.notes.map(n=>allIds.includes(n.folderId)?{...n,folderId:null}:n));
    if (allIds.includes(state.ui.folderId)) update('ui',{...state.ui,folderId:null});
  };

  const saveRename = e => {
    e.preventDefault();
    if (!renameVal.trim()) return;
    update('folders', folders.map(f=>f.id===renamingId?{...f,name:renameVal.trim()}:f));
    setRenamingId(null);
  };

  const updateFolderMeta = (fid, meta) =>
    update('folders', folders.map(f => f.id===fid ? {...f,...meta} : f));

  const navItems = [
    {id:'today',    label:'Today',    icon:Ic.today},
    {id:'notes',    label:'Notes',    icon:Ic.notes},
    {id:'journal',  label:'Journal',  icon:Ic.journal},
    {id:'tasks',    label:'Tasks',    icon:Ic.tasks},
    {id:'calendar', label:'Calendar', icon:Ic.cal},
    {id:'tags',     label:'Tags',     icon:Ic.tags},
    {id:'folders',  label:'Folders',  icon:Ic.folders},
    {id:'admin',    label:'Admin',    icon:Ic.admin},
  ];

  /* Shared inline-input style for folder name inputs */
  const folderInputStyle = {
    flex:1, background:'var(--bg-surface-2)', border:'1px solid var(--accent-ring)',
    borderRadius:6, color:'var(--text-primary)', fontSize:12, padding:'3px 7px',
    outline:'none', minWidth:0, fontFamily:'Manrope,sans-serif',
  };

  /* Recursive folder tree node */
  const FolderNode = ({node, depth}) => {
    const isActive   = state.ui.folderId === node.id;
    const isExpanded = expandedFolders.has(node.id);
    const hasChildren = node.children.length > 0;
    const isRenaming  = renamingId === node.id;
    const isAddingSub = addingSubId === node.id;
    const isPickerOpen = pickerOpenId === node.id;
    const count  = countWithDesc(node.id);
    const indent = depth * 14;
    const fColor = node.color || 'slate';

    return (
      <div>
        {isRenaming ? (
          <form onSubmit={saveRename}
            style={{display:'flex',gap:4,padding:'3px 8px',paddingLeft:8+indent}}>
            <FolderIconSvg color={fColor} iconId={node.icon} size={18}/>
            <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
              style={folderInputStyle}/>
            <button type="submit" style={{background:'none',border:'none',color:'var(--accent)',fontSize:11,cursor:'pointer',flexShrink:0}}>ok</button>
            <button type="button" onClick={()=>setRenamingId(null)} style={{background:'none',border:'none',color:'var(--text-secondary)',fontSize:11,cursor:'pointer',flexShrink:0}}>×</button>
          </form>
        ) : (
          <div
            className={`folder-row${isActive?' active':''}`}
            style={{paddingLeft:8+indent}}
            onClick={()=>{navFolder(node.id);setPickerOpenId(null);}}
            onMouseEnter={()=>setHoveredFolder(node.id)}
            onMouseLeave={()=>setHoveredFolder(null)}>
            {/* chevron */}
            {hasChildren ? (
              <span className={`folder-chevron${isExpanded?' open':''}`}
                onClick={e=>toggleExpand(node.id,e)}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:9,height:9}}>
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </span>
            ) : (
              <span style={{width:12,flexShrink:0}}/>
            )}
            {/* folder icon — click to open style picker */}
            <span title="Change color & icon"
              onClick={e=>{e.stopPropagation();setPickerOpenId(isPickerOpen?null:node.id);}}
              style={{display:'flex',borderRadius:4,padding:1,cursor:'pointer',flexShrink:0,
                      transition:'opacity 120ms',opacity:isActive?1:0.82}}>
              <FolderIconSvg color={fColor} iconId={node.icon} size={20}/>
            </span>
            {/* name */}
            <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.name}</span>
            {/* note count — hidden on hover */}
            {count > 0 && <span className="folder-count">{count}</span>}
            {/* action buttons */}
            <span className="folder-actions" onClick={e=>e.stopPropagation()}>
              <button className="folder-action add-sub" title="Add subfolder"
                onClick={()=>{setAddingSubId(node.id);setNewFolderName('');setAddingRootFolder(false);setPickerOpenId(null);}}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:9,height:9,pointerEvents:'none'}}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <button className="folder-action rename" title="Rename"
                onClick={()=>{setRenamingId(node.id);setRenameVal(node.name);setPickerOpenId(null);}}>✎</button>
              <button className="folder-action del" title="Delete"
                onClick={()=>deleteFolder(node.id)}>✕</button>
            </span>
          </div>
        )}
        {/* style picker */}
        {isPickerOpen && (
          <div onClick={e=>e.stopPropagation()}
            style={{margin:'2px 6px 6px',background:'var(--bg-surface-2)',
                    border:'1px solid var(--border-strong)',borderRadius:8,
                    padding:'10px 10px 8px',overflow:'hidden',
                    boxShadow:'0 4px 20px rgba(0,0,0,.28)'}}>
            <div style={{fontSize:9.5,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:7}}>Color</div>
            <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
              {FOLDER_COLORS.map(c=>(
                <button key={c.id} title={c.id} onClick={()=>updateFolderMeta(node.id,{color:c.id})}
                  style={{width:18,height:18,borderRadius:'50%',background:c.hex,border:fColor===c.id?'2px solid #fff':'2px solid transparent',
                          boxShadow:fColor===c.id?`0 0 0 2px ${c.hex}`:'none',
                          cursor:'pointer',padding:0,outline:'none',flexShrink:0,transition:'transform 100ms'}}/>
              ))}
            </div>
            <div style={{fontSize:9.5,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:6}}>Icon</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:4}}>
              {FOLDER_ICON_OPTS.map(ic=>{
                const isSel = ic.id==='none' ? !node.icon : node.icon===ic.id;
                return (
                  <button key={ic.id} title={ic.id}
                    onClick={()=>updateFolderMeta(node.id,{icon:ic.id==='none'?null:ic.id})}
                    style={{aspectRatio:'1',display:'flex',alignItems:'center',justifyContent:'center',
                            borderRadius:7,cursor:'pointer',padding:0,border:'none',outline:'none',
                            background:isSel?'var(--accent-soft)':'transparent',
                            transition:'background 100ms'}}>
                    {ic.id==='none'
                      ? <svg viewBox="0 0 24 24" width="22" height="22"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="var(--text-muted)" opacity="0.35"/></svg>
                      : <FolderIconSvg color={fColor} iconId={ic.id} size={26}/>
                    }
                  </button>
                );
              })}
            </div>
          </div>
        )}
        {/* inline subfolder add form */}
        {isAddingSub && (
          <form onSubmit={e=>createFolder(e,node.id)}
            style={{display:'flex',gap:4,padding:'3px 8px 4px',paddingLeft:8+indent+14}}>
            <FolderIconSvg color={fColor} iconId={node.icon} size={16}/>
            <input autoFocus value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
              placeholder="Subfolder name…" style={folderInputStyle}/>
            <button type="submit" style={{background:'none',border:'none',color:'var(--accent)',fontSize:11,cursor:'pointer',flexShrink:0}}>add</button>
            <button type="button" onClick={()=>setAddingSubId(null)} style={{background:'none',border:'none',color:'var(--text-secondary)',fontSize:11,cursor:'pointer',flexShrink:0}}>×</button>
          </form>
        )}
        {/* children */}
        {hasChildren && isExpanded && (
          <div style={{borderLeft:'1px solid var(--border)',marginLeft:20+indent}}>
            {node.children.map(child=>(
              <FolderNode key={child.id} node={child} depth={depth+1}/>
            ))}
          </div>
        )}
      </div>
    );
  };

  if (collapsed) {
    return (
      <div className="sidebar sidebar-collapsed" style={{alignItems:'center'}}>
        <div style={{padding:'14px 0 12px',borderBottom:'1px solid var(--border)',width:'100%',display:'flex',justifyContent:'center',flexShrink:0}}>
          <img src="/folio-icon.svg" alt="" onClick={onToggle} title="Expand sidebar"
            style={{width:28,height:28,borderRadius:7,flexShrink:0,cursor:'pointer',boxShadow:'0 4px 12px rgba(0,0,0,.45)'}}/>
        </div>
        <div style={{padding:'8px 0',width:'100%',display:'flex',flexDirection:'column',alignItems:'center',gap:2,flexShrink:0}}>
          {navItems.map(({id,label,icon})=>(
            <div key={id} className={`nav-item${view===id?' active':''}`} onClick={()=>nav(id)} title={label}

/* ── PrayerSettings (Admin → Prayer times tab) ── */
function PrayerSettings({ state, update }) {
  const s = state.salah || {};
  const [enabled,  setEnabled]  = useState(!!s.enabled);
  const [lat,      setLat]      = useState(s.lat !== null && s.lat !== undefined ? String(s.lat) : '');
  const [lng,      setLng]      = useState(s.lng !== null && s.lng !== undefined ? String(s.lng) : '');
  const [method,   setMethod]   = useState(s.method || 'mwl');
  const [asr,      setAsr]      = useState(s.asr || 'standard');
  const [prayers,  setPrayers]  = useState({fajr:true,sunrise:false,dhuhr:true,asr:true,maghrib:true,isha:true,...(s.prayers||{})});
  const [offsets,  setOffsets]  = useState(() => salahOffsets(s));
  const [locMsg,   setLocMsg]   = useState('');
  const [saveMsg,  setSaveMsg]  = useState('');
  const [preview,  setPreview]  = useState(null);
  const [previewState, setPreviewState] = useState('idle'); /* idle | loading | ok | stale | error */
  const previewSeq = useRef(0);

  /* Auto-preview whenever the inputs that affect the timetable change. This
     doubles as validation: it's what proves a coordinate actually resolves to
     prayer times before Save writes it to synced state (and to every other
     device). Offsets are applied locally, so they never trigger a refetch. */
  useEffect(()=>{
    const la=parseFloat(lat), lo=parseFloat(lng);
    if (isNaN(la) || isNaN(lo)) { setPreview(null); setPreviewState('idle'); return; }
    const seq = ++previewSeq.current;
    setPreviewState('loading');
    (async () => {
      try {
        const { days, source } = await loadSalahMonth(todayKey(), { lat:la, lng:lo, method, asr });
        if (seq !== previewSeq.current) return;
        setPreview(days);
        setPreviewState(source === 'stale' ? 'stale' : 'ok');
      } catch {
        if (seq !== previewSeq.current) return;
        setPreview(null); setPreviewState('error');
      }
    })();
  },[lat,lng,method,asr]);

  /* Re-derived rather than refetched, so nudging an offset is instant. */
  const previewTimes = useMemo(
    () => preview ? salahDayFrom(preview, todayKey(), { offsets }) : null,
    [preview, offsets],
  );

  const detectLocation = () => {
    if (!navigator.geolocation){setLocMsg('✗ Geolocation not supported');return;}
    setLocMsg('Detecting location…');
    navigator.geolocation.getCurrentPosition(
      pos=>{setLat(pos.coords.latitude.toFixed(6));setLng(pos.coords.longitude.toFixed(6));setLocMsg('✓ Location detected');},
      err=>{setLocMsg('✗ '+(err?.code===1?'Location blocked — enter coordinates manually':err.message));},
      {timeout:10000, maximumAge:5*60000}
    );
  };

  const setOffset = (p, v) => {
    const n = Number(v);
    setOffsets(o => ({ ...o, [p]: Number.isFinite(n) ? Math.max(-SALAH_OFFSET_LIMIT, Math.min(SALAH_OFFSET_LIMIT, Math.round(n))) : 0 }));
  };

  const save = () => {
    const la=parseFloat(lat), lo=parseFloat(lng);
    if (enabled) {
      if (isNaN(la)||isNaN(lo)) { setLocMsg('✗ Enter valid latitude and longitude first'); return; }
      if (Math.abs(la)>90 || Math.abs(lo)>180) { setLocMsg('✗ Coordinates out of range'); return; }
      /* Don't commit a location that hasn't produced a timetable — it would be
         pushed to every device and to the notification schedule before anyone
         knew whether it works. */
      if (previewState==='error') { setLocMsg('✗ No prayer times for those coordinates — check them and retry'); return; }
      if (previewState==='loading') { setLocMsg('Still checking those coordinates…'); return; }
    }
    update('salah',{enabled, lat:isNaN(la)?null:la, lng:isNaN(lo)?null:lo, method, asr, prayers, offsets});
    setSaveMsg('✓ Saved');
    setTimeout(()=>setSaveMsg(''), 2000);
  };

  const togBtn = active => ({
    flex:1, padding:'7px 8px', borderRadius:7, fontSize:12, fontWeight:600,
    cursor:'pointer', border:'1px solid', transition:'all 110ms',
    background:active?'var(--accent)':'transparent',
    borderColor:active?'var(--accent)':'var(--border)',
    color:active?'#fff':'var(--text-secondary)',
  });

  return (
    <div style={{display:'flex',flexDirection:'column',gap:18,maxWidth:560}}>
      <div style={{fontSize:12,color:'var(--text-secondary)'}}>Automatic salah times in your calendar &amp; Today view.</div>

      {/* enable toggle */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div>
              <div style={{fontSize:14,fontWeight:600,color:'var(--text-primary)'}}>Show prayer times</div>
              <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>Displays salah times in the calendar day panel and Today view</div>
            </div>
            <button type="button" onClick={()=>setEnabled(v=>!v)}
              style={{width:42,height:24,borderRadius:12,border:'none',cursor:'pointer',transition:'background 150ms',background:enabled?'var(--success)':'var(--border-strong)',position:'relative',flexShrink:0}}>
              <span style={{position:'absolute',top:3,left:enabled?21:3,width:18,height:18,borderRadius:9,background:'#fff',transition:'left 150ms'}}/>
            </button>
          </div>

          {enabled && (<>
            {/* location */}
            <div>
              <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:8}}>Location</label>
              <button type="button" onClick={detectLocation}
                style={{width:'100%',marginBottom:10,background:'rgba(99,91,255,.08)',border:'1px solid rgba(99,91,255,.25)',borderRadius:8,color:'#a09cf7',fontSize:12,fontWeight:600,padding:'8px 14px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,justifyContent:'center',fontFamily:'Manrope,sans-serif',transition:'all 120ms'}}
                onMouseEnter={e=>{e.currentTarget.style.background='rgba(99,91,255,.15)';}}
                onMouseLeave={e=>{e.currentTarget.style.background='rgba(99,91,255,.08)';}}>
                <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 1 8 8c0 5.25-8 13-8 13S4 15.25 4 10a8 8 0 0 1 8-8z"/>
                </svg>
                Use my current location
              </button>
              <div style={{display:'flex',gap:10}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:4}}>Latitude</label>
                  <input className="input" type="number" step="any" value={lat} onChange={e=>setLat(e.target.value)} placeholder="51.5074"/>

                  <label key={p} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',background:'var(--bg-surface)',borderRadius:7,cursor:'pointer',border:`1px solid ${prayers[p]?'rgba(129,140,248,.3)':'var(--border)'}`,transition:'border-color 120ms'}}>

                    <span style={{fontSize:12,color:prayers[p]?'var(--text-primary)':'var(--text-secondary)'}}>{PRAYER_LABELS[p]}</span>
                  </label>
                ))}

              <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:4}}>Adjustments</label>
              <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8}}>Minutes to shift each prayer — for a jama'ah that starts after the calculated time.</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                {PRAYER_NAMES.filter(p=>prayers[p]).map(p=>(

                    <input type="number" step="1" min={-SALAH_OFFSET_LIMIT} max={SALAH_OFFSET_LIMIT}
                      value={offsets[p] ?? 0} onChange={e=>setOffset(p, e.target.value)}
                      style={{width:52,background:'var(--bg-base)',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-primary)',fontSize:12,padding:'3px 6px',fontFamily:'"JetBrains Mono",monospace',outline:'none',textAlign:'right'}}/>
                  </div>
                ))}
              </div>
            </div>

            {/* live preview — also the check that these coordinates actually work */}
            <div style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:'.08em',color:'var(--warning)',textTransform:'uppercase'}}>
                  Today's times (preview)
                </div>
                {previewState==='loading' && <span style={{fontSize:10,color:'var(--text-muted)'}}>checking…</span>}
                {previewState==='stale'   && <span style={{fontSize:10,color:'var(--warning)'}}>offline · cached</span>}
              </div>
              {previewState==='idle' && <div style={{fontSize:12,color:'var(--text-muted)'}}>Set a location to preview.</div>}
              {previewState==='error' && <div style={{fontSize:12,color:'var(--danger)'}}>Couldn't load prayer times for those coordinates.</div>}
              {previewTimes && PRAYER_NAMES.filter(p=>prayers[p]).map(p=>(
                <div key={p} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:'1px solid #1f1f2415'}}>
                  <span style={{fontSize:12,color:'var(--text-tertiary)'}}>
                    {PRAYER_LABELS[p]}
                    {offsets[p] ? <span style={{color:'var(--text-muted)',marginLeft:6}}>{offsets[p]>0?`+${offsets[p]}`:offsets[p]}m</span> : null}
                  </span>
                  <span style={{fontSize:12,fontWeight:600,color:'var(--text-primary)',fontFamily:'"JetBrains Mono",monospace'}}>{previewTimes[p]}</span>
                </div>
              ))}
            </div>
          </>)}

      <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'flex-end',paddingTop:4}}>
        {saveMsg && <span style={{fontSize:12,color:'var(--success)'}}>{saveMsg}</span>}
        <button type="button" className="btn-primary" onClick={save}>Save</button>
      </div>
    </div>
  );
}

function BackgroundSection({ background, onChange }) {
  const [urlInput, setUrlInput] = useState(background?.source==='url' ? background.url : '');
  const [query, setQuery]       = useState('');
  const [results, setResults]   = useState([]);
  const [searching, setSearching] = useState(false);
  const [searchMsg, setSearchMsg] = useState(null);

  const applyUrl = () => {
    const url = urlInput.trim();
    if (!url) return;
    onChange({ url, source:'url', attribution:null });
  };
  const runSearch = async e => {
    e.preventDefault();
    if (!query.trim()) return;
    if (!Sync.configured()) { setSearchMsg('Set up sync first — the Unsplash proxy uses the same token.'); return; }
    setSearching(true); setSearchMsg(null);
    try {
      const r = await fetch(`/api/unsplash?q=${encodeURIComponent(query.trim())}`, {
        headers: { Authorization: `Bearer ${Sync.getToken()}` },
      });
      const data = await r.json();
      if (data.error === 'not_configured') { setSearchMsg('Add an Unsplash key to enable search — pasting a link still works.'); setResults([]); }
      else if (data.error) { setSearchMsg('Search failed — try again.'); setResults([]); }
      else { setResults(data.results || []); if (!data.results?.length) setSearchMsg('No results.'); }
    } catch { setSearchMsg('Search failed — try again.'); }
    setSearching(false);
  };
  const pickResult = r => {
    onChange({ url:r.fullUrl, source:'unsplash', attribution:r.photographer });
    if (r.downloadLocation && Sync.configured()) {
      fetch('/api/unsplash', {
        method:'POST',
        headers: { Authorization:`Bearer ${Sync.getToken()}`, 'Content-Type':'application/json' },
        body: JSON.stringify({ downloadLocation:r.downloadLocation }),
      }).catch(()=>{});
    }
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {/* paste a link */}
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Paste a link</div>
        <div style={{display:'flex',gap:8}}>
          <input value={urlInput} onChange={e=>setUrlInput(e.target.value)} placeholder="https://images.unsplash.com/… or a .gif link"
            className="input" style={{flex:1}}/>
          <button className="btn-primary" onClick={applyUrl}>Apply</button>
        </div>
      </div>

      {/* unsplash search */}
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Search Unsplash</div>
        <form onSubmit={runSearch} style={{display:'flex',gap:8,marginBottom:10}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="cozy cafe, forest, rain…" className="input" style={{flex:1}}/>
          <button className="btn-ghost" type="submit" disabled={searching}>{searching?'Searching…':'Search'}</button>
        </form>
        {searchMsg && <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>{searchMsg}</div>}
        {results.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))',gap:8,maxHeight:220,overflowY:'auto'}} className="scrollbar">
            {results.map(r=>(
              <div key={r.id} onClick={()=>pickResult(r)} title={r.photographer?.name}
                style={{cursor:'pointer',borderRadius:8,overflow:'hidden',border:'1.5px solid var(--border)',aspectRatio:'1',backgroundImage:`url(${r.thumbUrl})`,backgroundSize:'cover',backgroundPosition:'center',transition:'border-color 120ms'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}/>
            ))}
          </div>
        )}
      </div>

      {background?.url && (
        <button className="btn-ghost" onClick={()=>onChange(null)} style={{alignSelf:'flex-start'}}>Remove background</button>
      )}
    </div>
  );
}

/* ── SectionBanner — Notion-style cover banner shown above each main nav section ── */
function SectionBanner({ sectionId, banner, onChange, isMobile }) {
  const [hover, setHover]                 = useState(false); /* "Add cover" affordance only — no banner set yet */
  const [active, setActive]               = useState(false); /* edit controls for an existing banner — shown only after a click/tap */
  const [pickerOpen, setPickerOpen]       = useState(false);
  const [repositioning, setRepositioning] = useState(false);
  const [dragY, setDragY]                 = useState(banner?.positionY ?? 50);
  const dragRef = useRef(null);

  useEffect(() => { setDragY(banner?.positionY ?? 50); setRepositioning(false); setHover(false); setActive(false); }, [sectionId]);

  /* Clicking anywhere outside the banner closes the edit controls again —
     otherwise clicking once and then working elsewhere on the page leaves
     Reposition/Change cover/Remove sitting there indefinitely. Suspended while
     repositioning or the picker modal is open so those flows aren't cut short. */
  useEffect(() => {
    if (!active || repositioning || pickerOpen) return;
    const onDocPointerDown = e => {
      if (dragRef.current && !dragRef.current.contains(e.target)) setActive(false);
    };
    document.addEventListener('mousedown', onDocPointerDown);
    document.addEventListener('touchstart', onDocPointerDown);
    return () => {
      document.removeEventListener('mousedown', onDocPointerDown);
      document.removeEventListener('touchstart', onDocPointerDown);
    };
  }, [active, repositioning, pickerOpen]);

  const pillBtn = { background:'rgba(0,0,0,.55)', color:'#fff', border:'none', borderRadius:6, padding:'6px 10px', fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:5, backdropFilter:'blur(4px)', fontFamily:'Manrope,sans-serif' };

  const startDrag = e => {
    if (!repositioning || banner?.type !== 'image' || banner?.fit === 'contain') return;
    e.preventDefault();
    const rectH = dragRef.current.offsetHeight;
    const startY = e.clientY;
    const startPos = dragY;
    const onMove = mv => {
      const deltaPct = ((mv.clientY - startY) / rectH) * 100;
      setDragY(Math.max(0, Math.min(100, startPos - deltaPct)));
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    document.body.style.cursor = 'grabbing';
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  const closeAndChange = v => { onChange(v); setPickerOpen(false); };

  if (!banner) {
    return (
      <div style={{height:isMobile?30:38,flexShrink:0,display:'flex',alignItems:'center',padding:isMobile?'0 16px':'0 36px'}}
        onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}>
        <button onClick={()=>setPickerOpen(true)}
          style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:6,color:'var(--text-secondary)',fontSize:12,padding:'5px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:5,opacity:(hover||isMobile)?1:0,transition:'opacity 120ms',fontFamily:'Manrope,sans-serif'}}>
          <span style={{width:13,height:13,display:'flex'}}>{Ic.img}</span> Add cover
        </button>
        {pickerOpen && <BannerPickerModal sectionId={sectionId} banner={banner} onChange={closeAndChange} onClose={()=>setPickerOpen(false)}/>}
      </div>
    );
  }

  const isImage = banner.type === 'image';
  const isFit   = isImage && banner.fit === 'contain'; /* whole photo visible, no crop — see the blurred backdrop below */

  return (
    <div ref={dragRef} onMouseDown={startDrag} onClick={()=>{ if (!repositioning) setActive(true); }}
      style={{
        position:'relative', height:isMobile?120:200, flexShrink:0, overflow:'hidden',
        backgroundImage: banner.type==='gradient' ? banner.value : undefined,
        backgroundSize:'cover', backgroundRepeat:'no-repeat', backgroundPosition:'center',
        cursor: repositioning ? 'grab' : 'default',
      }}>
      {isImage && (isFit ? (<>
        {/* Most photos aren't nearly as wide as this banner, so showing the
            whole image (object-fit: contain) leaves gaps on the sides or top
            and bottom — and object-fit: contain / background-size: cover both
            resize with the container automatically, so this holds up whether
            the banner is the short mobile strip, a desktop one with the
            sidebar open or collapsed, or anything in between; only the blur
            radius is a fixed pixel value, so that's scaled down on the
            shorter mobile banner to avoid over-smearing it.
            Filling the gaps with a blurred, dimmed copy of the same photo
            reads as intentional rather than empty — same trick as Spotify/
            Apple Music "now playing" backgrounds. Oversized well beyond the
            blur radius and clipped by the container's overflow:hidden so the
            blur's soft edge never peeks into view. */}
        <div style={{position:'absolute', inset:-40, backgroundImage:`url("${banner.url}")`, backgroundSize:'cover', backgroundRepeat:'no-repeat', backgroundPosition:'center', filter:`blur(${isMobile?16:28}px) brightness(0.55)`}}/>
        <img src={banner.url} alt="" style={{position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'contain', objectPosition:'center'}}/>
      </>) : (
        <div style={{position:'absolute', inset:0, backgroundImage:`url("${banner.url}")`, backgroundSize:'cover', backgroundRepeat:'no-repeat', backgroundPosition:`center ${repositioning?dragY:(banner.positionY??50)}%`}}/>
      ))}
      {active && !repositioning && (
        /* Icon-only on mobile: this row can hold up to four buttons now, and
           text labels alongside icons don't reliably fit a narrow phone
           screen. Desktop keeps the labels since there's usually room —
           but "desktop" here just means isMobile is false, a single fixed
           breakpoint that says nothing about actual window width. A snapped/
           split-screen desktop window narrower than that breakpoint's typical
           layout still hits this branch with full labels, so flex-wrap plus a
           maxWidth tied to the container (not a guessed pixel figure) lets the
           row fold onto a second line instead of overflowing off the banner
           at sizes this component has no other way to detect. */
        <div style={{position:'absolute',right:isMobile?12:20,bottom:12,display:'flex',flexWrap:'wrap',justifyContent:'flex-end',rowGap:4,columnGap:isMobile?4:6,maxWidth:`calc(100% - ${isMobile?24:40}px)`}}>
          {isImage && !isFit && (
            <button onClick={()=>setRepositioning(true)} style={pillBtn} title="Reposition">
              <span style={{width:12,height:12,display:'flex'}}>{Ic.move}</span> {!isMobile && 'Reposition'}
            </button>
          )}
          {isImage && (
            <button onClick={()=>onChange({...banner, fit: isFit ? undefined : 'contain'})} style={pillBtn}
              title={isFit ? 'Crop the photo to fill the banner' : 'Show the whole photo — fills the gaps with a blurred backdrop'}>
              <span style={{width:12,height:12,display:'flex'}}>{Ic.fit}</span> {!isMobile && (isFit ? 'Fill banner' : 'Fit whole image')}
            </button>
          )}
          <button onClick={()=>setPickerOpen(true)} style={pillBtn} title="Change cover">
            <span style={{width:12,height:12,display:'flex'}}>{Ic.img}</span> {!isMobile && 'Change cover'}
          </button>
          <button onClick={()=>onChange(null)} style={pillBtn} title="Remove cover">
            <span style={{width:12,height:12,display:'flex'}}>{Ic.x}</span>
          </button>
        </div>
      )}
      {repositioning && (
        <div style={{position:'absolute',left:'50%',bottom:12,transform:'translateX(-50%)',display:'flex',gap:8}}>
          <button onClick={()=>{setDragY(banner.positionY??50);setRepositioning(false);}} style={pillBtn}>Cancel</button>
          <button onClick={()=>{onChange({...banner,positionY:dragY});setRepositioning(false);}} style={{...pillBtn,background:'var(--accent)'}}>Save position</button>
        </div>
      )}
      {banner.source==='unsplash' && banner.attribution?.name && !repositioning && (
        <div style={{position:'absolute',left:isMobile?12:20,bottom:12,fontSize:10.5,color:'rgba(255,255,255,.8)',textShadow:'0 1px 3px rgba(0,0,0,.6)',fontFamily:'Manrope,sans-serif'}}>
          Photo by {banner.attribution.name} on Unsplash
        </div>
      )}
      {pickerOpen && <BannerPickerModal sectionId={sectionId} banner={banner} onChange={closeAndChange} onClose={()=>setPickerOpen(false)}/>}
    </div>
  );
}
