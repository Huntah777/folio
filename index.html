/* ── tag display helpers ───────────────────────────────────────────────────
   Tags accumulate. A vault with thirty of them used to render all thirty as
   equal-weight controls on every screen that filters — a wall you have to
   read end-to-end to find the one you want, and which pushed the actual
   content below the fold. These two components are the fix, and both work on
   the same principle: show the few that earn their place, and put the long
   tail one tap away instead of on screen.                                  */

/* How many tags a filter bar shows before the rest move into the overflow
   popover. Roughly one comfortable row on a laptop. */
const TAG_BAR_MAX = 8;

/* Count how many items in `items` carry each tag, most-used first. Usage is
   the ranking everywhere: the tag you file things under weekly should be the
   one under your cursor, not the one that happens to sort first. */
function tagCounts(items) {
  const counts = new Map();
  for (const it of items) for (const t of (it.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

/* The inline tags on a note/task row, capped. Past two, tags stop labelling
   the row and start competing with its title, so the remainder collapses to
   a "+2" that still tells you they exist. */
function TagChips({ tags = [], max = 2, onPick, size = 11 }) {
  if (!tags.length) return null;
  const shown = tags.slice(0, max);
  const extra = tags.length - shown.length;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:5,minWidth:0}}>
      {shown.map(t => (
        <span key={t} className="tag" style={{background:`${tagColor(t)}1f`,color:tagColor(t),fontSize:size}}
          onClick={onPick ? e => { e.stopPropagation(); onPick(t); } : undefined}>{t}</span>
      ))}
      {extra > 0 && (
        <span className="tag" title={tags.slice(max).join('  ')}
          style={{background:'var(--fill)',color:'var(--text-secondary)',fontSize:size}}>+{extra}</span>
      )}
    </span>
  );
}

/* One scrollable row of capsule filters: All, then the most-used tags, then
   a "+N" that opens a searchable list of everything. The selected tag is
   always pulled into the visible row even when it isn't a popular one —
   otherwise activating a filter from the overflow would hide the only
   control that turns it off again. */
function TagFilterBar({ tags, counts, value, onChange, max = TAG_BAR_MAX }) {
  const [open, setOpen]     = useState(false);
  const [query, setQuery]   = useState('');
  const boxRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (boxRef.current && !boxRef.current.contains(e.target)) { setOpen(false); setQuery(''); } };
    const onKey = e => { if (e.key === 'Escape') { setOpen(false); setQuery(''); } };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [open]);

  if (!tags.length) return null;
  const countOf = t => counts?.get?.(t) ?? 0;

  let head = tags.slice(0, max);
  if (value && !head.includes(value)) head = [...head.slice(0, max - 1), value];
  const rest = tags.filter(t => !head.includes(t));
  const matches = rest.filter(t => t.toLowerCase().includes(query.replace(/^#/, '').toLowerCase()));

  return (
    <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
      <div className="no-scrollbar tag-scroll" style={{display:'flex',alignItems:'center',gap:6,overflowX:'auto',flex:1,minWidth:0,padding:'2px 0'}}>
        <button className="pill" onClick={() => onChange('')}
          style={value === '' ? {background:'var(--fill-active)',color:'var(--text-primary)'} : undefined}>All</button>
        {head.map(t => {
          const on = value === t;
          return (
            <button key={t} className={`pill${on ? ' on' : ''}`} onClick={() => onChange(on ? '' : t)}
              style={on ? {background:tagColor(t),color:'#fff'} : {color:tagColor(t)}}>
              {t}<span className="pill-count">{countOf(t)}</span>
            </button>
          );
        })}
      </div>

      {rest.length > 0 && (
        <div ref={boxRef} style={{position:'relative',flexShrink:0}}>
          <button className="pill" onClick={() => setOpen(o => !o)} aria-expanded={open}>+{rest.length}</button>
          {open && (
            <div style={{position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:60,width:230,padding:6,
                         background:'var(--vibrancy)',backdropFilter:'var(--glass-blur)',WebkitBackdropFilter:'var(--glass-blur)',
                         border:'1px solid var(--hairline)',borderRadius:'var(--r-md)',boxShadow:'var(--shadow-3)',animation:'popIn 160ms var(--ease) both'}}>
              <input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder="Find a tag…"
                className="input" style={{marginBottom:6,fontSize:12.5,padding:'7px 10px'}}/>
              <div className="scrollbar" style={{maxHeight:230,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
                {matches.map(t => (
                  <button key={t} onClick={() => { onChange(t); setOpen(false); setQuery(''); }}
                    style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:'var(--r-xs)',border:'none',
                            background:'transparent',cursor:'pointer',fontFamily:'Manrope,sans-serif',fontSize:12.5,color:'var(--text-tertiary)',textAlign:'left',width:'100%'}}
                    onMouseEnter={e => e.currentTarget.style.background='var(--fill-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                    <span style={{width:8,height:8,borderRadius:99,background:tagColor(t),flexShrink:0}}/>
                    <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t}</span>
                    <span style={{fontSize:10.5,color:'var(--text-muted)',fontFamily:'"JetBrains Mono",monospace'}}>{countOf(t)}</span>
                  </button>
                ))}
                {!matches.length && <div style={{fontSize:12,color:'var(--text-muted)',padding:'8px 9px'}}>No match.</div>}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const PROMPTS_DEEP = [
  /* meaning & purpose */
  'What are you building toward, and does your daily life reflect that?',
  'What would you regret most if you stayed exactly as you are five years from now?',
  'What does a meaningful life look like to you — not a successful one, a meaningful one?',
  'What is the story you tell yourself about who you are? Is it still true?',
  'What would you pursue if external validation were taken off the table entirely?',
  /* stoic philosophy */
  '"You have power over your mind, not outside events." Where in your life have you forgotten this?',
  '"The impediment to action advances action. What stands in the way becomes the way." What obstacle is actually your path right now?',
  '"Waste no more time arguing what a good person should be. Be one." Where are you still arguing instead of acting?',
  '"He who fears death will never do anything worthy of a living man." What are you not doing because of fear?',
  '"First say to yourself what you would be; and then do what you have to do." What do you want to become?',
  /* identity */
  'What parts of yourself have you been ignoring or suppressing lately?',
  'If your actions over the past month were your only autobiography, what would it say about you?',
  'What version of yourself are you grieving? What are you becoming?',
  'What do you believe now that you didn\'t believe five years ago? What changed?',
];
function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}
function dailyPrompt(date = new Date()) {
  const h = date.getHours();
  const d = dayOfYear(date);
  /* Deep prompts surface every ~4 days to avoid fatigue */
  if (d % 4 === 0) return PROMPTS_DEEP[d % PROMPTS_DEEP.length];
  const pool = h < 14 ? PROMPTS_MORNING : PROMPTS_EVENING;
  return pool[d % pool.length];
}
function computeStreak(entries) {
  const days = new Set(entries.map(e => e.date));
  let streak = 0;
  let cursor = new Date();
  if (!days.has(todayKey())) cursor = new Date(Date.now() - 86400000);
  while (days.has(fmtKey(cursor))) { streak++; cursor = new Date(cursor.getTime() - 86400000); }
  return streak;
}
function entriesOnThisDay(entries, date = new Date()) {
  const mmdd = `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const thisYear = date.getFullYear();
  return entries
    .filter(e => e.date && e.date.slice(5) === mmdd && Number(e.date.slice(0,4)) !== thisYear)
    .map(e => ({ ...e, yearsAgo: thisYear - Number(e.date.slice(0,4)) }))
    .sort((a,b) => a.yearsAgo - b.yearsAgo);
}

function MarkdownView({ content, onCheckboxToggle }) {

    if (!onCheckboxToggle) return;

/* ── CodeBlock ── */
function CodeBlock({ value='', lang='javascript', onChange, onLangChange, bare=false }) {
  const taRef  = useRef(null);
  const preRef = useRef(null);
  const gutRef = useRef(null);
  const lines  = value.split('\n');
  const lineCount = Math.max(lines.length, 1);
  const h = Math.max(80, lineCount * 21 + 28);
  const gutW = Math.max(36, String(lineCount).length * 9 + 20);

  const langSafe = safeLang(lang);
  const langColor = LANG_COLORS[langSafe] || LANG_COLORS.plaintext;
  const highlighted = useMemo(() => {
    if (!window.Prism || !Prism.languages[langSafe]) return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return Prism.highlight(value, Prism.languages[langSafe], langSafe);
  }, [value, langSafe]);

  const sync = () => {
    if (preRef.current && taRef.current) preRef.current.scrollTop = taRef.current.scrollTop;
    if (gutRef.current  && taRef.current) gutRef.current.scrollTop  = taRef.current.scrollTop;
  };

  return (
    <div style={{marginTop:4}}>
      {/* `bare` drops the language/copy header — used when this is nested as
          the source editor inside MermaidBlock, which supplies its own. */}
      {!bare && (
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <span style={{width:8,height:8,borderRadius:99,background:langColor,flexShrink:0}}/>
        <select value={lang} onChange={e=>onLangChange(e.target.value)}
          style={{background:'var(--bg-surface)',border:`1px solid ${langColor}55`,borderRadius:6,color:langColor,fontSize:11,padding:'3px 8px',fontFamily:'Manrope,sans-serif',cursor:'pointer'}}>
          {LANGS.map(l=><option key={l} value={l} style={{color:LANG_COLORS[l],background:'var(--bg-surface)'}}>{l}</option>)}
        </select>
        <button onClick={()=>navigator.clipboard.writeText(value)} style={{background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',display:'flex',alignItems:'center',gap:3,fontSize:11}}>
          <svg style={{width:12,height:12}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          copy
        </button>
      </div>
      )}
      <div className="code-wrap" style={{height:h,display:'flex',borderTop:`2px solid ${langColor}`}}>
        <div ref={gutRef} style={{width:gutW,flexShrink:0,overflowY:'hidden',padding:'12px 8px 12px 10px',textAlign:'right',fontFamily:'"JetBrains Mono",monospace',fontSize:'12.5px',lineHeight:'1.6',color:'var(--text-muted)',userSelect:'none',background:'var(--bg-sidebar)',borderRight:'1px solid var(--border)'}}>
          {Array.from({length:lineCount},(_,i)=><div key={i}>{i+1}</div>)}
        </div>
        <div style={{flex:1,position:'relative',overflow:'hidden'}}>
          <pre ref={preRef} className={`language-${langSafe}`} style={{margin:0,height:'100%',overflow:'hidden',padding:'12px 16px'}}>
            <code className={`language-${langSafe}`} dangerouslySetInnerHTML={{__html:highlighted+'\n'}}/>
          </pre>
          <textarea ref={taRef} value={value} onChange={e=>onChange(e.target.value)} onScroll={sync} spellCheck={false}/>
        </div>
      </div>
    </div>
  );
}

/* ── MermaidBlock — a ```mermaid fence rendered as a diagram ──
   The source stays plain text in the note body, so diagrams remain
   searchable, syncable and diffable like everything else — only the
   presentation changes. */
const MERMAID_STARTER = `flowchart TD
    A[Start] --> B{Condition?}
    B -->|Yes| C[Do the thing]
    B -->|No| D[Skip it]
    C --> E[Done]
    D --> E`;

function MermaidBlock({ value, onChange, onLangChange }) {
  const [svg, setSvg]         = useState('');
  const [error, setError]     = useState(null);
  const [editing, setEditing] = useState(() => !value.trim());
  const [themeTick, setThemeTick] = useState(0);
  /* Rendering is debounced so a long diagram isn't re-parsed on every
     keystroke while you type it. */
  const [debounced, setDebounced] = useState(value);
  const seqRef = useRef(0);
  const idRef  = useRef('mmd-' + uid());

  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), 350);
    return () => clearTimeout(t);
  }, [value]);

  useEffect(() => {
    const onThemeChange = () => setThemeTick(t => t + 1);
    window.addEventListener('folio-theme-change', onThemeChange);
    return () => window.removeEventListener('folio-theme-change', onThemeChange);
  }, []);

  useEffect(() => {
    const code = debounced.trim();
    if (!code) { setSvg(''); setError(null); return; }
    let dead = false;
    const my = ++seqRef.current;
    (async () => {
      try {
        /* Unique id per render: mermaid uses it for the SVG's internal element
           ids, and reusing one makes two diagrams on a page collide. */
        const out = await renderMermaid(code, `${idRef.current}-${my}`);
        if (dead || my !== seqRef.current) return;
        setSvg(out); setError(null);
      } catch (e) {
        if (dead || my !== seqRef.current) return;
        /* Keep the last good SVG on screen rather than blanking the diagram
           mid-edit — an in-progress line is almost always transiently invalid. */
        setError(String(e?.message || e).split('\n').slice(0, 3).join(' ').trim() || 'Invalid diagram syntax');
      }
    })();
    return () => { dead = true; };
  }, [debounced, themeTick]);

  const downloadSvg = () => {
    if (!svg) return;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'diagram.svg';
    a.click();
    URL.revokeObjectURL(url);
  };

  const btn = { background:'none', border:'none', color:'var(--text-secondary)', cursor:'pointer', display:'flex', alignItems:'center', gap:3, fontSize:11, fontFamily:'Manrope,sans-serif', padding:0 };

  return (
    <div style={{marginTop:4}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
        <span style={{width:8,height:8,borderRadius:99,background:LANG_COLORS.mermaid,flexShrink:0}}/>
        <select value="mermaid" onChange={e=>onLangChange(e.target.value)}
          style={{background:'var(--bg-surface)',border:`1px solid ${LANG_COLORS.mermaid}55`,borderRadius:6,color:LANG_COLORS.mermaid,fontSize:11,padding:'3px 8px',fontFamily:'Manrope,sans-serif',cursor:'pointer'}}>
          {LANGS.map(l=><option key={l} value={l} style={{color:LANG_COLORS[l],background:'var(--bg-surface)'}}>{l}</option>)}
        </select>
        <button onClick={()=>setEditing(v=>!v)} style={{...btn,color:editing?'var(--accent)':'var(--text-secondary)'}}>
          <span style={{width:12,height:12,display:'flex'}}>{Ic.code}</span>{editing ? 'hide source' : 'edit'}
        </button>
        {svg && <button onClick={downloadSvg} style={btn}>
          <span style={{width:12,height:12,display:'flex'}}>{Ic.img}</span>SVG
        </button>}
        <button onClick={()=>navigator.clipboard.writeText(value)} style={btn}>
          <span style={{width:12,height:12,display:'flex'}}>{Ic.copy}</span>copy
        </button>
        {error && <span style={{fontSize:10.5,color:'var(--danger)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={error}>{error}</span>}
      </div>

      {/* Rendered diagram. Scrolls horizontally rather than squashing — a wide
          flowchart stays readable instead of being crushed to fit. */}
      {svg
        ? <div className="mermaid-view scrollbar"
            style={{background:'var(--bg-surface)',border:`1px solid ${error?'var(--danger)':'var(--border)'}`,borderRadius:10,padding:'14px 12px',overflowX:'auto',textAlign:'center'}}
            dangerouslySetInnerHTML={{__html: svg}}/>
        : <div style={{background:'var(--bg-surface)',border:`1px solid ${error?'var(--danger)':'var(--border)'}`,borderRadius:10,padding:'18px 14px',fontSize:12,color:error?'var(--danger)':'var(--text-muted)'}}>
            {error || (debounced.trim() ? 'Rendering diagram…' : 'Empty diagram — add some mermaid syntax below.')}
          </div>}

      {editing && (
        <div style={{marginTop:8}}>
          <CodeBlock value={value} lang="plaintext" onChange={onChange} onLangChange={()=>{}} bare/>
        </div>
      )}
    </div>
  );
}

/* ── ContextMenu ── */
function ContextMenu({ x, y, items, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDown = e => { if (!ref.current?.contains(e.target)) onClose(); };
    const onKey  = e => { if (e.key === 'Escape') onClose(); };
    setTimeout(() => {
      document.addEventListener('mousedown', onDown);
      document.addEventListener('contextmenu', onDown);
      document.addEventListener('keydown', onKey);
    }, 0);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('contextmenu', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, []);
  // Keep menu inside viewport
  const vpW = window.innerWidth, vpH = window.innerHeight;
  const menuW = 180, menuH = items.length * 36 + 12;
  const left = x + menuW > vpW ? vpW - menuW - 8 : x;
  const top  = y + menuH > vpH ? vpH - menuH - 8 : y;
  return ReactDOM.createPortal(
    <div ref={ref} className="ctx-menu" style={{left,top}}>
      {items.map((item,i) => item === 'sep'
        ? <div key={i} className="ctx-sep"/>
        : <div key={item.label} className={`ctx-item${item.danger?' danger':''}`}
            onClick={()=>{ item.fn(); onClose(); }}>
            {item.icon&&<span style={{width:14,display:'flex',alignItems:'center',flexShrink:0}}>{item.icon}</span>}
            {item.label}
          </div>
      )}
    </div>,
    document.body
  );
}

const MCAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MCAL_DAYS   = ['S','M','T','W','T','F','S'];

/* ── Popover ───────────────────────────────────────────────────────────────
   Anchored floating panel, rendered through a portal into <body>.

   The portal is the point: an absolutely-positioned panel inside a narrow
   scrolling column (the notes list, a task row) gets clipped by that column's
   own bounds, which is how the notes date picker ended up half off-screen.
   Out here it only has to fit the viewport, and it flips above or slides
   sideways to do that.                                                     */
function Popover({ anchorRef, onClose, children, width = 250, align = 'start', gap = 6 }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);

  useLayoutEffect(() => {
    const place = () => {
      const a = anchorRef.current?.getBoundingClientRect();
      if (!a) return;
      const h  = ref.current?.offsetHeight || 300;
      const vw = window.innerWidth, vh = window.innerHeight, m = 8;

      let left = align === 'end' ? a.right - width : a.left;
      left = Math.max(m, Math.min(left, vw - width - m));

      /* Below by default; above when that would run off the bottom and there
         is more room up top. */
      const below = a.bottom + gap;
      const top   = (below + h > vh - m && a.top - gap - h > m) ? a.top - gap - h : below;

      setPos({ left, top: Math.max(m, Math.min(top, vh - h - m)), maxHeight: vh - 2 * m });
    };
    place();
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    return () => { window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true); };
  }, [anchorRef, width, align, gap]);

  useEffect(() => {
    const onDown = e => {
      if (ref.current?.contains(e.target) || anchorRef.current?.contains(e.target)) return;
      onClose();
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } };
    setTimeout(() => document.addEventListener('mousedown', onDown), 0);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [onClose, anchorRef]);

  return ReactDOM.createPortal(
    <div ref={ref} style={{position:'fixed',zIndex:400,width,left:pos?.left ?? -9999,top:pos?.top ?? -9999,
                           maxHeight:pos?.maxHeight,overflow:'auto',visibility:pos?'visible':'hidden',
                           background:'var(--vibrancy)',WebkitBackdropFilter:'var(--glass-blur)',backdropFilter:'var(--glass-blur)',
                           border:'1px solid var(--hairline)',borderRadius:'var(--r-md)',boxShadow:'var(--shadow-3)',
                           padding:8,animation:'popIn 160ms var(--ease) both'}}
      className="scrollbar">
      {children}
    </div>,
    document.body,
  );
}

/* ── DateField ─────────────────────────────────────────────────────────────
   Replaces <input type="date">. The native control renders as whatever the OS
   decides — a grey dd/mm/yyyy stub on desktop Chrome with a picker that owes
   nothing to the rest of the app — so it was the one control on the page that
   always looked borrowed. This one shows the date the way the task rows do
   ("Today", "Tomorrow", "Mon 24 Aug") and opens the app's own calendar.    */
function DateField({ value, onChange, placeholder = 'Add date', allowClear = true, tone }) {
  const btnRef = useRef(null);
  const [open, setOpen] = useState(false);
  const overdue = value && value < todayKey();
  return (
    <>
      <button ref={btnRef} type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
        className="pill" style={{gap:7,color:value ? (tone || (overdue ? 'var(--danger)' : 'var(--text-primary)')) : 'var(--text-secondary)'}}>
        <svg style={{width:12,height:12,flexShrink:0,opacity:.85}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        {value ? friendlyDate(value) : placeholder}
      </button>
      {open && (
        <Popover anchorRef={btnRef} onClose={() => setOpen(false)} width={252}>
          <CalendarPanel value={value} allowClear={allowClear}
            onPick={k => { onChange(k); setOpen(false); }}
            onClear={() => { onChange(''); setOpen(false); }}/>
        </Popover>
      )}
    </>
  );
}

/* The calendar grid itself, shared by DateField and the notes date filter, so
   picking a date looks the same everywhere it happens. */
function CalendarPanel({ value, onPick, onClear, allowClear = true, clearLabel = 'Clear' }) {
  const init = value ? parseKey(value) : new Date();
  const [view, setView] = useState(new Date(init.getFullYear(), init.getMonth(), 1));
  const yr = view.getFullYear(), mo = view.getMonth();
  const firstDow = new Date(yr, mo, 1).getDay();
  const days  = new Date(yr, mo + 1, 0).getDate();
  const cells = Array(firstDow).fill(null).concat(Array.from({length:days},(_,i)=>i+1));
  const shift = d => { const x = new Date(); x.setDate(x.getDate()+d); return fmtKey(x); };

  const navBtn = {background:'none',border:'none',color:'var(--text-secondary)',fontSize:16,cursor:'pointer',
                  lineHeight:1,padding:'2px 8px',borderRadius:'var(--r-pill)',fontFamily:'Manrope,sans-serif'};

  return (
    <div>
      {/* Shortcuts first: most dates you set are one of these three, and
          reaching them through the grid is three interactions instead of one. */}
      <div style={{display:'flex',gap:5,marginBottom:8}}>
        {[['Today',0],['Tomorrow',1],['Next week',7]].map(([label,d])=>(
          <button key={label} type="button" onClick={()=>onPick(shift(d))} className="pill"
            style={{flex:1,justifyContent:'center',padding:'5px 6px',fontSize:11,
                    ...(value===shift(d)?{background:'var(--accent)',color:'#fff'}:{})}}>{label}</button>
        ))}
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
        <button type="button" onClick={()=>setView(new Date(yr,mo-1,1))} style={navBtn} aria-label="Previous month">‹</button>
        <span style={{fontSize:12.5,fontWeight:700,color:'var(--text-primary)'}}>{MCAL_MONTHS[mo]} {yr}</span>
        <button type="button" onClick={()=>setView(new Date(yr,mo+1,1))} style={navBtn} aria-label="Next month">›</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:3}}>
        {MCAL_DAYS.map((d,i)=><div key={i} style={{textAlign:'center',fontSize:10,color:'var(--text-muted)',fontWeight:700,padding:'2px 0'}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
        {cells.map((d,i)=>{
          if (!d) return <div key={i}/>;
          const key = fmtKey(new Date(yr,mo,d));
          const sel = key === value, isToday = key === todayKey();
          return (
            <button key={i} type="button" onClick={()=>onPick(sel ? '' : key)}
              style={{background:sel?'var(--accent)':'none',border:'1px solid '+(isToday&&!sel?'var(--accent-ring)':'transparent'),
                      borderRadius:'var(--r-pill)',color:sel?'#fff':isToday?'var(--accent)':'var(--text-tertiary)',
                      fontSize:11.5,padding:'5px 0',cursor:'pointer',transition:'background 100ms var(--ease)',
                      textAlign:'center',lineHeight:1.4,fontFamily:'Manrope,sans-serif',fontWeight:sel||isToday?700:500}}
              onMouseEnter={e=>{ if(!sel) e.currentTarget.style.background='var(--fill-hover)'; }}
              onMouseLeave={e=>{ if(!sel) e.currentTarget.style.background='none'; }}>
              {d}
            </button>
          );
        })}
      </div>
      {allowClear && value && (
        <button type="button" onClick={onClear} className="btn-ghost"
          style={{marginTop:8,width:'100%',fontSize:11.5,padding:'6px'}}>{clearLabel}</button>
      )}
    </div>
  );
}

/* ── TagEditor ─────────────────────────────────────────────────────────────
   Adding a tag used to mean typing into a 1-character-wide box and trusting a
   <datalist> to offer the tags you already had — which meant re-typing an
   existing tag was as likely as reusing it, and typos quietly became new
   tags. This shows what already exists, ticks off what's applied, and only
   offers to create when nothing matches.                                   */
function TagEditor({ tags = [], allTags = [], onChange, label = 'Tag', compact }) {
  const btnRef = useRef(null);
  const [open, setOpen]   = useState(false);
  const [query, setQuery] = useState('');

  const q = query.trim().replace(/^#+/, '');
  const applied = new Set(tags);
  /* What's already on the item sorts to the top, so opening the picker answers
     "what does this have?" before you've read a single row. Tags applied but
     never registered elsewhere still appear, or removing one would be
     impossible from here. */
  const options = [...new Set([...tags, ...allTags])]
    .filter(t => t.replace(/^#/,'').toLowerCase().includes(q.toLowerCase()))
    .sort((a,b) => (applied.has(b) ? 1 : 0) - (applied.has(a) ? 1 : 0) || a.localeCompare(b));
  const canCreate = q.length > 0 && !allTags.some(t => t.toLowerCase() === ('#'+q).toLowerCase());

  const toggle = t => onChange(applied.has(t) ? tags.filter(x => x !== t) : [...tags, t]);
  const create = () => {
    const clean = '#' + q.replace(/\s+/g, '-');
    if (!applied.has(clean)) onChange([...tags, clean]);
    setQuery('');
  };

  return (
    <>
      <button ref={btnRef} type="button" onClick={() => setOpen(o => !o)} aria-expanded={open}
        className="pill" title="Add or remove tags"
        style={compact ? {padding:'3px 9px',fontSize:11,gap:4} : {gap:5}}>
        <svg style={{width:11,height:11,flexShrink:0}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        {label}
      </button>
      {open && (
        <Popover anchorRef={btnRef} onClose={() => { setOpen(false); setQuery(''); }} width={230}>
          <input autoFocus value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (canCreate) create(); else if (options[0]) toggle(options[0]); } }}
            placeholder="Find or create…" className="input" style={{marginBottom:6,fontSize:12.5,padding:'7px 10px'}}/>
          <div className="scrollbar" style={{maxHeight:220,overflowY:'auto',display:'flex',flexDirection:'column',gap:1}}>
            {options.map(t => {
              const on = applied.has(t);
              return (
                <button key={t} type="button" onClick={() => toggle(t)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:'var(--r-xs)',border:'none',
                          background:'transparent',cursor:'pointer',fontFamily:'Manrope,sans-serif',fontSize:12.5,
                          color:on?'var(--text-primary)':'var(--text-tertiary)',textAlign:'left',width:'100%'}}
                  onMouseEnter={e => e.currentTarget.style.background='var(--fill-hover)'}
                  onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                  <span style={{width:8,height:8,borderRadius:99,background:tagColor(t),flexShrink:0}}/>
                  <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t}</span>
                  {on && <svg style={{width:12,height:12,color:'var(--accent)',flexShrink:0}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
                </button>
              );
            })}
            {canCreate && (
              <button type="button" onClick={create}
                style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:'var(--r-xs)',border:'none',
                        background:'transparent',cursor:'pointer',fontFamily:'Manrope,sans-serif',fontSize:12.5,
                        color:'var(--accent)',textAlign:'left',width:'100%'}}
                onMouseEnter={e => e.currentTarget.style.background='var(--fill-hover)'}
                onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                <svg style={{width:11,height:11,flexShrink:0}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Create #{q.replace(/\s+/g,'-')}</span>
              </button>
            )}
            {!options.length && !canCreate && <div style={{fontSize:12,color:'var(--text-muted)',padding:'8px 9px'}}>No tags yet.</div>}
          </div>
        </Popover>
      )}
    </>
  );
}

/* ── JournalDatePicker — the same idea as CalendarPanel, but with year
   stepping («/»), since browsing a journal reasonably means jumping whole
   years back, not just months. Selecting a day hands its key up and closes. ── */
function JournalDatePicker({ value, onChange, onClose }) {
  const ref = useRef(null);
  const init = value ? parseKey(value) : new Date();
  const [view, setView] = useState(new Date(init.getFullYear(), init.getMonth(), 1));
  const [typed, setTyped]       = useState('');
  const [typedErr, setTypedErr] = useState(false);
  useEffect(() => {
    const h = e => { if (!ref.current?.contains(e.target)) onClose(); };
    setTimeout(() => document.addEventListener('mousedown', h), 0);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  /* Typing a date jumps straight there — clicking « » to walk from "now" back
     to, say, 1999 is dozens of clicks. Same DD/MM/YYYY order the app already
     displays dates in (en-GB), so it matches what you see everywhere else. */
  const submitTyped = () => {
    const dt = parseTypedDateDMY(typed);
    if (!dt) { setTypedErr(true); return; }
    onChange(fmtKey(dt));
    onClose();
  };
  const yr = view.getFullYear(), mo = view.getMonth();
  const firstDow = new Date(yr, mo, 1).getDay();
  const days     = new Date(yr, mo + 1, 0).getDate();
  const cells    = Array(firstDow).fill(null).concat(Array.from({length:days},(_,i)=>i+1));
  const navBtn = { background:'none', border:'none', color:'var(--text-secondary)', fontSize:15, cursor:'pointer', lineHeight:1, padding:'0 4px', borderRadius:5 };
  return (
    <div ref={ref} style={{position:'absolute',top:'calc(100% + 4px)',left:0,zIndex:200,background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:12,padding:'12px 12px 10px',width:224,boxShadow:'0 12px 40px rgba(0,0,0,.8)'}}>
      <form onSubmit={e=>{e.preventDefault();submitTyped();}} style={{display:'flex',gap:6,marginBottom:10}}>
        <input value={typed} onChange={e=>{setTyped(e.target.value);setTypedErr(false);}}
          placeholder="DD/MM/YYYY" inputMode="numeric" autoFocus
          style={{flex:1,minWidth:0,background:'var(--bg-base)',border:`1px solid ${typedErr?'var(--danger)':'var(--border-strong)'}`,borderRadius:6,padding:'6px 8px',color:'var(--text-primary)',fontSize:12,outline:'none',fontFamily:'"JetBrains Mono",monospace'}}/>
        <button type="submit" style={{background:'var(--accent)',border:'none',borderRadius:6,color:'#fff',padding:'0 10px',fontSize:11,fontWeight:600,cursor:'pointer',flexShrink:0}}>Go</button>
      </form>
      {typedErr && <div style={{fontSize:10.5,color:'var(--danger)',marginTop:-6,marginBottom:8}}>Enter a valid date as DD/MM/YYYY</div>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{display:'flex'}}>
          <button onClick={()=>setView(new Date(yr-1,mo,1))} title="Previous year" style={navBtn} onMouseEnter={e=>e.currentTarget.style.color='var(--text-primary)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-secondary)'}>«</button>
          <button onClick={()=>setView(new Date(yr,mo-1,1))} title="Previous month" style={navBtn} onMouseEnter={e=>e.currentTarget.style.color='var(--text-primary)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-secondary)'}>‹</button>
        </div>
        <span style={{fontSize:12,fontWeight:700,color:'var(--text-primary)'}}>{MCAL_MONTHS[mo]} {yr}</span>
        <div style={{display:'flex'}}>
          <button onClick={()=>setView(new Date(yr,mo+1,1))} title="Next month" style={navBtn} onMouseEnter={e=>e.currentTarget.style.color='var(--text-primary)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-secondary)'}>›</button>
          <button onClick={()=>setView(new Date(yr+1,mo,1))} title="Next year" style={navBtn} onMouseEnter={e=>e.currentTarget.style.color='var(--text-primary)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-secondary)'}>»</button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:3}}>
        {MCAL_DAYS.map((d,i)=><div key={i} style={{textAlign:'center',fontSize:10,color:'var(--text-muted)',fontWeight:700,padding:'2px 0'}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
        {cells.map((d,i)=>{
          if (!d) return <div key={i}/>;
          const key = fmtKey(new Date(yr,mo,d));
          const sel = key === value;
          const isToday = key === todayKey();
          return (
            <button key={i} onClick={()=>{ onChange(key); onClose(); }}
              style={{background:sel?'var(--accent)':isToday&&!sel?'var(--bg-surface)':'none',border:isToday&&!sel?'1px solid #818cf840':'1px solid transparent',borderRadius:6,color:sel?'#fff':isToday?'var(--accent)':'var(--text-tertiary)',fontSize:11,padding:'4px 0',cursor:'pointer',transition:'all 80ms',textAlign:'center',lineHeight:1.4}}
              onMouseEnter={e=>{ if(!sel) e.currentTarget.style.background='var(--border-strong)'; }}
              onMouseLeave={e=>{ if(!sel) e.currentTarget.style.background=isToday?'var(--bg-surface)':'none'; }}>
              {d}
            </button>
          );
        })}
      </div>
      <button onClick={()=>{ onChange(todayKey()); onClose(); }} style={{marginTop:8,width:'100%',background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',fontSize:11,padding:'5px',cursor:'pointer',fontFamily:'Manrope,sans-serif',transition:'all 110ms'}} onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--accent)';e.currentTarget.style.color='var(--accent)';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-strong)';e.currentTarget.style.color='var(--text-secondary)';}}>Jump to today</button>
    </div>
  );
}

/* ── JournalWeekNav — the Journal feed always shows exactly one Monday–Sunday
   week; this steps which one. Week is the primary unit (‹ ›), Month/Year
   buttons jump several weeks at a time, and the calendar icon jumps straight
   to an arbitrary date's week. ── */
function JournalWeekNav({ viewDate, onChange }) {
  const [pickerOpen, setPickerOpen] = useState(false);
  const { startKey, endKey } = weekRangeKeys(viewDate);
  const isThisWeek = startKey === weekRangeKeys(todayKey()).startKey;
  const shiftDays = n => onChange(fmtKey(new Date(parseKey(viewDate).getTime() + n*86400000)));
  const shiftMonths = n => { const d = parseKey(viewDate); onChange(fmtKey(new Date(d.getFullYear(), d.getMonth()+n, d.getDate()))); };
  const shiftYears  = n => { const d = parseKey(viewDate); onChange(fmtKey(new Date(d.getFullYear()+n, d.getMonth(), d.getDate()))); };
  const navBtn = { background:'var(--bg-surface)', border:'1px solid var(--border)', borderRadius:6, color:'var(--text-secondary)', fontSize:11.5, padding:'5px 8px', cursor:'pointer', fontFamily:'Manrope,sans-serif', display:'flex', alignItems:'center', gap:3, whiteSpace:'nowrap' };
  return (
    <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',gap:6,marginBottom:18,maxWidth:900}}>
      <button onClick={()=>shiftYears(-1)} title="Previous year" style={navBtn}>« Year</button>
      <button onClick={()=>shiftMonths(-1)} title="Previous month" style={navBtn}>‹ Month</button>
      <button onClick={()=>shiftDays(-7)} title="Previous week" style={navBtn}>‹ Week</button>
      <div style={{position:'relative'}}>
        <button onClick={()=>setPickerOpen(v=>!v)} style={{...navBtn,color:'var(--text-primary)',fontWeight:600,minWidth:100,justifyContent:'center'}}>
          <span style={{width:12,height:12,display:'flex'}}>{Ic.cal}</span> {weekLabel(startKey,endKey)}
        </button>
        {pickerOpen && <JournalDatePicker value={viewDate} onChange={onChange} onClose={()=>setPickerOpen(false)}/>}
      </div>
      <button onClick={()=>shiftDays(7)} title="Next week" style={navBtn}>Week ›</button>
      <button onClick={()=>shiftMonths(1)} title="Next month" style={navBtn}>Month ›</button>
      <button onClick={()=>shiftYears(1)} title="Next year" style={navBtn}>Year »</button>
      {!isThisWeek && (
        <button onClick={()=>onChange(todayKey())} style={{...navBtn,color:'var(--accent)',borderColor:'var(--accent)'}}>This week</button>
      )}
    </div>
  );
}

/* ── PdfView ─────────────────────────────────────────────────────
   Renders a stored PDF with pdf.js onto a canvas. Canvas rather than an
   <iframe>/<embed> because the bytes arrive as an authenticated fetch (no
   header can ride on a frame src), and because it keeps `object-src 'none'`
   in the CSP intact. */
function PdfView({ file, onRemove }) {
  const [state, setState]   = useState('loading'); /* loading | ready | error */
  const [error, setError]   = useState(null);
  const [page, setPage]     = useState(1);
  const [pages, setPages]   = useState(0);
  const [expanded, setExpanded] = useState(false);
  const canvasRef = useRef(null);
  const docRef    = useRef(null);
  const taskRef   = useRef(null);   /* in-flight render, so page flips can cancel */
  const wrapRef   = useRef(null);

  /* Load the document once per file. */
  useEffect(() => {
    if (!file?.key) return;
    let dead = false;
    setState('loading'); setError(null);
    (async () => {
      try {
        const [lib, url] = await Promise.all([pdfjs(), Files.url(file.key)]);
        const doc = await lib.getDocument(url).promise;
        if (dead) { try { doc.destroy(); } catch {} return; }
        docRef.current = doc;
        setPages(doc.numPages);
        setPage(1);
        setState('ready');
      } catch (e) {
        if (dead) return;
        setError(e.message === 'UNAUTHORIZED' ? 'Not authorised — check your sync token' : 'Could not load this PDF');
        setState('error');
      }
    })();
    return () => {
      dead = true;
      try { taskRef.current?.cancel(); } catch {}
      try { docRef.current?.destroy(); } catch {}
      docRef.current = null;
    };
  }, [file?.key]);

  /* Draw the current page, sized to the container so it stays readable on a
     phone and sharp on a retina screen. */
  useEffect(() => {
    if (state !== 'ready' || !docRef.current) return;
    let dead = false;
    (async () => {
      try {
        try { taskRef.current?.cancel(); } catch {}
        const pg = await docRef.current.getPage(page);
        if (dead) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const avail = (wrapRef.current?.clientWidth || 600) - 2;
        const base  = pg.getViewport({ scale: 1 });
        const scale = Math.max(0.2, avail / base.width);
        const dpr   = Math.min(window.devicePixelRatio || 1, 2);
        const vp    = pg.getViewport({ scale: scale * dpr });
        canvas.width  = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        canvas.style.width  = '100%';
        canvas.style.height = 'auto';
        const task = pg.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
        taskRef.current = task;
        await task.promise;
      } catch (e) {
        /* A cancelled render is the expected outcome of flipping pages fast. */
        if (!dead && e?.name !== 'RenderingCancelledException') setError('Could not render this page');
      }
    })();
    return () => { dead = true; };
  }, [state, page, expanded]);

  const download = async () => {
    try {
      const url = await Files.url(file.key);
      const a = document.createElement('a');
      a.href = url; a.download = file.name || 'document.pdf';
      a.click();
    } catch {}
  };

  const bar = { display:'flex', alignItems:'center', gap:8, padding:'8px 10px', borderBottom:'1px solid var(--border)', flexWrap:'wrap' };
  const btn = { background:'var(--bg-base)', border:'1px solid var(--border-strong)', borderRadius:6, color:'var(--text-secondary)', cursor:'pointer', fontSize:11, padding:'3px 8px', fontFamily:'Manrope,sans-serif' };

  return (
    <div style={{margin:'8px 0',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
      <div style={bar}>
        <svg style={{width:13,height:13,flexShrink:0,color:'var(--danger)'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
        <span style={{fontSize:12,fontWeight:600,color:'var(--text-primary)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>
          {file?.name || 'document.pdf'}
        </span>
        {file?.size ? <span style={{fontSize:10.5,color:'var(--text-muted)',flexShrink:0}}>{fmtBytes(file.size)}</span> : null}
        <button style={btn} onClick={download}>Download</button>
        {onRemove && <button style={{...btn,color:'var(--danger)'}} onClick={onRemove}>Remove</button>}
      </div>

      {state==='loading' && <div style={{padding:'22px 14px',fontSize:12,color:'var(--text-muted)'}}>Loading PDF…</div>}
      {state==='error'   && <div style={{padding:'22px 14px',fontSize:12,color:'var(--danger)'}}>{error}</div>}

      {state==='ready' && (<>
        <div ref={wrapRef} style={{padding:10,maxHeight:expanded?'none':420,overflow:'auto',background:'var(--bg-base)'}}>
          <canvas ref={canvasRef} style={{display:'block',borderRadius:4,boxShadow:'0 1px 6px rgba(0,0,0,.25)'}}/>
        </div>
        <div style={{...bar,borderBottom:'none',borderTop:'1px solid var(--border)'}}>
          <button style={{...btn,opacity:page<=1?.4:1}} disabled={page<=1} onClick={()=>setPage(p=>Math.max(1,p-1))}>‹ Prev</button>
          <span style={{fontSize:11,color:'var(--text-secondary)',fontFamily:'"JetBrains Mono",monospace'}}>{page} / {pages}</span>
          <button style={{...btn,opacity:page>=pages?.4:1}} disabled={page>=pages} onClick={()=>setPage(p=>Math.min(pages,p+1))}>Next ›</button>
          <span style={{flex:1}}/>
          <button style={btn} onClick={()=>setExpanded(v=>!v)}>{expanded?'Collapse':'Expand'}</button>
        </div>
      </>)}
    </div>
  );
}

/* ── FolderPickerDropdown — collapsible tree dropdown for folder assignment ── */
function FolderPickerDropdown({ value, folders, onChange }) {
  const [open, setOpen]       = useState(false);
  const [expanded, setExpanded] = useState(() => new Set());
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const selected = folders.find(f => f.id === value) || null;
  const tree = useMemo(() => buildFolderTree(folders), [folders]);

  const toggleExp = (fid, e) => {
    e.stopPropagation();
    setExpanded(prev => { const n = new Set(prev); n.has(fid) ? n.delete(fid) : n.add(fid); return n; });
  };

  const renderNode = node => {
    const isSel      = value === node.id;
    const isExp      = expanded.has(node.id);
    const hasKids    = node.children.length > 0;
    const fColor     = node.color || 'slate';
    return (
      <div key={node.id}>
        <div
          onClick={()=>{ onChange(node.id); setOpen(false); }}
          style={{display:'flex',alignItems:'center',gap:5,padding:'6px 10px',cursor:'pointer',
            background:isSel?'var(--accent-soft)':'transparent',
            color:isSel?'var(--accent)':'var(--text-primary)'}}
          onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{if(!isSel)e.currentTarget.style.background=isSel?'var(--accent-soft)':'transparent';}}>
          {hasKids ? (
            <button onClick={e=>toggleExp(node.id,e)} style={{background:'none',border:'none',cursor:'pointer',
              padding:2,color:'var(--text-muted)',display:'flex',flexShrink:0,
              transform:isExp?'rotate(90deg)':'none',transition:'transform 130ms'}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:9,height:9}}><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          ) : <span style={{width:13,flexShrink:0}}/>}
          <FolderIconSvg color={fColor} iconId={node.icon} size={15}/>
          <span style={{fontSize:12,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.name}</span>
          {isSel && <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11,flexShrink:0}}><polyline points="20 6 9 17 4 12"/></svg>}
        </div>
        {isExp && hasKids && (
          <div style={{marginLeft:14,borderLeft:'1px solid var(--border)',paddingLeft:1}}>
            {node.children.map(child => renderNode(child))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div ref={ref} style={{position:'relative',marginLeft:'auto',flexShrink:0}}>
      <button onClick={()=>setOpen(v=>!v)}
        style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,
          color:selected?'var(--accent)':'var(--text-muted)',fontSize:11,padding:'3px 6px',
          cursor:'pointer',outline:'none',display:'flex',alignItems:'center',gap:4,maxWidth:140,
          fontFamily:'Manrope,sans-serif'}}>
        {selected
          ? <FolderIconSvg color={selected.color||'slate'} iconId={selected.icon} size={14}/>
          : <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        }
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,maxWidth:90}}>
          {selected ? selected.name : 'No folder'}
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:8,height:8,flexShrink:0,opacity:0.5}}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      {open && (
        <div style={{position:'absolute',right:0,top:'calc(100% + 4px)',zIndex:300,
          background:'var(--bg-surface-2)',border:'1px solid var(--border-strong)',
          borderRadius:10,boxShadow:'var(--shadow-3)',
          minWidth:180,maxWidth:260,maxHeight:280,overflowY:'auto'}}>
          <div
            onClick={()=>{ onChange(null); setOpen(false); }}
            style={{display:'flex',alignItems:'center',gap:5,padding:'7px 10px',cursor:'pointer',
              background:!value?'var(--accent-soft)':'transparent',
              color:!value?'var(--accent)':'var(--text-muted)',
              borderBottom:'1px solid var(--border)',fontSize:12}}
            onMouseEnter={e=>{if(value)e.currentTarget.style.background='var(--fill-hover)';}}
            onMouseLeave={e=>{if(value)e.currentTarget.style.background=!value?'var(--accent-soft)':'transparent';}}>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span style={{flex:1}}>No folder</span>
            {!value && <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11,flexShrink:0}}><polyline points="20 6 9 17 4 12"/></svg>}
          </div>
          {tree.map(node => renderNode(node))}
        </div>
      )}
    </div>
  );
}

/* ── NoteEditor ── */
function NoteEditor({ note, state, update, isMobile }) {
  const [showCode, setShowCode] = useState(false);
  const [codeLang, setCodeLang] = useState('javascript');
  const [codeVal, setCodeVal] = useState('');
  const [showTagPicker, setShowTagPicker] = useState(false);
  const [tagInput, setTagInput] = useState('');
  const [tagFocused, setTagFocused] = useState(false);
  const [showLinkSearch, setShowLinkSearch] = useState(false);
  const [linkQuery, setLinkQuery] = useState('');
  const [showEmojiPicker, setShowEmojiPicker] = useState(false);
  const [showWebLink, setShowWebLink] = useState(false);
  const [wlUrl,   setWlUrl]   = useState('');
  const [wlTitle, setWlTitle] = useState('');
  const [previewMode, setPreviewMode] = useState(true);
  const imgInputRef = useRef(null);
  const mdInputRef  = useRef(null);
  const pdfInputRef = useRef(null);
  /* Must stay above the `if (!note) return` below — Rules of Hooks. */
  const [pdfBusy, setPdfBusy] = useState(null); /* null | {label, error} */
  const activeTA = useRef(null); /* { el, partIdx, pos } */

  /* Every note opens read-only first, edit is an explicit choice — this
     component instance is reused across notes/tabs (not remounted), so
     without this a note opened while previewMode happened to be false from
     editing the last one would silently skip the preview landing. */
  useEffect(() => { setPreviewMode(true); }, [note?.id]);

  /* ── bodyParts — MUST be before any early return (Rules of Hooks) ── */
  const bodyParts = useMemo(() => note ? parseBody(note.body) : [{type:'text',content:''}], [note?.body]);

  if (!note) return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
      <div style={{fontFamily:'Fraunces,serif',fontSize:18,color:'var(--border-strong)'}}>Select or create a note</div>
    </div>
  );

  const upNote = patch => update('notes', state.notes.map(n => n.id===note.id ? {...n,...patch,updated:Date.now()} : n));
  const removeTag = t => upNote({ tags: note.tags.filter(x=>x!==t) });
  const addTag = t => {
    const clean = t.trim().replace(/^#*/,'#');
    if (clean.length <= 1) return;
    if (!note.tags.includes(clean)) upNote({tags:[...note.tags,clean]});
    if (!state.tags.includes(clean)) update('tags',[...state.tags,clean]);
  };

  const rebuildBody = np => np.map(p=>{
    if(p.type==='code') return '```'+p.lang+'\n'+p.content+'\n```';
    if(p.type==='link') return '[url:'+encodeURIComponent(p.title)+'|'+encodeURIComponent(p.url)+']';
    if(p.type==='image') return '[img:'+p.id+']';
    if(p.type==='pdf')   return '[pdf:'+p.id+']';
    return p.content;
  }).join('');

  /* ── formatting toolbar ── */
  const insertLinePrefix = prefix => {
    if (!activeTA.current) return;
    const { el, partIdx } = activeTA.current;
    const pos = el.selectionStart;
    const val = el.value;
    const lineStart = val.lastIndexOf('\n', pos-1)+1;
    const newVal = val.slice(0,lineStart)+prefix+val.slice(lineStart);
    const np=[...bodyParts]; np[partIdx]={...np[partIdx],content:newVal};
    upNote({body:rebuildBody(np)});
    setTimeout(()=>{ el.focus(); el.selectionStart=el.selectionEnd=lineStart+prefix.length+(pos-lineStart); },0);
  };

  /* Toggle a block-level prefix on the current line — strips whatever prefix is
     already there, then applies the new one (or just removes it if it was the same). */
  const toggleLinePrefix = prefix => {
    if (!activeTA.current) return;
    const { el, partIdx } = activeTA.current;
    const pos = el.selectionStart;
    const val = el.value;
    const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
    const lineEnd = val.indexOf('\n', pos);
    const lineEndPos = lineEnd === -1 ? val.length : lineEnd;
    const line = val.slice(lineStart, lineEndPos);
    const existingM = line.match(/^(\s*)(#{1,3} |[-*] (?:\[[ xX]\] )?|> )?/);
    const indent = existingM[1];
    const existingPrefix = existingM[2] || '';
    const rawContent = line.slice(indent.length + existingPrefix.length);
    const newLine = indent + (existingPrefix === prefix ? rawContent : prefix + rawContent);
    const cursorDelta = newLine.length - line.length;
    const newVal = val.slice(0, lineStart) + newLine + val.slice(lineEndPos);
    const np = [...bodyParts]; np[partIdx] = {...np[partIdx], content: newVal};
    upNote({body: rebuildBody(np)});
    setTimeout(() => { el.focus(); el.selectionStart = el.selectionEnd = Math.max(lineStart, pos + cursorDelta); }, 0);
  };

  const FMT = [
    {label:'H1', title:'Heading 1', fn:()=>toggleLinePrefix('# ')},
    {label:'H2', title:'Heading 2', fn:()=>toggleLinePrefix('## ')},
    {label:'H3', title:'Heading 3', fn:()=>toggleLinePrefix('### ')},
    {icon:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>),
      title:'Bullet list', fn:()=>toggleLinePrefix('- ')},
    {icon:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="6" height="6" rx="1.5"/><polyline points="4.4 8 5.4 9 7.6 6.5"/><line x1="12" y1="8" x2="21" y2="8"/><line x1="3" y1="17" x2="21" y2="17" opacity=".4"/></svg>),
      title:'Todo item', fn:()=>toggleLinePrefix('- [ ] ')},
    {icon:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="6" y1="4" x2="6" y2="20"/><line x1="10.5" y1="8" x2="20" y2="8"/><line x1="10.5" y1="13" x2="20" y2="13"/><line x1="10.5" y1="18" x2="16" y2="18"/></svg>),
      title:'Quote', fn:()=>toggleLinePrefix('> ')},
    {icon:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="20" y2="12"/></svg>),
      title:'Divider', fn:()=>insertLinePrefix('---\n')},
  ];

  /* ── @Today auto-replace ── */
  const todayStamp = () => {
    const now = new Date();
    return now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) +
           ' ' + now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  };

  const handleTitleChange = e => {
    let val = e.target.value;
    const pos = e.target.selectionStart;
    e.target.style.height = 'auto';
    e.target.style.height = e.target.scrollHeight + 'px';
    const match = val.slice(0, pos).match(/@[Tt]oday$/);
    if (match) {
      const stamp  = todayStamp();
      const before = val.slice(0, pos - match[0].length);
      const after  = val.slice(pos);
      val = before + stamp + after;
      upNote({title: val});
      setTimeout(()=>{ e.target.selectionStart = e.target.selectionEnd = before.length + stamp.length; }, 0);
      return;
    }
    upNote({title: val});
  };

  const handleBodyChange = (e, partIdx) => {
    let content = e.target.value;
    const pos = e.target.selectionStart;
    const match = content.slice(0, pos).match(/@[Tt]oday$/);
    if (match) {
      const stamp  = todayStamp();
      const before = content.slice(0, pos - match[0].length);
      const after  = content.slice(pos);
      content = before + stamp + after;
      const np=[...bodyParts]; np[partIdx]={...np[partIdx],content};
      upNote({body:rebuildBody(np)});
      setTimeout(()=>{ e.target.selectionStart=e.target.selectionEnd=before.length+stamp.length; },0);
      return;
    }
    const np=[...bodyParts]; np[partIdx]={...np[partIdx],content};
    upNote({body:rebuildBody(np)});
  };

  const handleCheckboxToggle = (partIdx, cbIdx) => {
    const lines = bodyParts[partIdx].content.split('\n');
    let n = 0;
    const toggled = lines.map(line => {
      const m = line.match(/^(\s*[-*] )(\[[ x]\] )(.*)$/i);
      if (m) {
        if (n === cbIdx) { n++; return m[1] + (/x/i.test(m[2]) ? '[ ] ' : '[x] ') + m[3]; }
        n++;
      }
      return line;
    });
    const np = [...bodyParts]; np[partIdx] = {...np[partIdx], content: toggled.join('\n')};
    upNote({body: rebuildBody(np)});
  };

  /* ── Smart keyboard handling for the note body ── */
  const handleBodyKeyDown = (e, partIdx) => {
    const el = e.target;
    const pos = el.selectionStart;
    const selEnd = el.selectionEnd;
    const val = el.value;
    const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
    const lineEnd = val.indexOf('\n', pos);
    const lineEndPos = lineEnd === -1 ? val.length : lineEnd;
    const line = val.slice(lineStart, lineEndPos);
    // matches: (indent)(bullet char) (optional todo prefix)(content)
    const bm = line.match(/^(\s*)([-*]) (\[[ xX]\] )?(.*)$/);

    const apply = (newContent, newPos) => {
      const np = [...bodyParts]; np[partIdx] = {...np[partIdx], content: newContent};
      upNote({body: rebuildBody(np)});
      setTimeout(() => { el.selectionStart = el.selectionEnd = newPos; }, 0);
    };

    // ── Tab / Shift+Tab: indent or unindent current line ──
    if (e.key === 'Tab') {
      e.preventDefault();
      if (bm) {
        if (e.shiftKey) {
          if (bm[1].length < 2) return;
          apply(val.slice(0, lineStart) + line.slice(2) + val.slice(lineEndPos), Math.max(lineStart, pos - 2));
        } else {
          apply(val.slice(0, lineStart) + '  ' + line + val.slice(lineEndPos), pos + 2);
        }
      } else {
        apply(val.slice(0, pos) + '  ' + val.slice(pos), pos + 2);
      }
      return;
    }

    // ── Enter: smart bullet/todo continuation ──
    if (e.key === 'Enter' && !e.shiftKey && bm) {
      e.preventDefault();
      const indent = bm[1];
      const todoPrefix = bm[3] || '';
      const content = bm[4] || '';

      if (!content.trim()) {
        // Empty bullet — unindent one level, or exit list if already at root
        if (indent.length >= 2) {
          const newLine = indent.slice(2) + bm[2] + ' ' + (todoPrefix ? '[ ] ' : '');
          apply(val.slice(0, lineStart) + newLine + val.slice(lineEndPos), lineStart + newLine.length);
        } else {
          // Remove the empty bullet entirely
          apply(val.slice(0, lineStart) + val.slice(lineEndPos), lineStart);
        }
      } else {
        // Continue list: new bullet at same indent + same type
        const newBullet = '\n' + indent + bm[2] + ' ' + (todoPrefix ? '[ ] ' : '');
        apply(val.slice(0, pos) + newBullet + val.slice(pos), pos + newBullet.length);
      }
      return;
    }

    // ── Backspace: remove empty bullet / unindent ──
    if (e.key === 'Backspace' && bm && pos === selEnd) {
      const prefixLen = bm[1].length + 2 + (bm[3] ? bm[3].length : 0);
      const contentStart = lineStart + prefixLen;
      if (pos === contentStart && !bm[4]) {
        e.preventDefault();
        if (bm[1].length >= 2) {
          // Unindent first
          const newLine = bm[1].slice(2) + bm[2] + ' ' + (bm[3] ? '[ ] ' : '');
          apply(val.slice(0, lineStart) + newLine + val.slice(lineEndPos), lineStart + newLine.length);
        } else if (lineStart > 0) {
          // Remove the bullet line and merge with previous line
          apply(val.slice(0, lineStart - 1) + val.slice(lineEndPos), lineStart - 1);
        } else {
          // First line: strip the bullet prefix
          apply(val.slice(prefixLen), 0);
        }
        return;
      }
    }
  };

  /* ── PDF attachment ──
     Uploaded to R2 first; only the small metadata record goes into the note,
     so the synced state blob stays lean. (State for this lives above the
     early return — see the refs block — to keep hook order stable.) */
  const handlePdfAttach = async e => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    if (file.type !== 'application/pdf') { setPdfBusy({ label:'Not a PDF', error:true }); return; }
    if (file.size > MAX_PDF_BYTES) { setPdfBusy({ label:`Too large — max ${fmtBytes(MAX_PDF_BYTES)}`, error:true }); return; }
    try {
      setPdfBusy({ label:'Uploading…' });
      const meta = await Files.upload(file);
      const id = uid();
      const rec = { id, key:meta.key, name:meta.name, size:meta.size, type:meta.type, uploadedAt:Date.now() };
      insertAtCursor(
        {type:'pdf', id},
        (note.body||'')+'\n\n[pdf:'+id+']',
        {files: [...(note.files||[]), rec]}
      );
      setPdfBusy(null);
    } catch (err) {
      setPdfBusy({ label: pdfErrorLabel(err), error:true });
    }
  };

  /* ── image upload ── */
  const handleImg = e => {
    const file = e.target.files?.[0];
    if (!file||!file.type.startsWith('image/')||file.size>MAX_IMAGE_BYTES) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const id = uid();
      const newImages = [...(note.images||[]), {id, src:ev.target.result, alt:file.name, caption:''}];
      insertAtCursor(
        {type:'image', id},
        (note.body||'')+'\n\n[img:'+id+']',
        {images: newImages}
      );
    };
    reader.readAsDataURL(file);
    e.target.value='';
  };

  /* ── markdown import / export ── */
  const insertTextAtCursor = text => {
    if (activeTA.current) {
      const { partIdx, pos=0 } = activeTA.current;
      const cur = bodyParts[partIdx];
      if (cur && cur.type==='text') {
        const before = cur.content.slice(0,pos);
        const after  = cur.content.slice(pos);
        const np=[...bodyParts]; np[partIdx]={...np[partIdx],content:before+text+after};
        upNote({body:rebuildBody(np)});
        return;
      }
    }
    upNote({body:(note.body?note.body+'\n\n':'')+text});
  };
  const handleMdUpload = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => insertTextAtCursor(ev.target.result);
    reader.readAsText(file, 'UTF-8');
    e.target.value='';
  };
  const exportMd = () => {
    const content = note.body || '';
    const blob = new Blob([content], {type:'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (note.title||'note').replace(/[^a-zA-Z0-9\-_ ]/g,'').trim()||'note';
    a.download += '.md';
    a.click();
    URL.revokeObjectURL(url);
  };

  /* ── linked notes ── */
  const addWebLink = e => {
    e.preventDefault();
    if (!wlUrl.trim()) return;
    const raw = /^https?:\/\//i.test(wlUrl) ? wlUrl.trim() : 'https://'+wlUrl.trim();
    const url = safeHttpUrl(raw);
    if (!url) return;
    const title = wlTitle.trim() || (() => { try { return new URL(url).hostname; } catch { return url; } })();
    insertAtCursor(
      {type:'link', title, url},
      (note.body||'')+'\n\n[url:'+encodeURIComponent(title)+'|'+encodeURIComponent(url)+']'
    );
    setWlUrl(''); setWlTitle(''); setShowWebLink(false);
  };
  const removeWebLink = id => upNote({webLinks:(note.webLinks||[]).filter(l=>l.id!==id)});

  const addLink = id => { if(!(note.links||[]).includes(id)) upNote({links:[...(note.links||[]),id]}); setLinkQuery(''); };
  const removeLink = id => upNote({links:(note.links||[]).filter(x=>x!==id)});
  const linkedNotes = (note.links||[]).map(id=>state.notes.find(n=>n.id===id)).filter(Boolean);
  const linkable = state.notes.filter(n=>n.id!==note.id&&(!linkQuery||n.title.toLowerCase().includes(linkQuery.toLowerCase())));

  /* ── insert a part at the active cursor position, or append ── */
  const insertAtCursor = (newPart, fallbackBody, extraPatch={}) => {
    if (activeTA.current) {
      const { partIdx, pos=0 } = activeTA.current;
      const cur = bodyParts[partIdx];
      if (cur && cur.type==='text') {
        const before = cur.content.slice(0, pos);
        const after  = cur.content.slice(pos);
        const np = [...bodyParts];
        np.splice(partIdx, 1,
          {type:'text', content: before},
          newPart,
          {type:'text', content: after}
        );
        upNote({body: rebuildBody(np), ...extraPatch});
        return;
      }
    }
    upNote({body: fallbackBody, ...extraPatch});
  };

  /* ── code insert ── */
  const insertCode = () => {
    if (!codeVal.trim()) return;
    insertAtCursor(
      {type:'code', lang:codeLang, content:codeVal},
      (note.body||'')+'\n\n```'+codeLang+'\n'+codeVal+'\n```'
    );
    setCodeVal(''); setShowCode(false);
  };

  /* Inserts a ready-to-edit flowchart rather than an empty fence — a blank
     mermaid block is just a syntax error until you know the syntax, and the
     starter doubles as a reminder of the shape. */
  const insertFlowchart = () => {
    insertAtCursor(
      {type:'code', lang:'mermaid', content:MERMAID_STARTER},
      (note.body||'')+'\n\n```mermaid\n'+MERMAID_STARTER+'\n```'
    );
  };

  /* ── toolbar button style helper ── */
  const tbBtn = {background:'var(--fill)',border:'1px solid transparent',borderRadius:'var(--r-pill)',color:'var(--text-secondary)',padding:isMobile?'8px 12px':'5px 9px',fontSize:isMobile?13:11,fontWeight:600,cursor:'pointer',fontFamily:'Manrope,sans-serif',transition:'all 110ms',minHeight:isMobile?40:26};
  const tbIconBtn = {...tbBtn,width:isMobile?40:30,height:isMobile?40:30,padding:0,display:'flex',alignItems:'center',justifyContent:'center'};

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

      {/* ── title + emoji ── */}
      <div style={{padding:isMobile?'16px 14px 0':'24px 32px 0',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:14}}>
          <div style={{position:'relative',flexShrink:0}}>
            <span style={{fontSize:28,cursor:'pointer',lineHeight:1.3,display:'block',borderRadius:8,padding:'0 2px',transition:'background 120ms'}}
              title="Click to pick emoji"
              onClick={()=>setShowEmojiPicker(v=>!v)}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg-surface)'}
              onMouseLeave={e=>e.currentTarget.style.background='none'}>
              {note.emoji||'📝'}
            </span>
            {showEmojiPicker&&<EmojiPicker onSelect={em=>upNote({emoji:em})} onClose={()=>setShowEmojiPicker(false)}/>}
          </div>
          <textarea className="editor-title" rows={1} value={note.title}
            onChange={handleTitleChange}
            placeholder="Untitled" style={{height:'auto'}}/>
        </div>

        {/* tags row */}
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',paddingBottom:10}} className="divider">
          {note.tags.map(t=>(
            <span key={t} className="tag" style={{background:`${tagColor(t)}18`,color:tagColor(t)}}>
              {t}<span onClick={()=>removeTag(t)} style={{cursor:'pointer',opacity:.7,marginLeft:2}}>×</span>
            </span>
          ))}
          {showTagPicker ? (() => {
            const allTags = [...new Set(state.notes.flatMap(n=>n.tags))];
            const suggestions = allTags.filter(t =>
              !note.tags.includes(t) &&
              (!tagInput || t.toLowerCase().includes(tagInput.replace(/^#/,'').toLowerCase()))
            ).slice(0,6);
            return (
              <div style={{position:'relative'}}>
                <form onSubmit={e=>{e.preventDefault();addTag(tagInput);setTagInput('');setShowTagPicker(false);setTagFocused(false);}} style={{display:'flex',gap:4}}>
                  <input autoFocus value={tagInput}
                    onChange={e=>setTagInput(e.target.value)}
                    onFocus={()=>setTagFocused(true)}
                    onBlur={()=>setTimeout(()=>setTagFocused(false),150)}
                    placeholder="#tag"
                    style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,padding:'2px 8px',color:'var(--text-primary)',fontSize:12,width:110,outline:'none'}}/>
                  <button type="submit" style={{background:'var(--accent)',border:'none',borderRadius:6,color:'#fff',padding:'2px 8px',fontSize:12,cursor:'pointer'}}>add</button>
                  <button type="button" onClick={()=>{setShowTagPicker(false);setTagInput('');}} style={{background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:15,lineHeight:1}}>×</button>
                </form>
                {tagFocused && suggestions.length>0 && (
                  <div style={{position:'absolute',top:'100%',left:0,marginTop:4,background:'var(--modal-bg)',border:'1px solid var(--glass-border)',borderRadius:8,padding:'4px',zIndex:20,minWidth:140,boxShadow:'var(--shadow-3)'}}>
                    {suggestions.map(t=>(
                      <div key={t} onMouseDown={()=>{addTag(t);setTagInput('');setShowTagPicker(false);}}
                        style={{display:'flex',alignItems:'center',gap:6,padding:'5px 8px',borderRadius:5,cursor:'pointer',transition:'background 100ms'}}
                        onMouseEnter={e=>e.currentTarget.style.background='var(--border)'}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <span style={{width:7,height:7,borderRadius:99,background:tagColor(t),flexShrink:0,display:'inline-block'}}/>
                        <span style={{fontSize:12,color:'var(--text-tertiary)'}}>{t}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })() : (
            <button onClick={()=>setShowTagPicker(true)} style={{background:'none',border:'1px dashed var(--border-strong)',borderRadius:6,color:'var(--text-muted)',padding:'2px 8px',fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',gap:3}}>
              <svg style={{width:9,height:9}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>tag
            </button>
          )}
          {/* folder picker */}
          <FolderPickerDropdown
            value={note.folderId||null}
            folders={state.folders||[]}
            onChange={folderId=>upNote({folderId})}
          />
        </div>
      </div>

      {/* ── formatting toolbar — edit mode only; preview keeps just the mode switch,
           so reading a note doesn't cost a whole extra toolbar's worth of scroll ── */}
      <div style={{padding:isMobile?'6px 12px':'6px 32px',borderBottom:'1px solid var(--border)',display:'flex',gap:6,alignItems:'center',flexShrink:0,flexWrap:'wrap'}}>
        {!previewMode && (<>
        {FMT.map((f,i)=>(
          <button key={i} onClick={f.fn} title={f.title} style={f.icon?tbIconBtn:tbBtn}
            onMouseEnter={e=>{e.currentTarget.style.background='var(--fill-hover)';e.currentTarget.style.color='var(--text-primary)';}}
            onMouseLeave={e=>{e.currentTarget.style.background='var(--fill)';e.currentTarget.style.color='var(--text-secondary)';}}>
            {f.icon ? React.cloneElement(f.icon,{style:{width:14,height:14}}) : f.label}
          </button>
        ))}
        <div style={{width:1,height:16,background:'var(--border-strong)',margin:'0 2px'}}/>
        {/* image */}
        <button onClick={()=>imgInputRef.current?.click()} title="Upload image" style={tbIconBtn}
          onMouseEnter={e=>{e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input ref={imgInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImg}/>
        {/* pdf attachment */}
        <button onClick={()=>{setPdfBusy(null);pdfInputRef.current?.click();}} title="Attach a PDF" style={tbIconBtn}
          onMouseEnter={e=>{e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>
        </button>
        <input ref={pdfInputRef} type="file" accept="application/pdf,.pdf" style={{display:'none'}} onChange={handlePdfAttach}/>
        {pdfBusy && (
          <span style={{fontSize:10.5,color:pdfBusy.error?'var(--danger)':'var(--text-muted)',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                title={pdfBusy.label}>{pdfBusy.label}</span>
        )}
        {/* code */}
        <button onClick={()=>setShowCode(v=>!v)} title="Add code snippet" style={tbIconBtn}
          onMouseEnter={e=>{e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        {/* mermaid flowchart */}
        <button onClick={insertFlowchart} title="Insert a flowchart (mermaid)" style={tbIconBtn}
          onMouseEnter={e=>{e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="5" rx="1"/><rect x="2" y="17" width="8" height="5" rx="1"/><rect x="14" y="17" width="8" height="5" rx="1"/><path d="M12 7v4"/><path d="M6 17v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>
        </button>
        {/* web url */}
        <button onClick={()=>{setShowWebLink(v=>!v);setShowLinkSearch(false);}} title="Add web link"
          style={{...tbIconBtn,color:showWebLink?'var(--accent)':'var(--text-secondary)',background:showWebLink?'var(--accent-soft)':'var(--fill)'}}
          onMouseEnter={e=>{if(!showWebLink)e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{if(!showWebLink)e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        {/* link note */}
        <button onClick={()=>{setShowLinkSearch(v=>!v);setShowWebLink(false);}} title="Link a note"
          style={{...tbIconBtn,color:showLinkSearch?'var(--accent)':'var(--text-secondary)',background:showLinkSearch?'var(--accent-soft)':'var(--fill)'}}
          onMouseEnter={e=>{if(!showLinkSearch)e.currentTarget.style.background='var(--fill-hover)';}}
          onMouseLeave={e=>{if(!showLinkSearch)e.currentTarget.style.background='var(--fill)';}}>
          <svg style={{width:14,height:14}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
