          <div style={{fontFamily:'Fraunces,serif',fontSize:26,fontWeight:600}}>{score} / {questions.length}</div>
          <div style={{...studyMuted,marginBottom:14}}>{score === questions.length ? 'Perfect.' : 'Review the ones you missed:'}</div>
          {missed.map(m => (
            <div key={m.id} style={{padding:'8px 0',borderTop:'1px solid var(--border)'}}>
              <div style={{fontSize:13.5,fontWeight:600}}>{m.q}</div>
              <div style={{fontSize:13,color:'var(--success)',marginTop:2}}>{m.options[m.answer]}</div>
              {m.why && <div style={{...studyMuted,marginTop:2}}>{m.why}</div>}
            </div>
          ))}
          <button className="btn-primary" style={{marginTop:16}} onClick={onExit}>Done</button>
        </div>
      ) : (
        <div className="card" style={{padding:'22px 22px'}}>
          <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:10}}>Question {i + 1} of {questions.length} · score {score}</div>
          <div style={{fontSize:18,fontWeight:600,lineHeight:1.45,marginBottom:16}}>{q.q}</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {q.options.map((opt, idx) => {
              const isRight = picked !== null && idx === q.answer, isWrong = picked === idx && idx !== q.answer;
              return (
                <button key={idx} onClick={()=>pick(idx)} disabled={picked !== null}
                  style={{textAlign:'left',padding:'11px 14px',borderRadius:'var(--r-md)',cursor:picked===null?'pointer':'default',fontFamily:'Manrope,sans-serif',fontSize:14,
                    color:'var(--text-primary)',background: isRight ? 'rgba(16,185,129,.14)' : isWrong ? 'rgba(244,63,94,.14)' : 'var(--fill)',
                    border:`1px solid ${isRight ? 'var(--success)' : isWrong ? 'var(--danger)' : 'var(--hairline)'}`}}>
                  <b style={{marginRight:8,color:'var(--text-muted)'}}>{'ABCD'[idx] || idx + 1}</b>{opt}
                </button>
              );
            })}
          </div>
          {picked !== null && (
            <div className="fadeUp" style={{marginTop:14}}>
              {q.why && <div style={studyMuted}>{q.why}</div>}
              <button className="btn-primary" style={{marginTop:12}} onClick={()=>{ setI(x => x + 1); setPicked(null); }}>
                {i + 1 < questions.length ? 'Next' : 'See score'}
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── timed mock exam ──
   Start time and answers persist in localStorage, so a reload or a phone
   killing the tab neither resets the clock nor loses what you wrote. MCQs
   are marked locally; written answers go to the examMarking model, with a
   self-marking fallback when that isn't reachable. */
function ExamRunner({ state, update, set, exam, isMobile, onExit }) {
  const KEY = `folio_exam_${exam.id}`;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  const [run, setRun]         = useState(load);           /* {startedAt, answers} | null */
  const [phase, setPhase]     = useState(() => load() ? 'running' : 'intro');
  const [marking, setMarking] = useState(null);           /* {results, score, max, mcq} */
  const [error, setError]     = useState(null);
  const [selfMarks, setSelfMarks] = useState({});
  const [now, setNow] = useState(Date.now());
  const save = r => { setRun(r); try { localStorage.setItem(KEY, JSON.stringify(r)); } catch {} };
  const clear = () => { try { localStorage.removeItem(KEY); } catch {} };

  const total = exam.questions.reduce((s, q) => s + (q.marks || 1), 0);
  const endsAt = run ? run.startedAt + exam.durationMin * 60000 : 0;
  const left = Math.max(0, endsAt - now);

  useEffect(() => {
    if (phase !== 'running') return;
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, [phase]);
  useEffect(() => { if (phase === 'running' && run && left === 0) submit(); }, [left, phase]);

  const answer = (idx, v) => save({ ...run, answers: { ...run.answers, [idx]: v } });

  const recordAttempt = (score) => {
    update('studySets', prev => prev.map(s => s.id !== set.id ? s : {
      ...s,
      exams: (s.exams || []).map(e => e.id === exam.id ? { ...e, attempts: [...(e.attempts || []), { at:Date.now(), score, max:total }].slice(-5) } : e),
      updated: Date.now(),
    }));
  };

  const submit = async () => {
    if (phase !== 'running') return;
    setPhase('marking'); setError(null);
    const answers = run?.answers || {};
    const mcq = exam.questions.map((q, idx) => q.type === 'mcq'
      ? { idx, score: answers[idx] === q.answer ? (q.marks || 1) : 0, max: q.marks || 1 } : null).filter(Boolean);
    const written = exam.questions.map((q, idx) => q.type === 'written'
      ? { index: idx, q: q.q, marks: q.marks, mark_scheme: q.mark_scheme, model_answer: q.model_answer, answer: answers[idx] || '' } : null).filter(Boolean);
    const mcqScore = mcq.reduce((s, m) => s + m.score, 0);
    let results = [];
    if (written.length) {
      try {
        const r = await StudyAPI.mark({ model: studyCfg(state, 'examMarking').model, setId:set.id, examId:exam.id, questions:written });
        results = r.result.results;
      } catch (e) {
        setError(`${studyErrorLabel(e)} — mark your written answers yourself using the mark schemes below.`);
        setMarking({ results:null, mcq, mcqScore });
        setPhase('results');
        clear();
        return;
      }
    }
    const score = mcqScore + results.reduce((s, r) => s + r.score, 0);
    setMarking({ results, mcq, mcqScore, score });
    recordAttempt(score);
    clear();
    setPhase('results');
  };

  const fmtLeft = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2,'0')}`; };
  const answers = run?.answers || {};

  if (phase === 'intro') return (
    <div className="fadeUp">
      <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12,marginBottom:14}} onClick={onExit}>← {set.title}</button>
      <div className="card" style={{padding:'24px 22px'}}>
        <div style={studyEyebrow('var(--warning)')}>Mock exam</div>
        <div style={{fontFamily:'Fraunces,serif',fontSize:24,fontWeight:600,margin:'8px 0'}}>{exam.title}</div>
        <div style={{...studyMuted,marginBottom:16}}>
          {exam.durationMin} minutes · {exam.questions.length} questions · {total} marks. The timer keeps running if you leave; the paper submits itself when time is up.
        </div>
        <button className="btn-primary" onClick={()=>{ save({ startedAt:Date.now(), answers:{} }); setNow(Date.now()); setPhase('running'); }}>Start exam</button>
      </div>
    </div>
  );

  return (
    <div className="fadeUp">
      <div style={{position:'sticky',top:0,zIndex:2,background:'var(--bg-app)',padding:'8px 0 10px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid var(--border)',marginBottom:16}}>
        <div style={{flex:1,minWidth:0,fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{exam.title}</div>
        {phase === 'running' && <span style={{fontFamily:'"JetBrains Mono",monospace',fontSize:15,fontWeight:600,color: left < 60000 ? 'var(--danger)' : left < 300000 ? 'var(--warning)' : 'var(--text-primary)'}}>{fmtLeft(left)}</span>}
        {phase === 'running' && <button className="btn-primary" style={{padding:'6px 14px'}} onClick={()=>{ if (confirm('Submit your paper now?')) submit(); }}>Submit</button>}
        {phase !== 'running' && <button className="btn-ghost" style={{padding:'6px 14px'}} onClick={onExit}>Done</button>}
      </div>

      {phase === 'marking' && <StudyBanner busy>Marking your written answers…</StudyBanner>}
      {phase === 'results' && marking && (
        <div className="card" style={{padding:'18px 20px',marginBottom:16}}>
          <div style={{fontFamily:'Fraunces,serif',fontSize:30,fontWeight:600}}>
            {marking.results
              ? <>{Math.round(marking.score * 10) / 10} / {total} <span style={{fontSize:16,color:'var(--text-secondary)'}}>({Math.round(marking.score / total * 100)}%)</span></>
              : <>{marking.mcqScore + Object.values(selfMarks).reduce((a, b) => a + (+b || 0), 0)} / {total}</>}
          </div>
          {error && <div style={{fontSize:12.5,color:'var(--warning)',marginTop:6}}>{error}</div>}
          {!marking.results && (
            <button className="btn-ghost" style={{marginTop:10}} onClick={()=>{
              const s = marking.mcqScore + Object.values(selfMarks).reduce((a, b) => a + (+b || 0), 0);
              recordAttempt(s); setMarking(m => ({ ...m, results:[], score:s, selfSaved:true }));
            }} disabled={marking.selfSaved}>Save my self-marked score</button>
          )}
        </div>
      )}

      {exam.questions.map((q, idx) => {
        const res = marking?.results?.find(r => r.index === idx);
        const mcqRes = marking?.mcq?.find(m => m.idx === idx);
        return (
          <div key={idx} className="card" style={{padding:'16px 18px',marginBottom:12}}>
            <div style={{display:'flex',gap:10,marginBottom:10}}>
              <span style={{fontSize:12,fontWeight:700,color:'var(--text-muted)'}}>{idx + 1}.</span>
              <div style={{flex:1,fontSize:14.5,fontWeight:600,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{q.q}</div>
              <span style={{fontSize:11.5,color:'var(--text-muted)',whiteSpace:'nowrap'}}>
                {phase === 'results' && (res || mcqRes) ? `${res ? res.score : mcqRes.score} / ` : ''}{q.marks || 1} mark{(q.marks || 1) === 1 ? '' : 's'}
              </span>
            </div>
            {q.type === 'mcq' ? (
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {q.options.map((opt, oi) => {
                  const chosen = answers[idx] === oi;
                  const showRight = phase === 'results' && oi === q.answer;
                  const showWrong = phase === 'results' && chosen && oi !== q.answer;
                  return (
                    <button key={oi} disabled={phase !== 'running'} onClick={()=>answer(idx, oi)}
                      style={{textAlign:'left',padding:'9px 12px',borderRadius:'var(--r-sm)',fontFamily:'Manrope,sans-serif',fontSize:13.5,color:'var(--text-primary)',cursor:phase==='running'?'pointer':'default',
                        background: showRight ? 'rgba(16,185,129,.14)' : showWrong ? 'rgba(244,63,94,.14)' : chosen ? 'var(--accent-soft)' : 'var(--fill)',
                        border:`1px solid ${showRight ? 'var(--success)' : showWrong ? 'var(--danger)' : chosen ? 'var(--accent)' : 'var(--hairline)'}`}}>
                      <b style={{marginRight:8,color:'var(--text-muted)'}}>{'ABCD'[oi] || oi + 1}</b>{opt}
                    </button>
                  );
                })}
              </div>
            ) : (
              <textarea className="input" rows={isMobile ? 6 : 7} disabled={phase !== 'running'} value={answers[idx] || ''}
                onChange={e=>answer(idx, e.target.value)} placeholder="Your answer…" style={{lineHeight:1.6}}/>
            )}
            {phase === 'results' && q.type === 'written' && (
              <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',fontSize:13,lineHeight:1.55}}>
                {res && (<>
                  {res.hit?.length > 0 && <div style={{color:'var(--success)'}}>✓ {res.hit.join(' · ')}</div>}
                  {res.missed?.length > 0 && <div style={{color:'var(--danger)',marginTop:4}}>✗ {res.missed.join(' · ')}</div>}
                  {res.tip && <div style={{color:'var(--text-secondary)',marginTop:6}}>{res.tip}</div>}
                </>)}
                {!marking.results && (
                  <label style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,color:'var(--text-secondary)'}}>
                    Your mark <input className="input" type="number" min="0" max={q.marks} step="0.5" style={{width:70,padding:'4px 8px'}}
                      value={selfMarks[idx] ?? ''} onChange={e=>setSelfMarks(m=>({ ...m, [idx]: Math.max(0, Math.min(q.marks, +e.target.value || 0)) }))}/> / {q.marks}
                  </label>
                )}
                <details style={{marginTop:8}}>
                  <summary style={{cursor:'pointer',color:'var(--accent)',fontSize:12.5}}>Mark scheme and model answer</summary>
                  <ul style={{margin:'6px 0 0 18px'}}>{(q.mark_scheme || []).map((m, i) => <li key={i}>{m}</li>)}</ul>
                  <div style={{marginTop:6,color:'var(--text-tertiary)',whiteSpace:'pre-wrap'}}>{q.model_answer}</div>
                </details>
              </div>
            )}
            {phase === 'results' && q.type === 'mcq' && q.mark_scheme?.[0] && (
              <div style={{...studyMuted,marginTop:8}}>{q.mark_scheme[0]}</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── add material: record / PDF / paste ── */
function StudySourceModal({ state, update, initialMode = 'pdf', prefill = null, onClose, onCreated }) {
  const [mode, setMode]   = useState(initialMode);
  const [title, setTitle] = useState('');
  const [folderId, setFolderId] = useState(state.ui.folderId || '');
  const [kinds, setKinds] = useState({ smartNotes:true, flashcards:true, quiz:true });
  const [pasted, setPasted] = useState('');
  const [status, setStatus] = useState(null);  /* {label, error?} */
  const [recording, setRecording] = useState(false);
  const pdfRef = useRef(null);
  const txtRef = useRef(null);

  const folders = useMemo(() => {
    const out = [];
    const walk = (nodes, depth) => nodes.forEach(n => { out.push({ id:n.id, label:`${'  '.repeat(depth)}${n.name}` }); walk(n.children || [], depth + 1); });
    walk(buildFolderTree(state.folders || []), 0);
    return out;
  }, [state.folders]);
  const chosen = Object.keys(kinds).filter(k => kinds[k]);
  const defaultTitle = mode === 'record'
    ? `Lecture — ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`
    : mode === 'paste' ? 'Captions' : '';

  const finish = note => onCreated({ note, kinds: chosen });

  /* Notes with nothing to generate from (a recording that failed to
     transcribe, a video with no transcript) open straight in the editor with
     the player ready, instead of starting an empty study set. */
  const openNote = (note, item) => {
    update('ui', { ...state.ui, view:'notes', noteId:note.id });
    if (item) openMedia({ noteId:note.id, itemId:item.id });
    onClose();
  };

  const fromTranscript = async (lines, emoji) => {
    if (!lines.length) { setStatus({ label:'Nothing to save yet.', error:true }); return; }
    setStatus({ label:'Saving transcript…' });
    const note = await createTranscriptNote({ update, title: title.trim() || defaultTitle, lines, folderId: folderId || null, emoji });
    finish(note);
  };

  const fromRecording = async res => {
    const t = title.trim() || defaultTitle;
    const media = res.parts.length
      ? [{ id:uid(), kind:'audio', title:t, durationMs:res.durationMs, mime:res.mime, parts:res.parts, createdAt:Date.now() }]
      : [];
    if (!res.lines.length && !media.length) { setStatus({ label:'Nothing was transcribed.', error:true }); return; }
    setStatus({ label:'Saving…' });
    const note = await createTranscriptNote({ update, title:t, lines:res.lines, folderId:folderId || null, emoji:'🎙️', media });
    if (res.lines.length) finish(note); else openNote(note, media[0]);
  };

  const fromYouTube = async r => {
    const item = { id:uid(), kind:'youtube', videoId:r.videoId, title:r.title || 'YouTube video', author:r.author || '', embeddable:r.embeddable !== false, createdAt:Date.now() };
    setStatus({ label:'Saving…' });
    const note = await createTranscriptNote({ update, title: title.trim() || item.title, lines: r.lines || [], folderId: folderId || null, emoji:'📺', media:[item] });
    if (r.lines?.length) finish(note); else openNote(note, item.embeddable ? item : null);
  };

  const fromPdf = async file => {
    if (!file) return;
    if (file.type !== 'application/pdf') { setStatus({ label:'Not a PDF file', error:true }); return; }
    if (file.size > MAX_PDF_BYTES) { setStatus({ label:`Too large — max ${fmtBytes(MAX_PDF_BYTES)}`, error:true }); return; }
    try {
      setStatus({ label:`Uploading ${file.name}…` });
      const bytes = await file.arrayBuffer();
      const meta = await Files.upload(file);
      let extracted = { text:'', truncated:false };
      try {
        extracted = await extractPdfText(bytes, (p, total) => setStatus({ label:`Reading text… page ${p} of ${total}` }));
      } catch {}
      const fileId = uid(), now = Date.now();
      const rec = { id:fileId, key:meta.key, name:meta.name, size:meta.size, type:meta.type, uploadedAt:now };
      _studyFileText.set(meta.key, extracted.text);
      const body = [`[pdf:${fileId}]`, '---', extracted.text || '_No selectable text found in this PDF (it may be a scan)._'].join('\n\n');
      const note = {
        id:uid(), emoji:'📄', title: title.trim() || (file.name || 'document.pdf').replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim() || 'Untitled PDF',
        body, tags:[], links:[], images:[], files:[rec], folderId: folderId || null, created:now, updated:now,
      };
      update('notes', prev => [note, ...prev]);
      if (!extracted.text) { setStatus({ label:'Saved the PDF, but it has no selectable text (a scan?) — nothing to study from.', error:true }); return; }
      finish(note);
    } catch (e) {
      setStatus({ label: pdfErrorLabel(e), error:true });
    }
  };

  return (
    <StudyModal title="Add study material" onClose={recording ? ()=>{} : onClose} width={580}>
      {!recording && (
        <div className="seg" style={{marginBottom:14}}>
          {[['record','Record lecture'],['youtube','YouTube'],['pdf','PDF'],['paste','Paste text']].map(([id, label]) => (
            <button key={id} aria-pressed={mode===id} onClick={()=>{ setMode(id); setStatus(null); }}>{label}</button>
          ))}
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <input className="input" placeholder={defaultTitle || 'Title (optional)'} value={title} onChange={e=>setTitle(e.target.value)}/>
        <select className="input" value={folderId} onChange={e=>setFolderId(e.target.value)}>
          <option value="">No folder</option>
          {folders.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
        </select>
      </div>

      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14,alignItems:'center'}}>
        <span style={{fontSize:12,color:'var(--text-secondary)',marginRight:4}}>Then make:</span>
        {['smartNotes','flashcards','quiz'].map(k => (
          <button key={k} className={`pill${kinds[k]?' on':''}`} onClick={()=>setKinds(v=>({ ...v, [k]:!v[k] }))}>{studyKind(k).label}</button>
        ))}
      </div>

      {mode === 'record' && (
        <Recorder onRecordingChange={setRecording} onFinish={fromRecording}/>
      )}
      {mode === 'youtube' && (
        <YouTubeSource cta="Create note & continue" ctaNoTranscript="Add video without a transcript" onCreate={fromYouTube} autoFocus prefill={prefill}/>
      )}
      {mode === 'pdf' && (<>
        <input ref={pdfRef} type="file" accept="application/pdf,.pdf" style={{display:'none'}} onChange={e=>fromPdf(e.target.files?.[0])}/>
        <button className="btn-primary" onClick={()=>pdfRef.current?.click()}>Choose a PDF…</button>
        <div style={{...studyMuted,marginTop:8}}>Slides, handouts or papers. The PDF is attached to a new note and its text is used for the study set.</div>
      </>)}
      {mode === 'paste' && (<>
        {/* File upload for .txt/.vtt/.srt — hidden input triggered by button */}
        <input ref={txtRef} type="file" accept=".txt,.vtt,.srt,text/plain" style={{display:'none'}}
          onChange={async e => {
            const f = e.target.files?.[0]; if (!f) return;
            setPasted(await f.text()); e.target.value = '';
          }}/>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
          <button className="btn-secondary" style={{fontSize:12.5}} onClick={()=>txtRef.current?.click()}>
            Choose file…
          </button>
          <span style={{fontSize:12,color:'var(--text-secondary)'}}>.txt / .vtt / .srt</span>
        </div>
        <textarea className="input" rows={9} value={pasted} onChange={e=>setPasted(e.target.value)}
          placeholder="Paste notes, an article, or a video transcript. For YouTube: under the video, …more → Show transcript, then copy. Caption files (.vtt/.srt) are cleaned up automatically."/>
        {estTokens(pasted) > 10_000 && (
          <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:6}}>
            Large transcript (~{Math.round(estTokens(pasted)/1000)}K tokens) — use a Claude model for best results with Llama&apos;s 12K limit.
          </div>
        )}
        <button className="btn-primary" style={{marginTop:10}} disabled={!pasted.trim()}
          onClick={()=>fromTranscript(parsePastedTranscript(pasted), /-->/.test(pasted) ? '📺' : '📋')}>
          Save & continue
        </button>
      </>)}
      {status && <div style={{fontSize:12.5,marginTop:12,color:status.error?'var(--danger)':'var(--text-secondary)'}}>{status.label}</div>}
    </StudyModal>
  );
}

/* ── floating media panel ───────────────────────────────────────────────────
   One draggable, resizable window for both kinds of media a note can carry:
     • YouTube — the official embedded player (IFrame Player API), nothing is
       downloaded;
     • audio   — a lecture recording Folio kept, stored as ~4.5-minute
       segments in R2 and played back as one continuous timeline.
   It lives at App level, like the Pomodoro widget, so it keeps playing while
   you move between notes. Position and size are remembered per device. */
const MEDIA_RECT_KEY = 'folio_media_rect';
const MEDIA_RATE_KEY = 'folio_media_rate';
const MEDIA_HEADER_H = 38;
const MEDIA_AUDIO_H  = 172;
const openMedia = detail => { try { window.dispatchEvent(new CustomEvent('folio-media', { detail })); } catch {} };

const loadMediaRect = () => {
  try {
    const r = JSON.parse(localStorage.getItem(MEDIA_RECT_KEY));
    if (r && [r.x, r.y, r.w, r.h].every(Number.isFinite)) return r;
  } catch {}
  return null;
};

/* ── YouTube ── */
let _ytApi = null;
function ytApi() {
  if (_ytApi) return _ytApi;
  _ytApi = new Promise((resolve, reject) => {
    if (window.YT?.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { prev?.(); } catch {} resolve(window.YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { _ytApi = null; reject(new Error('Couldn’t load the YouTube player — are you offline?')); };
    document.head.appendChild(s);
  });
  return _ytApi;
}
const YT_ERRORS = {
  2:   'That video link isn’t valid.',
  5:   'The player hit an error — try again.',
  100: 'This video was removed or is private.',
  101: 'The video’s owner doesn’t allow it to play outside YouTube.',
  150: 'The video’s owner doesn’t allow it to play outside YouTube.',
  153: 'YouTube couldn’t identify Folio as the page embedding the video.',
};

function YouTubePlayer({ videoId, seekReq, onTime, interacting, onBlocked }) {
  const host = useRef(null), player = useRef(null), ready = useRef(false), pending = useRef(null);
  const blockedRef = useRef(onBlocked);
  blockedRef.current = onBlocked;
  const [error, setError]     = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let dead = false, timer = null;
    ready.current = false; setError(null); setLoading(true);
    ytApi().then(YT => {
      if (dead || !host.current) return;
      const mount = document.createElement('div');
      host.current.textContent = '';
      host.current.appendChild(mount);
      player.current = new YT.Player(mount, {
        host: 'https://www.youtube-nocookie.com',
        videoId, width:'100%', height:'100%',
        /* origin is what YouTube uses to identify the embedding page; without it
           (or a Referer) it refuses to play (error 153). */
        playerVars: { playsinline:1, rel:0, modestbranding:1, enablejsapi:1, origin: location.origin },
        events: {
          onReady: () => {
            if (dead) return;
            ready.current = true; setLoading(false);
            if (pending.current != null) {
              const t = pending.current; pending.current = null;
              try { player.current.seekTo(t, true); player.current.playVideo(); } catch {}
            }
            timer = setInterval(() => { try { onTime(player.current.getCurrentTime()); } catch {} }, 500);
          },
          onError: e => {
            if (dead) return;
            setError(YT_ERRORS[e.data] || `YouTube error ${e.data}`);
            /* The owner/label blocks embedding. oEmbed says "embeddable" for many such
               videos (music especially), so the player's own verdict is the one to trust. */
            if (e.data === 101 || e.data === 150) blockedRef.current?.();
          },
        },
      });
    }).catch(e => { if (!dead) setError(e.message); });
    return () => {
      dead = true; clearInterval(timer);
      try { player.current?.destroy(); } catch {}
      player.current = null; ready.current = false;
    };
  }, [videoId]);

  useEffect(() => {
    if (!seekReq) return;
    if (ready.current && player.current) { try { player.current.seekTo(seekReq.t, true); player.current.playVideo(); } catch {} }
    else pending.current = seekReq.t;
  }, [seekReq?.nonce]);

  const cover = { position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10, padding:16, textAlign:'center', fontSize:13 };
  return (
    <div style={{position:'relative',width:'100%',aspectRatio:'16 / 9',background:'#000',flexShrink:0,pointerEvents:interacting?'none':'auto'}}>
      <div ref={host} style={{position:'absolute',inset:0}}/>
      {loading && !error && <div style={{...cover,color:'rgba(255,255,255,.6)'}}>Loading player…</div>}
      {error && (
        <div style={{...cover,color:'#fff',background:'#0b0b0e'}}>
          <div>{error}</div>
          <a className="btn-primary" style={{textDecoration:'none'}} target="_blank" rel="noopener noreferrer"
            href={`https://www.youtube.com/watch?v=${videoId}`}>Open on YouTube ↗</a>
        </div>
      )}
    </div>
  );
}

/* ── recording playback ──
   The recording is several independent files (see the Recorder), so playback
   is a single <audio> element swapped between parts on a virtual timeline: the
   slider spans the whole recording, seeks pick the part and offset, and the
   next part is fetched while the current one plays. Part lengths come from the
   Recorder's own clock — a MediaRecorder file has no reliable duration. */
function AudioRecordingPlayer({ item, seekReq, onTime }) {
  const parts = item.parts || [];
  const offsets = useMemo(() => { let a = 0; return parts.map(p => { const o = a; a += p.ms || 0; return o; }); }, [item.id]);
  const total   = useMemo(() => parts.reduce((s, p) => s + (p.ms || 0), 0), [item.id]);
  const audio   = useRef(null);
  const cur     = useRef({ i:-1, token:0, switching:false });
  const rateRef = useRef(1);
  const api     = useRef({});
  const [pos, setPos]         = useState(0);
  const [playing, setPlaying] = useState(false);
  const [loading, setLoading] = useState(true);
  const [err, setErr]         = useState(null);
  const [rate, setRate]       = useState(() => {
    try { const v = Number(localStorage.getItem(MEDIA_RATE_KEY)); return v >= .5 && v <= 3 ? v : 1; } catch { return 1; }
  });
  rateRef.current = rate;

  const partAt = ms => { for (let k = parts.length - 1; k >= 0; k--) if (offsets[k] <= ms) return k; return 0; };

  const loadPart = async (i, atMs, play) => {
    const a = audio.current;
    if (!a || !parts[i]) return;
    const token = ++cur.current.token;
    cur.current.i = i; cur.current.switching = !!play;
    setLoading(true); setErr(null);
    try {
      const url = await Files.url(parts[i].key);
      if (token !== cur.current.token) return;
      a.src = url;
      /* Loading a new source resets the rate to the default, so set both. */
      a.defaultPlaybackRate = rateRef.current; a.playbackRate = rateRef.current;
      await new Promise((res, rej) => {
        const done = () => { a.removeEventListener('loadedmetadata', ok); a.removeEventListener('error', bad); };
        const ok  = () => { done(); res(); };
        const bad = () => { done(); rej(new Error('This part of the recording couldn’t be loaded')); };
        a.addEventListener('loadedmetadata', ok); a.addEventListener('error', bad);
      });
      if (token !== cur.current.token) return;
      if (atMs > 0) a.currentTime = atMs / 1000;
      setLoading(false); setPos(offsets[i] + atMs);
      if (play) await a.play();
      if (parts[i + 1]) Files.url(parts[i + 1].key).catch(() => {});   /* warm the next part */
    } catch (e) {
      if (token !== cur.current.token) return;
      setLoading(false); cur.current.switching = false; setPlaying(false);
      setErr(e?.name === 'NotAllowedError' ? 'Press play to start' : (e?.message || 'Playback failed'));
    }
  };

  const seekTo = (ms, play) => {
    ms = Math.max(0, Math.min(total, ms));
    const i = partAt(ms), at = Math.max(0, ms - offsets[i]), a = audio.current;
    if (cur.current.i === i && a?.src) {
      a.currentTime = at / 1000; setPos(ms);
      if (play) { cur.current.switching = true; a.play().catch(() => {}); }
    } else loadPart(i, at, play ?? playing);
  };
  const toggle = () => {
    const a = audio.current;
    if (!a) return;
    if (!a.src || cur.current.i < 0) { loadPart(0, 0, true); return; }
    if (pos >= total - 50) { seekTo(0, true); return; }
    if (a.paused) { cur.current.switching = true; setPlaying(true); a.play().catch(() => { cur.current.switching = false; setPlaying(false); }); }
    else { cur.current.switching = false; a.pause(); }
  };
  const skip = s => seekTo(pos + s * 1000, playing);
  api.current = { toggle, skip, seekTo };

  useEffect(() => {
    loadPart(0, 0, false);
    return () => { cur.current.token++; try { audio.current?.pause(); } catch {} };
  }, [item.id]);
  useEffect(() => { if (seekReq) seekTo(seekReq.t * 1000, true); }, [seekReq?.nonce]);
  useEffect(() => {
    const a = audio.current;
    if (a) { a.defaultPlaybackRate = rate; a.playbackRate = rate; }
    try { localStorage.setItem(MEDIA_RATE_KEY, String(rate)); } catch {}
  }, [rate]);

  /* Lock-screen / headset controls. */
  useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: item.title || 'Recording', artist: 'Folio' });
      navigator.mediaSession.setActionHandler('play',  () => api.current.toggle());
      navigator.mediaSession.setActionHandler('pause', () => api.current.toggle());
      navigator.mediaSession.setActionHandler('seekbackward', () => api.current.skip(-15));
      navigator.mediaSession.setActionHandler('seekforward',  () => api.current.skip(15));
    } catch {}
    return () => { try { ['play','pause','seekbackward','seekforward'].forEach(k => navigator.mediaSession.setActionHandler(k, null)); } catch {} };
  }, [item.id]);

  const btn = { width:40, height:40, borderRadius:99, border:'1px solid var(--glass-edge)', background:'var(--fill)', color:'var(--text-primary)',
                cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, fontFamily:'Manrope,sans-serif', flexShrink:0 };
  return (
    <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:8,flexShrink:0}}>
      <audio ref={audio} preload="auto" playsInline style={{display:'none'}}
        onTimeUpdate={() => {
          const a = audio.current, i = cur.current.i;
          if (!a || i < 0) return;
          const ms = offsets[i] + Math.min(a.currentTime * 1000, parts[i].ms || Infinity);
          setPos(ms); onTime(ms / 1000);
        }}
        onPlaying={() => { cur.current.switching = false; setPlaying(true); }}
        onPause={() => {
          /* A part finishing fires pause then ended; don't flash "paused" between parts. */
          if (audio.current?.ended && cur.current.i + 1 < parts.length) return;
          if (!cur.current.switching) setPlaying(false);
        }}
        onEnded={() => {
          const i = cur.current.i;
          if (i + 1 < parts.length) loadPart(i + 1, 0, true);
          else { cur.current.switching = false; setPlaying(false); setPos(total); }
        }}/>
      <input type="range" className="glass-slider" aria-label="Seek" min="0" max={Math.max(1, Math.round(total / 1000))} step="1"
        value={Math.min(Math.round(pos / 1000), Math.max(1, Math.round(total / 1000)))}
        style={{'--pct':`${total ? Math.min(100, pos / total * 100) : 0}%`}}
        onChange={e => seekTo(+e.target.value * 1000)}/>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text-secondary)',fontVariantNumeric:'tabular-nums',marginTop:-6}}>
        <span>{fmtClock(pos / 1000)}</span><span>{fmtClock(total / 1000)}</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button style={btn} title="Back 15 seconds" aria-label="Back 15 seconds" onClick={()=>skip(-15)}>↺15</button>
        <button style={{...btn,width:48,height:48,background:'var(--accent)',border:'none',color:'#fff',fontSize:16}}
          aria-label={playing ? 'Pause' : 'Play'} onClick={toggle}>{loading && !playing ? '…' : playing ? '❚❚' : '▶'}</button>
        <button style={btn} title="Forward 15 seconds" aria-label="Forward 15 seconds" onClick={()=>skip(15)}>15↻</button>
        <span style={{flex:1}}/>
        <select className="input" aria-label="Playback speed" style={{width:'auto',padding:'6px 8px',fontSize:12}} value={rate} onChange={e=>setRate(+e.target.value)}>
          {[0.75, 1, 1.25, 1.5, 1.75, 2, 2.5].map(r => <option key={r} value={r}>{r}×</option>)}
        </select>
      </div>
      {err && <div style={{fontSize:12,color:'var(--danger)'}}>{err}</div>}
    </div>
  );
}

/* ── transcript beside the player: highlights the current line, click to seek ── */
const TranscriptRow = React.memo(function TranscriptRow({ l, i, active, onSeek }) {
  if (l.t == null) return <div style={{padding:'3px 8px',fontSize:12.5,lineHeight:1.55,color:'var(--text-tertiary)'}}>{l.text}</div>;
  return (
    <button data-i={i} onClick={() => onSeek(l.t)}
      style={{display:'flex',gap:8,width:'100%',textAlign:'left',padding:'4px 8px',borderRadius:'var(--r-xs)',border:'none',cursor:'pointer',
        fontFamily:'Manrope,sans-serif',fontSize:12.5,lineHeight:1.55,
        background:active ? 'var(--accent-soft)' : 'transparent', color:active ? 'var(--text-primary)' : 'var(--text-tertiary)'}}>
      <span style={{color:'var(--accent)',fontVariantNumeric:'tabular-nums',flexShrink:0,minWidth:38,fontWeight:600}}>{fmtClock(l.t)}</span>
      <span>{l.text}</span>
    </button>
  );
});

function TranscriptFollower({ lines, now, onSeek }) {
  const ref = useRef(null);
  const [follow, setFollow] = useState(true);
  let active = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].t == null) continue;
    if (lines[i].t <= now + 0.3) active = i; else break;
  }
  useEffect(() => {
    if (!follow || active < 0) return;
    ref.current?.querySelector(`[data-i="${active}"]`)?.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }, [active, follow]);
  return (
    <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',borderTop:'1px solid var(--glass-border)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 10px 2px'}}>
        <span style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-muted)'}}>Transcript</span>
        <button className={`pill${follow?' on':''}`} style={{padding:'2px 10px',fontSize:11}} onClick={()=>setFollow(v=>!v)}>Follow</button>
      </div>
      <div ref={ref} className="scrollbar" style={{flex:1,minHeight:0,overflow:'auto',padding:'0 4px 8px'}}>
        {lines.map((l, i) => <TranscriptRow key={i} l={l} i={i} active={i === active} onSeek={onSeek}/>)}
      </div>
    </div>
  );
}

/* A note's transcript as parsed lines — from its text/plain attachment, or
   from the "## Transcript" section when R2 wasn't available at save time. */
function useNoteTranscript(note, item) {
  const [lines, setLines] = useState([]);
  const file = mediaTranscriptFile(note, item);
  const fallback = file || (note?.media || []).some(m => m.transcriptKey) ? '' : (note?.body || '');
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        let text = '';
        if (file) text = await studyFileText(file);
        else { const m = fallback.match(/## Transcript\n\n([\s\S]*)$/); text = m ? m[1] : ''; }
        if (!dead) setLines(parseTranscript(text));
      } catch { if (!dead) setLines([]); }
    })();
    return () => { dead = true; };
  }, [note?.id, item?.id, file?.key, fallback]);
  return lines;
}

function MediaPanel({ req, state, update, isMobile, onClose }) {
  const note   = state.notes.find(n => n.id === req.noteId);
  const item   = note?.media?.find(m => m.id === req.itemId);
  const isVideo = item?.kind === 'youtube';
  const lines  = useNoteTranscript(note, item);
  const [now, setNow]               = useState(0);
  const [minimized, setMinimized]   = useState(false);
  const [interacting, setInteracting] = useState(false);
  const [vp, setVp]                 = useState(() => ({ w: window.innerWidth || 1280, h: window.innerHeight || 800 }));
  const [rect, setRect]             = useState(loadMediaRect);
  const [localSeek, setLocalSeek]   = useState(null);
  const drag = useRef(null);

  useEffect(() => { if (!item) onClose(); }, [!!item]);
  useEffect(() => { setNow(0); }, [item?.id]);
  useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth || 1280, h: window.innerHeight || 800 });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  if (!item) return null;

  const minH = w => MEDIA_HEADER_H + (isVideo ? Math.round(w * 9 / 16) : MEDIA_AUDIO_H);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const fit = r => {
    const w = clamp(r.w, 300, Math.max(300, vp.w - 16));
    const h = clamp(r.h, minH(w), Math.max(minH(w), vp.h - 16));
    return { w, h, x: clamp(r.x, 80 - w, vp.w - 80), y: clamp(r.y, 0, vp.h - MEDIA_HEADER_H) };
  };
  const initial = () => {
    const w = Math.min(460, vp.w - 32), h = minH(w) + (isVideo ? 230 : 210);
    /* Sits above the Pomodoro widget's corner by default. */
    return { w, h, x: vp.w - w - 20, y: Math.max(16, vp.h - h - 96) };
  };
  const eff = fit(rect || initial());

  const seekReq = req.seek != null ? { t: req.seek, nonce: req.nonce } : null;
  const seekFromTranscript = t => setLocalSeek({ t, nonce: Date.now() });
  /* Remember that this video can't be embedded, so its card offers "Open ↗" next time. */
  const markBlocked = () => {
    if (item.embeddable === false || !note) return;
    update('notes', prev => prev.map(n => n.id === note.id
      ? { ...n, media: (n.media || []).map(m => m.id === item.id ? { ...m, embeddable:false } : m), updated: Date.now() } : n));
  };
  const activeSeek = localSeek && (!seekReq || localSeek.nonce > seekReq.nonce) ? localSeek : seekReq;

  const down = kind => e => {
    if (isMobile) return;
    if (kind === 'move' && e.target.closest('button,a')) return;
    if (kind === 'size') e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    drag.current = { kind, sx: e.clientX, sy: e.clientY, r: { ...eff } };
    setInteracting(true);
  };
  const move = e => {
    const d = drag.current;
    if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    setRect(d.kind === 'move' ? { ...d.r, x: d.r.x + dx, y: d.r.y + dy } : { ...d.r, w: d.r.w + dx, h: d.r.h + dy });
  };
  const up = () => {
    if (!drag.current) return;
    drag.current = null; setInteracting(false);
    setRect(r => { const c = fit(r); try { localStorage.setItem(MEDIA_RECT_KEY, JSON.stringify(c)); } catch {} return c; });
  };
  const handlers = { onPointerMove: move, onPointerUp: up, onPointerCancel: up };

  const mobileVideoH = Math.round((vp.w - 16) * 9 / 16);
  const style = isMobile
    ? { left:8, right:8, bottom:'calc(56px + env(safe-area-inset-bottom, 0px) + 8px)',
        height: minimized ? MEDIA_HEADER_H : MEDIA_HEADER_H + (isVideo ? mobileVideoH : MEDIA_AUDIO_H) + (lines.length ? 150 : 0) }
    : { left:eff.x, top:eff.y, width:eff.w, height: minimized ? MEDIA_HEADER_H : eff.h };

  return (
    <div className="media-panel" role="dialog" aria-label={item.title || 'Media player'} style={style}>
      <div {...handlers} onPointerDown={down('move')} onDoubleClick={()=>setMinimized(v=>!v)}
        style={{height:MEDIA_HEADER_H,flexShrink:0,display:'flex',alignItems:'center',gap:8,padding:'0 6px 0 12px',
          cursor:isMobile?'default':(interacting?'grabbing':'grab'),userSelect:'none',touchAction:'none',borderBottom:minimized?'none':'1px solid var(--glass-border)'}}>
        <span style={{fontSize:14}}>{isVideo ? '▶️' : '🎙️'}</span>
        <span style={{flex:1,minWidth:0,fontSize:12.5,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={item.title}>{item.title || (isVideo ? 'YouTube video' : 'Recording')}</span>
        <button className="icon-btn" title={minimized ? 'Expand' : 'Minimise'} aria-label={minimized ? 'Expand' : 'Minimise'} onClick={()=>setMinimized(v=>!v)}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">{minimized ? <polyline points="6 15 12 9 18 15"/> : <line x1="5" y1="12" x2="19" y2="12"/>}</svg>
        </button>
        <button className="icon-btn" title="Close" aria-label="Close player" onClick={onClose}>{Ic.x}</button>
      </div>
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        {isVideo
          ? <YouTubePlayer videoId={item.videoId} seekReq={activeSeek} onTime={setNow} interacting={interacting} onBlocked={markBlocked}/>
          : <AudioRecordingPlayer item={item} seekReq={activeSeek} onTime={setNow}/>}
        {lines.length > 0 && <TranscriptFollower lines={lines} now={now} onSeek={seekFromTranscript}/>}
      </div>
      {!isMobile && !minimized && (
        <div {...handlers} onPointerDown={down('size')} title="Drag to resize" aria-hidden="true"
          style={{position:'absolute',right:0,bottom:0,width:22,height:22,cursor:'nwse-resize',touchAction:'none',display:'flex',alignItems:'flex-end',justifyContent:'flex-end',padding:4}}>
          <svg viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" style={{color:'var(--text-muted)'}}><line x1="9" y1="2" x2="2" y2="9"/><line x1="9" y1="6" x2="6" y2="9"/></svg>
        </div>
      )}
    </div>
  );
}

/* ── YouTube → transcript via Gemini ──
   One 15-minute window at a time, each a single streamed request (see
   StudyAPI.ytStream) — Gemini may take minutes and the heartbeats keep the
   connection alive. Finished windows are kept for the session, so pressing
   Look up again after a failure carries on where it stopped. */
const _geminiDone = new Map();   /* `${videoId}:${start}-${end}` → lines */

/* Length from YouTube's own player in this browser. The server can't get it
   reliably (YouTube blocks the page for servers), and without it the windows
   have to be found by walking until the video runs out. */
async function ytDurationSec(videoId) {
  try {
    const YT = await Promise.race([ytApi(), new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 8000))]);
    return await new Promise(resolve => {
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:-10000px;top:0;width:320px;height:180px;pointer-events:none';
      const mount = document.createElement('div');
      box.appendChild(mount); document.body.appendChild(box);
      let player = null, settled = false;
      const done = d => {
        if (settled) return; settled = true; clearTimeout(timer);
        try { player?.destroy(); } catch {} box.remove(); resolve(d);
      };
      const timer = setTimeout(() => done(0), 12000);
      player = new YT.Player(mount, {
        host: 'https://www.youtube-nocookie.com', videoId, width: '320', height: '180',
        playerVars: { origin: location.origin },
        events: {
          onReady: async e => {
            for (let i = 0; i < 10; i++) {
              const d = Math.round(e.target.getDuration?.() || 0);
              if (d > 0) return done(d);
              await new Promise(r => setTimeout(r, 300));
            }
            done(0);
          },
          onError: () => done(0),
        },
      });
    });
  } catch { return 0; }
}

async function geminiTranscribeVideo({ videoId, duration = 0, windowSec = 900, onProgress, isCancelled }) {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const check = () => { if (isCancelled?.()) { const e = new Error('Stopped'); e.code = 'cancelled'; throw e; } };
  /* Wait-and-retry only for "busy"/"rate limited" and for transport glitches
     (a gateway error page with no error code of ours, or the network). A
     failure our server reports explicitly is real and is shown at once. */
  const retryable = e => ['busy', 'rate_limited', 'dropped'].includes(e.code)
    || (!e.code && ([502, 503, 504, 524].includes(e.status) || /^HTTP_5\d\d$/.test(e.message) || /fetch|network|load failed/i.test(e.message || '')));

  /* One window = one streamed request. "Busy" and dropped connections wait and
     retry; a part Gemini can't finish in time is split in two. */
  const runWindow = async (a, b, label, depth = 0) => {
    const key = `${videoId}:${a}-${b}`;
    if (_geminiDone.has(key)) return _geminiDone.get(key);
    for (let attempt = 0; ; attempt++) {
      check();
      try {
        const r = await StudyAPI.ytStream(videoId, a, b, secs => { check(); onProgress?.(`${label} · ${secs}s`); });
        _geminiDone.set(key, r.lines);
        return r.lines;
      } catch (e) {
        if (e.code === 'cancelled') throw e;
        /* Too slow, or tripped Google's content filter (which misfires on
           technical talks): smaller pieces usually get through. */
        if ((e.code === 'timeout' || e.code === 'filtered') && depth < 2 && b - a >= 120) {
          const mid = Math.floor((a + b) / 2);
          const lines = [...await runWindow(a, mid, label + ' (1st half)', depth + 1), ...await runWindow(mid, b, label + ' (2nd half)', depth + 1)];
          if (!lines.some(l => l.skipped)) _geminiDone.set(key, lines);
          return lines;
        }
        /* A piece the filter still refuses is marked in the transcript and
           skipped, so one stretch doesn't cost the whole video. Not cached, so
           Look up tries it again. */
        if (e.code === 'filtered') {
          const span = b > a ? `${fmtClock(a)}–${fmtClock(b)}` : 'this video';
          return [{ t:a, text:`[Not transcribed: Gemini’s content filter blocked ${span}]`, skipped:true }];
        }
        if (!retryable(e) || attempt >= 4) throw e;
        const wait = 15 + attempt * 15;
        onProgress?.(`${label} · ${e.code === 'dropped' ? 'connection dropped' : 'Gemini is busy'}, retrying in ${wait}s…`);
        await sleep(wait * 1000);
      }
    }
  };

  const all = [];
  const total = duration > 0 ? Math.max(1, Math.ceil(duration / windowSec)) : null;
  const MAX_WINDOWS = Math.ceil(4 * 3600 / windowSec);   /* stop walking after 4 hours */
  let empties = 0;
  for (let i = 0; i < (total || MAX_WINDOWS); i++) {
    const a = i * windowSec, b = total ? Math.min(duration, (i + 1) * windowSec) : (i + 1) * windowSec;
    const label = `Transcribing with Gemini · part ${i + 1}${total ? ` of ${total}` : ''}`;
    onProgress?.(label + '…');
    let lines;
    try { lines = await runWindow(a, b, label); }
    catch (e) {
      /* Google won't take a clip of this video → one request for all of it. */
      if (e.code === 'clip_unsupported') {
        const label = 'Transcribing with Gemini · whole video';
        onProgress?.(label + '…');
        return runWindow(0, 0, label);
      }
      /* Length unknown: only an error that actually says the range is past the
         end counts as "finished" — any other failure must surface, or a real
         mid-video error would silently cut the transcript short. */
      if (!total && i > 0 && /offset|duration|exceed|beyond|out of range|past the end/i.test(e.message || '')) break;
      throw e;
    }
    all.push(...lines);
    empties = lines.length ? 0 : empties + 1;
    if (!total && empties >= 2) break;
  }
  return all;
}

/* ── YouTube lookup: link → title/channel (+ captions if YouTube allows) ── */
const YT_REASONS = {
  blocked:     'YouTube won’t hand captions to Folio’s server. Use the free “Send to Folio” bookmark below, set up a free Gemini key (see SETUP.md) to make this automatic, or paste the transcript: on YouTube, “…more” → “Show transcript”, copy everything.',
  quota:       'Gemini’s free daily allowance is used up. Use the “Send to Folio” bookmark below, or paste the transcript.',
  private:     'Gemini can only transcribe public videos. Use the “Send to Folio” bookmark below, or paste the transcript.',
  gemini_failed: 'Gemini couldn’t transcribe this video. Use the “Send to Folio” bookmark below, or paste the transcript.',
  no_captions: 'This video has no captions, so there’s no transcript to pick up. You can still watch it here, or paste your own notes below.',
  unavailable: 'This video is unavailable (private or removed).',
  failed:      'Couldn’t read the captions. You can paste the transcript below instead (…more → Show transcript on YouTube).',
  offline:     'Couldn’t reach Folio’s server, so no details were fetched. You can still add the video and paste a transcript.',
};
function YouTubeSource({ cta, ctaNoTranscript, onCreate, autoFocus, prefill }) {
  const [url, setUrl]       = useState(prefill ? `https://youtu.be/${prefill.videoId}` : '');
  const [busy, setBusy]     = useState(false);
  const [progress, setProgress] = useState(null);
  const cancelRef = useRef(false);
  const [err, setErr]       = useState(null);
  const [meta, setMeta]     = useState(() => prefill
    ? { videoId: prefill.videoId, title: prefill.title, author: prefill.author, embeddable: true, transcript: prefill.lines, reason: null, source: 'bookmarklet' }
    : null);
  const [pasted, setPasted] = useState('');
  const apiLines    = meta?.transcript?.length ? meta.transcript : null;
  const pastedLines = useMemo(() => pasted.trim() ? parsePastedTranscript(pasted) : [], [pasted]);
  const lines = apiLines || (pastedLines.length ? pastedLines : null);
  const stamped = pastedLines.some(l => l.t != null);

  const lookup = async () => {
    const id = parseYouTubeId(url);
    if (!id) { setErr('Paste a YouTube link — youtube.com/watch?v=…, youtu.be/…'); return; }
    setBusy(true); setErr(null); setMeta(null);
    let info;
    try { info = await StudyAPI.youtube(id); }
    catch (e) {
      setMeta({ videoId:id, title:'', author:'', embeddable:true, transcript:null, reason:'offline' });
      setErr(studyErrorLabel(e)); setBusy(false);
      return;
    }
    setMeta(info);
    /* No captions from YouTube → Gemini, one streamed 15-minute window at a time (free tier: 8 h/day). */
    if (!info.transcript?.length && info.gemini && info.reason !== 'unavailable') {
      cancelRef.current = false;
      try {
        setProgress('Checking the video’s length…');
        const duration = info.duration || await ytDurationSec(id);
        const all = await geminiTranscribeVideo({
          videoId: id, duration, windowSec: info.geminiWindow || 900,
          onProgress: setProgress, isCancelled: () => cancelRef.current,
        });
        setMeta(m => ({ ...m, transcript: all.length ? all : null, source:'gemini', reason: all.length ? null : 'no_captions' }));
      } catch (e) {
        if (e.code !== 'cancelled') {
          const reason = e.code === 'quota' ? 'quota' : e.code === 'unavailable' ? 'private' : 'gemini_failed';
          setMeta(m => ({ ...m, reason }));
          setErr(`${studyErrorLabel(e)}${e.code === 'quota' || e.code === 'unavailable' ? '' : ' — press Look up again to carry on from where it stopped.'}`);
        } else setMeta(m => ({ ...m, reason:'gemini_failed' }));
      }
      setProgress(null);
    }
    setBusy(false);
  };

  return (
    <div>
      <div style={{display:'flex',gap:8}}>
        <input className="input" autoFocus={autoFocus} placeholder="https://www.youtube.com/watch?v=…" value={url}
          onChange={e=>{ setUrl(e.target.value); setMeta(null); setErr(null); }}
          onKeyDown={e=>{ if (e.key === 'Enter') { e.preventDefault(); lookup(); } }}/>
        <button className="btn-primary" disabled={busy || !url.trim()} onClick={lookup} style={{flexShrink:0}}>{busy ? 'Looking…' : 'Look up'}</button>
      </div>
      {progress && (
        <StudyBanner busy onClose={()=>{ cancelRef.current = true; }}>
          {progress} — keep this open; Gemini usually needs one to three minutes per 15-minute part.
        </StudyBanner>
      )}
      {err && <div style={{fontSize:12.5,color:'var(--danger)',marginTop:8}}>{err}</div>}

      {meta && (
        <div style={{marginTop:12}}>
          <div className="row-soft" style={{marginBottom:10}}>
            <img alt="" src={`https://i.ytimg.com/vi/${meta.videoId}/mqdefault.jpg`} style={{width:96,height:54,objectFit:'cover',borderRadius:'var(--r-xs)',background:'#000',flexShrink:0}}/>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,lineHeight:1.35}}>{meta.title || 'YouTube video'}</div>
              <div style={{fontSize:11.5,color:'var(--text-muted)'}}>{meta.author || meta.videoId}</div>
            </div>
          </div>
          {meta.embeddable === false && (
            <div style={{fontSize:12.5,color:'var(--warning)',marginBottom:8}}>
              The owner doesn’t allow this video to play inside other apps, so Folio can only link to it on YouTube. A transcript still works.
            </div>
          )}
          {apiLines
            ? <div style={{fontSize:12.5,color:'var(--success)',marginBottom:8}}>
                ✓ {meta.source === 'gemini' ? 'Transcribed by Gemini (AI — may not be word-for-word)' : meta.source === 'bookmarklet' ? 'Transcript from YouTube' : 'Captions found'}{meta.language ? ` (${meta.language})` : ''} · {apiLines.length} lines
                {apiLines.some(l => l.skipped) && (
                  <div style={{color:'var(--warning, #d97706)',marginTop:4}}>
                    Gemini’s filter refused {apiLines.filter(l => l.skipped).length} stretch(es), marked “[Not transcribed…]” in the transcript. Press Look up to retry those, or paste them in yourself.
                  </div>
                )}
              </div>
            : (<>
                <div style={{...studyMuted,marginBottom:8}}>{YT_REASONS[meta.reason] || YT_REASONS.failed}</div>
                {meta.reason !== 'unavailable' && (<>
                  <textarea className="input" rows={6} value={pasted} onChange={e=>setPasted(e.target.value)}
                    placeholder="Paste the transcript here (timestamps are kept so you can click a line to jump to it)…"/>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginTop:6,flexWrap:'wrap'}}>
                    <a href={`https://www.youtube.com/watch?v=${meta.videoId}`} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:'var(--accent)'}}>Open on YouTube ↗</a>
                    {pastedLines.length > 0 && <span style={{fontSize:12,color:'var(--text-muted)'}}>{pastedLines.length} lines{stamped ? ' · timestamps found' : ' · no timestamps'}</span>}
                  </div>
                  <BookmarkletLink/>
                </>)}
              </>)}
          {meta.reason !== 'unavailable' && (
            <button className="btn-primary" style={{marginTop:12}}
              onClick={()=>onCreate({ videoId:meta.videoId, title:meta.title, author:meta.author, embeddable:meta.embeddable !== false, lines })}>
              {lines ? cta : ctaNoTranscript}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ── "Send to Folio" bookmarklet ──
   YouTube now refuses captions to servers (and rejects direct transcript
   requests without its player's token), but its own page still gets them.
   This runs on youtube.com when you click the bookmark: it asks the page's
   player to load captions (as the CC button does), catches the caption request
   the player makes (token included) and re-reads it as timed captions — or
   reads the "Show transcript" panel as a backup — then restores captions as
   they were and opens Folio with the result in the URL hash: compressed, and
   never sent through a server. Self-contained on
   purpose: it is serialised with toString() and can't see anything in here. */
function folioYtBookmarklet(FOLIO) {
  (async () => {
    const restore = [];
    try {
      const v = new URLSearchParams(location.search).get('v') || (location.pathname.match(/\/(?:shorts|live)\/([\w-]{11})/) || [])[1];
      if (!/(^|\.)youtube\.com$/.test(location.hostname) || !v) { alert('Open a YouTube video first, then click “Send to Folio”.'); return; }
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const isCap = u => typeof u === 'string' && u.indexOf('/api/timedtext') >= 0 && u.indexOf('v=' + v) >= 0;
      /* 1. Watch for the caption request YouTube's own player makes — it
            carries the token YouTube now requires, which a server can't get. */
      let caught = performance.getEntriesByType('resource').map(e => e.name).filter(isCap).pop() || null;
      const of = window.fetch, oo = XMLHttpRequest.prototype.open;
      window.fetch = function (input) { const u = typeof input === 'string' ? input : input && input.url; if (isCap(u)) caught = u; return of.apply(this, arguments); };
      XMLHttpRequest.prototype.open = function (m, u) { if (isCap(String(u))) caught = String(u); return oo.apply(this, arguments); };
      restore.push(() => { window.fetch = of; XMLHttpRequest.prototype.open = oo; });
      /* 2. If it hasn't happened yet, ask the player to load captions (what
            pressing CC does), then put captions back the way they were. */
      const player = document.getElementById('movie_player');
      if (!caught && player && player.setOption) {
        const tracks = (player.getOption && player.getOption('captions', 'tracklist', { includeAsr: true })) || [];
        const wasOn = tracks.length > 0;
        try { player.loadModule && player.loadModule('captions'); } catch (err) {}
        const list = (player.getOption && player.getOption('captions', 'tracklist', { includeAsr: true })) || [];
        const pick = list.find(t => /^en/.test(t.languageCode) && !t.kind) || list.find(t => /^en/.test(t.languageCode)) || list[0];
        if (pick) { try { player.setOption('captions', 'track', pick); } catch (err) {} }
        for (let i = 0; i < 24 && !caught; i++) await sleep(250);
        if (!wasOn) restore.push(() => { try { player.unloadModule('captions'); } catch (err) {} });
      }
      /* 3. Still nothing: press the CC button itself. */
      const cc = document.querySelector('.ytp-subtitles-button');
      if (!caught && cc && cc.getAttribute('aria-pressed') === 'false') {
        cc.click(); restore.push(() => { if (cc.getAttribute('aria-pressed') === 'true') cc.click(); });
        for (let i = 0; i < 24 && !caught; i++) await sleep(250);
      }
      let lines = [];
      if (caught) {
        try {
          const u = new URL(caught, location.origin);
          u.searchParams.set('fmt', 'json3');
          const j = await (await of.call(window, u.toString(), { credentials: 'include' })).json();
          for (const ev of j.events || []) {
            if (!ev.segs) continue;
            const text = ev.segs.map(s => s.utf8 || '').join('').replace(/\s+/g, ' ').trim();
            if (!text || (lines.length && lines[lines.length - 1].text === text)) continue;
            lines.push({ t: Math.round((ev.tStartMs || 0) / 100) / 10, text });
          }
        } catch (err) { lines = []; }
      }
      /* 4. Backup: the "Show transcript" panel. Rows read "0:01 / 1 second /
            words" — the middle line is a screen-reader label. */
      if (!lines.length) {
        const segs = () => document.querySelectorAll('transcript-segment-view-model, ytd-transcript-segment-renderer');
        if (!segs().length) {
          const btn = [...document.querySelectorAll('button')].find(b => /^show transcript$/i.test((b.getAttribute('aria-label') || b.textContent || '').trim()));
          if (btn) { btn.click(); for (let i = 0; i < 24 && !segs().length; i++) await sleep(250); await sleep(300); }
        }
        for (const el of segs()) {
          const parts = el.innerText.split('\n').map(s => s.trim()).filter(Boolean);
          const n = (parts.shift() || '').split(':').map(Number);
          const words = parts.filter(p => !/^(\d+ (hours?|minutes?|seconds?),? ?)+$/i.test(p)).join(' ');
          if (words) lines.push({ t: n.length > 1 && n.every(x => !isNaN(x)) ? n.reduce((a, p) => a * 60 + p, 0) : null, text: words });
        }
      }
      restore.forEach(f => f()); restore.length = 0;
      if (!lines.length) { alert('YouTube didn’t provide a transcript for this video (it may have no captions). Try again once the video has started playing.'); return; }
      const title = document.title.replace(/^\(\d+\)\s*/, '').replace(/ - YouTube$/, '');
      const author = ((document.querySelector('ytd-video-owner-renderer #channel-name a, #owner #channel-name a') || {}).textContent || '').trim();
      const bytes = new TextEncoder().encode(JSON.stringify({ v, title, author, lines }));
      const packed = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
      let bin = '';
      for (let i = 0; i < packed.length; i += 0x8000) bin += String.fromCharCode.apply(null, packed.subarray(i, i + 0x8000));
      const dest = FOLIO + '/#yt-transcript=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const w = window.open(dest, '_blank');
      if (!w) location.href = dest;   /* popup blocked: go there in this tab */
    } catch (e) {
      restore.forEach(f => { try { f(); } catch (err) {} });
      alert('Send to Folio failed: ' + (e && e.message));
    }
  })();
}

/* Auto-captions arrive as ~1.5-second fragments with no punctuation — fine
   for a player, unreadable as a transcript. Join them into lines of up to
   ~10 seconds / 160 characters, breaking early at a sentence end. Lines
   that are already sentence-sized pass through unchanged. */
function mergeTranscriptLines(lines) {
  const out = [];
  for (const l of lines) {
    const cur = out[out.length - 1];
    const fits = cur && cur.t != null && l.t != null && l.t - cur.t < 10 && cur.text.length + l.text.length < 160 && !/[.!?…]["”’)]?$/.test(cur.text);
    if (fits) cur.text += ' ' + l.text;
    else out.push({ ...l });
  }
  return out;
}

/* Folio side: decode what the bookmarklet put in the URL hash. Treated
   strictly as data — validated, trimmed, rendered as text. */
async function decodeYtImport(b64) {
  const bin = atob(String(b64).replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  const j = JSON.parse(txt);
  if (!YT_ID_RE.test(j?.v || '') || !Array.isArray(j.lines)) throw new Error('Not a Folio transcript link');
  return {
    videoId: j.v, title: String(j.title || '').slice(0, 300), author: String(j.author || '').slice(0, 200),
    lines: mergeTranscriptLines(j.lines.filter(l => l && typeof l.text === 'string' && l.text.trim())
      .map(l => ({ t: Number.isFinite(Number(l.t)) && l.t !== null ? Number(l.t) : null, text: l.text.slice(0, 2000) }))
      .slice(0, 20000)),
  };
}

function BookmarkletLink() {
  const ref = useRef(null);
  /* Set imperatively: React warns about javascript: URLs in JSX. */
  useEffect(() => {
    ref.current?.setAttribute('href', 'javascript:' + encodeURIComponent(`(${folioYtBookmarklet.toString()})(${JSON.stringify(location.origin)})`));
  }, []);
  return (
    <div className="row-soft" style={{marginTop:10,flexWrap:'wrap'}}>
      <a ref={ref} className="pill on" draggable="true" onClick={e => e.preventDefault()} title="Drag me to your bookmarks bar"
        style={{textDecoration:'none',cursor:'grab'}}>⇢ Send to Folio</a>
      <span style={{flex:'1 1 220px',fontSize:12,color:'var(--text-secondary)',lineHeight:1.5}}>
        Free, automatic: drag this to your bookmarks bar once. Then on any YouTube video, click it — Folio opens with the transcript filled in. (Desktop browsers.)
      </span>
    </div>
  );
}

/* ── a note's media: recordings and videos, with Play ── */
function NoteMedia({ note, update, previewMode }) {
  const media = note.media || [];
  const [adding, setAdding]       = useState(false);
  const [transcriptFor, setTranscriptFor] = useState(null);
  const [pasted, setPasted]       = useState('');
  const [busy, setBusy]           = useState(null);
  if (!media.length && previewMode) return null;

  /* Functional update against the LATEST note — transcripts upload
     asynchronously and the user may have kept typing meanwhile. */
  const patchNote = fn => update('notes', prev => prev.map(n => n.id === note.id ? { ...n, ...fn(n), updated: Date.now() } : n));
  const attachTranscript = async (title, lines) => {
    try { return await uploadTranscriptFile(title, lines); }
    catch {   /* no R2: keep it in the body instead */
      patchNote(n => ({ body: `${n.body || ''}

## Transcript

${formatTranscript(lines)}`.trim() }));
      return null;
    }
  };
  const addVideo = async r => {
    const item = { id: uid(), kind:'youtube', videoId:r.videoId, title:r.title || 'YouTube video', author:r.author || '', embeddable:r.embeddable !== false, createdAt: Date.now() };
    setBusy('Adding…');
    const f = r.lines?.length ? await attachTranscript(item.title, r.lines) : null;
    patchNote(n => ({ media: [...(n.media || []), f ? { ...item, transcriptKey: f.key } : item], ...(f ? { files: [...(n.files || []), f] } : {}) }));
    setBusy(null); setAdding(false);
    openMedia({ noteId: note.id, itemId: item.id });
  };
  const saveTranscript = async item => {
    const lines = parsePastedTranscript(pasted);
    if (!lines.length) return;
    setBusy('Saving transcript…');
    const f = await attachTranscript(item.title, lines);
    if (f) patchNote(n => ({ files: [...(n.files || []), f], media: (n.media || []).map(m => m.id === item.id ? { ...m, transcriptKey: f.key } : m) }));
    setBusy(null); setTranscriptFor(null); setPasted('');
  };
  const remove = item => {
    if (!confirm(item.kind === 'audio' ? 'Delete this recording? The audio is removed for good (the transcript stays).' : 'Remove this video from the note?')) return;
    if (item.kind === 'audio') (item.parts || []).forEach(p => Files.remove(p.key));
    patchNote(n => ({ media: (n.media || []).filter(m => m.id !== item.id) }));
  };

  return (
    <div style={{marginBottom:14}}>
      {media.map(item => (
        <div key={item.id} style={{marginBottom:8}}>
          <div className="row-soft">
            <span style={{fontSize:18}}>{item.kind === 'audio' ? '🎙️' : '▶️'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.title}</div>
              <div style={{fontSize:11.5,color:'var(--text-muted)'}}>
                {item.kind === 'audio'
                  ? `Recording · ${fmtClock((item.durationMs || 0) / 1000)}`
                  : `YouTube${item.author ? ` · ${item.author}` : ''}${item.embeddable === false ? ' · opens on YouTube' : ''}`}
              </div>
            </div>
            {item.kind === 'youtube' && item.embeddable === false
              ? <a className="btn-primary" style={{textDecoration:'none',padding:'6px 14px'}} href={`https://www.youtube.com/watch?v=${item.videoId}`} target="_blank" rel="noopener noreferrer">Open ↗</a>
              : <button className="btn-primary" style={{padding:'6px 14px'}} onClick={()=>openMedia({ noteId:note.id, itemId:item.id })}>Play</button>}
            {item.kind === 'youtube' && !mediaTranscriptFile(note, item) && (
              <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12}} onClick={()=>setTranscriptFor(transcriptFor === item.id ? null : item.id)}>Add transcript</button>
            )}
            <button className="icon-btn danger" title="Remove" aria-label="Remove" onClick={()=>remove(item)}>{Ic.trash}</button>
          </div>
          {transcriptFor === item.id && (
            <div style={{marginTop:6}}>
              <textarea className="input" rows={5} value={pasted} onChange={e=>setPasted(e.target.value)}
                placeholder="On YouTube: …more → Show transcript → copy all, then paste here."/>
              <div style={{display:'flex',gap:8,marginTop:6}}>
                <button className="btn-primary" disabled={!pasted.trim() || !!busy} onClick={()=>saveTranscript(item)}>{busy || 'Save transcript'}</button>
                <button className="btn-ghost" onClick={()=>{ setTranscriptFor(null); setPasted(''); }}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      ))}
      {!previewMode && (
        adding
          ? <div className="card" style={{padding:'12px 14px'}}>
              <YouTubeSource cta="Add video & transcript" ctaNoTranscript="Add video without transcript" onCreate={addVideo} autoFocus/>
              <button className="btn-ghost" style={{marginTop:10,padding:'4px 12px',fontSize:12}} onClick={()=>setAdding(false)}>Cancel</button>
            </div>
          : <button className="btn-ghost" style={{padding:'5px 12px',fontSize:12}} onClick={()=>setAdding(true)}>▶ Add YouTube video</button>
      )}
    </div>
  );
}

/* ── transcript attachment (text/plain in R2) — click a timestamp to seek ── */
function TranscriptAttachment({ file, note }) {
  const [text, setText] = useState(null);
  const [open, setOpen] = useState(false);
  const [err, setErr]   = useState(null);
  const lines = useMemo(() => text ? parseTranscript(text) : [], [text]);
  const all = note?.media || [];
  const owner = all.find(m => m.transcriptKey === file.key) || (all.some(m => m.transcriptKey) ? null : all[0]);
  const media = owner && (owner.kind === 'audio' || owner.embeddable !== false) ? owner : null;
  const toggle = async () => {
    if (!open && text === null) {
      try { setText(await studyFileText(file)); } catch (e) { setErr(pdfErrorLabel(e)); }
    }
    setOpen(v => !v);
  };
  return (
    <div className="row-soft" style={{flexDirection:'column',alignItems:'stretch',margin:'12px 0'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span>📝</span>
        <span style={{flex:1,fontSize:13,fontWeight:600,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Transcript · {file.name}</span>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>{fmtBytes(file.size || 0)}</span>
        <button className="btn-ghost" style={{padding:'4px 12px',fontSize:12}} onClick={toggle}>{open ? 'Hide' : 'Show'}</button>
      </div>
      {err && <div style={{fontSize:12,color:'var(--danger)',marginTop:6}}>{err}</div>}
      {open && text !== null && (
        <div className="scrollbar" style={{marginTop:10,maxHeight:420,overflow:'auto'}}>
          {media && lines.some(l => l.t != null) && <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:6}}>Click a timestamp to jump the player to it.</div>}
          {lines.map((l, i) => (
            <div key={i} style={{display:'flex',gap:8,fontSize:13.5,lineHeight:1.7,color:'var(--text-tertiary)'}}>
              {l.t != null && (media
                ? <button onClick={()=>openMedia({ noteId:note.id, itemId:media.id, seek:l.t })} title="Play from here"
                    style={{background:'none',border:'none',padding:0,cursor:'pointer',color:'var(--accent)',fontVariantNumeric:'tabular-nums',fontWeight:600,fontFamily:'inherit',fontSize:'inherit',minWidth:42,textAlign:'left',flexShrink:0}}>{fmtClock(l.t)}</button>
                : <span style={{color:'var(--text-muted)',fontVariantNumeric:'tabular-nums',minWidth:42,flexShrink:0}}>{fmtClock(l.t)}</span>)}
              <span style={{whiteSpace:'pre-wrap'}}>{l.text}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── lecture recorder ──
   MediaRecorder in ~4.5-minute segments: each segment is a complete,
   independently decodable file (a byte-slice of one long webm/mp4 isn't),
   small enough for one Whisper call. A segment is kept in IndexedDB until it
   has been both transcribed AND (if "keep audio" is on) uploaded to R2, so a
   crash or a killed tab loses at most the segment in progress.
   The finished recording is a list of parts with their lengths; playback
   stitches them into one timeline (see AudioRecordingPlayer). */
const SEGMENT_MS = 270000;
const KEEP_AUDIO_KEY = 'folio_keep_audio';
/* A segment's real length, read from the audio itself. The wall clock lies
   whenever capture pauses while timers keep counting (iPhone locking the
   screen, a laptop sleeping), and a part length that disagrees with its audio
   would skew every later timestamp and seek. Chrome's MediaRecorder files can
   report an infinite duration until the end is forced, hence the seek trick.
   Falls back to `fallbackMs` if the file can't be measured. */
function audioDurationMs(blob, fallbackMs) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const a = new Audio();
    let settled = false;
    const done = ms => { if (settled) return; settled = true; clearTimeout(timer); a.removeAttribute('src'); URL.revokeObjectURL(url); resolve(ms); };
    const timer = setTimeout(() => done(fallbackMs), 5000);
    const read = () => Number.isFinite(a.duration) && a.duration > 0 ? Math.round(a.duration * 1000) : null;
    a.preload = 'metadata';
    a.onerror = () => done(fallbackMs);
    a.onloadedmetadata = () => {
      const d = read();
      if (d != null) return done(d);
      a.ondurationchange = () => { const v = read(); if (v != null) done(v); };
      try { a.currentTime = 1e101; } catch { done(fallbackMs); }
    };
    a.src = url;
  });
}
const audioExt = type => /mp4/.test(type) ? 'mp4' : /ogg/.test(type) ? 'ogg' : 'webm';
function Recorder({ onFinish, onRecordingChange }) {
  const [phase, setPhase]   = useState('idle');   /* idle | recording | finishing */
  const [error, setError]   = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [segs, setSegs]     = useState({ total:0, done:0, failed:0 });
  const [preview, setPreview] = useState('');
  const [leftovers, setLeftovers] = useState([]);
  const [keepAudio, setKeepAudio] = useState(() => { try { return localStorage.getItem(KEEP_AUDIO_KEY) !== '0'; } catch { return true; } });
  const r = useRef({ stream:null, rec:null, recId:null, idx:0, results:[], parts:[], ms:[], empty:new Set(), chain:Promise.resolve(), rotate:null, tick:null, started:0, wake:null, mime:'', keep:true });

  useEffect(() => { RecStore.all().then(list => setLeftovers(list)); }, []);
  useEffect(() => { onRecordingChange?.(phase === 'recording' || phase === 'finishing'); }, [phase]);
  useEffect(() => () => {
    const s = r.current;
    clearTimeout(s.rotate); clearInterval(s.tick);
    try { s.rec?.state !== 'inactive' && s.rec?.stop(); } catch {}
    s.stream?.getTracks().forEach(t => t.stop());
    s.wake?.release?.().catch(() => {});
  }, []);
  const toggleKeep = v => { setKeepAudio(v); try { localStorage.setItem(KEEP_AUDIO_KEY, v ? '1' : '0'); } catch {} };

  const transcribeSeg = async rec => {
    const s = r.current;
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const prompt = s.results.slice(0, rec.idx).map(x => x?.text || '').join(' ').slice(-300);
        const { text, segments } = await StudyAPI.transcribe(rec.blob, prompt);
        s.results[rec.idx] = { text, segments: segments || [] };
        setPreview(s.results.map(x => x?.text || '').join(' ').slice(-400));
        setSegs(v => ({ ...v, done: v.done + 1 }));
        return true;
      } catch (e) {
        lastErr = e;
        await new Promise(res => setTimeout(res, 2000 * (attempt + 1)));
      }
    }
    setSegs(v => ({ ...v, failed: v.failed + 1 }));
    setError(`A segment failed to transcribe (${studyErrorLabel(lastErr)}). It’s kept on this device — you can recover it later.`);
    return false;
  };
  const uploadSeg = async rec => {
    const s = r.current;
    const type = rec.blob.type || 'audio/webm';
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const meta = await Files.upload(new File([rec.blob], `lecture-${String(rec.idx).padStart(4, '0')}.${audioExt(type)}`, { type }));
        s.parts[rec.idx] = { key: meta.key, size: meta.size, ms: rec.ms, type: type.split(';')[0] };
        return true;
      } catch (e) {
        lastErr = e;
        await new Promise(res => setTimeout(res, 2000 * (attempt + 1)));
      }
    }
    setError(`Part of the audio couldn’t be saved for playback (${pdfErrorLabel(lastErr)}). The transcript is unaffected.`);
    return false;
  };
  const processRec = async rec => {
    const keep = r.current.keep;
    const [okT, okU] = await Promise.all([transcribeSeg(rec), keep ? uploadSeg(rec) : Promise.resolve(true)]);
    if (okT && okU) RecStore.del(rec.key);
  };

  /* Timeline: each segment's transcript timings are relative to that segment,
     so they're shifted by the summed length of the segments before it. */
  const finalize = () => {
    const s = r.current;
    const n = Math.max(s.results.length, s.ms.length, s.parts.length);
    let offset = 0;
    const lines = [], parts = [];
    let missing = false;
    for (let i = 0; i < n; i++) {
      if (s.empty.has(i)) continue;
      const res = s.results[i], ms = s.ms[i] || 0;
      if (res?.segments?.length) for (const sg of res.segments) lines.push({ t: Math.round((offset / 1000 + sg.start) * 10) / 10, text: sg.text });
      else if (res?.text) lines.push({ t: Math.round(offset / 100) / 10, text: res.text });
      if (s.keep) { if (s.parts[i]) parts.push({ key: s.parts[i].key, size: s.parts[i].size, ms }); else missing = true; }
      offset += ms;
    }
    const usable = s.keep && !missing && parts.length > 0;
    if (s.keep && missing) s.parts.filter(Boolean).forEach(p => Files.remove(p.key));   /* a partial recording can't play */
