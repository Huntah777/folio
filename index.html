  );
}

/* ── SyncSettings (Admin → Sync tab) ── */
function SyncSettings({ onConnected, onSync, syncStatus }) {
  const [token, setToken] = useState(Sync.getToken() || '');
  const [status, setStatus] = useState('');

  const save = async e => {
    e.preventDefault();
    const t = token.trim();
    if (!t) { Sync.setToken(null); setStatus('cleared'); return; }
    Sync.setToken(t);
    setStatus('testing…');
    try {
      const remote = await Sync.load();
      setStatus('✓ Connected!');
      onConnected && onConnected(remote);
    } catch(err) {
      if (err.message === 'UNAUTHORIZED') {
        const health = await fetch('/api/health').then(r => r.json()).catch(() => ({}));
        setStatus(!health.sync_configured
          ? '✗ Server SYNC_TOKEN not set — add it in Cloudflare Pages → Settings → Environment variables (Production)'
          : '✗ Wrong token — must match SYNC_TOKEN exactly');
      } else if (err.message === 'HTTP_413') {
        setStatus('✗ Data too large to sync (over 5 MB)');
      } else if (err.message.startsWith('HTTP_5')) {
        setStatus('✗ Server error — check D1 binding in Cloudflare Pages');
      } else {
        setStatus('✗ Could not reach API');
      }
    }
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:18,maxWidth:520}}>
      <div style={{fontSize:12,color:'var(--text-secondary)'}}>Connect to Cloudflare D1 for cross-device sync.</div>

      {Sync.configured() && onSync && (
        <div style={{padding:'12px 14px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <div style={{fontSize:12}}>
            <span style={{color:syncStatus==='synced'?'var(--success)':syncStatus==='offline'?'var(--danger)':syncStatus==='unauth'?'var(--warning)':'var(--text-secondary)',fontWeight:600}}>
              {syncStatus==='synced'?'Synced':syncStatus==='syncing'?'Syncing…':syncStatus==='saving'?'Saving…':syncStatus==='offline'?'Offline':syncStatus==='unauth'?'Auth error':'Connected'}
            </span>
            <span style={{color:'var(--text-muted)',marginLeft:6}}>· pull latest from D1</span>
          </div>
          <button type="button" onClick={onSync}
            style={{background:'linear-gradient(135deg,var(--accent),var(--accent-strong))',border:'none',borderRadius:7,color:'#fff',fontSize:12,fontWeight:700,padding:'6px 14px',cursor:'pointer',fontFamily:'Manrope,sans-serif',flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
            <svg style={{width:11,height:11,animation:(syncStatus==='syncing'||syncStatus==='saving')?'spin 0.8s linear infinite':'none'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            Sync now
          </button>
        </div>
      )}

      <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:6}}>Sync token <span style={{color:'var(--text-muted)'}}>(set as SYNC_TOKEN in Cloudflare Pages env vars)</span></label>
          <input className="input" type="password" value={token} onChange={e=>setToken(e.target.value)}
            placeholder="Paste your secret token…"/>
        </div>
        {status && (
          <div style={{fontSize:12,color:status.startsWith('✓')?'var(--success)':status.startsWith('✗')?'var(--danger)':'var(--warning)',wordBreak:'break-word',overflowWrap:'anywhere'}}>{status}</div>
        )}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          {token && <button type="button" className="btn-ghost" onClick={()=>{Sync.setToken(null);setToken('');setStatus('cleared');}}>Disconnect</button>}
          <button type="submit" className="btn-primary">Save &amp; test</button>
        </div>
      </form>
    </div>
  );
}

/* ── NotificationsSettings (Admin → Notifications tab) ──
   Subscribe control + real diagnostics (what THIS device thinks vs. what the
   SERVER has on file — they can disagree for weeks with no error, see the
   GET handler in functions/api/push.js) + a local test notification, plus a
   view of what's coming up and what's actually fired recently. */
function NotificationsSettings({ state }) {
  const [notifPerm, setNotifPerm] = useState(() => ('Notification' in window) ? Notification.permission : 'denied');
  const [enabling, setEnabling]   = useState(false);
  const [deviceSub, setDeviceSub] = useState(null);   /* null=checking, false=none, PushSubscription */
  const [serverInfo, setServerInfo] = useState(null); /* null=checking, false=not registered, {updatedAt,sentToday} */
  const [pushBusy, setPushBusy]   = useState(false);
  const [msg, setMsg]             = useState(null);   /* plain string — reconnect and test share one slot */
  const [upcoming, setUpcoming]   = useState(null);
  const [history, setHistory]     = useState(null);

  const refreshDeviceStatus = useCallback(async () => {
    if (notifPerm !== 'granted' || !('serviceWorker' in navigator)) { setDeviceSub(false); return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      setDeviceSub(sub || false);
    } catch { setDeviceSub(false); }
  }, [notifPerm]);

  useEffect(() => { refreshDeviceStatus(); }, [refreshDeviceStatus]);

  useEffect(() => {
    if (deviceSub === null) return;
    if (!deviceSub) { setServerInfo(false); return; }
    const token = Sync.getToken();
    if (!token) { setServerInfo(false); return; }
    (async () => {
      try {
        const r = await fetch(`/api/push?id=${encodeURIComponent(deviceSub.endpoint)}`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await r.json();
        setServerInfo(data.registered ? data : false);
      } catch { setServerInfo(false); }
    })();
  }, [deviceSub]);

  useEffect(() => {
    (async () => {
      if (!state?.meetings) { setUpcoming([]); return; }
      try {
        const all = await buildSchedule(state.meetings, state.salah);
        const now = Date.now();
        setUpcoming(all.filter(n => n.fireAt > now).sort((a,b) => a.fireAt - b.fireAt).slice(0, 10));
      } catch { setUpcoming([]); }
    })();
  }, [state?.meetings, state?.salah]);

  useEffect(() => { readNotificationLog().then(setHistory); }, []);

  const enableNotifications = async () => {
    if (!('Notification' in window)) return;
    setEnabling(true);
    try {
      const perm = await Notification.requestPermission();
      setNotifPerm(perm);
      if (perm === 'granted') {
        scheduleNotifications(state);
        await activatePush();
        await refreshDeviceStatus();
      }
    } finally { setEnabling(false); }
  };

  /* Tear the existing subscription down and build a fresh one. Unsubscribing
     first matters: if the old subscription is the broken one, re-POSTing it
     would just re-register the same dead endpoint. */
  const reconnectPush = async () => {
    setPushBusy(true); setMsg(null);
    try {
      const reg = await navigator.serviceWorker.ready;
      const old = await reg.pushManager.getSubscription();
      if (old) {
        const token = Sync.getToken();
        if (token) {
          fetch('/api/push', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ endpoint: old.endpoint }),
          }).catch(()=>{});
        }
        await old.unsubscribe().catch(()=>{});
      }
      const ok = await registerPush();
      await refreshDeviceStatus();
      setMsg(ok
        ? 'Reconnected — this device is registered for background alerts.'
        : 'Could not reconnect. Check the sync token and notification permission.');
    } catch (e) {
      setMsg(e?.message || 'Could not reconnect.');
    }
    setPushBusy(false);
  };

  const sendTestNotification = async () => {
    setMsg(null);
    const ok = await showNotificationViaSW('Test notification', 'If you can see this, notifications are working on this device.', 'folio-test');
    setMsg(ok ? 'Sent — check your notification tray.' : 'Could not show a test notification.');
  };

  const fmtWhen = ms => new Date(ms).toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

  return (
    <div style={{display:'flex',flexDirection:'column',gap:22,maxWidth:640}}>
      {notifPerm !== 'granted' ? (
        <div style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:13,fontWeight:600}}>Notifications are off</div>
            <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:2}}>Enable them for meeting and prayer-time alerts, even when Folio isn't open.</div>
          </div>
          <button className="btn-primary" onClick={enableNotifications} disabled={enabling}>{enabling ? 'Requesting…' : 'Enable notifications'}</button>
        </div>
      ) : (
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Status</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8}}>
              <span style={{fontSize:12,color:'var(--text-secondary)',flex:1}}>This device</span>
              {deviceSub===null && <span style={{fontSize:11,color:'var(--text-muted)'}}>checking…</span>}
              {deviceSub===false && <span style={{fontSize:11,color:'var(--text-muted)'}}>Not registered</span>}
              {deviceSub && <span style={{fontSize:11,fontWeight:700,color:'var(--warning)',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:4,padding:'2px 8px'}}>ACTIVE</span>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:8,flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:'var(--text-secondary)',flex:1,minWidth:80}}>Server</span>
              {serverInfo===null && <span style={{fontSize:11,color:'var(--text-muted)'}}>checking…</span>}
              {serverInfo===false && <span style={{fontSize:11,color:'var(--text-muted)'}}>Not registered</span>}
              {serverInfo && (
                <span style={{fontSize:11,color:'var(--text-secondary)'}}>
                  Confirmed {fmtWhen(serverInfo.updatedAt)} · {serverInfo.sentToday} sent today
                </span>
              )}
            </div>
            {/* A push subscription can be silently invalidated by the browser
                (site data cleared, PWA reinstalled, key rotation) and there's
                no event for most of these cases — the device just stops
                receiving. Re-subscribing is the fix. */}
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button type="button" className="btn-ghost" onClick={reconnectPush} disabled={pushBusy}>{pushBusy ? 'Reconnecting…' : 'Reconnect'}</button>
              <button type="button" className="btn-ghost" onClick={sendTestNotification}>Send test notification</button>
            </div>
            {msg && <div data-testid="push-msg" style={{fontSize:11,color:'var(--text-secondary)',padding:'6px 10px',background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:6}}>{msg}</div>}
          </div>
        </div>
      )}

      <div className="divider"/>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Upcoming</div>
        {!upcoming?.length ? (
          <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing scheduled in the next 14 days.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {upcoming.map(n=>(
              <div key={n.id} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'6px 10px',background:'var(--bg-surface)',borderRadius:7,fontSize:12}}>
                <span style={{color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</span>
                <span style={{color:'var(--text-muted)',flexShrink:0,fontFamily:'"JetBrains Mono",monospace'}}>{fmtWhen(n.fireAt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Recently delivered</div>
        {!history?.length ? (
          <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing delivered on this device yet.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {history.map((n,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'6px 10px',background:'var(--bg-surface)',borderRadius:7,fontSize:12}}>
                <span style={{color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</span>
                <span style={{color:'var(--text-muted)',flexShrink:0,fontFamily:'"JetBrains Mono",monospace'}}>{fmtWhen(n.firedAt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── DataSettings (Admin → Data tab) ── */
function DataSettings({ state, hydrate, replaceState }) {
  const [confirmClear, setConfirmClear] = useState(null); /* 'data' | 'cache' | null */
  const [pendingImportFile, setPendingImportFile] = useState(null);
  const [importMsg, setImportMsg] = useState(null);
  const fileInputRef = useRef(null);

  const exportState = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `folio-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const confirmImport = async () => {
    if (!pendingImportFile) return;
    try {
      const parsed = JSON.parse(await pendingImportFile.text());
      replaceState(tombMissing(state, hydrate(parsed)));
      setImportMsg({ text: 'Backup restored.' });
    } catch {
      setImportMsg({ text: "Could not read that file — is it a folio backup JSON?", error: true });
    }
    setPendingImportFile(null);
  };

  const clearLocalData = () => {
    localStorage.removeItem('folio_v1');
    window.location.reload();
  };
  const clearCacheAndReload = async () => {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations().catch(() => []);
      await Promise.all(regs.map(r => r.unregister()));
    }
    const keys = await caches.keys().catch(() => []);
    await Promise.all(keys.map(k => caches.delete(k)));
    window.location.reload();
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:22,maxWidth:560}}>
      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Backup</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>Download everything as a JSON file, or restore from one.</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button type="button" className="btn-ghost" onClick={exportState}>Export data</button>
            {!pendingImportFile && (
              <button type="button" className="btn-ghost" onClick={()=>fileInputRef.current?.click()}>Import data…</button>
            )}
            <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}}
              onChange={e=>{ const f=e.target.files?.[0]; e.target.value=''; setImportMsg(null); if (f) setPendingImportFile(f); }}/>
          </div>
          {pendingImportFile && (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--warning)',flex:1}}>Restoring "{pendingImportFile.name}" replaces current data — anything it doesn't have will be deleted on next sync.</span>
              <button type="button" onClick={()=>setPendingImportFile(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={confirmImport}
                style={{background:'var(--warning)',border:'none',borderRadius:6,color:'var(--bg-app)',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm restore</button>
            </div>
          )}
          {importMsg && <div style={{fontSize:11,color:importMsg.error?'var(--danger)':'var(--success)'}}>{importMsg.text}</div>}
        </div>
      </div>

      <div className="divider"/>

      <div>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.06em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Reset</div>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10}}>Use these if the PWA is showing stale data or won't load correctly.</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {confirmClear === 'data' ? (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--warning)',flex:1}}>This will delete local data and reload — sync will pull it back if connected.</span>
              <button type="button" onClick={()=>setConfirmClear(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={clearLocalData}
                style={{background:'var(--warning)',border:'none',borderRadius:6,color:'var(--bg-app)',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm</button>
            </div>
          ) : (
            <button type="button" onClick={()=>setConfirmClear('data')}
              style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:7,color:'var(--text-secondary)',fontSize:12,padding:'7px 12px',cursor:'pointer',textAlign:'left',fontFamily:'Manrope,sans-serif',transition:'all 120ms'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--warning)';e.currentTarget.style.color='var(--warning)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-strong)';e.currentTarget.style.color='var(--text-secondary)'}}>
              Clear local data &amp; reload
              <span style={{display:'block',fontSize:10,color:'var(--text-muted)',marginTop:1}}>Removes cached app state — re-pulled from D1 on next open</span>
            </button>
          )}

          {confirmClear === 'cache' ? (
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{fontSize:11,color:'var(--danger)',flex:1}}>This unregisters the service worker and clears all caches. App will reload fresh.</span>
              <button type="button" onClick={()=>setConfirmClear(null)} className="btn-ghost" style={{fontSize:11,padding:'4px 10px'}}>Cancel</button>
              <button type="button" onClick={clearCacheAndReload}
                style={{background:'var(--danger)',border:'none',borderRadius:6,color:'#fff',fontSize:11,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Confirm</button>
            </div>
          ) : (
            <button type="button" onClick={()=>setConfirmClear('cache')}
              style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:7,color:'var(--text-secondary)',fontSize:12,padding:'7px 12px',cursor:'pointer',textAlign:'left',fontFamily:'Manrope,sans-serif',transition:'all 120ms'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--danger)';e.currentTarget.style.color='var(--danger)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-strong)';e.currentTarget.style.color='var(--text-secondary)'}}>
              Clear PWA cache &amp; reload
              <span style={{display:'block',fontSize:10,color:'var(--text-muted)',marginTop:1}}>Unregisters service worker and wipes all cached assets — fixes stale PWA installs</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── AdminView ──
   One consolidated settings page instead of separate modals, so notification
   diagnostics/history have a real home instead of being crammed into a
   corner popup. Tab choice is device-local (like theme/background above). */
const ADMIN_TAB_KEY = 'folio_admin_tab';
const ADMIN_TABS = [
  { id: 'notifications', label: 'Notifications' },
  { id: 'prayer',        label: 'Prayer times'  },
  { id: 'appearance',    label: 'Appearance'    },
  { id: 'sync',          label: 'Sync'          },
  { id: 'data',          label: 'Data'          },
];
function AdminView({ state, update, hydrate, replaceState, theme, changeTheme, background, changeBackground, syncStatus, onSync, onConnected, isMobile }) {
  const [tab, setTab] = useState(() => {
    try {
      const t = localStorage.getItem(ADMIN_TAB_KEY);
      return ADMIN_TABS.some(x => x.id === t) ? t : 'notifications';
    } catch { return 'notifications'; }
  });
  const selectTab = id => { setTab(id); try { localStorage.setItem(ADMIN_TAB_KEY, id); } catch {} };

  return (
    <div style={{flex:1,minHeight:0,overflow:'auto'}} className="scrollbar">
      <div style={{maxWidth:760,margin:'0 auto',padding: isMobile ? '20px 16px 40px' : '32px 40px 60px'}}>
        <div style={{fontFamily:'Fraunces,serif',fontSize:22,fontWeight:600,marginBottom:4}}>Admin</div>
        <div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:20}}>Notifications, sync, and how Folio looks.</div>

        <div style={{display:'flex',gap:4,borderBottom:'1px solid var(--border)',marginBottom:24,overflowX:'auto'}}>
          {ADMIN_TABS.map(t=>(
            <button key={t.id} onClick={()=>selectTab(t.id)}
              style={{background:'none',border:'none',borderBottom:`2px solid ${tab===t.id?'var(--accent)':'transparent'}`,color:tab===t.id?'var(--text-primary)':'var(--text-secondary)',fontSize:13,fontWeight:600,padding:'8px 14px',cursor:'pointer',fontFamily:'Manrope,sans-serif',whiteSpace:'nowrap',flexShrink:0,transition:'color 120ms,border-color 120ms'}}>
              {t.label}
            </button>
          ))}
        </div>

        {tab==='notifications' && <NotificationsSettings state={state}/>}
        {tab==='prayer'        && <PrayerSettings state={state} update={update}/>}
        {tab==='appearance'    && <AppearanceSettings theme={theme} onChangeTheme={changeTheme} background={background} onChangeBackground={changeBackground}/>}
        {tab==='sync'          && <SyncSettings onConnected={onConnected} onSync={onSync} syncStatus={syncStatus}/>}
        {tab==='data'          && <DataSettings state={state} hydrate={hydrate} replaceState={replaceState}/>}
      </div>
    </div>
  );
}

/* ── Pomodoro ─────────────────────────────────────────────────────────────── */

function beep(freq = 880, dur = 0.4) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}

/* ── background-capable pomodoro notification ──
   Scheduled the moment a phase starts (not fired live), so it reaches the
   user via the service worker's own timer or — if a push subscription
   exists — via real Web Push, both of which keep working when the tab is
   backgrounded or the app is fully closed. */
function buildPomNotif(pom, task) {
  const title = pom.mode === 'cap'
    ? "Time's up"
    : pom.phase === 'work' ? 'Focus session complete' : "Break's over";
  const body = pom.mode === 'cap'
    ? `Your ${Math.round(pom.workSecs / 60)}m cap on "${task?.title || 'task'}" has ended`
    : pom.phase === 'work'
      ? `Time for a ${Math.round(pom.breakSecs / 60)}m break — ${task?.title || 'your task'}`
      : `Back to focus on ${task?.title || 'your task'}`;
  return { id: 'pomodoro', title, body, fireAt: pom.endsAt, type: 'pomodoro' };
}

async function syncPomodoroPush(notification) {
  try {
    const token = localStorage.getItem('folio_token');
    if (!token || !('serviceWorker' in navigator)) return false;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return false;
    const res = await fetch('/api/push', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ subscription: sub.toJSON(), notification }),
    });
    return res.ok;
  } catch { return false; }
}

function schedulePomodoroNotification(notification) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (navigator.serviceWorker?.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_POMODORO', notification });
  }
  syncPomodoroPush(notification);
}

/* play/pause/resume/start-next share one transition so the task-row button
   and the floating widget never fall out of sync */
function pomPlayClick(pom, setPom, task) {
  if (pom.awaitingStart || pom.paused) {
    const endsAt = Date.now() + pom.remaining * 1000;
    const next = { ...pom, endsAt, paused: false, awaitingStart: false };
    setPom(next);
    schedulePomodoroNotification(buildPomNotif(next, task));
  } else {
    const remaining = Math.max(0, Math.round((pom.endsAt - Date.now()) / 1000));
    setPom({ ...pom, remaining, endsAt: null, paused: true });
    schedulePomodoroNotification(null);
  }
}

function pomStop(pom, setPom, tasks, update, task) {
  if (!pom.awaitingStart && pom.phase === 'work' && task) {
    const remaining = pom.paused ? pom.remaining : Math.max(0, Math.round((pom.endsAt - Date.now()) / 1000));
    const partial = pom.workSecs - remaining;
    if (partial > 30) update('tasks', tasks.map(t => t.id === task.id
      ? { ...t, timeSpent: (t.timeSpent || 0) + partial } : t));
  }
  schedulePomodoroNotification(null);
  setPom(null);
}

function pomSkip(pom, setPom, tasks, update, task) {
  if (pom.phase === 'work') {
    const remaining = pom.paused ? pom.remaining : Math.max(0, Math.round((pom.endsAt - Date.now()) / 1000));
    const partial = pom.workSecs - remaining;
    if (task && partial > 30) update('tasks', tasks.map(t => t.id === task.id
      ? { ...t, pomDone: (t.pomDone || 0) + 1, timeSpent: (t.timeSpent || 0) + partial } : t));
  }
  beep(880, 0.3);
  const nextPhase = pom.phase === 'work' ? 'break' : 'work';
  const nextSecs  = pom.phase === 'work' ? pom.breakSecs : pom.workSecs;
  const endsAt = Date.now() + nextSecs * 1000;
  const next = { ...pom, phase: nextPhase, remaining: nextSecs, endsAt, paused: false, awaitingStart: false,
    sessionsDone: pom.phase === 'work' ? pom.sessionsDone + 1 : pom.sessionsDone };
  setPom(next);
  schedulePomodoroNotification(buildPomNotif(next, task));
}

function PomodoroWidget({ pom, setPom, tasks, update, isMobile }) {
  const task = tasks.find(t => t.id === pom?.taskId);
  const [notifPerm, setNotifPerm] = useState(('Notification' in window) ? Notification.permission : 'denied');

  /* recompute remaining from the wall-clock endsAt — resilient to throttled
     background tabs; also resyncs the instant the tab regains focus */
  useEffect(() => {
    if (!pom || pom.paused || pom.awaitingStart || !pom.endsAt) return;
    const recompute = () => setPom(prev => {
      if (!prev || prev.paused || prev.awaitingStart || !prev.endsAt) return prev;
      const rem = Math.max(0, Math.round((prev.endsAt - Date.now()) / 1000));
      return rem === prev.remaining ? prev : { ...prev, remaining: rem };
    });
    const id = setInterval(recompute, 1000);
    document.addEventListener('visibilitychange', recompute);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', recompute); };
  }, [pom?.paused, pom?.awaitingStart, pom?.endsAt]);

  /* phase ends — don't auto-continue, just bank progress and wait for the user.
     The actual notification was already scheduled (in advance) when this phase
     started, so it fires on time even if this tab never wakes up again. */
  useEffect(() => {
    if (!pom || pom.paused || pom.awaitingStart || pom.remaining !== 0) return;
    if (pom.mode === 'cap') {
      beep(440, 0.8);
      setTimeout(() => beep(440, 0.8), 500);
      if (task) update('tasks', tasks.map(t => t.id === task.id
        ? { ...t, timeSpent: (t.timeSpent || 0) + pom.workSecs } : t));
      setPom(null);
      return;
    }
    const finishedWork = pom.phase === 'work';
    beep(finishedWork ? 880 : 660, finishedWork ? 0.4 : 0.3);
    if (finishedWork && task) {
      update('tasks', tasks.map(t => t.id === task.id
        ? { ...t, pomDone: (t.pomDone || 0) + 1, timeSpent: (t.timeSpent || 0) + pom.workSecs } : t));
    }
    const nextPhase = finishedWork ? 'break' : 'work';
    const nextSecs  = finishedWork ? pom.breakSecs : pom.workSecs;
    setPom(prev => prev ? {
      ...prev, phase: nextPhase, remaining: nextSecs, endsAt: null,
      paused: true, awaitingStart: true,
      sessionsDone: finishedWork ? prev.sessionsDone + 1 : prev.sessionsDone,
    } : prev);
  }, [pom?.remaining, pom?.paused, pom?.awaitingStart]);

  if (!pom) return null;

  const enableNotifs = async () => {
    if (!('Notification' in window)) return;
    const perm = await Notification.requestPermission();
    setNotifPerm(perm);
    if (perm === 'granted' && !pom.paused && !pom.awaitingStart && pom.endsAt) {
      schedulePomodoroNotification(buildPomNotif(pom, task));
    }
  };

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const isCap = pom.mode === 'cap';
  const isWork = pom.phase === 'work';
  const total = isWork ? pom.workSecs : pom.breakSecs;
  const progress = total > 0 ? (total - pom.remaining) / total : 0;
  const accent = isCap ? 'var(--warning)' : (pom.awaitingStart ? 'var(--warning)' : (isWork ? 'var(--accent)' : 'var(--success)'));

  const partialSecs = isWork && !pom.awaitingStart ? (pom.workSecs - pom.remaining) : 0;
  const totalSpentSecs = (task?.timeSpent || 0) + partialSecs;
  const totalSpentMins = totalSpentSecs / 60;
  const hasTimeBlock = !!task?.timeBlock && !isCap;
  const capRatio = hasTimeBlock ? Math.min(1, totalSpentMins / task.timeBlock) : 0;
  const overCap = hasTimeBlock && totalSpentMins >= task.timeBlock;

  const r = 26, circ = 2 * Math.PI * r;
  const dots = Math.min(pom.sessionsDone, 8);
  const badgeLabel = isCap ? 'Time Cap'
    : pom.awaitingStart ? (isWork ? 'Break ready' : 'Focus ready')
    : (isWork ? 'Focus' : 'Break');

  return (
    <div style={{position:'fixed',bottom:isMobile?72:24,right:16,
      background:'var(--modal-bg)',border:`1px solid ${accent}30`,borderRadius:16,
      padding:'14px 16px',width:220,
      boxShadow:`0 8px 32px rgba(0,0,0,.6),0 0 0 1px ${accent}18`,
      zIndex:9000,fontFamily:'Manrope,sans-serif',userSelect:'none'}}>

      {/* header row */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <span style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',
          color:accent,background:`${accent}18`,padding:'2px 8px',borderRadius:99}}>
          {badgeLabel}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:3}}>
          {Array.from({length:dots},(_,i)=>(
            <span key={i} style={{width:5,height:5,borderRadius:99,background:'var(--accent)'}}/>
          ))}
          <button onClick={()=>pomStop(pom,setPom,tasks,update,task)} style={{background:'none',border:'none',color:'var(--text-muted)',
            cursor:'pointer',padding:'2px',lineHeight:1,marginLeft:6}}
            onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--text-muted)'} title="End session">
            <svg style={{width:12,height:12}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      {/* task name */}
      <div style={{fontSize:12,color:'var(--text-primary)',fontWeight:600,marginBottom:12,
        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={task?.title}>
        {task?.title ?? '—'}
      </div>

      {/* progress ring */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',marginBottom:12}}>
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r={r} fill="none" stroke="var(--border)" strokeWidth="5"/>
          <circle cx="32" cy="32" r={r} fill="none" stroke={accent} strokeWidth="5"
            strokeDasharray={circ} strokeDashoffset={circ*(1-progress)}
            strokeLinecap="round" transform="rotate(-90 32 32)"
            style={{transition:'stroke-dashoffset .9s linear'}}/>
          <text x="32" y="37" textAnchor="middle" fill="var(--text-primary)" fontSize="13"
            fontFamily="Manrope,sans-serif" fontWeight="700">{fmt(pom.remaining)}</text>
        </svg>
      </div>

      {/* controls */}
      {pom.awaitingStart ? (
        <button onClick={()=>pomPlayClick(pom,setPom,task)}
          style={{width:'100%',background:`${accent}15`,border:`1px solid ${accent}35`,
            borderRadius:8,color:accent,fontSize:12,padding:'8px 0',marginBottom:hasTimeBlock?12:0,
            cursor:'pointer',fontFamily:'Manrope,sans-serif',fontWeight:700}}>
          ▶ Start {isWork ? 'focus' : 'break'}
        </button>
      ) : (
        <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:hasTimeBlock?12:0}}>
          <button onClick={()=>pomPlayClick(pom,setPom,task)}
            style={{flex:1,background:`${accent}15`,border:`1px solid ${accent}35`,
              borderRadius:8,color:accent,fontSize:12,padding:'7px 0',
              cursor:'pointer',fontFamily:'Manrope,sans-serif',fontWeight:600}}>
            {pom.paused?'▶ Resume':'⏸ Pause'}
          </button>
          {!isCap&&(
            <button onClick={()=>pomSkip(pom,setPom,tasks,update,task)}
              style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:8,
                color:'var(--text-secondary)',fontSize:12,padding:'7px 10px',cursor:'pointer',
                fontFamily:'Manrope,sans-serif'}} title={isWork?'Skip to break':'Skip to focus'}>
              ⏭
            </button>
          )}
        </div>
      )}

      {/* time cap bar */}
      {hasTimeBlock&&(
        <div style={{marginBottom:notifPerm==='default'?10:0}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,
            marginBottom:3,color:overCap?'var(--danger)':'var(--text-secondary)'}}>
            <span>Time cap</span>
            <span>{Math.round(totalSpentMins)}m / {task.timeBlock}m{overCap&&' ⚠'}</span>
          </div>
          <div style={{height:3,borderRadius:99,background:'var(--border)',overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:99,
              width:`${Math.round(capRatio*100)}%`,
              background:overCap?'var(--danger)':capRatio>0.8?'var(--warning)':'var(--success)',
              transition:'width 1s linear'}}/>
          </div>
        </div>
      )}

      {/* background-notification permission hint */}
      {notifPerm==='default'&&(
        <button onClick={enableNotifs}
          style={{width:'100%',background:'none',border:'1px dashed var(--border-strong)',borderRadius:7,
            color:'var(--text-secondary)',fontSize:10.5,padding:'6px 0',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>
          🔔 Enable alerts for background notifications
        </button>
      )}
    </div>
  );
}

/* ── App ── */
function App() {
  const [state, setStateRaw]   = useState(null);
  const [syncStatus, setSyncStatus] = useState('idle'); /* idle|saving|synced|offline|unauth|local */
  const [theme, setTheme]           = useState(() => ThemePref.get());
  const [background, setBackground] = useState(() => BackgroundPref.get());
  const [sidebarOpen, setSidebarOpen] = useState(true);
  /* Full view for the notes editor. Owned here because it also hides the
     sidebar and cover banner, which are rendered at this level. */
  const [fullView, setFullViewRaw] = useState(() => FullViewPref.get());
  const setFullView = useCallback(v => {
    setFullViewRaw(prev => { const next = typeof v === 'function' ? v(prev) : v; FullViewPref.set(next); return next; });
  }, []);

  /* Escape leaves full view. It hides every other navigation affordance, so
     without this a stuck state would need a page reload to escape. Ignored
     while typing, so it can't fire mid-edit. */
  useEffect(() => {
    if (!fullView) return;
    const onKey = e => {
      if (e.key !== 'Escape') return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      setFullView(false);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [fullView, setFullView]);
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
  const saveTimer    = useRef(null);
  const pendingFlush = useRef(null); /* latest unsaved state, cleared on successful D1 write */
  const stateRef     = useRef(null); /* always-current state for syncNow closure */
  const syncingRef   = useRef(false);
  const lastSyncRef  = useRef(0);
  stateRef.current = state;
  const [installBanner, setInstallBanner] = useState(!!window._installPrompt);
  const [pom, setPom] = useState(null);

  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  /* ── theme: device-local, applied via data-theme attribute + CSS vars ── */
  useEffect(() => { applyTheme(theme); }, [theme]);
  const changeTheme = id => { ThemePref.set(id); setTheme(id); };

  /* ── background image/gif: device-local, applied via CSS vars ── */
  useEffect(() => { applyBackground(background); }, [background]);
  const changeBackground = pref => { BackgroundPref.set(pref); setBackground(pref); };

  /* ── section cover banners: synced via state.banners, one per main nav section ── */
  const changeBanner = (sectionId, val) => {
    update('banners', prev => {
      const next = { ...(prev || {}) };
      if (val == null) delete next[sectionId]; else next[sectionId] = val;
      return next;
    });
  };

  useEffect(() => {
    const onReady = () => setInstallBanner(true);
    const onDone  = () => setInstallBanner(false);
    window.addEventListener('installpromptready', onReady);
    window.addEventListener('appinstalled_done', onDone);
    return () => {
      window.removeEventListener('installpromptready', onReady);
      window.removeEventListener('appinstalled_done', onDone);
    };
  }, []);

  useEffect(() => {
    document.body.classList.toggle('pwa-install-banner', installBanner);
    return () => document.body.classList.remove('pwa-install-banner');
  }, [installBanner]);

  /* Full view hides the fixed mobile nav, and #app reserves 56px of bottom
     padding for it — this class reclaims that space (see the CSS). */
  useEffect(() => {
    document.body.classList.toggle('notes-full-view', isNotesFullView(fullView, state, isMobile));
    return () => document.body.classList.remove('notes-full-view');
  }, [fullView, state?.ui?.view, state?.ui?.noteId, state?.notes, isMobile]);

  /* Respect ?view= from manifest shortcuts */
  const VALID_VIEWS = ['today','notes','journal','tasks','calendar','tags','admin'];
  const urlView = new URLSearchParams(location.search).get('view');
  const startView = VALID_VIEWS.includes(urlView) ? urlView : null;

  /* Merge new SEED keys in when DB shape evolves. ui and salah are merged a
     level deeper so newly-added sub-keys (e.g. salah.offsets) reach state
     saved before they existed. */
  const hydrate = d => {
    const seed = SEED();
    const merged = {
      ...seed, ...d,
      ui:    { ...seed.ui,    ...(d?.ui    || {}) },
      salah: { ...seed.salah, ...(d?.salah || {}),
               offsets: { ...seed.salah.offsets, ...(d?.salah?.offsets || {}) } },
    };
    if (startView) merged.ui = { ...merged.ui, view: startView };
    /* one-time migration: banners used to live in a device-local key before they synced */
    if (!merged.banners || Object.keys(merged.banners).length === 0) {
      const legacy = LegacyBannerPrefs.get();
      if (legacy && Object.keys(legacy).length) merged.banners = legacy;
    }
    return merged;
  };

  /* ── merge a local snapshot against a freshly-pulled remote one ──
     Per-item last-write-wins for notes/tasks/meetings/journal (via mergeById, which
     also folds in tombstones so deletions survive a stale save from another device),
     simple "keep local-only extras" for folders (no delete-tracking needed there),
     and a plain union for tags (flat strings, no delete concept at all). */
  const mergeState = (local, remote) => {
    const merged = hydrate(remote);
    TOMBSTONE_COLLECTIONS.forEach(key => {
      const tKey = key + 'Deleted';
      const { items, tombstones } = mergeById(local?.[key], remote?.[key], local?.[tKey], remote?.[tKey]);
      merged[key] = items;
      merged[tKey] = tombstones;
    });
    const remoteFolderIds = new Set((remote?.folders||[]).map(x => x.id));
    const folderExtras = (local?.folders||[]).filter(x => !remoteFolderIds.has(x.id));
    if (folderExtras.length) merged.folders = [...merged.folders, ...folderExtras];
    merged.tags = [...new Set([...(remote?.tags||[]), ...(local?.tags||[])])];
    return merged;
  };

  /* ── initial load ── */
  useEffect(() => { (async () => {
    const cache = Cache.read();
    if (!Sync.configured()) {
      setStateRaw(hydrate(cache));
      setSyncStatus('local');
      return;
    }
    try {
      const remote = await Sync.load();
      const remoteEmpty  = !remote?.notes || remote.notes.length === 0;
      const cacheHasData = cache?.notes?.length > 0;
      if (remoteEmpty && cacheHasData) {
        const hydrated = hydrate(cache);
        await Sync.save(hydrated);
        setStateRaw(hydrated);
      } else if (remoteEmpty) {
        const seeded = hydrate(SEED());
        await Sync.save(seeded);
        setStateRaw(seeded);
      } else {
        // Per-item last-write-wins merge (with tombstones for deletes) between the local
        // cache and the freshly-pulled remote copy
        const merged = mergeState(cache, remote);
        Sync.save(merged).catch(() => {});
        setStateRaw(merged);
      }
      setSyncStatus('synced');
    } catch(e) {
      if (e.message === 'UNAUTHORIZED') {
        Sync.setToken(null);
        const hydrated = hydrate(cache);
        setStateRaw({ ...hydrated, ui: { ...hydrated.ui, view: 'admin' } });
        setSyncStatus('unauth');
      } else {
        setStateRaw(hydrate(cache));
        setSyncStatus('offline');
      }
    }
  })(); }, []);

  /* ── reload state from server after token is saved in Admin → Sync ── */
  const handleSyncConnected = useCallback(async (remote) => {
    const cache = Cache.read();
    const remoteEmpty = !remote?.notes || remote.notes.length === 0;
    const cacheHasData = cache?.notes?.length > 0;
    if (remoteEmpty && cacheHasData) {
      const hydrated = hydrate(cache);
      await Sync.save(hydrated);
      setStateRaw(hydrated);
    } else if (!remoteEmpty) {
      const merged = mergeState(cache, remote);
      await Sync.save(merged);
      setStateRaw(merged);
    }
    setSyncStatus('synced');
  }, []);

  /* ── reschedule notifications whenever meetings or salah settings change ── */
  useEffect(() => {
    if (state?.meetings) scheduleNotifications(state);
  }, [state?.meetings, state?.salah]);

  /* Back-fills the SW-readable token cache for devices that connected before
     mirrorTokenToSW existed (it's normally kept current by Sync.setToken). */
  useEffect(() => { mirrorTokenToSW(Sync.getToken()); }, []);

  /* ── keep ui.timezone current ──
     The cron Worker has no local timezone of its own, so it builds every
     reminder time in this zone. Detected rather than asked for, and refreshed
     when it changes (travel, or the first load after this field was added) so
     reminders follow you instead of staying pinned to where you set it up. */
  useEffect(() => {
    if (!state?.ui) return;
    let tz = null;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch {}
    if (tz && state.ui.timezone !== tz) update('ui', { ...state.ui, timezone: tz });
  }, [state?.ui?.timezone]);

  /* ── adhan: play audio when SW messages PLAY_ADHAN (app in foreground) ── */
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    const handler = e => {
      if (e.data?.type !== 'PLAY_ADHAN') return;
      try {
        const ac = new AudioContext();
        [[440, 0], [554, 0.45], [659, 0.9], [554, 1.35], [440, 1.8]].forEach(([freq, t]) => {
          const osc = ac.createOscillator(); const g = ac.createGain();
          osc.connect(g); g.connect(ac.destination);
          osc.frequency.value = freq; osc.type = 'sine';
          g.gain.setValueAtTime(0, ac.currentTime + t);
          g.gain.linearRampToValueAtTime(0.28, ac.currentTime + t + 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.9);
          osc.start(ac.currentTime + t); osc.stop(ac.currentTime + t + 0.9);
        });
      } catch {}
    };
    navigator.serviceWorker.addEventListener('message', handler);
    return () => navigator.serviceWorker.removeEventListener('message', handler);
  }, []);

  /* ── reschedule notifications when app comes back to foreground ── */
  useEffect(() => {
    if (!state?.meetings) return;
    const onVisible = () => { if (document.visibilityState === 'visible') scheduleNotifications(state); };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [state?.meetings, state?.salah]);

  /* ── flush pending D1 write before the page is hidden/unloaded ── */
  useEffect(() => {
    const flush = () => {
      if (!pendingFlush.current) return;
      clearTimeout(saveTimer.current);
      Sync.save(pendingFlush.current, { keepalive: true }).catch(() => {});
      pendingFlush.current = null;
    };
    const onVisibility = () => { if (document.visibilityState === 'hidden') flush(); };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pagehide', flush);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('pagehide', flush);
    };
  }, []);

  /* ── manual / auto sync-now: pull remote, merge local extras, push if needed ── */
  const syncNow = useCallback(async () => {
    if (!Sync.configured()) {
      setStateRaw(prev => prev && ({ ...prev, ui: { ...prev.ui, view: 'admin' } }));
      return;
    }
    if (syncingRef.current) return;
    syncingRef.current = true;
    clearTimeout(saveTimer.current);
    const pending = pendingFlush.current;
    setSyncStatus('syncing');
    try {
      /* One authoritative round-trip: the server merges what we send into the
         stored blob and hands back the result. The old load → merge-locally →
         save sequence had a race in the gap — another device writing between
         our GET and PUT was silently overwritten.
         Any pending debounced write is subsumed by this one: it's an older
         snapshot of the very state we're about to push. */
      const res = await Sync.save(stateRef.current, { wantMerged: true });
      if (pendingFlush.current === pending) pendingFlush.current = null;
      const merged = hydrate(res?.data || stateRef.current);
      Cache.write(merged);
      setStateRaw(merged);
      lastSyncRef.current = Date.now();
      setSyncStatus('synced');
    } catch(e) {
      setSyncStatus(e.message === 'UNAUTHORIZED' ? 'unauth' : 'offline');
    } finally {
      syncingRef.current = false;
    }
  }, []);

  /* ── cheap "has anything changed?" pull, for waking the app ──
     A conditional GET costs one 304 when nothing moved, where a full syncNow
     would upload the entire state. Only escalates to a real sync when there
     are unsaved local edits or the server actually has something newer. */
  const pullIfChanged = useCallback(async () => {
    if (!Sync.configured() || syncingRef.current) return;
    if (pendingFlush.current) { syncNow(); return; }
    syncingRef.current = true;
    try {
      const remote = await Sync.load({ conditional: true });
      lastSyncRef.current = Date.now();
      if (remote) {
        const merged = mergeState(stateRef.current, remote);
        Cache.write(merged);
        setStateRaw(merged);
      }
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus(e.message === 'UNAUTHORIZED' ? 'unauth' : 'offline');
    } finally {
      syncingRef.current = false;
    }
  }, [syncNow]);

  /* ── auto-pull when app comes to foreground (critical for iPad PWA) ── */
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState !== 'visible') return;
      if (!Sync.configured()) return;
      if (Date.now() - lastSyncRef.current < 30000) return; /* throttle: 30s minimum */
      pullIfChanged();
    };
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onVisible);
    return () => {
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', onVisible);
    };
  }, [pullIfChanged]);

  /* ── update: write localStorage immediately, debounce D1 by 1.5s ── */
  const update = useCallback((key, val) => {
    setStateRaw(prev => {
      const next = typeof val === 'function'
        ? { ...prev, [key]: val(prev[key]) }
        : { ...prev, [key]: val };
      Cache.write(next);
      if (Sync.configured()) {
        pendingFlush.current = next;
        setSyncStatus('saving');
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            await Sync.save(next);
            pendingFlush.current = null;
            setSyncStatus('synced');
          } catch(e) {
            setSyncStatus(e.message === 'UNAUTHORIZED' ? 'unauth' : 'offline');
          }
        }, 1500);
      }
      return next;
    });
  }, []);

  /* Whole-state replace for Admin → Data → Import, which restores a full
     backup rather than editing one key — same write/debounce path as
     `update` above, just skipping the per-key merge. */
  const replaceState = useCallback((next) => {
    Cache.write(next);
    setStateRaw(next);
    if (Sync.configured()) {
      pendingFlush.current = next;
      setSyncStatus('saving');
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        try {
          await Sync.save(next);
          pendingFlush.current = null;
          setSyncStatus('synced');
        } catch(e) {
          setSyncStatus(e.message === 'UNAUTHORIZED' ? 'unauth' : 'offline');
        }
      }, 1500);
    }
  }, []);

  if (!state) return (
    <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'var(--text-muted)'}}>
      <img src="/folio-icon.svg" alt="" style={{width:30,height:30,borderRadius:7}}/>
      <span style={{fontSize:13,fontFamily:'Manrope,sans-serif'}}>Loading Folio…</span>
    </div>
  );

  const views = { today:TodayView, notes:NotesView, journal:JournalView, tasks:TasksView, calendar:CalendarView, tags:TagsView, folders:FoldersView, admin:AdminView };
  const View  = views[state.ui.view] || TodayView;

  const notesFullView = isNotesFullView(fullView, state, isMobile);
  /* On mobile, opening a note already goes full-bleed (see the isMobile branch
     in NotesView) — the section cover banner above it just adds scroll
     distance before reaching the note itself, for no benefit since the note's
     own title/emoji is already the visual header at that point. Sidebar and
     MobileNav stay put here (unlike notesFullView) — they're not what's
     eating vertical space, and MobileNav in particular is the fallback way
     out of the editor. */
  const mobileNoteOpen = isMobile && state.ui.view === 'notes' && !!state.ui.noteId
    && (state.notes || []).some(n => n.id === state.ui.noteId);

  return (
    <div style={{isolation:'isolate',display:'flex',width:'100%',height:'100%',minWidth:0,overflow:'hidden'}}>
      <div id="app-bg-image"/>
      <div id="app-bg-scrim"/>
      {!notesFullView && (
        <Sidebar state={state} update={update} syncStatus={syncStatus}
          onSync={syncNow} collapsed={!sidebarOpen} onToggle={()=>setSidebarOpen(v=>!v)}/>
      )}
      <div className="main">
        {!notesFullView && !mobileNoteOpen && state.ui.view!=='admin' && (
          <SectionBanner sectionId={state.ui.view} banner={state.banners?.[state.ui.view]} onChange={v=>changeBanner(state.ui.view,v)} isMobile={isMobile}/>
        )}
        <div style={{flex:1,minHeight:0,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          <View state={state} update={update} isMobile={isMobile} pom={pom} setPom={setPom}
            fullView={fullView} setFullView={setFullView}
            hydrate={hydrate} replaceState={replaceState}
            theme={theme} changeTheme={changeTheme} background={background} changeBackground={changeBackground}
            syncStatus={syncStatus} onSync={syncNow} onConnected={handleSyncConnected}/>
        </div>
      </div>
      {!notesFullView && (
        <MobileNav state={state} update={update} syncStatus={syncStatus}/>
      )}
      {background?.source==='unsplash' && background?.attribution && <UnsplashCredit attribution={background.attribution}/>}
      {installBanner && <InstallBanner/>}
      <PomodoroWidget pom={pom} setPom={setPom} tasks={state.tasks} update={update} isMobile={isMobile}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
