  const [pushToast,  setPushToast]  = useState(null); /* null | 'active' | 'foreground' */
  const [editModal,  setEditModal]  = useState(null);
  const [editForm,   setEditForm]   = useState(BLANK_FORM);
  const [editScope,  setEditScope]  = useState('all');
  const [confirmDel, setConfirmDel] = useState(null);
  const [nowTick, setNowTick] = useState(Date.now());

  useEffect(() => {
    if (notifPerm !== 'granted' || !('serviceWorker' in navigator)) {
      setPushActive(false); return;
    }
    navigator.serviceWorker.ready
      .then(reg => reg.pushManager.getSubscription())
      .then(sub => setPushActive(!!sub))
      .catch(() => setPushActive(false));
  }, [notifPerm]);

  const requestNotifPerm = async () => {
    if (!('Notification' in window)) return;
    const perm = await Notification.requestPermission();
    setNotifPerm(perm);
    if (perm !== 'granted') return;
    scheduleNotifications(state);
    const ok = await activatePush();
    if (ok) setPushActive(true);
    setPushToast(ok ? 'active' : 'foreground');
    setTimeout(() => setPushToast(null), 5000);
  };

  const calDate = state.ui.calDate ? parseKey(state.ui.calDate) : new Date();
  const selDate = state.ui.calDate || todayKey();
  const { times: selSalahTimes } = useSalahTimes(selDate, state.salah);

  const year = calDate.getFullYear(), month = calDate.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const today = todayKey();
  const isToday = selDate === today;

  useEffect(() => {
    if (!isToday) return;
    const id = setInterval(() => setNowTick(Date.now()), 30000);
    return () => clearInterval(id);
  }, [isToday]);

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));

  const meetingsOnDay = d => state.meetings.filter(m => occursOnDay(m, d));
  const selDayMeetings = meetingsOnDay(parseKey(selDate)).sort((a,b)=>a.time.localeCompare(b.time));

  const nav = dir => { const d=new Date(year,month+dir,1); update('ui',{...state.ui,calDate:fmtKey(d)}); };

  const resetForm = () => {
    /* default weekly days to the day-of-week of the selected date */
    setForm({...BLANK_FORM, recurrenceDays:[parseKey(selDate).getDay()]});
  };
  const openModal = () => { resetForm(); setShowModal(true); };

  const addMeeting = e => {
    e.preventDefault();
    if(!form.title.trim()) return;
    const m = {
      id: uid(),
      title: form.title, time: form.time, duration: form.duration,
      attendees: form.attendees, date: selDate, noteId: '',
      recurrence: form.recurrence,
      recurrenceDays: form.recurrence==='weekly' ? form.recurrenceDays : [],
      recurrenceEnd: form.recurrence!=='none' ? form.recurrenceEnd : '',
      updated: Date.now(),
    };
    update('meetings',[...state.meetings, m]);
    setShowModal(false);
  };

  const openMeetingNote = m => {
    const recLine = recurLabel(m) ? `\n**Recurrence:** ${recurLabel(m)}${m.recurrenceEnd?' until '+m.recurrenceEnd:''}` : '';
    const body = `## Attendees\n${m.attendees||'—'}\n\n## Agenda\n- \n\n## Notes\n\n## Action Items\n- [ ] ${recLine}`;
    const n = { id:uid(), emoji:'🗓', title:`${m.title} — ${selDate}`, body, tags:['#meeting'], links:[], images:[], created:Date.now(), updated:Date.now() };
    update('notes',[n,...state.notes]);
    update('meetings',state.meetings.map(x=>x.id===m.id?{...x,noteId:n.id,updated:Date.now()}:x));
    update('ui',{...state.ui,view:'notes',noteId:n.id});
  };

  const openEditMeeting = m => {
    setEditModal(m);
    setEditScope('all');
    setEditForm({
      title:m.title, time:m.time, duration:m.duration, attendees:m.attendees||'',
      recurrence:m.recurrence||'none', recurrenceDays:m.recurrenceDays||[],
      recurrenceEnd:m.recurrenceEnd||'',
    });
  };

  const submitEditMeeting = e => {
    e.preventDefault();
    if (!editForm.title.trim()) return;
    const m = editModal;
    const isRecurring = m.recurrence && m.recurrence !== 'none';
    const updates = {
      title:editForm.title, time:editForm.time, duration:editForm.duration,
      attendees:editForm.attendees,
      recurrence:editForm.recurrence,
      recurrenceDays:editForm.recurrence==='weekly'?editForm.recurrenceDays:[],
      recurrenceEnd:editForm.recurrence!=='none'?editForm.recurrenceEnd:'',
    };
    if (isRecurring && editScope==='one' && !m.exceptionDate) {
      const exception = {...m,...updates, id:uid(), exceptionDate:selDate, editedFrom:m.editedFrom||m.id, recurrence:'none', recurrenceDays:[], recurrenceEnd:'', updated:Date.now()};
      const origId = m.editedFrom || m.id;
      const updatedList = state.meetings.map(x=>x.id===origId?{...x,exceptions:[...(x.exceptions||[]),selDate],updated:Date.now()}:x);
      update('meetings',[...updatedList, exception]);
    } else {
      update('meetings', state.meetings.map(x=>x.id===m.id?{...x,...updates,updated:Date.now()}:x));
    }
    setEditModal(null);
  };

  const tombstoneMeetings = ids => update('meetingsDeleted', [...(state.meetingsDeleted||[]), ...ids.map(id => ({ id, deletedAt: Date.now() }))]);

  const handleDeleteClick = m => {
    const isRecurring = (m.recurrence && m.recurrence !== 'none') || m.exceptionDate;
    if (!isRecurring) {
      if (confirm(`Delete "${m.title}"?`)) {
        update('meetings', state.meetings.filter(x=>x.id!==m.id));
        tombstoneMeetings([m.id]);
      }
      return;
    }
    setConfirmDel(m.id === confirmDel ? null : m.id);
  };

  const doDeleteOne = m => {
    if (m.exceptionDate) {
      update('meetings', state.meetings.filter(x=>x.id!==m.id));
      tombstoneMeetings([m.id]);
    } else {
      update('meetings', state.meetings.map(x=>x.id===m.id?{...x,exceptions:[...(x.exceptions||[]),selDate],updated:Date.now()}:x));
    }
    setConfirmDel(null);
  };

  const doDeleteAll = m => {
    const origId = m.editedFrom || m.id;
    const removedIds = state.meetings.filter(x=>x.id===origId || x.editedFrom===origId).map(x=>x.id);
    update('meetings', state.meetings.filter(x=>x.id!==origId && x.editedFrom!==origId));
    tombstoneMeetings(removedIds);
    setConfirmDel(null);
  };

  /* toolbar toggle style helper */
  const tog = active => ({
    flex:1, padding:'6px 4px', borderRadius:6, fontSize:11.5, fontWeight:600,
    cursor:'pointer', border:'1px solid', transition:'all 110ms',
    background: active ? 'var(--accent)' : 'transparent',
    borderColor: active ? 'var(--accent)' : 'var(--border)',
    color: active ? '#fff' : 'var(--text-secondary)',
  });

  return (
    <div style={{display:'flex',flex:1,overflow:'hidden',flexDirection:isMobile?'column':'row'}}>

      {/* ── month grid ── */}
      <div style={{flex:1,padding:isMobile?'10px 6px':'24px 24px 24px 40px',overflow:isMobile?'visible':'auto',minWidth:0}} className={isMobile?undefined:'scrollbar'}>
        <div style={{display:'flex',alignItems:'center',gap:isMobile?6:16,marginBottom:isMobile?10:20,flexWrap:isMobile?'wrap':'nowrap'}}>
          <button onClick={()=>nav(-1)} style={{background:'none',border:'1px solid var(--border)',borderRadius:7,color:'var(--text-secondary)',padding:'5px 10px',cursor:'pointer',fontSize:16,flexShrink:0}}>‹</button>
          <h2 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?16:22,fontWeight:600,flex:1,minWidth:0}}>{MONTHS[month]} {year}</h2>
          <button onClick={()=>nav(1)} style={{background:'none',border:'1px solid var(--border)',borderRadius:7,color:'var(--text-secondary)',padding:'5px 10px',cursor:'pointer',fontSize:16,flexShrink:0}}>›</button>
          <button onClick={()=>update('ui',{...state.ui,calDate:today})} style={{background:'none',border:'1px solid var(--border)',borderRadius:7,color:'var(--text-secondary)',padding:'5px 10px',cursor:'pointer',fontSize:isMobile?11:12,flexShrink:0}}>Today</button>
          <button onClick={requestNotifPerm}
            title={notifPerm!=='granted'?'Enable alerts':pushActive?'Background push active':'Alerts on (foreground only)'}
            style={{background:notifPerm==='granted'?(pushActive?'rgba(245,158,11,0.12)':'rgba(16,185,129,0.08)'):'none',
              border:`1px solid ${notifPerm==='granted'?(pushActive?'rgba(245,158,11,.45)':'rgba(16,185,129,.4)'):'var(--border)'}`,
              borderRadius:7,color:notifPerm==='granted'?(pushActive?'var(--warning)':'var(--success)'):'var(--text-muted)',
              padding:'5px 8px',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:4,transition:'all 120ms'}}>
            <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            {notifPerm==='granted' && pushActive && <span style={{fontSize:9,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase'}}>BG</span>}
          </button>
        </div>
        {pushToast && (
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',borderRadius:8,marginBottom:12,
            background:pushToast==='active'?'rgba(245,158,11,0.08)':'rgba(16,185,129,0.07)',
            border:`1px solid ${pushToast==='active'?'rgba(245,158,11,0.25)':'rgba(16,185,129,0.25)'}`,
            color:pushToast==='active'?'var(--warning)':'var(--success)',fontSize:12,animation:'fadeIn 200ms ease'}}>
            <svg style={{width:13,height:13,flexShrink:0}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            {pushToast==='active'
              ? 'Background alerts active — you\'ll be notified even when the app is closed'
              : 'Alerts on (open app only) — connect sync to enable background alerts'}
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:isMobile?2:4,marginBottom:isMobile?3:6}}>
          {DAY_SHORT.map(d=><div key={d} style={{fontSize:isMobile?9:11,color:'var(--text-muted)',textAlign:'center',fontWeight:600,padding:'4px 0'}}>{isMobile?d[0]:d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:isMobile?2:4}}>
          {cells.map((d,i)=> d===null ? <div key={`e${i}`}/> : (
            <div key={d.toISOString()} className={`cal-cell${fmtKey(d)===today?' today':''}${fmtKey(d)===selDate?' sel':''}`}
              onClick={()=>update('ui',{...state.ui,calDate:fmtKey(d)})}>
              <div style={{fontSize:isMobile?10:12,fontWeight:fmtKey(d)===today?700:400,color:fmtKey(d)===today?'var(--accent)':'var(--text-tertiary)',marginBottom:2}}>{d.getDate()}</div>
              {meetingsOnDay(d).slice(0,3).map((m,idx)=>(
                <div key={m.id+idx} style={{display:'flex',alignItems:'center',gap:2,marginBottom:2}}>
                  <div style={{width:'60%',height:isMobile?3:4,borderRadius:3,background: m.recurrence&&m.recurrence!=='none' ? 'var(--success)' : 'var(--accent)'}}/>
                  {!isMobile&&m.recurrence&&m.recurrence!=='none'&&<span style={{fontSize:8,color:'var(--success)'}}>↻</span>}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>

      {/* resize handle — desktop only */}
      {!isMobile && (
        <div className="resize-handle"
          onMouseDown={e=>{
            const startX=e.clientX, startW=panelWidth;
            const onMove=mv=>setPanelWidth(Math.max(200,Math.min(520,startW-(mv.clientX-startX))));
            const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.body.style.cursor='';document.body.style.userSelect='';};
            document.body.style.cursor='col-resize';document.body.style.userSelect='none';
            document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);e.preventDefault();
          }}
        />
      )}

      {/* ── day panel ── */}
      <div style={{width:isMobile?'100%':panelWidth,borderLeft:isMobile?'none':'1px solid var(--border)',borderTop:isMobile?'1px solid var(--border)':'none',display:'flex',flexDirection:'column',overflow:'hidden',flexShrink:0,minHeight:isMobile?160:undefined}}>
        <div style={{padding:'20px 16px 12px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <div style={{fontFamily:'Fraunces,serif',fontSize:16,fontWeight:600,marginBottom:2}}>
            {selDate===today ? 'Today' : parseKey(selDate).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}
          </div>
          <button className="btn-primary" onClick={openModal} style={{fontSize:12,padding:'5px 12px',marginTop:10,width:'100%'}}>+ Add meeting</button>
        </div>
        <div style={{flex:1,overflow:'auto',padding:'12px'}} className="scrollbar">
          {/* ── unified day timeline ── */}
          {(()=>{
            const tItems=[];
            if(state.salah?.enabled&&state.salah?.lat!==null&&selSalahTimes){
              const pt=selSalahTimes;
              PRAYER_NAMES.filter(p=>state.salah.prayers?.[p]!==false).forEach(p=>{
                const t=pt[p];if(!t||t==='--:--')return;
                const [h,m]=t.split(':').map(Number);
                tItems.push({type:'prayer',key:`p-${p}`,mins:h*60+m,time:t,label:PRAYER_LABELS[p]});
              });
            }
            selDayMeetings.forEach(m=>{
              const [h,mi]=(m.time||'00:00').split(':').map(Number);
              tItems.push({type:'meeting',key:m.id,mins:h*60+mi,meeting:m});
            });
            tItems.sort((a,b)=>a.mins-b.mins);
            let nowMins=null;
            if(isToday){
              const d=new Date(nowTick);
              nowMins=d.getHours()*60+d.getMinutes();
              tItems.push({type:'now',key:'now',mins:nowMins});
              tItems.sort((a,b)=>a.mins-b.mins);
            }
            if(!tItems.length)return <div style={{color:'var(--text-muted)',fontSize:12,padding:'8px 4px'}}>Nothing scheduled.</div>;
            return (
              <div style={{position:'relative',paddingLeft:4}}>
                <div style={{position:'absolute',left:15,top:14,bottom:14,width:1,background:'var(--border)',zIndex:0}}/>
                {tItems.map((item,idx)=>{
                  if(item.type==='now'){
                    const upcoming=tItems.slice(idx+1).find(x=>x.type!=='now');
                    let countdown=null;
                    if(upcoming){
                      const diff=upcoming.mins-item.mins;
                      const h=Math.floor(diff/60), mn=diff%60;
                      const label=upcoming.type==='prayer'?upcoming.label:upcoming.meeting.title;
                      countdown=`${h>0?h+'h ':''}${mn}m until ${label}`;
                    }
                    const nowLabel=new Date(nowTick).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
                    return(
                      <div key="now" style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,position:'relative'}}>
                        <div style={{width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,zIndex:1,position:'relative'}}>
                          <span style={{position:'absolute',width:14,height:14,borderRadius:'50%',background:'var(--danger)',animation:'ping 1.8s cubic-bezier(0,0,.2,1) infinite'}}/>
                          <span style={{width:9,height:9,borderRadius:'50%',background:'var(--danger)',position:'relative',boxShadow:'0 0 0 3px var(--modal-bg)'}}/>
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
                            <span style={{fontSize:11,fontWeight:700,color:'var(--danger)',fontFamily:'"JetBrains Mono",monospace'}}>{nowLabel}</span>
                            <span style={{fontSize:11.5,color:'var(--danger)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}}>Now</span>
                          </div>
                          <div style={{fontSize:11,color:countdown?'var(--text-secondary)':'var(--text-muted)',marginTop:1}}>
                            {countdown||'Nothing else scheduled today'}
                          </div>
                        </div>
                      </div>
                    );
                  }
                  if(item.type==='prayer')return(
                    <div key={item.key} style={{display:'flex',alignItems:'center',gap:10,marginBottom:9,position:'relative'}}>
                      <div style={{width:22,height:22,borderRadius:'50%',background:'rgba(245,158,11,0.14)',border:'1.5px solid rgba(245,158,11,0.42)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,zIndex:1}}>
                        <svg style={{width:9,height:9}} viewBox="0 0 24 24" fill="none" stroke="var(--warning)" strokeWidth="2.5" strokeLinecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{fontSize:11,fontWeight:700,color:'var(--warning)',fontFamily:'"JetBrains Mono",monospace',minWidth:37}}>{item.time}</span>
                        <span style={{fontSize:12,color:'#c9b97a',fontWeight:600}}>{item.label}</span>
                      </div>
                    </div>
                  );
                  const m=item.meeting,recLabel=recurLabel(m),isDelConf=confirmDel===m.id;
                  return(
                    <div key={item.key} style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:12,position:'relative'}}>
                      <div style={{width:22,height:22,borderRadius:'50%',background:recLabel?'rgba(16,185,129,0.12)':'rgba(129,140,248,0.12)',border:`1.5px solid ${recLabel?'rgba(16,185,129,0.4)':'rgba(129,140,248,0.4)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,zIndex:1}}>
                        <div style={{width:6,height:6,borderRadius:'50%',background:recLabel?'var(--success)':'var(--accent)'}}/>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                          <div style={{minWidth:0,flex:1}}>
                            <div style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>
                              <span style={{fontSize:11,fontWeight:700,color:'var(--text-secondary)',fontFamily:'"JetBrains Mono",monospace'}}>{m.time}</span>
                              <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',wordBreak:'break-word'}}>{m.title}</span>
                            </div>
                            <div style={{fontSize:11,color:'var(--text-secondary)',marginTop:1}}>{m.duration} min{m.attendees?` · ${m.attendees}`:''}</div>
                            {recLabel&&<div style={{display:'flex',alignItems:'center',gap:4,marginTop:3}}><span style={{fontSize:10,color:'var(--success)',fontWeight:700}}>↻</span><span style={{fontSize:11,color:'var(--success)'}}>{recLabel}{m.recurrenceEnd?` · until ${m.recurrenceEnd}`:''}</span></div>}
                            {m.exceptionDate&&<div style={{fontSize:10,color:'var(--warning)',marginTop:2}}>Edited occurrence</div>}
                          </div>
                          <div style={{display:'flex',gap:4,marginLeft:8,flexShrink:0,alignItems:'center'}}>
                            <button onClick={()=>openEditMeeting(m)} title="Edit meeting"
                              style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',padding:'2px',display:'flex',alignItems:'center',transition:'color 120ms'}}
                              onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                              onMouseLeave={e=>e.currentTarget.style.color='var(--text-muted)'}>
                              <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onClick={()=>handleDeleteClick(m)} title="Delete meeting"
                              style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',padding:'2px',display:'flex',alignItems:'center',transition:'color 120ms'}}
                              onMouseEnter={e=>e.currentTarget.style.color='var(--danger)'}
                              onMouseLeave={e=>e.currentTarget.style.color='var(--text-muted)'}>
                              <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                          </div>
                        </div>
                        {isDelConf&&(
                          <div style={{marginTop:8,padding:'8px 10px',background:'#0f0f13',borderRadius:7,border:'1px solid var(--border-strong)'}}>
                            <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:6}}>Delete recurring meeting:</div>
                            <div style={{display:'flex',gap:5}}>
                              <button onClick={()=>doDeleteOne(m)} style={{flex:1,background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',borderRadius:6,color:'var(--warning)',fontSize:11,padding:'5px 4px',cursor:'pointer',fontFamily:'Manrope,sans-serif',fontWeight:600}}>This occurrence</button>
                              <button onClick={()=>doDeleteAll(m)} style={{flex:1,background:'rgba(244,63,94,.1)',border:'1px solid rgba(244,63,94,.3)',borderRadius:6,color:'var(--danger)',fontSize:11,padding:'5px 4px',cursor:'pointer',fontFamily:'Manrope,sans-serif',fontWeight:600}}>All occurrences</button>
                              <button onClick={()=>setConfirmDel(null)} style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',fontSize:11,padding:'5px 8px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Cancel</button>
                            </div>
                          </div>
                        )}
                        <button onClick={()=>openMeetingNote(m)}
                          style={{marginTop:6,background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--accent)',fontSize:11.5,padding:'4px 10px',cursor:'pointer',width:'100%'}}>
                          {m.noteId?'Open meeting note':'Create meeting note'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>
      </div>

      {/* ── add meeting modal ── */}
      {showModal&&(
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)setShowModal(false)}}>
          <div className="modal fadeUp" style={{maxHeight:'90vh',overflowY:'auto'}}>
            <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'var(--modal-bg)',zIndex:1}}>
              <span style={{fontFamily:'Fraunces,serif',fontSize:17,fontWeight:600}}>New meeting</span>
              <button onClick={()=>setShowModal(false)} style={{background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:20}}>×</button>
            </div>
            <form onSubmit={addMeeting} style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}}>

              {/* title */}
              <div>
                <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Title</label>
                <input className="input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Meeting title" autoFocus required/>
              </div>

              {/* time + duration */}
              <div style={{display:'flex',gap:12}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Time</label>
                  <input type="time" className="input" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/>
                </div>
                <div style={{flex:1}}>
                  <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Duration (min)</label>
                  <input type="number" className="input" value={form.duration} min={5} max={480} onChange={e=>setForm({...form,duration:+e.target.value})}/>
                </div>
              </div>

              {/* attendees */}
              <div>
                <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Attendees</label>
                <input className="input" value={form.attendees} onChange={e=>setForm({...form,attendees:e.target.value})} placeholder="Names or emails"/>
              </div>

              {/* recurrence type */}
              <div>
                <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:8}}>Recurrence</label>
                <div style={{display:'flex',gap:6}}>
                  {['none','daily','weekly','monthly'].map(r=>(
                    <button type="button" key={r} onClick={()=>{
                      const days = r==='weekly' ? [parseKey(selDate).getDay()] : [];
                      setForm({...form, recurrence:r, recurrenceDays:days});
                    }} style={tog(form.recurrence===r)}>
                      {r==='none'?'None':r[0].toUpperCase()+r.slice(1)}
                    </button>
                  ))}
                </div>

                {/* weekly day picker */}
                {form.recurrence==='weekly' && (
                  <div style={{marginTop:10}}>
                    <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:6}}>Repeats on</div>
                    <div style={{display:'flex',gap:5}}>
                      {DAY_SHORT.map((day,i)=>{
                        const on = (form.recurrenceDays||[]).includes(i);
                        return (
                          <button type="button" key={i} onClick={()=>{
                            const days = on
                              ? form.recurrenceDays.filter(d=>d!==i)
                              : [...(form.recurrenceDays||[]),i];
                            setForm({...form,recurrenceDays:days});
                          }} style={{...tog(on),flex:1,padding:'5px 0',fontSize:11}}>
                            {day[0]}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* end date */}
                {form.recurrence!=='none' && (
                  <div style={{marginTop:12}}>
                    <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>
                      End date <span style={{color:'var(--text-muted)'}}>(optional)</span>
                    </label>
                    <input type="date" className="input" value={form.recurrenceEnd}
                      onChange={e=>setForm({...form,recurrenceEnd:e.target.value})}
                      min={selDate}/>
                  </div>
                )}
              </div>

              <div style={{display:'flex',gap:8,justifyContent:'flex-end',paddingTop:4}}>
                <button type="button" className="btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
                <button type="submit" className="btn-primary">Add meeting</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ── edit meeting modal ── */}
      {editModal&&(
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget){setEditModal(null);setConfirmDel(null);}}}>
          <div className="modal fadeUp" style={{maxHeight:'90vh',overflowY:'auto'}}>
            <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,background:'var(--modal-bg)',zIndex:1}}>
              <span style={{fontFamily:'Fraunces,serif',fontSize:17,fontWeight:600}}>Edit meeting</span>
              <button onClick={()=>setEditModal(null)} style={{background:'none',border:'none',color:'var(--text-secondary)',cursor:'pointer',fontSize:20}}>×</button>
            </div>

            {/* scope selector for recurring meetings */}
            {editModal.recurrence && editModal.recurrence!=='none' && !editModal.exceptionDate && (
              <div style={{padding:'12px 24px',borderBottom:'1px solid var(--border)',background:'#0f0f13'}}>
                <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:8}}>Recurring meeting — save changes for:</div>
                <div style={{display:'flex',gap:6}}>
                  {[['all','All occurrences'],['one','This occurrence only']].map(([v,l])=>(
                    <button type="button" key={v} onClick={()=>setEditScope(v)} style={tog(editScope===v)}>{l}</button>
                  ))}
                </div>
                {editScope==='one'&&<div style={{fontSize:10,color:'var(--text-secondary)',marginTop:6}}>Creates a separate entry for {selDate} only.</div>}
              </div>
            )}

            <form onSubmit={submitEditMeeting} style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}}>
              <div>
                <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Title</label>
                <input className="input" value={editForm.title} onChange={e=>setEditForm({...editForm,title:e.target.value})} autoFocus required/>
              </div>
              <div style={{display:'flex',gap:12}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Time</label>
                  <input type="time" className="input" value={editForm.time} onChange={e=>setEditForm({...editForm,time:e.target.value})}/>
                </div>
                <div style={{flex:1}}>
                  <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Duration (min)</label>
                  <input type="number" className="input" value={editForm.duration} min={5} max={480} onChange={e=>setEditForm({...editForm,duration:+e.target.value})}/>
                </div>
              </div>
              <div>
                <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Attendees</label>
                <input className="input" value={editForm.attendees} onChange={e=>setEditForm({...editForm,attendees:e.target.value})} placeholder="Names or emails"/>
              </div>
              {editScope==='all' && (
                <div>
                  <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:8}}>Recurrence</label>
                  <div style={{display:'flex',gap:6}}>
                    {['none','daily','weekly','monthly'].map(r=>(
                      <button type="button" key={r} onClick={()=>{
                        const days=r==='weekly'?(editForm.recurrenceDays.length?editForm.recurrenceDays:[parseKey(selDate).getDay()]):[];
                        setEditForm({...editForm,recurrence:r,recurrenceDays:days});
                      }} style={tog(editForm.recurrence===r)}>
                        {r==='none'?'None':r[0].toUpperCase()+r.slice(1)}
                      </button>
                    ))}
                  </div>
                  {editForm.recurrence==='weekly'&&(
                    <div style={{marginTop:10}}>
                      <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:6}}>Repeats on</div>
                      <div style={{display:'flex',gap:5}}>
                        {DAY_SHORT.map((day,i)=>{
                          const on=(editForm.recurrenceDays||[]).includes(i);
                          return <button type="button" key={i} onClick={()=>{const ds=on?editForm.recurrenceDays.filter(d=>d!==i):[...(editForm.recurrenceDays||[]),i];setEditForm({...editForm,recurrenceDays:ds});}} style={{...tog(on),flex:1,padding:'5px 0',fontSize:11}}>{day[0]}</button>;
                        })}
                      </div>
                    </div>
                  )}
                  {editForm.recurrence!=='none'&&(
                    <div style={{marginTop:12}}>
                      <label style={{fontSize:12,color:'var(--text-secondary)',display:'block',marginBottom:5}}>End date <span style={{color:'var(--text-muted)'}}>(optional)</span></label>
                      <input type="date" className="input" value={editForm.recurrenceEnd} onChange={e=>setEditForm({...editForm,recurrenceEnd:e.target.value})}/>
                    </div>
                  )}
                </div>
              )}
              <div style={{display:'flex',gap:8,justifyContent:'flex-end',paddingTop:4}}>
                <button type="button" className="btn-ghost" onClick={()=>setEditModal(null)}>Cancel</button>
                <button type="submit" className="btn-primary">Save changes</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── TodayView ── */
function TodayView({ state, update, isMobile }) {
  const hour = new Date().getHours();
  const greeting = hour<12?'Good morning Abdul-Malik':hour<17?'Good afternoon Abdul-Malik':'Good evening Abdul-Malik';
  const todayMeetings = state.meetings.filter(m=>occursOnDay(m,new Date())).sort((a,b)=>a.time.localeCompare(b.time));
  const todayTasks = state.tasks.filter(t=>!t.done&&t.due===todayKey());
  const recent = [...state.notes].sort((a,b)=>b.updated-a.updated).slice(0,4);
  const pinned = [...state.notes].filter(n=>n.pinned).sort((a,b)=>b.updated-a.updated);

  const toggleTask = id => update('tasks',state.tasks.map(t=>t.id===id?{...t,done:!t.done,updated:Date.now()}:t));
  const { times: todaySalahTimes, status: todaySalahStatus, retry: retrySalah } = useSalahTimes(todayKey(), state.salah);

  return (
    <div style={{flex:1,overflowY:'auto',overflowX:'hidden',padding:isMobile?'20px 16px':'32px 36px'}} className="scrollbar">
      <div style={{fontFamily:'Fraunces,serif',fontSize:isMobile?20:28,fontWeight:600,marginBottom:4,wordBreak:'break-word'}}>{greeting}</div>
      <div style={{color:'var(--text-secondary)',fontSize:13,marginBottom:isMobile?20:32}}>
        {new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
      </div>

      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:isMobile?12:20,maxWidth:820}}>
        {/* tasks */}
        <div className="card" style={{padding:'18px 20px'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--accent)',textTransform:'uppercase',marginBottom:12}}>Tasks today</div>
          {todayTasks.length===0&&<div style={{color:'var(--text-muted)',fontSize:13}}>All clear 🎉</div>}
          {todayTasks.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:9,padding:'6px 0',borderBottom:'1px solid #1f1f2420'}}>
              <span className={`tick${t.done?' on':''}`} onClick={()=>toggleTask(t.id)} style={{width:15,height:15,borderRadius:4}}>
                {t.done&&<svg style={{width:8,height:8}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
              </span>
              <span style={{flex:1,fontSize:13,color:t.done?'var(--text-muted)':'var(--text-primary)',wordBreak:'break-word',minWidth:0}}>{t.title}</span>
              <span style={{width:7,height:7,borderRadius:99,background:PRIO[t.priority||'none'],flexShrink:0}}/>
            </div>
          ))}
          <button onClick={()=>update('ui',{...state.ui,view:'tasks'})}
            style={{marginTop:12,background:'none',border:'none',color:'var(--accent)',fontSize:12,cursor:'pointer',padding:0}}>View all tasks →</button>
        </div>

        {/* meetings */}
        <div className="card" style={{padding:'18px 20px'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--success)',textTransform:'uppercase',marginBottom:12}}>Meetings today</div>
          {todayMeetings.length===0&&<div style={{color:'var(--text-muted)',fontSize:13}}>No meetings today.</div>}
          {todayMeetings.map(m=>(
            <div key={m.id} style={{padding:'6px 0',borderBottom:'1px solid #1f1f2420'}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',wordBreak:'break-word'}}>{m.time} · {m.title}</div>
              {m.attendees&&<div style={{fontSize:11.5,color:'var(--text-secondary)',wordBreak:'break-word'}}>{m.attendees}</div>}
            </div>
          ))}
          <button onClick={()=>update('ui',{...state.ui,view:'calendar',calDate:todayKey()})}
            style={{marginTop:12,background:'none',border:'none',color:'var(--success)',fontSize:12,cursor:'pointer',padding:0}}>Open calendar →</button>
        </div>

        {/* study — hidden until there are cards */}
        <StudyDueCard state={state} update={update}/>

        {/* prayer times */}
        {state.salah?.enabled && state.salah?.lat !== null && (()=>{
          const pt = todaySalahTimes;
          const shown = PRAYER_NAMES.filter(p=>state.salah.prayers?.[p]!==false);
          if (!shown.length) return null;
          const st = todaySalahStatus?.state;
          /* Nothing cached and nothing fetched yet — say so rather than
             silently rendering no card at all. */
          if (!pt && st !== 'error') return (
            <div className="card" style={{padding:'18px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--warning)',textTransform:'uppercase',marginBottom:12}}>Prayer Times</div>
              <div style={{fontSize:12,color:'var(--text-muted)'}}>Loading timetable…</div>
            </div>
          );
          return (
            <div className="card" style={{padding:'18px 20px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--warning)',textTransform:'uppercase'}}>Prayer Times</div>
                {(st==='stale'||st==='error') && (
                  <button onClick={retrySalah} title={todaySalahStatus?.message||''}
                    style={{background:'none',border:'none',padding:0,cursor:'pointer',fontSize:10,color:st==='error'?'var(--danger)':'var(--warning)'}}>
                    {st==='error' ? 'unavailable · retry' : 'offline · retry'}
                  </button>
                )}
              </div>
              {!pt && <div style={{fontSize:12,color:'var(--text-muted)'}}>No timetable available offline yet.</div>}
              {pt && shown.map(p=>(
                <div key={p} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid #1f1f2420'}}>
                  <span style={{fontSize:13,color:'var(--text-tertiary)'}}>{PRAYER_LABELS[p]}</span>
                  <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',fontFamily:'"JetBrains Mono",monospace'}}>{pt[p]}</span>
                </div>
              ))}
            </div>
          );
        })()}

        {/* recent notes */}
        <div className="card" style={{padding:'18px 20px',gridColumn:'1/-1'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--warning)',textTransform:'uppercase',marginBottom:12}}>Recent notes</div>
          <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)',gap:10}}>
            {recent.map(n=>(
              <div key={n.id} style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:9,padding:'12px 14px',cursor:'pointer',transition:'border-color 120ms',overflow:'hidden'}}
                onClick={()=>update('ui',{...state.ui,view:'notes',noteId:n.id})}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-strong)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,overflow:'hidden'}}>
                  <span style={{fontSize:14,flexShrink:0}}>{n.emoji||'📝'}</span>
                  <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title||'Untitled'}</span>
                </div>
                <div style={{fontSize:11.5,color:'var(--text-secondary)',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',wordBreak:'break-word'}}>{notePreview(n.body)}</div>
              </div>
            ))}
          </div>
          <button onClick={()=>update('ui',{...state.ui,view:'notes'})}
            style={{marginTop:12,background:'none',border:'none',color:'var(--warning)',fontSize:12,cursor:'pointer',padding:0}}>All notes →</button>
        </div>

        {/* pinned notes */}
        {pinned.length>0&&(
          <div className="card" style={{padding:'18px 20px',gridColumn:'1/-1'}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--warning)',textTransform:'uppercase',marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
              <svg style={{width:11,height:11}} viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Pinned notes
            </div>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)',gap:10}}>
              {pinned.map(n=>(
                <div key={n.id} style={{background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:9,padding:'12px 14px',cursor:'pointer',transition:'border-color 120ms',overflow:'hidden'}}
                  onClick={()=>update('ui',{...state.ui,view:'notes',noteId:n.id})}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-strong)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,overflow:'hidden'}}>
                    <span style={{fontSize:14,flexShrink:0}}>{n.emoji||'📝'}</span>
                    <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title||'Untitled'}</span>
                  </div>
                  <div style={{fontSize:11.5,color:'var(--text-secondary)',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden',wordBreak:'break-word'}}>{notePreview(n.body)}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── TagsView ── */
const TAG_SOURCES = [
  { id:'all',     label:'All',     key:null,      noun:'use'   },
  { id:'notes',   label:'Notes',   key:'notes',   noun:'note'  },
  { id:'tasks',   label:'Tasks',   key:'tasks',   noun:'task'  },
  { id:'journal', label:'Journal', key:'journal', noun:'entry' },
];
const plural = (n, noun) => n === 1 ? noun : noun === 'entry' ? 'entries' : noun + 's';

/* ── FoldersView — full-page folder management ── */
function FoldersView({ state, update, isMobile }) {
  const folders = state.folders || [];
  const [expandedFolders, setExpandedFolders] = useState(() => new Set());
  const [addingRootFolder, setAddingRootFolder] = useState(false);
  const [addingSubId, setAddingSubId] = useState(null);
  const [newFolderName, setNewFolderName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');
  const [pickerOpenId, setPickerOpenId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [notesOpenIds, setNotesOpenIds] = useState(() => new Set());
  const [collapsedGroupKeys, setCollapsedGroupKeys] = useState(() => new Set());

  const folderTree = useMemo(() => buildFolderTree(folders), [folders]);

  const noteCounts = useMemo(() => {
    const c = {};
    state.notes.forEach(n => { if (n.folderId) c[n.folderId] = (c[n.folderId]||0)+1; });
    return c;
  }, [state.notes]);

  const countWithDesc = fid =>
    getFolderDescIds(fid, folders).reduce((s, id) => s + (noteCounts[id]||0), 0);

  const toggleExpand = fid =>
    setExpandedFolders(prev => {
      const n = new Set(prev); n.has(fid) ? n.delete(fid) : n.add(fid); return n;
    });

  const toggleNotesOpen = fid =>
    setNotesOpenIds(prev => {
      const n = new Set(prev); n.has(fid) ? n.delete(fid) : n.add(fid); return n;
    });

  const updateFolderMeta = (fid, meta) =>
    update('folders', folders.map(f => f.id===fid ? {...f,...meta} : f));

  const createFolder = (e, parentId = null) => {
    e.preventDefault();
    if (!newFolderName.trim()) return;
    const nf = {id:uid(), name:newFolderName.trim(), parentId};
    update('folders', [...folders, nf]);
    setNewFolderName(''); setAddingRootFolder(false); setAddingSubId(null);
    if (parentId) setExpandedFolders(prev => new Set([...prev, parentId]));
  };

  const saveRename = e => {
    e.preventDefault();
    if (!renameVal.trim()) return;
    update('folders', folders.map(f => f.id===renamingId ? {...f, name:renameVal.trim()} : f));
    setRenamingId(null);
  };

  const deleteFolderFv = fid => {
    const allIds = getFolderDescIds(fid, folders);
    update('folders', folders.filter(f => !allIds.includes(f.id)));
    update('notes', state.notes.map(n => allIds.includes(n.folderId) ? {...n, folderId:null} : n));
    if (allIds.includes(state.ui.folderId)) update('ui', {...state.ui, folderId:null});
    setConfirmDeleteId(null);
  };

  const totalNotes = folders.reduce((s, f) => s + (noteCounts[f.id]||0), 0);
  const allExpandable = folders.filter(f => folders.some(c => c.parentId === f.id)).map(f => f.id);
  const allExpanded = allExpandable.length > 0 && allExpandable.every(id => expandedFolders.has(id));

  const inputStyle = {
    flex:1, background:'var(--bg-surface)', border:'1px solid var(--accent-ring)',
    borderRadius:6, color:'var(--text-primary)', fontSize:13, padding:'6px 10px',
    outline:'none', fontFamily:'Manrope,sans-serif', minWidth:0,
  };
  const btnSm = (extra={}) => ({
    border:'1px solid var(--border)', background:'none', color:'var(--text-secondary)',
    fontSize:11, padding:'4px 9px', borderRadius:6, cursor:'pointer',
    fontFamily:'Manrope,sans-serif', flexShrink:0, ...extra,
  });

  const FolderCard = ({node, depth}) => {
    const isExpanded   = expandedFolders.has(node.id);
    const hasChildren  = node.children.length > 0;
    const isRenaming   = renamingId === node.id;
    const isAddingSub  = addingSubId === node.id;
    const isPickerOpen = pickerOpenId === node.id;
    const isConfirmDel = confirmDeleteId === node.id;
    const isNotesOpen  = notesOpenIds.has(node.id);
    const count        = countWithDesc(node.id);
    /* All notes in this folder AND every descendant subfolder, grouped by their
       immediate parent folder so the user can see which subfolder each note is in. */
    const allDescFolderIds = isNotesOpen ? getFolderDescIds(node.id, folders) : [];
    const allDescNotes = isNotesOpen
      ? [...state.notes].filter(n => allDescFolderIds.includes(n.folderId)).sort((a,b) => b.updated - a.updated)
      : [];
    /* Build groups: first group = notes directly here, then one group per subfolder that has notes */
    const noteGroups = isNotesOpen ? (() => {
      const groups = [];
      const direct = allDescNotes.filter(n => n.folderId === node.id);
      if (direct.length) groups.push({folder:null, notes:direct});
      const subFolderIds = allDescFolderIds.filter(id => id !== node.id);
      subFolderIds.forEach(fid => {
        const fNotes = allDescNotes.filter(n => n.folderId === fid);
        if (fNotes.length) {
          const f = folders.find(ff => ff.id === fid);
          groups.push({folder:f||null, notes:fNotes});
        }
      });
      return groups;
    })() : [];
    const fColor       = node.color || 'slate';
    const indent       = depth * 20;

    return (
      <div>
        {/* main row */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',
          paddingLeft:12+indent,borderRadius:10,background:'var(--bg-surface-2)',
          border:'1px solid var(--border)',marginBottom:4,minHeight:50,flexWrap:'wrap'}}>
          {/* chevron */}
          {hasChildren ? (
            <button onClick={()=>toggleExpand(node.id)} style={{background:'none',border:'none',cursor:'pointer',
              padding:3,color:'var(--text-muted)',display:'flex',flexShrink:0,
              transform:isExpanded?'rotate(90deg)':'none',transition:'transform 150ms'}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:12,height:12}}><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          ) : <span style={{width:18,flexShrink:0}}/>}
          {/* folder icon */}
          <button onClick={()=>setPickerOpenId(isPickerOpen?null:node.id)} title="Customise"
            style={{background:'none',border:'none',padding:2,cursor:'pointer',display:'flex',flexShrink:0,borderRadius:6}}>
            <FolderIconSvg color={fColor} iconId={node.icon} size={30}/>
          </button>
          {/* name / rename form */}
          {isRenaming ? (
            <form onSubmit={saveRename} style={{flex:1,display:'flex',gap:6,alignItems:'center',minWidth:160}}>
              <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)} style={inputStyle}/>
              <button type="submit" style={btnSm({background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',color:'var(--accent)',fontWeight:600})}>Save</button>
              <button type="button" onClick={()=>setRenamingId(null)} style={btnSm()}>Cancel</button>
            </form>
          ) : (
            <span style={{flex:1,fontWeight:500,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              {node.name}
            </span>
          )}
          {/* note count — click to toggle inline notes */}
          {count > 0 && (
            <button onClick={()=>toggleNotesOpen(node.id)}
              style={{fontSize:11,background:isNotesOpen?'var(--accent-soft)':'var(--fill)',
                color:isNotesOpen?'var(--accent)':'var(--text-muted)',
                border:isNotesOpen?'1px solid var(--accent-ring)':'1px solid transparent',
                borderRadius:99,padding:'2px 8px',flexShrink:0,cursor:'pointer',
                fontFamily:'Manrope,sans-serif'}}>
              {count} note{count!==1?'s':''}
            </button>
          )}
          {/* actions */}
          {!isRenaming && !isConfirmDel && (
            <div style={{display:'flex',gap:4,flexShrink:0}}>
              <button onClick={()=>update('ui',{...state.ui,view:'notes',folderId:node.id})} style={btnSm()}>View</button>
              {count > 0 && <button onClick={()=>update('ui',{...state.ui,view:'study',studyIntent:{scope:{type:'folder',id:node.id}}})} style={btnSm()} title="Study this folder (including subfolders)">Study</button>}
              <button onClick={()=>{setAddingSubId(node.id);setNewFolderName('');setAddingRootFolder(false);setPickerOpenId(null);setExpandedFolders(prev=>new Set([...prev,node.id]));}}
                style={btnSm({padding:'4px 7px'})} title="Add subfolder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:10,height:10,display:'block'}}>
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
              <button onClick={()=>{setRenamingId(node.id);setRenameVal(node.name);setPickerOpenId(null);}} style={btnSm({fontSize:14,padding:'1px 7px'})}>&#9998;</button>
              <button onClick={()=>setConfirmDeleteId(node.id)} style={btnSm({color:'var(--danger)',opacity:0.8})}>&#10005;</button>
            </div>
          )}
          {/* delete confirm */}
          {isConfirmDel && (
            <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0,flexWrap:'wrap'}}>
              <span style={{fontSize:11,color:'var(--text-secondary)'}}>
                {node.children.length > 0 ? 'Delete folder and subfolders?' : 'Delete this folder?'}
              </span>
              <button onClick={()=>deleteFolderFv(node.id)}
                style={{background:'var(--danger)',border:'none',color:'#fff',fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:6,cursor:'pointer'}}>
                Delete
              </button>
              <button onClick={()=>setConfirmDeleteId(null)} style={btnSm()}>Cancel</button>
            </div>
          )}
        </div>
        {/* style picker */}
        {isPickerOpen && (
          <div onClick={e=>e.stopPropagation()}
            style={{marginLeft:12+indent,marginBottom:6,background:'var(--bg-surface-2)',
              border:'1px solid var(--border-strong)',borderRadius:10,padding:'12px',
              overflow:'hidden',boxShadow:'var(--shadow-3)'}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Color</div>
            <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
              {FOLDER_COLORS.map(c=>(
                <button key={c.id} title={c.id} onClick={()=>updateFolderMeta(node.id,{color:c.id})}
                  style={{width:24,height:24,borderRadius:'50%',background:c.hex,
                    border:fColor===c.id?'2.5px solid #fff':'2.5px solid transparent',
                    boxShadow:fColor===c.id?`0 0 0 2.5px ${c.hex}`:'none',
                    cursor:'pointer',padding:0,outline:'none',flexShrink:0}}/>
              ))}
            </div>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Icon</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:4}}>
              {FOLDER_ICON_OPTS.map(ic=>{
                const isSel = ic.id==='none' ? !node.icon : node.icon===ic.id;
                return (
                  <button key={ic.id} title={ic.id}
                    onClick={()=>updateFolderMeta(node.id,{icon:ic.id==='none'?null:ic.id})}
                    style={{aspectRatio:'1',display:'flex',alignItems:'center',justifyContent:'center',
                      borderRadius:8,cursor:'pointer',padding:0,border:'none',outline:'none',
                      background:isSel?'var(--accent-soft)':'transparent',transition:'background 100ms'}}>
                    {ic.id==='none'
                      ? <svg viewBox="0 0 24 24" width="24" height="24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="var(--text-muted)" opacity="0.35"/></svg>
                      : <FolderIconSvg color={fColor} iconId={ic.id} size={28}/>
                    }
                  </button>
                );
              })}
            </div>
          </div>
        )}
        {/* inline notes panel */}
        {isNotesOpen && (
          <div style={{marginLeft:12+indent,marginBottom:6,background:'var(--bg-surface-2)',
            border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
            {allDescNotes.length === 0 ? (
              <div style={{padding:'14px 16px',fontSize:12,color:'var(--text-muted)',textAlign:'center'}}>
                No notes in this folder or its subfolders
              </div>
            ) : (
              noteGroups.map((group, gi) => {
                const gk = noteGroups.length > 1 ? `${node.id}::${group.folder ? group.folder.id : 'direct'}` : null;
                const isGCollapsed = gk ? collapsedGroupKeys.has(gk) : false;
                const toggleG = () => {
                  if (!gk) return;
                  setCollapsedGroupKeys(prev => { const next = new Set(prev); next.has(gk) ? next.delete(gk) : next.add(gk); return next; });
                };
                return (
                  <div key={gi}>
                    {/* subfolder section header — collapsible when multiple groups */}
                    {noteGroups.length > 1 && (
                      <button onClick={toggleG} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 14px',
                        background:'var(--bg-surface-3)',borderTop:gi>0?'1px solid var(--border)':'none',
                        width:'100%',border:'none',cursor:'pointer',textAlign:'left'}}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
                          style={{width:10,height:10,flexShrink:0,color:'var(--text-muted)',
                            transform:isGCollapsed?'none':'rotate(90deg)',transition:'transform 150ms'}}>
                          <polyline points="9 18 15 12 9 6"/>
                        </svg>
                        {group.folder
                          ? <><FolderIconSvg color={group.folder.color||'slate'} iconId={group.folder.icon} size={13}/>
                              <span style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',
                                color:'var(--text-muted)'}}>{group.folder.name}</span></>
                          : <span style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',
                              color:'var(--text-muted)'}}>This folder</span>
                        }
                      </button>
                    )}
                    {!isGCollapsed && group.notes.map((n, i) => {
                      const preview = notePreview(n.body, 90);
                      return (
                        <div key={n.id}
                          style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',
                            borderBottom:i<group.notes.length-1?'1px solid var(--border)':'none'}}>
                          <span style={{fontSize:16,flexShrink:0}}>{n.emoji||'📝'}</span>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',
                              whiteSpace:'nowrap',color:'var(--text-primary)',marginBottom:2}}>
                              {n.title||'Untitled'}
                            </div>
                            {preview&&<div style={{fontSize:11,color:'var(--text-muted)',overflow:'hidden',
                              textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{preview}</div>}
                          </div>
                          {n.tags&&n.tags.length>0&&(
                            <span style={{fontSize:10,color:tagColor(n.tags[0]),flexShrink:0,maxWidth:54,
                              overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                              {n.tags[0]}
                            </span>
                          )}
                          <span style={{fontSize:11,color:'var(--text-muted)',flexShrink:0,whiteSpace:'nowrap'}}>
                            {new Date(n.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
                          </span>
                          <button
                            onClick={()=>update('ui',{...state.ui,view:'notes',folderId:n.folderId,noteId:n.id})}
                            style={{background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',
                              color:'var(--accent)',fontSize:11,fontWeight:600,padding:'4px 10px',
                              borderRadius:6,cursor:'pointer',flexShrink:0,display:'flex',
                              alignItems:'center',gap:4,fontFamily:'Manrope,sans-serif'}}>
                            Open
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:9,height:9}}>
                              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                            </svg>
                          </button>
                        </div>
                      );
                    })}
                  </div>
                );
              })
            )}
            <div style={{padding:'7px 14px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end'}}>
              <button onClick={()=>update('ui',{...state.ui,view:'notes',folderId:node.id})}
                style={{background:'none',border:'none',color:'var(--accent)',fontSize:11,
                  cursor:'pointer',fontFamily:'Manrope,sans-serif',fontWeight:600}}>
                Open in Notes &#8594;
              </button>
            </div>
          </div>
        )}
        {/* add subfolder form */}
        {isAddingSub && (
          <form onSubmit={e=>createFolder(e,node.id)}
            style={{display:'flex',gap:6,alignItems:'center',marginLeft:12+indent+18+8,marginBottom:6}}>
            <FolderIconSvg color="slate" iconId={null} size={20}/>
            <input autoFocus value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
              placeholder="Subfolder name" style={inputStyle}/>
            <button type="submit" style={btnSm({background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',color:'var(--accent)',fontWeight:600})}>Add</button>
            <button type="button" onClick={()=>setAddingSubId(null)} style={btnSm()}>&#10005;</button>
          </form>
        )}
        {/* children */}
        {isExpanded && node.children.length > 0 && (
          <div style={{marginLeft:20,paddingLeft:8,borderLeft:'2px solid var(--border)',marginBottom:2}}>
            {node.children.map(child => <FolderCard key={child.id} node={child} depth={depth+1}/>)}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{flex:1,overflow:'auto',padding:isMobile?'18px 14px 80px':'28px 32px'}} className="scrollbar">
      {/* header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:22,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600}}>Folders</h1>
          <div style={{fontSize:12.5,color:'var(--text-secondary)',marginTop:3}}>
            {folders.length} folder{folders.length!==1?'s':''}
            {totalNotes > 0 ? ' · ' + totalNotes + ' note' + (totalNotes!==1?'s':'') : ''}
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
          {allExpandable.length > 0 && (
            <button onClick={()=>setExpandedFolders(allExpanded ? new Set() : new Set(allExpandable))}
              style={{background:'var(--fill)',border:'1px solid var(--border)',color:'var(--text-secondary)',
                fontSize:12,padding:'6px 12px',borderRadius:8,cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>
              {allExpanded ? 'Collapse all' : 'Expand all'}
            </button>
          )}
          <button onClick={()=>{setAddingRootFolder(true);setNewFolderName('');setAddingSubId(null);setPickerOpenId(null);}}
            style={{background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',color:'var(--accent)',
              fontSize:13,fontWeight:600,padding:'7px 14px',borderRadius:8,cursor:'pointer',
              display:'flex',alignItems:'center',gap:6,fontFamily:'Manrope,sans-serif',flexShrink:0}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{width:14,height:14}}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Folder
          </button>
        </div>
      </div>

      {/* empty state */}
      {folders.length === 0 && !addingRootFolder && (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text-muted)'}}>
          <div style={{marginBottom:14}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" style={{width:52,height:52,opacity:0.3,display:'inline-block'}}>
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:6,color:'var(--text-secondary)'}}>No folders yet</div>
          <div style={{fontSize:13,marginBottom:20}}>Organise your notes into folders and subfolders</div>
          <button onClick={()=>{setAddingRootFolder(true);setNewFolderName('');}}
            style={{background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',color:'var(--accent)',
              fontSize:13,fontWeight:600,padding:'8px 18px',borderRadius:8,cursor:'pointer'}}>
            Create your first folder
          </button>
        </div>
      )}

      {/* folder tree */}
      {(folders.length > 0 || addingRootFolder) && (
        <div style={{display:'flex',flexDirection:'column'}}>
          {folderTree.map(node => <FolderCard key={node.id} node={node} depth={0}/>)}
          {/* root create form */}
          {addingRootFolder && (
            <form onSubmit={e=>createFolder(e,null)}
              style={{display:'flex',gap:8,alignItems:'center',padding:'10px 12px',
                background:'var(--bg-surface-2)',border:'1px dashed var(--accent-ring)',
                borderRadius:10,marginTop:4}}>
              <FolderIconSvg color="slate" iconId={null} size={26}/>
              <input autoFocus value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
                placeholder="Folder name" style={inputStyle}/>
              <button type="submit" style={btnSm({background:'var(--accent-soft)',border:'1px solid var(--accent-ring)',color:'var(--accent)',fontWeight:600,fontSize:12,padding:'6px 14px'})}>Create</button>
              <button type="button" onClick={()=>setAddingRootFolder(false)} style={btnSm({fontSize:12,padding:'6px 10px'})}>Cancel</button>
            </form>
          )}
          {!addingRootFolder && (
            <button onClick={()=>{setAddingRootFolder(true);setNewFolderName('');}}
              style={{display:'flex',alignItems:'center',gap:6,marginTop:6,padding:'8px 12px',
                background:'none',border:'1px dashed var(--border)',borderRadius:10,
                color:'var(--text-muted)',fontSize:13,cursor:'pointer',
                fontFamily:'Manrope,sans-serif',width:'100%',justifyContent:'flex-start'}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{width:14,height:14}}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add root folder
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function TagsView({ state, update, isMobile }) {
  const [query, setQuery]   = useState('');
  const [sort, setSort]     = useState('used'); /* 'used' | 'az' */
  const [source, setSource] = useState('all');  /* see TAG_SOURCES */
  const [confirmDeleteTag, setConfirmDeleteTag] = useState(null);

  /* Tags live on notes, tasks and journal entries. All tags in state.tags are
     always shown (with 0 counts when unused) so deleting all items that use a
     tag does not silently remove it from the list. */
  const ranked = useMemo(() => {
    const counts = new Map();
    (state.tags||[]).forEach(t => counts.set(t, { tag:t, notes:0, tasks:0, journal:0, total:0 }));
    const bump = (t, kind) => {
      const c = counts.get(t) || { tag:t, notes:0, tasks:0, journal:0, total:0 };
      c[kind]++; c.total++; counts.set(t, c);
    };
    state.notes.forEach(n => (n.tags||[]).forEach(t => bump(t,'notes')));
    state.tasks.forEach(t2 => (t2.tags||[]).forEach(t => bump(t,'tasks')));
    (state.journal||[]).forEach(j => (j.tags||[]).forEach(t => bump(t,'journal')));
    return [...counts.values()];
  }, [state.notes, state.tasks, state.journal, state.tags]);

  const deleteGlobalTag = tag => {
    update('tags', (state.tags||[]).filter(t => t !== tag));
    update('notes', state.notes.map(n => ({...n, tags:(n.tags||[]).filter(t=>t!==tag)})));
    update('tasks', state.tasks.map(t => ({...t, tags:(t.tags||[]).filter(tg=>tg!==tag), updated:Date.now()})));
    update('journal', (state.journal||[]).map(j => ({...j, tags:(j.tags||[]).filter(t=>t!==tag)})));
    setConfirmDeleteTag(null);
  };

  /* Which count the screen is ranking and showing. Filtering by source is not
     the same as filtering the list: a tag used on ten notes and one task is a
     different thing under Notes than under Tasks, so the count switches with
     the source and the ordering follows it. */
  const src   = TAG_SOURCES.find(s => s.id === source) || TAG_SOURCES[0];
  const countOf = c => src.key ? c[src.key] : c.total;

  const inSource = useMemo(
    () => src.key ? ranked.filter(c => c[src.key] > 0) : ranked,
    [ranked, src.key],
  );

  const visible = useMemo(() => {
    const q = query.trim().replace(/^#/, '').toLowerCase();
    const list = q ? inSource.filter(c => c.tag.toLowerCase().includes(q)) : inSource;
    return [...list].sort(sort === 'az'
      ? (a,b) => a.tag.localeCompare(b.tag)
      : (a,b) => countOf(b) - countOf(a) || a.tag.localeCompare(b.tag));
  }, [inSource, query, sort, src.key]);

  const openTag = t => update('ui', { ...state.ui, view:'notes', filterTag:t, noteId:null });

  /* The most-used handful get a real card with a breakdown; everything else
     becomes a dense capsule. A tag used once doesn't need the same footprint
     as one used twenty times, and giving it that footprint is exactly what
     made this screen a wall to scan. Suppressed while searching or sorting
     A–Z, where a single uniform list is what you actually want. */
  const featured = (sort === 'used' && !query.trim()) ? visible.slice(0, 6) : [];
  const rest     = featured.length ? visible.slice(featured.length) : visible;

  const totalUses = inSource.reduce((n,c) => n + countOf(c), 0);
  /* Where a tag click should land. Following the source you're browsing is the
     only behaviour that isn't a surprise — clicking a tag under Tasks used to
     drop you into filtered Notes. */
  const openTagIn = t => source === 'tasks'
    ? update('ui', { ...state.ui, view:'tasks', filterTag:t })
    : source === 'journal'
      ? update('ui', { ...state.ui, view:'journal', filterTag:t })
      : openTag(t);

  return (
    <div style={{flex:1,overflow:'auto',padding:isMobile?'18px 16px':'28px 32px'}} className="scrollbar">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:18}}>
        <div>
          <h1 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600}}>Tags</h1>
          <div style={{fontSize:12.5,color:'var(--text-secondary)',marginTop:3}}>
            {inSource.length} tag{inSource.length!==1?'s':''} · {totalUses} {plural(totalUses, src.noun)}
          </div>
        </div>
        {ranked.length > 1 && (
          <div className="seg" role="group" aria-label="Sort tags">
            <button aria-pressed={sort==='used'} onClick={()=>setSort('used')}>Most used</button>
            <button aria-pressed={sort==='az'}   onClick={()=>setSort('az')}>A–Z</button>
          </div>
        )}
      </div>

      {ranked.length === 0 ? (
        <div style={{color:'var(--text-muted)',fontSize:13}}>No tags yet. Add tags to your notes.</div>
      ) : (<>
        {/* Where a tag is used is usually the question — a task tag and a note
            tag do different jobs even when they share a name. */}
        <div className="no-scrollbar" style={{display:'flex',gap:6,marginBottom:18,overflowX:'auto',paddingBottom:2}}>
          {TAG_SOURCES.map(o => {
            const n = o.key ? ranked.filter(c => c[o.key] > 0).length : ranked.length;
            const on = source === o.id;
            return (
              <button key={o.id} onClick={()=>setSource(o.id)} aria-pressed={on}
                className={`pill${on ? ' on' : ''}`} disabled={n === 0 && !on}
                style={n === 0 && !on ? {opacity:.4,cursor:'default'} : undefined}>
                {o.label}<span className="pill-count">{n}</span>
              </button>
            );
          })}
        </div>

        {inSource.length > 8 && (
          <div style={{position:'relative',maxWidth:340,marginBottom:22}}>
            <svg style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',width:13,height:13,color:'var(--text-muted)',pointerEvents:'none'}}
              viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input className="input" value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Filter tags…" style={{paddingLeft:32,borderRadius:'var(--r-pill)'}}/>
            {query && (
              <button onClick={()=>setQuery('')} className="icon-btn"
                style={{position:'absolute',right:4,top:'50%',transform:'translateY(-50%)',width:24,height:24}} title="Clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            )}
          </div>
        )}

        {featured.length > 0 && (
          <div style={{marginBottom:26}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.09em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>Most used</div>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
              {featured.map(c => (
                <div key={c.tag} style={{position:'relative'}}>
                  <button onClick={()=>openTagIn(c.tag)} className="card"
                    style={{padding:'14px 15px',cursor:'pointer',textAlign:'left',border:'1px solid var(--border)',
                            fontFamily:'Manrope,sans-serif',width:'100%',transition:'transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)'}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=`${tagColor(c.tag)}66`;e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='var(--shadow-2)';}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='var(--shadow-1)';}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9,paddingRight:16}}>
                      <span style={{width:26,height:26,borderRadius:'var(--r-sm)',background:`${tagColor(c.tag)}24`,color:tagColor(c.tag),
                                    display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:13,fontWeight:700}}>#</span>
                      <span style={{fontSize:13.5,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',minWidth:0,flex:1}}>
                        {c.tag.replace(/^#/,'')}
                      </span>
                      <span style={{fontSize:15,fontWeight:700,color:tagColor(c.tag),fontFamily:'"JetBrains Mono",monospace'}}>{countOf(c)}</span>
                    </div>
                    {/* Under All, the breakdown is the interesting part; under a
                        single source there is nothing to break down. */}
                    <div style={{display:'flex',gap:8,fontSize:11,color:'var(--text-secondary)',flexWrap:'wrap'}}>
                      {src.key
                        ? <span>{countOf(c)} {plural(countOf(c), src.noun)}</span>
                        : <>
                            {c.notes>0   && <span>{c.notes} {plural(c.notes,'note')}</span>}
                            {c.tasks>0   && <span>{c.tasks} {plural(c.tasks,'task')}</span>}
                            {c.journal>0 && <span>{c.journal} {plural(c.journal,'entry')}</span>}
                          </>}
                    </div>
                  </button>
                  <button onClick={()=>setConfirmDeleteTag(c.tag)} className="icon-btn danger"
                    title="Delete tag"
                    style={{position:'absolute',top:7,right:7,padding:'3px 4px',zIndex:1}}>
                    <svg style={{width:11,height:11}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {rest.length > 0 && (
          <div>
            {featured.length > 0 && (
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.09em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>
                Everything else
              </div>
            )}
            {/* A capsule cloud, not a card grid: one line each, so thirty tags
                read as one block you can scan rather than thirty objects. */}
            <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
              {rest.map(c => (
                <span key={c.tag} className="pill"
                  style={{display:'inline-flex',alignItems:'center',gap:0,color:tagColor(c.tag),background:`${tagColor(c.tag)}14`,padding:0}}>
                  <span onClick={()=>openTagIn(c.tag)} style={{cursor:'pointer',padding:'5px 4px 5px 10px'}}
                    title={`${c.notes} notes · ${c.tasks} tasks · ${c.journal} journal`}>
                    {c.tag}<span className="pill-count" style={{marginLeft:4}}>{countOf(c)}</span>
                  </span>
                  <span onClick={()=>setConfirmDeleteTag(c.tag)}
                    style={{cursor:'pointer',padding:'5px 8px 5px 4px',opacity:.55,fontSize:13,lineHeight:1,transition:'opacity 120ms'}}
                    title="Delete tag"
                    onMouseEnter={e=>e.currentTarget.style.opacity=1}
