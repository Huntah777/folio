<style>
/* ── theme tokens ── */
:root{
  --bg-app:#0a0a0b; --bg-sidebar:#0d0d10; --bg-surface:#17171b; --bg-surface-2:#101012; --bg-surface-3:#141418; --modal-bg:#131317;
  --border:#1f1f24; --border-strong:#2a2a31;
  --text-primary:#f4f3ee; --text-secondary:#9a9788; --text-tertiary:#c9c6b8; --text-quaternary:#e6e4dc; --text-muted:#3a3a44;
  --accent:#818cf8; --accent-strong:#6366f1; --success:#10b981; --warning:#f59e0b; --danger:#f43f5e;
  /* Translucent fills, the way macOS builds controls: a wash of light over
     whatever is behind, rather than a flat opaque grey. Keeps a control
     legible on both the plain background and a photo background. */
  --fill:rgba(255,255,255,.055); --fill-hover:rgba(255,255,255,.085); --fill-active:rgba(255,255,255,.12);
  --hairline:rgba(255,255,255,.09);
  --glass-rgb:30 30 37;
  --glass-edge-rgb:255 255 255;
  --tab-selected:rgba(0,0,0,.34);
  --accent-ring:rgba(129,140,248,.35);
  --accent-soft:rgba(129,140,248,.14);
  --shadow-1:0 1px 2px rgba(0,0,0,.28);
  --shadow-2:0 4px 16px -4px rgba(0,0,0,.5);
  --shadow-3:0 2px 10px -3px rgba(0,0,0,.30);
}
:root[data-theme="ghibli"]{
  --bg-app:#f2e4c9; --bg-sidebar:#e9d7b3; --bg-surface:#fbf3e2; --bg-surface-2:#f5e8ca; --bg-surface-3:#f0e0bd; --modal-bg:#fbf3e2;
  --border:#e0cca0; --border-strong:#cbaf7a;
  --text-primary:#3c2c1e; --text-secondary:#7d6448; --text-tertiary:#5a4632; --text-quaternary:#4a3a28; --text-muted:#b9a582;
  --accent:#7a9e6f; --accent-strong:#5c8151; --success:#7a9e6f; --warning:#d98e3f; --danger:#c1594a;
  /* On a light ground the same idea inverts: tint with shadow, not light. */
  --fill:rgba(60,44,30,.06); --fill-hover:rgba(60,44,30,.10); --fill-active:rgba(60,44,30,.15);
  --hairline:rgba(60,44,30,.12);
  --glass-rgb:251 243 226;
  --glass-edge-rgb:92 70 44;
  --tab-selected:rgba(60,44,30,.10);
  --accent-ring:rgba(122,158,111,.38);
  --accent-soft:rgba(122,158,111,.18);
  --shadow-1:0 1px 2px rgba(120,92,54,.12);
  --shadow-2:0 4px 16px -4px rgba(120,92,54,.20);
  --shadow-3:0 2px 10px -3px rgba(120,92,54,.22);
}
/* ── glass (iOS 27) ──
   --glass is the user's clarity setting, 0 = Ultra Clear … 1 = Tinted (Admin →
   Appearance; see GlassPref). Everything glass derives from it, so one slider
   moves menus, modals, the tab bar and popovers together.
   iOS 27's refinements over iOS 26, mirrored here: glass is less translucent by
   default; surfaces are outlined with a defined border instead of floating on
   a drop shadow (the clearer the glass, the stronger the edge, so it stays
   legible); translucency is fixed rather than adapting to what's behind it;
   and the tab bar is a docked, solid-edged bar with a darker selected pill. */
:root{
  --glass:.72;
  --vibrancy:rgb(var(--glass-rgb) / calc(.30 + var(--glass) * .62));
  --glass-border:rgb(var(--glass-edge-rgb) / calc(.20 - var(--glass) * .08));
  --glass-edge:rgb(var(--glass-edge-rgb) / .09);
  --glass-blur:blur(24px) saturate(calc(1.4 + (1 - var(--glass)) * .5));
}
/* The OS's Reduce Transparency / Increase Contrast win over the slider. */
@media (prefers-reduced-transparency:reduce){:root{--glass:1}}
@media (prefers-contrast:more){:root{--glass:1;--glass-border:rgb(var(--glass-edge-rgb) / .45)}}

/* One radius scale and one motion curve for the whole app, so nothing has to
   guess. The curve is the decelerating ease Apple uses everywhere — fast to
   start, settling at the end — which is most of why a UI "feels" native. */
:root{
  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-app);color:var(--text-primary);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:var(--r-pill);border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
/* Overlay scrollbars: the thumb only materialises once the pointer is over
   the scrolling region, so a dense list isn't permanently railed by a bar. */
*:hover::-webkit-scrollbar-thumb{background:var(--border-strong);background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:content-box}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}

/* layout */
#app-bg-image{position:fixed;inset:0;z-index:-2;background:var(--app-bg-image,none) center/cover no-repeat;background-color:var(--bg-app)}
#app-bg-scrim{position:fixed;inset:0;z-index:-1;background:var(--app-bg-scrim,transparent)}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:232px;min-width:232px;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* sidebar nav */
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);user-select:none;position:relative}
.nav-item:hover{background:var(--fill);color:var(--text-primary)}
.nav-item.active{background:var(--fill-active);color:var(--text-primary);box-shadow:inset 0 1px 0 var(--hairline)}
.nav-item:active{background:var(--fill-active)}
.nav-item svg{width:15px;height:15px;flex-shrink:0}

/* cards */
.card{background:linear-gradient(160deg,var(--bg-surface-3),var(--bg-surface-2));border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hairline)}
.note-card{padding:15px 16px;cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);position:relative}
.note-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-2),inset 0 1px 0 var(--hairline)}
.note-card:active{transform:translateY(0) scale(.995)}
.note-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px rgba(129,140,248,.18)}
.note-card.checked{border-color:#818cf840}
/* delete / action buttons */
.del-btn{background:none;border:none;cursor:pointer;padding:3px 4px;border-radius:5px;color:var(--text-muted);display:flex;align-items:center;transition:color 120ms,background 120ms}
.del-btn:hover{color:var(--danger);background:rgba(244,63,94,.1)}
/* note card trash button */
.note-del{position:absolute;top:10px;right:10px;opacity:0;background:var(--modal-bg);border:1px solid var(--border-strong);border-radius:7px;padding:5px 7px;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;transition:color 120ms,opacity 120ms,border-color 120ms}
.note-card:hover .note-del{opacity:1}
.note-del:hover{color:var(--danger);border-color:rgba(244,63,94,.35)}
/* note card pin/favourite button */
.note-pin{position:absolute;top:10px;right:38px;opacity:0;background:var(--modal-bg);border:1px solid var(--border-strong);border-radius:7px;padding:5px 7px;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;transition:color 120ms,opacity 120ms,border-color 120ms}
.note-card:hover .note-pin{opacity:1}
.note-pin:hover{color:var(--warning);border-color:rgba(245,158,11,.35)}
.note-pin.on{color:var(--warning);border-color:rgba(245,158,11,.35);opacity:1}
/* note card select checkbox */
.note-cb{opacity:0;transition:opacity 120ms;flex-shrink:0}
.note-card:hover .note-cb,.note-card.checked .note-cb{opacity:1}
/* context menu */
.ctx-menu{background:var(--vibrancy);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:5px;min-width:180px;box-shadow:var(--shadow-3);z-index:9999;position:fixed;animation:popIn 160ms var(--ease) both}
.ctx-item{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:var(--r-xs);font-size:13px;cursor:pointer;color:var(--text-tertiary);transition:background 100ms var(--ease),color 100ms var(--ease);user-select:none;font-family:'Manrope',sans-serif;font-weight:500}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-item.danger{color:var(--text-secondary)}
.ctx-item.danger:hover{background:var(--danger);color:#fff}
.ctx-sep{height:1px;background:var(--hairline);margin:4px 8px}
/* bulk action bar */
.bulk-bar{position:sticky;bottom:8px;background:var(--vibrancy);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:9px 13px;display:flex;align-items:center;gap:8px;margin-top:8px;box-shadow:var(--shadow-3)}
/* folder action buttons */
.folder-action{background:none;border:1px solid transparent;cursor:pointer;padding:2px 5px;border-radius:4px;font-size:11px;line-height:1;font-family:'Manrope',sans-serif;font-weight:600;transition:all 110ms}
.folder-action.rename{color:var(--text-muted)}
.folder-action.rename:hover{background:var(--fill-hover);border-color:var(--border-strong);color:var(--text-primary)}
.folder-action.del{color:var(--text-muted)}
.folder-action.del:hover{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.3);color:var(--danger)}
.folder-action.add-sub{color:var(--text-muted)}
.folder-action.add-sub:hover{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--accent)}
.folder-row{display:flex;align-items:center;gap:5px;padding:5px 8px;margin:1px 4px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);user-select:none;font-size:12.5px;font-weight:500;color:var(--text-secondary);position:relative}
.folder-row:hover{background:var(--fill);color:var(--text-primary)}
.folder-row.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.folder-row.active:hover{background:var(--accent-soft)}
.folder-chevron{width:12px;height:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted);transition:transform 180ms var(--ease)}
.folder-chevron.open{transform:rotate(90deg)}
.folder-actions{display:none;align-items:center;gap:1px;flex-shrink:0}
.folder-row:hover .folder-actions{display:flex}
.folder-count{font-size:10px;color:var(--text-muted);flex-shrink:0;font-variant-numeric:tabular-nums;transition:opacity 120ms}
.folder-row:hover .folder-count{opacity:0}

/* editor */
.editor-title{background:transparent;border:none;outline:none;font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--text-primary);width:100%;resize:none;line-height:1.25}
.editor-body{background:transparent;border:none;outline:none;font-family:'Manrope',sans-serif;font-size:14.5px;color:var(--text-quaternary);line-height:1.75;width:100%;resize:none;flex:1}
textarea::placeholder{color:var(--text-muted)}
input::placeholder{color:var(--text-muted)}
input:focus,textarea:focus{outline:none}

/* code block */
.code-wrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border-strong);background:var(--bg-sidebar)}
.code-wrap pre[class*=language-]{margin:0;background:var(--bg-sidebar)!important;font-size:12.5px;line-height:1.6}
.code-wrap textarea{position:absolute;inset:0;resize:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;padding:12px 16px;border:none;outline:none;caret-color:var(--text-primary);background:transparent;color:transparent;z-index:1;tab-size:2}

/* tag pill */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;cursor:pointer;transition:transform 140ms var(--ease),filter 140ms var(--ease);white-space:nowrap}
.tag:hover{filter:brightness(1.18)}
.tag:active{transform:scale(.94)}

/* tick */
.tick{width:19px;height:19px;border-radius:var(--r-pill);border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:background 140ms var(--ease),border-color 140ms var(--ease),transform 140ms var(--ease)}
.tick:hover{border-color:var(--accent)}
.tick:active{transform:scale(.88)}
.tick.on{background:var(--accent);border-color:var(--accent)}

/* cal */
.cal-cell{border-radius:var(--r-sm);padding:5px;min-height:72px;cursor:pointer;transition:background 140ms var(--ease);font-size:12px}
@media(max-width:768px){.cal-cell{min-height:44px;padding:3px;font-size:11px}}
.cal-cell:hover{background:var(--fill)}
.cal-cell.today{background:var(--fill)}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal-dot{width:6px;height:6px;border-radius:99px;background:var(--accent);margin:1px 0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn 180ms var(--ease) both;padding:16px}
.modal{background:var(--modal-bg);border:1px solid var(--glass-border);border-radius:var(--r-xl);width:480px;max-width:100%;box-shadow:var(--shadow-3),inset 0 1px 0 var(--hairline);max-height:90vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}

/* misc */
.input{background:var(--fill);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:9px 12px;color:var(--text-primary);font-family:'Manrope',sans-serif;font-size:13px;width:100%;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-ring)}

/* Buttons are capsules. The press state scales down a touch rather than
   changing colour — the same feedback a physical key gives, and what makes
   a tap feel like it landed on a phone where there is no hover. */
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 18px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background var(--dur) var(--ease),transform 140ms var(--ease),box-shadow var(--dur) var(--ease);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--accent-strong);box-shadow:var(--shadow-2)}
.btn-primary:active{transform:scale(.96)}
.btn-primary:focus-visible{outline:none;box-shadow:0 0 0 3.5px var(--accent-ring)}
.btn-primary:disabled{opacity:.45;cursor:default;transform:none}
.btn-ghost{background:var(--fill);color:var(--text-tertiary);border:1px solid var(--glass-edge);border-radius:var(--r-pill);padding:8px 16px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform 140ms var(--ease)}
.btn-ghost:hover{background:var(--fill-hover);color:var(--text-primary)}
.btn-ghost:active{transform:scale(.96)}
.btn-ghost:focus-visible{outline:none;box-shadow:0 0 0 3.5px var(--accent-ring)}
.btn-ghost:disabled{opacity:.45;cursor:default;transform:none}

/* Capsule toggle — the "bubble" used for tag filters and any on/off chip. */
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--glass-edge);background:var(--fill);color:var(--text-secondary);font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform 140ms var(--ease);user-select:none}
.pill:hover{background:var(--fill-hover);color:var(--text-primary)}
.pill:active{transform:scale(.95)}
.pill.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--shadow-1)}
.pill.on:hover{background:var(--accent-strong);color:#fff}
.pill-count{font-size:10.5px;font-weight:700;opacity:.65;font-family:'JetBrains Mono',monospace}

/* macOS segmented control: one recessed track, the selection a raised slug. */
.seg{display:inline-flex;align-items:center;gap:2px;padding:2.5px;border-radius:var(--r-pill);background:var(--fill);border:1px solid var(--hairline)}
.seg > button{background:none;border:none;border-radius:var(--r-pill);padding:5px 13px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);white-space:nowrap}
.seg > button:hover{color:var(--text-primary)}
.seg > button[aria-pressed="true"]{background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hairline)}

/* Floating media player (see MediaPanel). Below modals (z 50) so a dialog
   always covers it; above page content. */
.media-panel{position:fixed;z-index:45;display:flex;flex-direction:column;background:var(--modal-bg);border:1px solid var(--glass-border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-3);overflow:hidden}

/* Glass slider: a capsule track with a white thumb, like the iOS 27 control.
   The fill shows how far toward Tinted it's set. */
.glass-slider{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;--pct:50%}
.glass-slider:focus{outline:none}
.glass-slider::-webkit-slider-runnable-track{height:8px;border-radius:99px;border:1px solid var(--glass-border);
  background:linear-gradient(to right,var(--accent) var(--pct),var(--fill-hover) var(--pct))}
.glass-slider::-moz-range-track{height:8px;border-radius:99px;border:1px solid var(--glass-border);
  background:linear-gradient(to right,var(--accent) var(--pct),var(--fill-hover) var(--pct))}
.glass-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:99px;background:#fff;
  border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 140ms var(--ease)}
.glass-slider::-moz-range-thumb{width:24px;height:24px;border-radius:99px;background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.glass-slider:active::-webkit-slider-thumb{transform:scale(1.08)}
.glass-slider:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3.5px var(--accent-ring),0 1px 3px rgba(0,0,0,.3)}

/* Circular icon button — toolbar affordance, thumb-sized on purpose. */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r-pill);border:none;background:transparent;color:var(--text-secondary);cursor:pointer;flex-shrink:0;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform 140ms var(--ease)}
.icon-btn:hover{background:var(--fill-hover);color:var(--text-primary)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.danger:hover{background:rgba(244,63,94,.14);color:var(--danger)}
.icon-btn svg{width:14px;height:14px}

.tag-scroll{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%)}

/* Row actions stay out of the way until the pointer is on the row — the
   Finder/Mail behaviour. On touch there is no hover, so they stay visible.  */

  const checkDays = Array.from({ length: 14 }, (_, i) => new Date(now + i * 86400000));
  const OFFSETS = [[15, '15 min'], [5, '5 min']];

  // Build a flat event list — meetings and salah treated identically
  const events = [];

  for (const m of meetings) {
    const [h, min] = (m.time || '00:00').split(':').map(Number);
    for (const day of checkDays) {
      if (!occursOnDay(m, day)) continue;
      const dt = new Date(day); dt.setHours(h, min, 0, 0);
      events.push({ id: `meeting-${m.id}-${fmtKey(day)}`, title: m.title, sub: m.attendees || '', at: dt.getTime(), type: 'meeting' });
    }
  }

  if (salah?.enabled && salah.lat != null) {
    /* The 14-day window spans at most two months, so this is one or two
       requests — and normally zero, since the month is already cached. It used
       to be 14 separate per-day calls every time the schedule was rebuilt. */
    const months = [...new Set(checkDays.map(d => fmtKey(d).slice(0, 7)))];
    const loaded = await Promise.all(
      months.map(mKey => loadSalahMonth(`${mKey}-01`, salah).catch(() => null))
    );
    const days = Object.assign({}, ...loaded.map(r => r?.days || {}));
    checkDays.forEach((day) => {
      const pt = salahDayFrom(days, fmtKey(day), salah); if (!pt) return;
      for (const p of PRAYER_NAMES) {
        if (salah.prayers?.[p] === false) continue;
        const t = pt[p]; if (!t || t === '--:--') continue;
        const [h, min] = t.split(':').map(Number);
        const dt = new Date(day); dt.setHours(h, min, 0, 0);
        events.push({ id: `salah-${p}-${fmtKey(day)}`, title: PRAYER_LABELS[p], sub: '', at: dt.getTime(), type: 'salah', prayer: p });
      }
    });
  }

  // Single loop: reminders + at-time for every event
  const notifications = [];
  for (const evt of events) {
    for (const [offset, label] of OFFSETS) {
      const fireAt = evt.at - offset * 60 * 1000;
      if (fireAt > now) notifications.push({
        id: `${evt.id}-${offset}`,
        title: evt.title,
        body: `In ${label}${evt.sub ? ' · ' + evt.sub : ''}`,
        fireAt, type: evt.type,
        ...(evt.prayer ? { prayer: evt.prayer } : {}),
      });
    }
    if (evt.at > now) notifications.push({
      id: `${evt.id}-0`,
      title: evt.title,
      body: evt.type === 'salah' ? 'Prayer time' : `Starting now${evt.sub ? ' · ' + evt.sub : ''}`,
      fireAt: evt.at,
      type: evt.type === 'salah' ? 'salah_athan' : 'meeting',
      ...(evt.prayer ? { prayer: evt.prayer } : {}),
    });
  }

  return notifications;
}

/* True if an existing subscription was created under the VAPID key this build
   still uses. A subscription tied to a stale key (e.g. the key was rotated
   server-side) otherwise just sits there looking healthy while every push to
   it silently fails — there's no browser-side error for that. */
function subMatchesVapidKey(sub) {
  const key = sub?.options?.applicationServerKey;
  if (!key) return false;
  const a = new Uint8Array(key);
  const b = vapidKeyBytes();
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/* Registers this device's push subscription with the server. Registration is
   ALL the client does now — the server derives what to send. Re-running this
   is cheap and also refreshes `updated_at`, which is the liveness signal the
   worker's stale-subscription cleanup relies on, so a device that's genuinely
   in use is never garbage-collected. */
async function registerPush() {
  try {
    const token = localStorage.getItem('folio_token');
    if (!token || !('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub && !subMatchesVapidKey(sub)) {
      await sub.unsubscribe().catch(() => {});
      sub = null;
    }
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidKeyBytes(),
      });
    }
    const res = await fetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    return res.ok;
  } catch {
    return false;
  }
}

async function activatePush() {
  return registerPush();
}

  /* Local timers for while the page is open… */
  if (('Notification' in window) && Notification.permission === 'granted' && navigator.serviceWorker?.controller) {
    const schedule = await buildSchedule(state?.meetings || [], state?.salah);
    navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_NOTIFICATIONS', notifications: schedule });

const STORE     = 'folio_v1';
const TOKEN_KEY = 'folio_token';
const ENDPOINT  = '/api/state';
/* Upper bound on how long a {lazy:true} update (see App's update) may sit
   unsynced. localStorage has it immediately either way. */
const LAZY_SAVE_MS = 20000;

/* The server merges every PUT into the stored blob (functions/api/state.js), so
   a save can no longer clobber another device's concurrent edit. This client
   still merges too — on load, to reconcile the offline cache against remote. */
const Sync = {
  _etag: null,       /* last seen server version, for conditional GETs */
  getToken() { try { const t = localStorage.getItem(TOKEN_KEY); return t ? t.trim() : null; } catch { return null; } },
  /* Changing the token can point at a different store, so drop the cached
     version with it — otherwise a stale If-None-Match could draw a 304 for
     state this client has never actually seen. */

  },
  configured() { return !!this.getToken(); },

     foreground wake on an idle account costs one tiny request instead of
     re-downloading (and re-applying) megabytes of notes on mobile data. */
  async load({ conditional = false } = {}) {
    const token = this.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const headers = { Authorization:`Bearer ${token}` };
    if (conditional && this._etag) headers['If-None-Match'] = this._etag;
    const r = await fetch(ENDPOINT, { headers, cache: 'no-store' });
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (r.status === 304) return null;

    this._etag = r.headers.get('ETag') || this._etag;
    return r.json();
  },
  /* wantMerged asks the server to echo the merged blob back. Worth it on an
     explicit sync (it folds in whatever another device wrote without a second
     round-trip); wasteful on the routine debounced save, which would otherwise
     re-download every note-with-image on every keystroke pause. */
  async save(state, opts={}) {
    const token = this.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const url = ENDPOINT + (opts.wantMerged ? '?return=merged' : '');
    const r = await fetch(url, {
      method: 'PUT',
      headers: { Authorization:`Bearer ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify(state),
      ...(opts.keepalive ? { keepalive: true } : {}),

    if (!r.ok) throw new Error(`HTTP_${r.status}`);

    this._etag = r.headers.get('ETag') || this._etag;
    return r.json().catch(()=>({}));
  },
};

  read() { try { const v=localStorage.getItem(STORE); return v?JSON.parse(v):null; } catch { return null; } },

   Notes carry only { id, key, name, size, type } — the bytes live in R2 and
   never enter the synced state blob. Downloads are fetched with the sync
   token and handed to the viewer as a blob: URL, because an <iframe>/<embed>
   src cannot carry an Authorization header. */
const Files = {
  _urls: new Map(),   /* key → blob: URL, so re-opening a note doesn't refetch */

  async upload(file) {
    const token = Sync.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const r = await fetch('/api/files', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': file.type || 'application/pdf',
        'X-File-Name': encodeURIComponent(file.name || 'document.pdf'),
      },
      body: file,
    });

    if (r.status === 501) throw new Error('NO_BUCKET');

      throw new Error(msg || `HTTP_${r.status}`);

  /* Returns a blob: URL for the stored object, cached per key. */
  async url(key) {

    const token = Sync.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const id = String(key).replace(/^f\//, '');
    const r = await fetch(`/api/files/${id}`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (!r.ok) throw new Error(`HTTP_${r.status}`);

    try {
      await fetch(`/api/files/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    } catch {}
  },

/* Deleting a note must also drop its attachments from R2, or the bucket
   accumulates orphans no UI can ever reach again. Best-effort by design: a
   failed cleanup should never block the delete the user asked for. */

  const set = ids instanceof Set ? ids : new Set([ids]);

    for (const m of n.media || []) for (const p of m.parts || []) Files.remove(p.key);

  if (m === 'UNAUTHORIZED')  return 'Not authorised — check your sync token';

  return m || 'Upload failed';

/* Pull the text out of a PDF for search. Page breaks are kept as headings so
   a long extraction stays navigable once it's in the note body. */
async function extractPdfText(data, onProgress) {
  const lib = await pdfjs();
  /* getDocument consumes (detaches) the buffer it's given, so hand it a copy —
     the same bytes are also uploaded and rendered. */
  const doc = await lib.getDocument({ data: data.slice(0) }).promise;
  const out = [];
  let total = 0, truncated = false;
  for (let p = 1; p <= doc.numPages; p++) {
    onProgress?.(p, doc.numPages);
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const text = content.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
    if (!text) continue;
    const chunk = `\n\n## Page ${p}\n\n${text}`;
    if (total + chunk.length > MAX_PDF_TEXT) { truncated = true; break; }
    out.push(chunk);
    total += chunk.length;
  }
  try { await doc.destroy(); } catch {}
  return {
    text: out.join('').trim(),
    pages: doc.numPages,
    truncated,
  };
}

  if (h < 24) return `${Math.round(h)}h`;
  const d = h / 24;
  if (d < 30) return `${Math.round(d)}d`;
  if (d < 365) return `${Math.round(d / 30 * 10) / 10}mo`;
  return `${Math.round(d / 365 * 10) / 10}y`;
};
const RATINGS = [
  { r:1, label:'Again', key:'1', color:'var(--danger)'  },
  { r:2, label:'Hard',  key:'2', color:'var(--warning)' },
  { r:3, label:'Good',  key:'3', color:'var(--success)' },
  { r:4, label:'Easy',  key:'4', color:'var(--accent)'  },

/* Blank-page recall coverage → FSRS rating for the note's recall card. */
const coverageRating = pct => pct < 40 ? 1 : pct < 70 ? 2 : pct < 90 ? 3 : 4;

const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return +d; };

/* Today's queue: due reviews (oldest due first, capped) then new cards up to
   the daily allowance, minus new cards already introduced today anywhere. */
function buildStudyQueue(state, noteIdSet = null, now = Date.now()) {
  const notesById = new Set((state.notes || []).map(n => n.id));
  const all = (state.cards || []).filter(c => !c.suspended && notesById.has(c.noteId));
  const scoped = noteIdSet ? all.filter(c => noteIdSet.has(c.noteId)) : all;
  const due = scoped.filter(c => c.fsrs?.state !== 0 && c.fsrs?.due <= now)
    .sort((a, b) => (a.kind === 'recall') - (b.kind === 'recall') || a.fsrs.due - b.fsrs.due)
    .slice(0, studyNum(state, 'maxReviews'));
  const today = startOfToday();
  const introduced = all.filter(c => c.firstReview && c.firstReview >= today).length;
  const newLeft = Math.max(0, studyNum(state, 'newPerDay') - introduced);
  const fresh = scoped.filter(c => c.fsrs?.state === 0 && c.kind === 'qa')
    .sort((a, b) => a.created - b.created || (a.id < b.id ? -1 : 1))
    .slice(0, newLeft);
  return { due, fresh, newLeft, queue: [...due, ...fresh], total: scoped.length };
}

/* ── note text ── */
/* The note-body parser, shared by NoteEditor (rendering) and study (plain
   text for the model). Same marker grammar as rebuildBody. */
function parseBody(body) {
  const parts = []; const rest = body || '';
  const re = /```(\w+)?\n([\s\S]*?)```|\[url:(.*?)\|(.*?)\]|\[img:([^\]]+)\]|\[pdf:([^\]]+)\]/g; let m; let last = 0;
  while ((m = re.exec(rest)) !== null) {
    if (m.index > last) parts.push({ type:'text', content:rest.slice(last, m.index) });
    if (m[0].startsWith('```'))
      parts.push({ type:'code', lang:m[1] || 'plaintext', content:m[2].replace(/\n$/, '') });
    else if (m[5] !== undefined)
      parts.push({ type:'image', id:m[5] });
    else if (m[6] !== undefined)
      parts.push({ type:'pdf', id:m[6] });
    else
      parts.push({ type:'link', title:decodeUrlPart(m[3] || ''), url:decodeUrlPart(m[4] || '') });
    last = m.index + m[0].length;
  }
  if (last < rest.length) parts.push({ type:'text', content:rest.slice(last) });
  if (!parts.length) return [{ type:'text', content:'' }];
  if (parts[0].type !== 'text') parts.unshift({ type:'text', content:'' });
  if (parts[parts.length - 1].type !== 'text') parts.push({ type:'text', content:'' });
  return parts;
}

const _studyFileText = new Map();   /* R2 key → extracted text, per session */
async function studyFileText(f) {
  if (_studyFileText.has(f.key)) return _studyFileText.get(f.key);
  const url = await Files.url(f.key);
  const blob = await (await fetch(url)).blob();
  const text = f.type === 'application/pdf'
    ? (await extractPdfText(await blob.arrayBuffer())).text
    : await blob.text();
  _studyFileText.set(f.key, text);
  return text;
}

/* Plain text for the model: markers stripped, images dropped, attached PDF
   text and lecture transcripts (R2, text/plain) appended. A PDF imported as
   a note already has its text in the body ("## Page N"), so it isn't fetched
   twice. Attachment failures (offline, no R2) degrade to body-only. */
async function noteToStudyText(note) {
  const out = [];
  for (const p of parseBody(note.body)) {
    if (p.type === 'text') out.push(p.content);
    else if (p.type === 'code') out.push('```' + p.lang + '\n' + p.content + '\n```');
    else if (p.type === 'link') out.push(`${p.title} (${p.url})`);
  }
  let text = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  const bodyHasPdfText = /## Page \d+/.test(text);
  for (const f of note.files || []) {
    try {
      if (f.type === 'application/pdf' && !bodyHasPdfText) {
        const t = await studyFileText(f);
        if (t) text += `\n\n[Attached PDF: ${f.name}]\n${t}`;
      } else if (f.type === 'text/plain') {
        const t = stripStamps(await studyFileText(f));
        if (t) text += `\n\n[Lecture transcript: ${f.name}]\n${t}`;
      }
    } catch {}
  }
  return text;
}

/* Cheap content fingerprint for "notes changed since cards were made". Body
   only (sync, no network) — attachments rarely change after the fact. */
function fnv32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
const noteHash = n => fnv32(`${n.title || ''}\n${n.body || ''}`);

const estTokens = s => Math.ceil(String(s || '').length / 3.5);
const noteBlock = (note, text) =>
  `=== NOTE id=${note.id} title=${(note.title || 'Untitled').replace(/\s+/g, ' ')} ===\n${text}\n`;

/* Pack note blocks into requests no bigger than the model takes. A note that
   alone exceeds the limit is split on paragraph boundaries (hard-split as a
   last resort), keeping its NOTE header so cards still map back to it. */
function chunkMaterial(blocks, maxTokens) {
  const chunks = [];
  let cur = { material:'', noteIds:[] };
  const flush = () => { if (cur.material) chunks.push(cur); cur = { material:'', noteIds:[] }; };
  const maxChars = Math.floor(maxTokens * 3.5 * 0.9);
  for (const b of blocks) {
    if (estTokens(b.text) <= maxTokens) {
      if (estTokens(cur.material + b.text) > maxTokens) flush();
      cur.material += b.text + '\n';
      if (!cur.noteIds.includes(b.noteId)) cur.noteIds.push(b.noteId);
      continue;
    }
    flush();
    const nl = b.text.indexOf('\n');
    const header = b.text.slice(0, nl);
    const paras = b.text.slice(nl + 1).split(/\n{2,}/).flatMap(p =>
      p.length > maxChars ? p.match(new RegExp(`[\\s\\S]{1,${maxChars}}`, 'g')) : [p]);
    let part = '';
    for (const p of paras) {
      if (part && estTokens(header + part + p) > maxTokens) {
        chunks.push({ material:`${header}\n${part}`, noteIds:[b.noteId] });
        part = '';
      }
      part += p + '\n\n';
    }
    if (part.trim()) chunks.push({ material:`${header}\n${part}`, noteIds:[b.noteId] });
  }
  flush();
  return chunks;
}

/* One request's worth of material for a whole scope (exams): when it won't
   fit, every note keeps an equal share rather than the first notes crowding
   out the rest. */
function fitMaterial(blocks, maxTokens) {
  const all = blocks.map(b => b.text).join('\n');
  if (estTokens(all) <= maxTokens) return all;
  const per = Math.floor(maxTokens * 3.5 * 0.9 / blocks.length);
  return blocks.map(b => b.text.length > per ? b.text.slice(0, per) + '\n[…]\n' : b.text).join('\n');
}

/* ── scopes ── */
function scopeNoteIds(state, scope) {
  const notes = state.notes || [];
  if (!scope) return [];
  if (scope.type === 'note') return notes.some(n => n.id === scope.id) ? [scope.id] : [];
  if (scope.type === 'folder') {
    const ids = new Set(getFolderDescIds(scope.id, state.folders || []));
    return notes.filter(n => ids.has(n.folderId)).map(n => n.id);
  }
  if (scope.type === 'tag') return notes.filter(n => (n.tags || []).includes(scope.id)).map(n => n.id);
  if (scope.type === 'all') return notes.map(n => n.id);

}
function scopeLabel(state, scope) {
  if (!scope) return '';
  if (scope.type === 'note') { const n = state.notes.find(x => x.id === scope.id); return n ? `${n.emoji || '📝'} ${n.title || 'Untitled'}` : 'Deleted note'; }
  if (scope.type === 'folder') { const f = (state.folders || []).find(x => x.id === scope.id); return f ? `📁 ${f.name}` : 'Deleted folder'; }
  if (scope.type === 'tag') return scope.id;

}
/* Plain name for a new set's title (no emoji / icon prefix). */
function scopeTitle(state, scope) {

  if (scope.type === 'folder') return (state.folders || []).find(x => x.id === scope.id)?.name || 'Folder';

const sameScope = (a, b) => a && b && a.type === b.type && (a.id || null) === (b.id || null);

/* ── answers ── */
const normalizeAnswer = s => String(s || '').toLowerCase()
  .replace(/[‘’]/g, "'").replace(/[^\p{L}\p{N}\s.]/gu, ' ')
  .replace(/\b(the|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim();
function levenshtein(a, b) {
  if (a === b) return 0;
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diag = prev[0]; prev[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
      diag = tmp;
    }
  }
  return prev[b.length];
}
/* Free local check before any AI call: an exact or near-exact match on a
   short answer is unambiguous. Long answers always go to the model, because
   string similarity can't judge an explanation. */
function fuzzyMatch(typed, expected) {
  const a = normalizeAnswer(typed), b = normalizeAnswer(expected);
  if (!a || !b) return false;
  if (a === b) return true;
  if (b.length > 40) return false;
  return 1 - levenshtein(a, b) / Math.max(a.length, b.length) >= 0.85;
}

/* ── API ── */
const StudyAPI = {
  async call(action, { method = 'POST', body, headers = {}, raw = false } = {}) {
    const token = Sync.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const r = await fetch(`/api/study/${action}`, {
      method,
      headers: { Authorization:`Bearer ${token}`, ...(raw ? {} : { 'Content-Type':'application/json' }), ...headers },
      body: raw ? body : (body === undefined ? undefined : JSON.stringify(body)),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (!r.ok) {
      const e = new Error(data.message || data.error || `HTTP_${r.status}`);
      e.code = data.error; e.status = r.status;
      throw e;
    }
    return data;
  },
  generate(body) { return this.call('generate', { body }); },
  jobs()         { return this.call('jobs', { method:'GET' }); },
  ack(ids)       { return this.call('ack', { body:{ ids } }); },
  check(body)    { return this.call('check', { body }); },
  recall(body)   { return this.call('recall', { body }); },
  mark(body)     { return this.call('mark', { body }); },
  ping(deep)     { return this.call(`ping${deep ? '?deep=1' : ''}`, { method:'GET' }); },
  usage()        { return this.call(`usage?tz=${new Date().getTimezoneOffset()}`, { method:'GET' }); },
  youtube(id)    { return this.call(`youtube?v=${encodeURIComponent(id)}`, { method:'GET' }); },
  /* Transcribe one window of a YouTube video with Gemini. The server answers
     at once with a stream of {"type":"ping"} lines (every 10 s) and then one
     {"type":"done"} or {"type":"error"} line — so a minutes-long job never
     looks idle to Cloudflare. onPing(seconds) reports progress. */
  async ytStream(v, start, end, onPing) {
    const token = Sync.getToken();
    if (!token) throw new Error('NO_TOKEN');
    const r = await fetch(`/api/study/ytStream?v=${encodeURIComponent(v)}&start=${start}&end=${end}`, { headers: { Authorization:`Bearer ${token}` } });
    if (r.status === 401) throw new Error('UNAUTHORIZED');
    if (!r.ok || !r.body) {
      const data = await r.json().catch(() => ({}));
      const e = new Error(data.message || data.error || `HTTP_${r.status}`);
      e.code = data.error; e.status = r.status;
      throw e;
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', final = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });

      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        let m; try { m = JSON.parse(line); } catch { continue; }
        if (m.type === 'ping') onPing?.(m.s); else final = m;
      }
    }
    if (!final) { const e = new Error('The connection dropped while Gemini was working'); e.code = 'dropped'; throw e; }
    if (final.type === 'error') { const e = new Error(final.message); e.code = final.code; e.status = final.status; throw e; }
    return final;
  },
  transcribe(blob, prompt) {
    return this.call('transcribe', {
      raw: true, body: blob,
      headers: { 'Content-Type': (blob.type || 'audio/webm').split(';')[0], 'X-Prompt': encodeURIComponent(String(prompt || '').slice(-400)) },
    });

};
const studyErrorLabel = err => {
  const m = err?.message;
  if (m === 'NO_TOKEN') return 'Set up sync first — study features run through your Cloudflare account (Admin → Sync)';
  if (m === 'UNAUTHORIZED') return 'Not authorised — check your sync token';
  if (err?.code === 'not_configured') return `${m} — see SETUP.md → Study & AI`;
  if (m === 'Failed to fetch' || m === 'Load failed') return 'Offline — this needs a connection';
  return m || 'Something went wrong';

/* ── importing AI results into synced state ──
   Ids are derived from the job, so importing the same result twice (two
   devices, or a retry) is a no-op. Cards deleted since are respected via
   the tombstone list. */
function importStudyResult(state, update, { jobId, setId, kind, chunk = 0, data, noteIds = [] }) {
  const now = Date.now();
  const validIds = new Set(noteIds.length ? noteIds : (state.notes || []).map(n => n.id));
  const fallbackNote = noteIds[0] || null;
  const deleted = new Set((state.cardsDeleted || []).map(t => t.id));
  let added = 0;

  if (kind === 'flashcards') {
    const fresh = (data.cards || []).map((c, i) => ({
      id: `c_${jobId}_${chunk}_${i}`, kind:'qa',
      noteId: validIds.has(c.noteId) ? c.noteId : fallbackNote,
      front: String(c.front).trim(), back: String(c.back).trim(),
      fsrs: newCardFsrs(now), firstReview: null, suspended: false, jobId, created: now, updated: now,
    })).filter(c => c.noteId && !deleted.has(c.id));
    added = fresh.length;
    update('cards', prev => {
      const have = new Set((prev || []).map(c => c.id));
      return [...(prev || []), ...fresh.filter(c => !have.has(c.id))];
    });
  } else if (kind === 'quiz' || kind === 'exam') {
    if (!setId) return 0;
    /* A set created moments ago may not be in this snapshot yet — the
       updater below still finds it, so only the count falls back. */
    const set = (state.studySets || []).find(s => s.id === setId) || { quiz:[], exams:[] };
    /* Counted against the snapshot: the updater below runs later. */
    added = kind === 'quiz'
      ? (data.questions || []).filter((_, i) => !(set.quiz || []).some(q => q.id === `q_${jobId}_${chunk}_${i}`)).length
      : ((set.exams || []).some(e => e.id === `e_${jobId}`) ? 0 : 1);
    update('studySets', prev => (prev || []).map(s => {
      if (s.id !== setId) return s;
      if (kind === 'quiz') {
        const have = new Set((s.quiz || []).map(q => q.id));
        const qs = (data.questions || []).map((q, i) => ({ ...q, id:`q_${jobId}_${chunk}_${i}` })).filter(q => !have.has(q.id));
        return { ...s, quiz: [...(s.quiz || []), ...qs], updated: now };
      }
      const id = `e_${jobId}`;
      if ((s.exams || []).some(e => e.id === id)) return s;
      return { ...s, exams: [...(s.exams || []), {
        id, title: data.title || 'Mock exam', durationMin: data.durationMin || 30,
        questions: data.questions || [], attempts: [], created: now,
      }], updated: now };
    }));
  } else if (kind === 'smartNotes') {
    const noteId = fallbackNote;
    if (!noteId) return 0;
    added = 1;
    update('notes', prev => prev.map(n => {
      if (n.id !== noteId || n.smartNotesJob === jobId) return n;
      const body = [data.markdown?.trim(), n.body?.trim()].filter(Boolean).join('\n\n---\n\n');
      return { ...n, title: n.title?.trim() ? n.title : (data.title || n.title), body, smartNotesJob: jobId, updated: now };
    }));
  }
  return added;
}

/* Plan and run a generation for a set. Batch-mode kinds go out as ONE
   Anthropic batch (results arrive later via the jobs poll); live kinds run
   one chunk per request so a phone dropping the connection only loses one
   chunk, and the server's per-chunk record makes a retry free. */
async function runStudyGeneration({ state, update, setId, kinds, noteIds, overrides = {}, title = '', newOnly = true, examOptions, onProgress }) {
  const notesById = new Map(state.notes.map(n => [n.id, n]));
  const set = (state.studySets || []).find(s => s.id === setId);
  onProgress?.('Reading notes…');
  const texts = [];
  for (const id of noteIds) {
    const n = notesById.get(id);
    if (!n) continue;
    const t = await noteToStudyText(n);
    if (t.trim()) texts.push({ note: n, text: t, hash: noteHash(n) });
  }
  if (!texts.length) throw new Error('Nothing to study — the selected notes are empty');

  const activeCards = (state.cards || []).length;
  const jobId = crypto.randomUUID();
  const plan = [];
  for (const kind of kinds) {
    const cfg = { ...studyCfg(state, kind), ...(overrides[kind] || {}) };
    const m = studyModel(cfg.model);
    const batch = !!cfg.batch && m.batch && studyKind(kind).batchable;
    let sel = texts;
    if (kind === 'flashcards' && newOnly) {
      sel = texts.filter(t => set?.sourceHashes?.[t.note.id] !== t.hash
        || !(state.cards || []).some(c => c.noteId === t.note.id && c.kind === 'qa'));
      if (activeCards >= MAX_ACTIVE_CARDS) throw new Error(`You have ${activeCards} cards — delete some before generating more (limit ${MAX_ACTIVE_CARDS})`);
    }
    if (!sel.length) continue;
    const blocks = sel.map(t => ({ noteId: t.note.id, text: noteBlock(t.note, t.text) }));
    /* Exams are one paper over the whole scope; smart notes are one write-up
       per note; cards and quizzes pack notes into as few requests as fit. */
    const chunks = kind === 'exam'
      ? [{ material: fitMaterial(blocks, m.maxChunkTokens), noteIds: blocks.map(b => b.noteId) }]
      : kind === 'smartNotes'
        ? blocks.map(b => ({ material: fitMaterial([b], m.maxChunkTokens), noteIds:[b.noteId] }))
        : chunkMaterial(blocks, m.maxChunkTokens);
    plan.push({ kind, model: cfg.model, batch, chunks: chunks.map(c => ({
      ...c,
      existingFronts: kind === 'flashcards'
        ? (state.cards || []).filter(x => x.kind === 'qa' && c.noteIds.includes(x.noteId)).map(x => x.front).slice(0, 300)
        : [],
      options: kind === 'exam' ? (examOptions || {}) : {},
    })) });
  }
  if (!plan.length) return { jobId, submitted: false, added: {}, cost: 0, upToDate: true };

  /* Same model + same material in 2+ requests → worth a cache write. */
  const sameModel = new Map();
  plan.filter(p => !p.batch).forEach(p => sameModel.set(p.model, (sameModel.get(p.model) || 0) + 1));

  const batchItems = plan.filter(p => p.batch).flatMap(p => p.chunks.map((c, i) => ({
    kind: p.kind, model: p.model, chunk: i, noteIds: c.noteIds,
    payload: { material: c.material, existingFronts: c.existingFronts, options: c.options },
  })));
  let submitted = false;
  if (batchItems.length) {
    onProgress?.('Sending to the batch queue…');
    await StudyAPI.generate({ jobId, setId, title, mode:'batch', items: batchItems });
    submitted = true;
  }

  const added = {}; let cost = 0; const errors = [];
  for (const p of plan.filter(p => !p.batch)) {
    for (let i = 0; i < p.chunks.length; i++) {
      const c = p.chunks[i];
      onProgress?.(`${studyKind(p.kind).label}${p.chunks.length > 1 ? ` (${i + 1}/${p.chunks.length})` : ''} · ${studyModel(p.model).short}…`);
      try {
        const res = await StudyAPI.generate({
          jobId, setId, title, mode:'live', cache: (sameModel.get(p.model) || 0) > 1,
          items: [{ kind: p.kind, model: p.model, chunk: i, noteIds: c.noteIds,
                    payload: { material: c.material, existingFronts: c.existingFronts, options: c.options } }],
        });
        added[p.kind] = (added[p.kind] || 0) + importStudyResult(state, update, { jobId, setId, kind: p.kind, chunk: i, data: res.result, noteIds: c.noteIds });
        cost += res.cost || 0;
      } catch (e) {
        errors.push(`${studyKind(p.kind).label}: ${studyErrorLabel(e)}`);
      }
    }
  }

  /* Remember what the cards were made from, so the set can flag edits. */
  const hashed = plan.some(p => p.kind === 'flashcards');
  if (hashed && setId) {
    const hashes = Object.fromEntries(texts.map(t => [t.note.id, t.hash]));
    update('studySets', prev => (prev || []).map(s => s.id === setId
      ? { ...s, sourceHashes: { ...(s.sourceHashes || {}), ...hashes }, updated: Date.now() } : s));
  }
  if (errors.length && !submitted && !Object.keys(added).length) throw new Error(errors.join(' · '));
  return { jobId, submitted, added, cost, errors };
}

/* A finished batch job from /api/study/jobs → state. */
function importStudyJob(state, update, job) {
  const added = {};
  for (const it of job.result?.items || []) {
    if (!it.ok) continue;
    added[it.kind] = (added[it.kind] || 0) + importStudyResult(state, update, {
      jobId: job.id, setId: job.setId, kind: it.kind, chunk: it.chunk, data: it.data, noteIds: it.noteIds || [],
    });
  }
  return added;
}
const describeAdded = added => Object.entries(added || {}).filter(([, n]) => n > 0).map(([k, n]) =>
  k === 'flashcards' ? `${n} card${n === 1 ? '' : 's'}` :
  k === 'quiz' ? `${n} quiz question${n === 1 ? '' : 's'}` :
  k === 'exam' ? 'a mock exam' : k === 'smartNotes' ? 'smart notes' : `${n} ${k}`).join(', ');

/* ── recordings: segments are kept in IndexedDB until transcribed, so a
   crash or a killed tab loses at most the segment in progress. ── */
const RecStore = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((resolve, reject) => {
      const req = indexedDB.open('folio-recordings', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('segments', { keyPath:'key' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { this._db = null; reject(req.error); };
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const t = db.transaction('segments', mode);
      const out = fn(t.objectStore('segments'));
      t.oncomplete = () => resolve(out?.result ?? out);
      t.onerror = () => reject(t.error);
    });
  },
  put(rec)  { return this.tx('readwrite', s => s.put(rec)).catch(() => {}); },
  del(key)  { return this.tx('readwrite', s => s.delete(key)).catch(() => {}); },
  async all() { try { return (await this.tx('readonly', s => s.getAll())) || []; } catch { return []; } },
};
const pickAudioMime = () => {
  if (typeof MediaRecorder === 'undefined') return null;
  return ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm']
    .find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
};
/* Strip a WebVTT / SRT caption file (e.g. YouTube "Show transcript" or a
   downloaded .vtt) down to its spoken text. */
function captionsToText(raw) {
  return String(raw || '')
    .replace(/^WEBVTT.*$/m, '')
    .split(/\r?\n/)
    .filter(l => !/^\s*\d+\s*$/.test(l) && !/-->/.test(l) && !/^(NOTE|STYLE|Kind:|Language:)/.test(l.trim()))
    .map(l => l.replace(/<[^>]+>/g, '').replace(/^\s*\d{1,2}:\d{2}(:\d{2})?\s*/, '').trim())
    .filter(Boolean)
    .filter((l, i, a) => l !== a[i - 1])
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
}
/* ── media: transcripts with timestamps, YouTube links, saving a source ──
   A transcript is stored as plain text, one phrase per line, each optionally
   prefixed "[m:ss]" or "[h:mm:ss]". That one format is what clicking a line
   to seek uses, what the study generator reads (with the stamps stripped),
   and what a human sees in the note — no JSON sidecar to keep in step. */
const YT_ID_RE = /^[A-Za-z0-9_-]{11}$/;
function parseYouTubeId(input) {
  const s = String(input || '').trim();
  if (YT_ID_RE.test(s)) return s;
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  let id = null;
  if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?]+)/); if (m) id = m[1]; }
  }
  return id && YT_ID_RE.test(id) ? id : null;
}

const fmtClock = sec => {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
};
const clockToSec = c => String(c).split(':').reduce((a, p) => a * 60 + (+p), 0);
const STAMP_LINE = /^\[(\d{1,2}(?::\d{2}){1,2})\][ \t]*(.*)$/;

const formatTranscript = lines =>
  lines.map(l => l.t == null ? l.text : `[${fmtClock(l.t)}] ${l.text}`).join('\n');
const parseTranscript = text => String(text || '').split(/\r?\n/).map(l => {
  const m = l.match(STAMP_LINE);
  return m ? { t: clockToSec(m[1]), text: m[2] } : { t: null, text: l };
}).filter(l => l.text.trim());
/* The model doesn't need (and shouldn't be charged for) the timestamps. */
const stripStamps = text => String(text || '').replace(/^\[\d{1,2}(?::\d{2}){1,2}\][ \t]*/gm, '');

/* Pasted text → [{t, text}]. Understands: WebVTT/SRT caption files; the
   transcript panel copied from YouTube (a timestamp on its own line, or
   "0:12 text" on one line); and plain text, which keeps its own lines. */
function parsePastedTranscript(raw) {
  const src = String(raw || '').replace(/\r/g, '');
  if (/-->/.test(src)) {
    const lines = [];
    for (const block of src.split(/\n{2,}/)) {
      const ls = block.split('\n');
      const i = ls.findIndex(l => /-->/.test(l));
      if (i < 0) continue;
      const m = ls[i].match(/(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,]\d+)?\s*-->/);
      if (!m) continue;
      const text = ls.slice(i + 1).join(' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
      if (text) lines.push({ t: (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]), text });
    }
    /* YouTube auto-captions repeat the previous cue. */
    return lines.filter((l, i, a) => !i || l.text !== a[i - 1].text);
  }
  const STAMP = /^(\d{1,2}(?::\d{2}){1,2})$/, INLINE = /^(\d{1,2}(?::\d{2}){1,2})\s+(\S.*)$/;
  const timed = [];
  let t = null, buf = [];
  const flush = () => { if (buf.length) { timed.push({ t, text: buf.join(' ').replace(/\s+/g, ' ').trim() }); buf = []; } };
  for (const rawLine of src.split('\n')) {
    const l = rawLine.trim();
    if (!l) continue;
    let m;
    if ((m = l.match(STAMP))) { flush(); t = clockToSec(m[1]); }
    else if ((m = l.match(INLINE))) { flush(); t = clockToSec(m[1]); buf.push(m[2]); }
    else buf.push(l);
  }
  flush();
  if (timed.some(l => l.t != null)) return timed.filter(l => l.text);
  return src.split('\n').map(l => ({ t: null, text: l.trim() })).filter(l => l.text);
}

/* Which transcript file belongs to a media item. New items carry the key of the
   transcript saved with them; notes made before that (or a lone transcript)
   fall back to the note's first text file — unless some item is keyed, in which
   case an unkeyed one has no transcript rather than borrowing another's. */
function mediaTranscriptFile(note, item) {
  const files = (note?.files || []).filter(f => f.type === 'text/plain');
  if (item?.transcriptKey) return files.find(f => f.key === item.transcriptKey) || null;
  return (note?.media || []).some(m => m.transcriptKey) ? null : (files[0] || null);
}

const fileSafe = s => (String(s || '').replace(/[^\w\- ]+/g, '').trim() || 'transcript').slice(0, 80);

/* The transcript lives in R2 as text/plain — an hour of speech is ~50 KB,
   too much to keep in the synced blob. */
async function uploadTranscriptFile(title, lines) {
  const transcript = formatTranscript(lines);
  const meta = await Files.upload(new File([transcript], `${fileSafe(title)}.txt`, { type:'text/plain' }));
  _studyFileText.set(meta.key, transcript);
  return { id: uid(), key: meta.key, name: meta.name, size: meta.size, type:'text/plain', uploadedAt: Date.now() };
}

/* A source (recording, video, captions) becomes a note. `media` items
   ({kind:'audio'|'youtube', …}) are what the floating player plays. Falls
   back to the note body when R2 isn't set up. */
async function createTranscriptNote({ update, title, lines = [], folderId = null, emoji = '🎙️', media = [] }) {
  const now = Date.now();
  const note = { id: uid(), emoji, title: title || 'Lecture', body:'', tags:[], links:[], images:[], files:[], media, folderId, created: now, updated: now };
  if (lines.length) {
    try {
      note.files = [await uploadTranscriptFile(title, lines)];
      note.media = note.media.map(m => ({ ...m, transcriptKey: note.files[0].key }));
    } catch {
      note.body = `## Transcript\n\n${formatTranscript(lines)}`;
    }
  }
  update('notes', prev => [note, ...prev]);
  return note;
}

/* ── per-item last-write-wins merge with soft-delete tombstones ──
   Used for notes/tasks/meetings/journal during sync merges. For every id seen in any
   of the four inputs, whichever has the LATEST timestamp wins: a newer edit beats an
   older tombstone (so editing something after an unaware device deleted it effectively
   undeletes it — expected last-write-wins behavior, not a bug), and a newer tombstone
   beats an older edit (so a delete that's genuinely the most recent action sticks).
   Tombstones older than TOMBSTONE_TTL_MS are pruned so they don't grow unbounded. */
const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000; // 90 days
function mergeById(localItems, remoteItems, localTombstones, remoteTombstones) {
  const winners = new Map();
  const consider = (id, ts, kind, value) => {
    const cur = winners.get(id);
    if (!cur || ts >= cur.ts) winners.set(id, { ts, kind, value }); // local wins exact ties (processed 2nd)
  };
  (remoteItems||[]).forEach(it => consider(it.id, it.updated||0, 'item', it));
  (localItems||[]).forEach(it => consider(it.id, it.updated||0, 'item', it));
  (remoteTombstones||[]).forEach(t => consider(t.id, t.deletedAt||0, 'tomb', t));
  (localTombstones||[]).forEach(t => consider(t.id, t.deletedAt||0, 'tomb', t));
  const items = [], tombstones = [];
  const now = Date.now();
  for (const w of winners.values()) {
    if (w.kind === 'item') items.push(w.value);
    else if (now - (w.value.deletedAt||0) <= TOMBSTONE_TTL_MS) tombstones.push(w.value);
  }
  return { items, tombstones };
}

/* Collections that carry soft-delete tombstones — see mergeById above. */
const TOMBSTONE_COLLECTIONS = ['notes','tasks','meetings','journal','cards','studySets','studyFolders'];

/* Restoring a full-state backup (Admin → Data → Import) is a deliberate
   "make the app look like this snapshot" action, unlike a routine sync merge
   where absence never means delete (a device just hasn't heard about the
   item yet). Anything the imported snapshot dropped needs an explicit
   tombstone here, or it would simply survive the next sync merge instead of
   propagating as a delete — the exact resurrection bug c76ba11 already fixed
   for normal deletes. */
function tombMissing(prevState, nextState) {
  const now = Date.now();
  const out = { ...nextState };
  TOMBSTONE_COLLECTIONS.forEach(key => {
    const tKey = key + 'Deleted';
    const nextIds = new Set((nextState[key]||[]).map(x=>x.id));
    const missing = (prevState[key]||[]).filter(x=>!nextIds.has(x.id));
    if (!missing.length) return;
    out[tKey] = [...(nextState[tKey]||[]), ...missing.map(x=>({id:x.id, deletedAt:now}))];
  });
  return out;
}

/* ── themes (device-local — never synced through Sync/Cache/SEED) ── */
const THEME_KEY = 'folio_theme';
const THEMES = {

  ghibli: { label:'Ghibli Café', swatch:['#f2e4c9','#fbf3e2','#7a9e6f'] },
};
const ThemePref = {
  get() { try { const t = localStorage.getItem(THEME_KEY); return THEMES[t] ? t : 'dark'; } catch { return 'dark'; } },
  set(id) { try { localStorage.setItem(THEME_KEY, THEMES[id] ? id : 'dark'); } catch {} },

}

/* ── glass clarity (device-local — never synced) ──
   Web apps can't read iOS's own Liquid Glass slider, so Folio has its own:
   0 = Ultra Clear … 100 = Tinted. Stored as a whole number; applied as the
   --glass CSS variable that every glass surface derives from. */
const GLASS_KEY = 'folio_glass';
const GLASS_DEFAULT = 72;
const GlassPref = {
  get() {
    try {
      const v = localStorage.getItem(GLASS_KEY);
      if (v === null) return GLASS_DEFAULT;
      const n = Number(v);
      return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : GLASS_DEFAULT;
    } catch { return GLASS_DEFAULT; }
  },
  set(n) { try { localStorage.setItem(GLASS_KEY, String(Math.max(0, Math.min(100, Math.round(n))))); } catch {} },
};
function applyGlass(n) {
  document.documentElement.style.setProperty('--glass', String(Math.max(0, Math.min(100, n)) / 100));
}

/* ── open note tabs + full view (device-local — never synced) ──
   Deliberately NOT part of state.ui, which syncs: which notes you have open is
   a per-device workspace, and syncing it would rearrange your laptop's tabs
   every time you opened a note on your phone. Same reasoning as theme and
   background above. */
const TABS_KEY     = 'folio_note_tabs';
const FULLVIEW_KEY = 'folio_note_fullview';
/* A cap, because tabs are opened implicitly (any note you view becomes one) and
   an unbounded strip would eventually be unusable. Oldest is evicted first. */
const MAX_NOTE_TABS = 12;
const NoteTabsPref = {
  get() {
    try {
      const v = JSON.parse(localStorage.getItem(TABS_KEY));
      return Array.isArray(v) ? v.filter(x => typeof x === 'string').slice(-MAX_NOTE_TABS) : [];
    } catch { return []; }
  },
  set(ids) { try { localStorage.setItem(TABS_KEY, JSON.stringify(ids.slice(-MAX_NOTE_TABS))); } catch {} },
};
const FullViewPref = {
  get() { try { return localStorage.getItem(FULLVIEW_KEY) === '1'; } catch { return false; } },
  set(on) { try { on ? localStorage.setItem(FULLVIEW_KEY, '1') : localStorage.removeItem(FULLVIEW_KEY); } catch {} },
};
/* Full view only actually applies on the notes view with a live note open —
   stripping the chrome off any other screen would leave nothing on it and no
   way back. Shared by the render and the body-class effect so the two can't
   disagree about when it's active.
   Desktop-only: on mobile the note editor is already full-bleed (see the
   isMobile branch in NotesView), so this flag would only strip the bottom
   nav bar and the note-list back button's headroom — turning "hide the
   sidebar" into "strand the user with no way to close the note." A stale
   'true' left over in localStorage from a stray tap is ignored on mobile
   rather than honoured. */
const isNotesFullView = (fullView, state, isMobile) =>
  !isMobile && !!fullView && state?.ui?.view === 'notes' && !!state?.ui?.noteId
  && (state?.notes || []).some(n => n.id === state.ui.noteId);

/* ── Salah (prayer time) — AlAdhan API ── */
const SALAH_METHODS = {
  mwl:     { name:'Muslim World League',                id:3 },
  isna:    { name:'ISNA (North America)',               id:2 },
  egypt:   { name:'Egyptian General Authority',         id:5 },
  makkah:  { name:"Umm Al-Qura (Makkah)",              id:4 },
  karachi: { name:'University of Karachi',               id:1 },
  tehran:  { name:'Geophysics Inst. Tehran',             id:7 },
};
const PRAYER_NAMES  = ['fajr','sunrise','dhuhr','asr','maghrib','isha'];
const PRAYER_LABELS = { fajr:'Fajr', sunrise:'Sunrise (Shuruq)', dhuhr:'Dhuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };
/* Aladhan returns capitalised keys; Folio uses lowercase internally. */
const ALADHAN_KEY = { fajr:'Fajr', sunrise:'Sunrise', dhuhr:'Dhuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };

const SALAH_MONTH_PFX = 'folio_salah_cal_';
/* Keys from the superseded one-request-per-day scheme: folio_salah_<date>_… */
const SALAH_LEGACY_DAY_RE = /^folio_salah_\d{4}-\d{2}-\d{2}_/;
/* Budgeted so a dead network resolves to a definite error in ~17s rather than
   hanging: two tries, each hard-capped, one short backoff. */
const SALAH_TIMEOUT_MS    = 8000;
const SALAH_ATTEMPTS      = 2;
/* A month's timetable is fixed, but re-validate daily so a changed method or a
   corrected upstream table doesn't sit stale for weeks. */
const SALAH_REVALIDATE_MS = 24 * 60 * 60 * 1000;
const SALAH_OFFSET_LIMIT  = 60;

const salahMethodId = m => (SALAH_METHODS[m] || SALAH_METHODS.mwl).id;
const salahSchoolId = a => (a === 'hanafi' ? 1 : 0);

/* Per-prayer adjustment in minutes — e.g. praying Dhuhr with a jama'ah that
   starts 5 minutes after the calculated time. Applied to the API response
   rather than through Aladhan's `tune` parameter, so changing an offset never
   invalidates a cached timetable. */
function salahOffsets(salah) {
  const out = {};
  for (const p of PRAYER_NAMES) {
    const v = Number(salah?.offsets?.[p]);
    out[p] = Number.isFinite(v) ? Math.max(-SALAH_OFFSET_LIMIT, Math.min(SALAH_OFFSET_LIMIT, Math.round(v))) : 0;
  }
  return out;
}

/* Aladhan returns "HH:MM (TZ)" → "HH:MM" with the offset applied. Clamped into
   the day: an offset is meant to be a nudge, and letting one spill past
   midnight would silently move a prayer to the wrong date. */
function salahHM(raw, offsetMin) {
  if (!raw) return null;
  const [h, m] = String(raw).split(' ')[0].split(':').map(Number);
  if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
  const mins = Math.max(0, Math.min(24 * 60 - 1, h * 60 + m + (Number(offsetMin) || 0)));
  return `${String(Math.floor(mins / 60)).padStart(2,'0')}:${String(mins % 60).padStart(2,'0')}`;
}

/* Aladhan's monthly calendar → { 'YYYY-MM-DD': rawTimings }. One request covers
   a whole month, so ordinary day-to-day use needs no network at all and a blip
   on any given morning can't leave the app without prayer times. */
function parseSalahCalendar(payload) {
  const days = {};
  for (const entry of payload?.data || []) {
    /* gregorian.date is DD-MM-YYYY */
    const [d, mo, y] = String(entry?.date?.gregorian?.date || '').split('-');
    if (!y || !mo || !d || !entry?.timings) continue;
    days[`${y}-${mo}-${d}`] = entry.timings;
  }
  return days;
}

const monthCacheKey = (lat, lon, y, mo, m, s) =>
  `${SALAH_MONTH_PFX}${y}-${String(mo).padStart(2,'0')}_${Number(lat).toFixed(3)}_${Number(lon).toFixed(3)}_m${m}_s${s}`;

/* Drop timetables for other months/locations so localStorage doesn't grow
   without bound, and sweep away the old per-day keys. */
function pruneSalahCache(keepKeys) {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (SALAH_LEGACY_DAY_RE.test(k)) { localStorage.removeItem(k); continue; }
      if (k.startsWith(SALAH_MONTH_PFX) && !keepKeys.includes(k)) localStorage.removeItem(k);
    }
  } catch {}
}

/* One month of prayer times, with a hard timeout and a retry. fetch() alone has
   no timeout: a request that never settles is what leaves the UI saying
   "fetching…" forever with nothing to act on. */
async function fetchSalahMonth({ lat, lon, y, mo, method, school }) {
  let lastErr = new Error('unreachable');
  for (let attempt = 0; attempt < SALAH_ATTEMPTS; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 800 * 2 ** (attempt - 1)));
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), SALAH_TIMEOUT_MS);
    try {
      const r = await fetch(
        `https://api.aladhan.com/v1/calendar/${y}/${mo}?latitude=${lat}&longitude=${lon}&method=${method}&school=${school}`,
        { signal: ctl.signal },
      );
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const days = parseSalahCalendar(await r.json());
      if (!Object.keys(days).length) throw new Error('empty timetable');
      return days;
    } catch (e) {
      lastErr = e?.name === 'AbortError' ? new Error('timed out') : e;
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

/* Resolve the month covering `dateKey`, preferring cache. Returns
   { days, at, source } or throws when there's nothing usable at all. */
async function loadSalahMonth(dateKey, { lat, lng, method, asr }, { force = false } = {}) {
  if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) throw new Error('No location set');
  const [y, mo] = dateKey.split('-').map(Number);
  const m = salahMethodId(method), s = salahSchoolId(asr);
  const key = monthCacheKey(lat, lng, y, mo, m, s);

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
  const fresh = cached?.days && Date.now() - (cached.at || 0) < SALAH_REVALIDATE_MS;
  if (fresh && !force) return { days: cached.days, at: cached.at, source: 'cache' };

  try {
    const days = await fetchSalahMonth({ lat, lon: lng, y, mo, method: m, school: s });
    const at = Date.now();
    try { localStorage.setItem(key, JSON.stringify({ at, days })); } catch {}
    /* Keep the current month too, so paging across a month boundary and back
       doesn't evict the timetable today's own reminders are built from. */
    const [ty, tmo] = todayKey().split('-').map(Number);
    pruneSalahCache([key, monthCacheKey(lat, lng, ty, tmo, m, s)]);
    return { days, at, source: 'live' };
  } catch (e) {
    /* A stale timetable is far better than none — prayer times for a fixed
       location barely move day to day, and the month is already downloaded. */
    if (cached?.days) return { days: cached.days, at: cached.at || 0, source: 'stale', error: e.message };
    throw e;
  }
}

/* Pull one day out of an already-loaded month, applying the user's offsets. */
function salahDayFrom(days, dateKey, salah) {
  const raw = days?.[dateKey];
  if (!raw) return null;
  const offsets = salahOffsets(salah);
  const out = {};
  for (const p of PRAYER_NAMES) out[p] = salahHM(raw[ALADHAN_KEY[p]], offsets[p]) || '--:--';
  return out;
}

/* Prayer times for one day, plus a status the UI can always say something
   definite about: what happened, when, and whether it came from the network or
   the cache. A bare "loading" with no resolution was the old failure mode. */
function useSalahTimes(dateKey, salah) {
  const [times, setTimes]   = React.useState(null);
  const [status, setStatus] = React.useState({ state:'idle', at:0, source:null, message:null });
  const reqSeq = React.useRef(0);

  const load = React.useCallback(async (force = false) => {
    if (!salah?.enabled || salah.lat == null || salah.lng == null) {
      setTimes(null); setStatus({ state:'idle', at:0, source:null, message:null });
      return;
    }
    const seq = ++reqSeq.current;
    const live = () => seq === reqSeq.current; /* a newer request supersedes this one */
    setStatus(st => ({ ...st, state:'loading', message:null }));
    try {
      const { days, at, source, error } = await loadSalahMonth(dateKey, salah, { force });
      if (!live()) return;
      setTimes(salahDayFrom(days, dateKey, salah));
      setStatus(source === 'stale'
        ? { state:'stale', at, source:'cache', message:error }
        : { state:'ok', at, source, message:null });
    } catch (e) {
      if (!live()) return;
      setTimes(null);
      setStatus({ state:'error', at:Date.now(), source:null, message:e.message });
    }
  }, [dateKey, salah?.enabled, salah?.lat, salah?.lng, salah?.method, salah?.asr,
      /* offsets are applied locally — re-derive without refetching */
      JSON.stringify(salah?.offsets || {})]);

  React.useEffect(() => { load(false); }, [load]);

  return { times, status, retry: () => load(true) };
}

/* Hue only — the lightness a tag needs depends on what it sits on, so it's
   applied per theme below rather than baked into a hex here. A pastel that
   reads well on near-black is close to invisible on the cream theme. */
const TAG_HUES = { '#getting-started':239,'#work':189,'#personal':160,'#ideas':38,'#meeting':350,'#gratitude':45,'#reflection':199,'#goals':275 };
const tagHue = t => {
  if (TAG_HUES[t] !== undefined) return TAG_HUES[t];
  let h = 0;
  for (let i = 0; i < t.length; i++) { h = t.charCodeAt(i) + ((h << 5) - h); h |= 0; }
  return Math.abs(h) % 360;
};
const isLightTheme = () => {
  try { return document.documentElement.dataset.theme === 'ghibli'; } catch { return false; }
};
const tagColor = t => isLightTheme()
  ? `hsl(${tagHue(t)},58%,34%)`   /* dark ink on a light ground */
  : `hsl(${tagHue(t)},65%,62%)`;  /* light ink on a dark ground */
