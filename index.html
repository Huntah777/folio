                  <svg style={{width:12,height:12,color:'var(--accent)',flexShrink:0}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  {linkUrl
                    ? <a href={linkUrl} target="_blank" rel="noopener noreferrer"
                        style={{flex:1,color:'var(--accent)',fontSize:13,textDecoration:'none',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'Manrope,sans-serif'}}
                        onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                        onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>
                        {l.title}
                      </a>
                    : <span style={{flex:1,color:'var(--text-secondary)',fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'Manrope,sans-serif'}}>{l.title} (blocked URL)</span>
                  }
                  <span style={{fontSize:11,color:'var(--text-muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160,flexShrink:0}}>
                    {linkUrl ? (() => { try { return new URL(linkUrl).hostname; } catch { return ''; } })() : ''}
                  </span>
                  <button onClick={()=>removeWebLink(l.id)} className="del-btn" style={{padding:'2px 4px',flexShrink:0}} title="Remove link">
                    <svg style={{width:11,height:11}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>;
              })}
            </div>
          </div>
        )}

        {/* legacy images not yet placed inline */}
        {(()=>{
          const inlineIds = new Set(bodyParts.filter(p=>p.type==='image').map(p=>p.id));
          const orphans = (note.images||[]).filter(img=>!inlineIds.has(img.id));
          if (!orphans.length) return null;
          return <div style={{marginTop:20}}>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase'}}>Images</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:14}}>
              {orphans.map(img=>{
                const imgSrc = safeImageSrc(img.src);
                return <div key={img.id} style={{position:'relative',maxWidth:'100%',background:'var(--bg-surface)',borderRadius:10,overflow:'hidden',border:'1px solid var(--border)'}}>
                  {imgSrc && <img src={imgSrc} alt={img.alt} style={{display:'block',maxWidth:'100%',maxHeight:280,objectFit:'contain'}}/>}
                  <button onClick={()=>upNote({images:(note.images||[]).filter(x=>x.id!==img.id)})}
                    style={{position:'absolute',top:6,right:6,background:'rgba(0,0,0,.75)',border:'none',borderRadius:5,color:'#fff',cursor:'pointer',width:22,height:22,fontSize:13,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
                  <input value={img.caption||''} onChange={e=>upNote({images:(note.images||[]).map(x=>x.id===img.id?{...x,caption:e.target.value}:x)})}
                    placeholder="Add caption…" style={{display:'block',width:'100%',background:'transparent',border:'none',borderTop:'1px solid var(--border)',color:'var(--text-secondary)',fontSize:11.5,padding:'6px 10px',outline:'none'}}/>
                </div>;
              })}
            </div>
          </div>;
        })()}
      </div>

      {/* ── linked notes bar ── */}
      {linkedNotes.length>0 && (
        <div style={{padding:'8px 32px',borderTop:'1px solid var(--border)',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',flexShrink:0}}>
          <span style={{fontSize:11,color:'var(--text-muted)',flexShrink:0}}>Linked:</span>
          {linkedNotes.map(n=>(
            <span key={n.id}
              style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--bg-surface)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 8px',fontSize:12,cursor:'pointer',transition:'border-color 110ms'}}
              onClick={()=>update('ui',{...state.ui,noteId:n.id})}
              onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
              <span style={{fontSize:12}}>{n.emoji||'📝'}</span>
              <span style={{color:'var(--text-tertiary)'}}>{n.title||'Untitled'}</span>
              <span onClick={e=>{e.stopPropagation();removeLink(n.id);}} className="del-btn" style={{marginLeft:2,padding:'0 2px',fontSize:13,lineHeight:1}}>×</span>
            </span>
          ))}
        </div>
      )}

      {/* ── footer ── */}
      <div style={{padding:'8px 32px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <span style={{fontSize:11,color:'var(--text-muted)',display:'flex',flexDirection:'column',gap:1}}>
          {note.created&&<span>Created <span style={{color:'var(--text-secondary)'}}>{new Date(note.created).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span></span>}
          <span>Updated <span style={{color:'var(--text-secondary)'}}>{new Date(note.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span></span>
        </span>
        <button onClick={()=>{
            if(confirm('Delete this note?')){
              const id = note.id;
              purgeNoteFiles(state.notes, id);
              update('notes', prev => (prev||state.notes).filter(n=>n.id!==id));
              update('notesDeleted', prev => [...(prev||[]), { id, deletedAt: Date.now() }]);
              update('ui', {...state.ui, noteId:null});
            }
          }}
          className="del-btn" style={{fontSize:12,gap:5}}>
          <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Delete note
        </button>
      </div>
    </div>
  );
}

/* ── NoteTabs — in-app tab strip for switching between open notes ──
   Not browser tabs: this is a single-page app, so each "tab" is just an entry
   in a device-local id list with the editor rendering whichever is active.
   Horizontally scrollable rather than shrinking tabs to nothing, so a title
   stays readable no matter how many are open. */
function NoteTabs({ notes, openIds, activeId, onSelect, onClose, fullView, onToggleFullView, isMobile }) {
  const stripRef = useRef(null);
  const activeRef = useRef(null);

  /* Keep the active tab in view when it changes from outside the strip —
     clicking a note in the list, or closing the tab to its right. */
  useEffect(() => {
    activeRef.current?.scrollIntoView({ block:'nearest', inline:'nearest' });
  }, [activeId]);

  /* A vertical wheel over a horizontal strip should scroll it, not the page. */
  const onWheel = e => {
    const el = stripRef.current;
    if (!el || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if (el.scrollWidth <= el.clientWidth) return;
    el.scrollLeft += e.deltaY;
  };

  const tabs = openIds.map(id => notes.find(n => n.id === id)).filter(Boolean);
  if (!tabs.length && !fullView) return null;

  return (
    <div style={{display:'flex',alignItems:'stretch',borderBottom:'1px solid var(--border)',background:'var(--bg-base)',flexShrink:0,minWidth:0}}>
      <div ref={stripRef} onWheel={onWheel} className="scrollbar"
        style={{display:'flex',alignItems:'stretch',gap:2,overflowX:'auto',overflowY:'hidden',flex:1,minWidth:0,padding:'4px 4px 0'}}>
        {tabs.map(n => {
          const active = n.id === activeId;
          return (
            <div key={n.id} ref={active ? activeRef : null}
              onClick={()=>onSelect(n.id)}
              /* Middle-click closes, matching every other tabbed interface. */
              onAuxClick={e=>{ if (e.button === 1) { e.preventDefault(); onClose(n.id); } }}
              title={n.title || 'Untitled'}
              style={{
                display:'flex',alignItems:'center',gap:6,flexShrink:0,cursor:'pointer',
                maxWidth:isMobile?150:200,padding:'6px 8px 6px 10px',borderRadius:'7px 7px 0 0',
                background:active?'var(--bg-surface)':'transparent',
                border:'1px solid',
                borderColor:active?'var(--border)':'transparent',
                borderBottom:'none',
                color:active?'var(--text-primary)':'var(--text-secondary)',
                transition:'background 110ms,color 110ms',
              }}
              onMouseEnter={e=>{ if(!active) e.currentTarget.style.background='var(--bg-surface)'; }}
              onMouseLeave={e=>{ if(!active) e.currentTarget.style.background='transparent'; }}>
              <span style={{fontSize:12,flexShrink:0}}>{n.emoji||'📝'}</span>
              <span style={{fontSize:12,fontWeight:active?600:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',minWidth:0}}>
                {n.title || 'Untitled'}
              </span>
              <span onClick={e=>{e.stopPropagation();onClose(n.id);}} title="Close tab"
                style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',width:15,height:15,borderRadius:4,opacity:.55,fontSize:14,lineHeight:1}}
                onMouseEnter={e=>{e.currentTarget.style.opacity=1;e.currentTarget.style.background='var(--border-strong)';}}
                onMouseLeave={e=>{e.currentTarget.style.opacity=.55;e.currentTarget.style.background='transparent';}}>×</span>
            </div>
          );
        })}
      </div>
      {/* Desktop only — on mobile the editor is already full-bleed, so this
          would only hide the bottom nav bar with no equivalent gain. */}
      {!isMobile && (
        <button onClick={onToggleFullView}
          title={fullView ? 'Exit full view (Esc)' : 'Full view — hide the sidebar and note list'}
          style={{flexShrink:0,alignSelf:'center',background:fullView?'var(--accent)':'transparent',border:'1px solid',borderColor:fullView?'var(--accent)':'var(--border)',borderRadius:6,color:fullView?'#fff':'var(--text-secondary)',cursor:'pointer',padding:'4px 7px',margin:'0 6px',display:'flex',alignItems:'center',gap:4,fontSize:11,fontFamily:'Manrope,sans-serif'}}>
          <span style={{width:12,height:12,display:'flex'}}>{fullView ? Ic.shrink : Ic.expand}</span>
          {fullView ? 'Exit' : 'Full'}
        </button>
      )}
    </div>
  );
}

/* ── NotesView ── */
/* fullView/setFullView are owned by App — full view also hides the sidebar and
   the cover banner, which live outside this component. */
function NotesView({ state, update, isMobile, fullView, setFullView }) {
  const [search, setSearch] = useState('');
  const [listWidth, setListWidth] = useState(280);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [ctxMenu, setCtxMenu] = useState(null);
  const [dateFilter, setDateFilter] = useState(null); // 'YYYY-MM-DD' or null
  const [showCal, setShowCal] = useState(false);
  const calBtnRef = useRef(null);
  const [favOnly, setFavOnly] = useState(false);
  const filterTag = state.ui.filterTag || '';
  const filterFolder = state.ui.folderId || null;
  const setFilterTag = t => update('ui',{...state.ui,filterTag:t});
  const noteId = state.ui.noteId;

  /* ── open tabs (device-local, see NoteTabsPref) ── */
  const [openIds, setOpenIds] = useState(() => NoteTabsPref.get());
  useEffect(() => { NoteTabsPref.set(openIds); }, [openIds]);

  /* Any note that becomes active gets a tab — so the existing "click a note in
     the list" paths need no changes, and a note opened on another device (ui.noteId
     syncs) surfaces here too. Also drops tabs for notes that no longer exist,
     which is how a tab disappears when its note is deleted or synced away. */
  useEffect(() => {
    setOpenIds(prev => {
      const live = prev.filter(id => state.notes.some(n => n.id === id));
      let next = (noteId && !live.includes(noteId)) ? [...live, noteId] : live;
      /* Evict oldest-first when over the cap, but never the note being edited —
         otherwise the strip could stop showing the very note on screen. */
      while (next.length > MAX_NOTE_TABS) {
        const dropIdx = next.findIndex(id => id !== noteId);
        if (dropIdx === -1) break;
        next = next.filter((_, i) => i !== dropIdx);
      }
      return next.length === prev.length && next.every((id,i) => id === prev[i]) ? prev : next;
    });
  }, [noteId, state.notes]);

  const openNote = id => update('ui', { ...state.ui, noteId: id });

  /* Computed from the current list rather than inside a setOpenIds updater:
     updaters can run during the render phase, and calling update() (which sets
     state in App) from there is an update-while-rendering. */
  const closeTab = id => {
    const idx = openIds.indexOf(id);
    const next = openIds.filter(x => x !== id);
    setOpenIds(next);
    /* Closing the active tab moves to its neighbour — the one on the right,
       falling back to the left — rather than dumping you on an empty editor. */
    if (id === noteId) openNote(next[idx] ?? next[idx - 1] ?? null);
  };

  const filterFolderDescIds = useMemo(
    () => filterFolder ? new Set(getFolderDescIds(filterFolder, state.folders||[])) : null,
    [filterFolder, state.folders]
  );
  const filtered = useMemo(() => state.notes.filter(n => {
    const q = search.toLowerCase();
    const dateStr = n.created ? new Date(n.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}).toLowerCase() : '';
    const matchQ = !q || n.title.toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q) || dateStr.includes(q);
    const matchT = !filterTag || n.tags.includes(filterTag);
    const matchF = !filterFolderDescIds || filterFolderDescIds.has(n.folderId);
    const matchD = !dateFilter || (n.created && fmtKey(new Date(n.created)) === dateFilter);
    const matchFav = !favOnly || n.pinned;
    return matchQ && matchT && matchF && matchD && matchFav;
  }), [state.notes, search, filterTag, filterFolderDescIds, dateFilter, favOnly]);

  const grouped = useMemo(() => {
    const today = todayKey();
    const yesterday = fmtKey(new Date(Date.now() - 86400000));
    const byKey = {};
    [...filtered].sort((a,b)=>(b.created||0)-(a.created||0)).forEach(n => {
      const key = n.created ? fmtKey(new Date(n.created)) : '0000-00-00';
      const label = key === today ? 'Today' : key === yesterday ? 'Yesterday' :
        (n.created ? new Date(n.created).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : 'Unknown');
      if (!byKey[key]) byKey[key] = { label, items:[] };
      byKey[key].items.push(n);
    });
    return Object.entries(byKey).sort(([a],[b])=>b.localeCompare(a)).map(([,v])=>v);
  }, [filtered]);

  const newNote = () => {
    const n = { id:uid(), emoji:'📝', title:'', body:'', tags:[], links:[], images:[], files:[], folderId: filterFolder||null, created:Date.now(), updated:Date.now() };
    update('notes', [n, ...state.notes]);
    update('ui', {...state.ui, noteId:n.id});
  };

  /* ── import a PDF as its own note ──
     Uploads the file to R2, then extracts its text into the note body so the
     PDF's contents are reachable by the same search and tagging as any other
     note. The [pdf:…] marker at the top renders the document itself. */
  const pdfNoteInputRef = useRef(null);
  const [importing, setImporting] = useState(null); /* null | {label, error} */
  const [dragOver, setDragOver]   = useState(false);

  const importPdfAsNote = async (file) => {
    if (!file) return;
    if (file.type !== 'application/pdf') { setImporting({ label:'Not a PDF file', error:true }); return; }
    if (file.size > MAX_PDF_BYTES) { setImporting({ label:`Too large — max ${fmtBytes(MAX_PDF_BYTES)}`, error:true }); return; }
    try {
      setImporting({ label:`Uploading ${file.name}…` });
      const bytes = await file.arrayBuffer();
      const meta  = await Files.upload(file);

      let extracted = { text:'', pages:0, truncated:false };
      try {
        setImporting({ label:'Reading text…' });
        extracted = await extractPdfText(bytes, (p, total) =>
          setImporting({ label:`Reading text… page ${p} of ${total}` }));
      } catch {
        /* A PDF that resists text extraction (scanned, or DRM'd) is still
           perfectly good as an attachment — keep the note, skip the text. */
      }

      const fileId = uid();
      const rec = { id:fileId, key:meta.key, name:meta.name, size:meta.size, type:meta.type, uploadedAt:Date.now() };
      const title = (file.name || 'document.pdf').replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim() || 'Untitled PDF';

      const parts = [`[pdf:${fileId}]`];
      if (extracted.text) {
        parts.push('---', extracted.text);
        if (extracted.truncated) parts.push(`\n_Text extraction truncated at ${fmtBytes(MAX_PDF_TEXT)} — the full document is attached above._`);
      } else {
        parts.push('---', '_No selectable text found in this PDF (it may be a scan). The document is attached above._');
      }

      const n = {
        id:uid(), emoji:'📄', title, body:parts.join('\n\n'),
        tags:[], links:[], images:[], files:[rec],
        folderId: filterFolder||null, created:Date.now(), updated:Date.now(),
      };
      update('notes', [n, ...state.notes]);
      update('ui', {...state.ui, noteId:n.id});
      setImporting(null);
    } catch (err) {
      setImporting({ label: pdfErrorLabel(err), error:true });
    }
  };

  const togglePin = (e, id) => {
    e.stopPropagation();
    update('notes', state.notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n));
  };
  const deleteNote = id => {
    purgeNoteFiles(state.notes, id);
    update('notes', state.notes.filter(n=>n.id!==id));
    update('notesDeleted', [...(state.notesDeleted||[]), { id, deletedAt: Date.now() }]);
    if (noteId===id) update('ui',{...state.ui,noteId:null});
    setSelectedIds(prev=>{ const s=new Set(prev); s.delete(id); return s; });
  };
  const toggleSelect = (e, id) => {
    e.stopPropagation();
    setSelectedIds(prev=>{ const s=new Set(prev); s.has(id)?s.delete(id):s.add(id); return s; });
  };
  const deleteSelected = () => {
    purgeNoteFiles(state.notes, selectedIds);
    update('notes', state.notes.filter(n=>!selectedIds.has(n.id)));
    update('notesDeleted', [...(state.notesDeleted||[]), ...[...selectedIds].map(id => ({ id, deletedAt: Date.now() }))]);
    if (selectedIds.has(noteId)) update('ui',{...state.ui,noteId:null});
    setSelectedIds(new Set());
  };
  const selectAll = () => setSelectedIds(new Set(filtered.map(n=>n.id)));
  const clearSel  = () => setSelectedIds(new Set());

  const selectedNote = state.notes.find(n=>n.id===noteId);
  /* Ranked by how often you actually use them, so the filter bar's visible
     slots go to the tags that earn them — see TagFilterBar. */
  const noteTagRanked = useMemo(()=>tagCounts(state.notes), [state.notes]);
  const noteTagCounts = useMemo(()=>new Map(noteTagRanked), [noteTagRanked]);
  const allTags       = useMemo(()=>noteTagRanked.map(([t])=>t), [noteTagRanked]);

  /* Mobile: full-screen editor with back button */
  if (isMobile && noteId && selectedNote) {
    return (
      <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
        <div style={{padding:'calc(10px + env(safe-area-inset-top,0px)) 10px 6px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',flexShrink:0}}>
          <button onClick={()=>update('ui',{...state.ui,noteId:null})}

              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/>

          <button className="btn-primary" onClick={newNote} title="New note" style={{padding:0,width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>

        {filtered.length===0 && <div style={{color:'var(--text-muted)',fontSize:13,padding:'20px 4px'}}>No notes found.</div>}
        {grouped.map(g=>(
          <div key={g.label}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.07em',color:'var(--text-muted)',textTransform:'uppercase',padding:'10px 4px 6px'}}>{g.label}</div>
            {g.items.map(n=>{
              const folder = (state.folders||[]).find(f=>f.id===n.folderId);
              const checked = selectedIds.has(n.id);

                <div key={n.id}
                  className={`note-card card fadeUp ${noteId===n.id&&!checked?'sel':''} ${checked?'checked':''}`}

                  onContextMenu={e=>{e.preventDefault();setCtxMenu({x:e.clientX,y:e.clientY,id:n.id});}}>
                  {/* pin/favourite button — visible on hover, or always if pinned */}
                  <button className={`note-pin${n.pinned?' on':''}`} onClick={e=>togglePin(e,n.id)} title={n.pinned?'Unpin note':'Pin note'}>
                    <svg style={{width:12,height:12}} viewBox="0 0 24 24" fill={n.pinned?'currentColor':'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                  </button>
                  {/* trash button — visible on hover */}
                  <button className="note-del" onClick={e=>{e.stopPropagation();deleteNote(n.id);}} title="Delete note">
                    <svg style={{width:12,height:12}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                  </button>
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:5,paddingRight:56}}>
                    {/* select checkbox */}
                    <span className={`note-cb tick${checked?' on':''}`} onClick={e=>toggleSelect(e,n.id)} style={{width:15,height:15,borderRadius:4,flexShrink:0}}>
                      {checked&&<svg style={{width:8,height:8}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                    </span>
                    <span style={{fontSize:16,flexShrink:0}}>{n.emoji||'📝'}</span>
                    <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{n.title||'Untitled'}</span>
                    {folder&&!filterFolder&&<span style={{fontSize:10,color:'var(--accent)',flexShrink:0,maxWidth:54,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📁{folder.name}</span>}
                  </div>
                  <div style={{fontSize:12,color:'var(--text-secondary)',overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',lineHeight:1.5,marginBottom:6,wordBreak:'break-word'}}>
                    {notePreview(n.body)}
                  </div>
                  {n.tags.length>0&&(
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                      {n.tags.slice(0,3).map(t=>(
                        <span key={t} className="tag" style={{background:`${tagColor(t)}15`,color:tagColor(t),fontSize:10}}>{t}</span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
        {/* bulk action bar */}
        {selectedIds.size>0&&(
          <div className="bulk-bar">
            <span style={{fontSize:12,color:'var(--text-secondary)',flex:1}}>{selectedIds.size} selected</span>
            <button onClick={selectAll} style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',fontSize:12,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>All</button>
            <button onClick={clearSel}  style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',fontSize:12,padding:'4px 10px',cursor:'pointer',fontFamily:'Manrope,sans-serif'}}>Clear</button>
            <button onClick={deleteSelected} className="del-btn" style={{border:'1px solid rgba(244,63,94,.3)',borderRadius:6,padding:'4px 12px',fontSize:12,gap:5,fontFamily:'Manrope,sans-serif',fontWeight:600,color:'var(--danger)',background:'rgba(244,63,94,.08)'}}>
              <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              Delete {selectedIds.size}
            </button>
          </div>
        )}
        {/* right-click context menu */}
        {ctxMenu&&(
          <ContextMenu x={ctxMenu.x} y={ctxMenu.y} onClose={()=>setCtxMenu(null)} items={[
            {label:'Select', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{width:13,height:13}}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
              fn:()=>setSelectedIds(prev=>{const s=new Set(prev);s.add(ctxMenu.id);return s;})},
            'sep',
            {label:'Delete note', danger:true, icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{width:13,height:13}}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>,
              fn:()=>deleteNote(ctxMenu.id)},
          ]}/>
        )}
      </div>
    </div>
  );

  if (isMobile) {
    return <div style={{display:'flex',height:'100%',overflow:'hidden'}}>{listPanel}</div>;
  }

  /* Full view drops the list panel (and, via App, the sidebar and cover banner)
     so the editor gets the whole page. Only meaningful with a note open —
     otherwise there'd be nothing left on screen. */
  const editorPane = (
    <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <NoteTabs notes={state.notes} openIds={openIds} activeId={noteId}
        onSelect={openNote} onClose={closeTab}
        fullView={fullView} onToggleFullView={()=>setFullView(v=>!v)} isMobile={isMobile}/>
      <NoteEditor note={selectedNote} state={state} update={update} isMobile={isMobile}/>
    </div>
  );

  if (fullView && selectedNote) {
    return <div style={{display:'flex',height:'100%',overflow:'hidden'}}>{editorPane}</div>;
  }

  return (
    <div style={{display:'flex',height:'100%',overflow:'hidden'}}>
      {listPanel}
      {/* drag-to-resize handle */}
      <div className="resize-handle"
        onMouseDown={e => {
          const startX = e.clientX, startW = listWidth;
          const onMove = mv => setListWidth(Math.max(160, Math.min(500, startW + mv.clientX - startX)));
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
          };
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          e.preventDefault();
        }}
      />
      {editorPane}
    </div>
  );
}

/* ── TasksView ── */
function TasksView({ state, update, isMobile, pom, setPom }) {
  const [newTitle, setNewTitle] = useState('');
  const [newPrio, setNewPrio] = useState('medium');
  const [newDue, setNewDue] = useState('');
  const [newTags, setNewTags] = useState([]);
  const [newTimeBlock, setNewTimeBlock] = useState('');
  const [newPomWork, setNewPomWork] = useState(25);
  const [newPomBreak, setNewPomBreak] = useState(5);
  const [blockerEdit, setBlockerEdit] = useState(null);
  const [noteEditing, setNoteEditing] = useState({});
  const [expanded, setExpanded] = useState({});
  const [subInput, setSubInput] = useState({});
  const [editing, setEditing] = useState(null);
  const [editingSub, setEditingSub] = useState(null);
  const [selectedTaskIds, setSelectedTaskIds] = useState(new Set());
  const [ctxMenu, setCtxMenu] = useState(null);
  const [tagFilter, setTagFilter] = useState(() => state.ui.filterTag || '');
  /* The Tags view navigates here with ui.filterTag set. Consume it into this
     view's own filter and clear it, so it applies once rather than pinning the
     screen to that tag for the rest of the session. */
  useEffect(() => {
    if (!state.ui.filterTag) return;
    setTagFilter(state.ui.filterTag);
    update('ui', { ...state.ui, filterTag:'' });
  }, [state.ui.filterTag]);

  const toggleTask = id => update('tasks', state.tasks.map(t=>t.id===id?{...t,done:!t.done,updated:Date.now()}:t));
  const toggleSub = (tid,sid) => update('tasks', state.tasks.map(t=>t.id===tid?{...t,subtasks:t.subtasks.map(s=>s.id===sid?{...s,done:!s.done}:s),updated:Date.now()}:t));
  const delTask = id => {
    update('tasks', state.tasks.filter(t=>t.id!==id));
    update('tasksDeleted', [...(state.tasksDeleted||[]), { id, deletedAt: Date.now() }]);
    setSelectedTaskIds(p=>{const s=new Set(p);s.delete(id);return s;});
  };
  const toggleTaskSel = (e,id) => { e.stopPropagation(); setSelectedTaskIds(p=>{const s=new Set(p);s.has(id)?s.delete(id):s.add(id);return s;}); };
  const deleteSelectedTasks = () => {
    update('tasks',state.tasks.filter(t=>!selectedTaskIds.has(t.id)));
    update('tasksDeleted', [...(state.tasksDeleted||[]), ...[...selectedTaskIds].map(id => ({ id, deletedAt: Date.now() }))]);
    setSelectedTaskIds(new Set());
  };
  const addTaskTag = (id, tag) => {
    const c=tag.startsWith('#')?tag:'#'+tag;
    update('tasks',state.tasks.map(t=>t.id===id&&!(t.tags||[]).includes(c)?{...t,tags:[...(t.tags||[]),c],updated:Date.now()}:t));
    if (!state.tags.includes(c)) update('tags',[...state.tags,c]);
  };
  const removeTaskTag = (id, tag) => update('tasks',state.tasks.map(t=>t.id===id?{...t,tags:(t.tags||[]).filter(tg=>tg!==tag),updated:Date.now()}:t));
  /* Whole-set write, for the tag picker — it hands back the final list rather
     than one add or one remove at a time. Any genuinely new tag is registered
     in state.tags so it shows up as an option everywhere else. */
  const setTaskTags = (id, next) => {
    update('tasks', state.tasks.map(t => t.id===id ? {...t, tags:next, updated:Date.now()} : t));
    const fresh = next.filter(tg => !state.tags.includes(tg));
    if (fresh.length) update('tags', [...state.tags, ...fresh]);
  };
  const taskOnlyTags = useMemo(() => [...new Set(
    state.tasks.flatMap(t => t.tags||[]),
  )].sort((a,b)=>a.localeCompare(b)), [state.tasks]);

  const addTask = e => {
    e.preventDefault();
    if(!newTitle.trim()) return;
    const task = {id:uid(),title:newTitle,done:false,priority:newPrio,due:newDue,tags:newTags,subtasks:[],created:Date.now(),updated:Date.now(),pomWork:Number(newPomWork)||25,pomBreak:Number(newPomBreak)||5};
    if (newTimeBlock) task.timeBlock = Number(newTimeBlock);
    update('tasks',[task,...state.tasks]);
    const freshTags = newTags.filter(tg=>!state.tags.includes(tg));
    if (freshTags.length) update('tags',[...state.tags,...freshTags]);
    setNewTitle(''); setNewDue(''); setNewPrio('medium'); setNewTags([]); setNewTimeBlock(''); setNewPomWork(25); setNewPomBreak(5);
  };
  const cancelAdd = () => { setNewTitle(''); setNewDue(''); setNewPrio('medium'); setNewTags([]); setNewTimeBlock(''); setNewPomWork(25); setNewPomBreak(5); };
  const addSub = (tid) => {
    const v = subInput[tid]||'';
    if(!v.trim()) return;
    update('tasks',state.tasks.map(t=>t.id===tid?{...t,subtasks:[...t.subtasks,{id:uid(),title:v,done:false}],updated:Date.now()}:t));
    setSubInput({...subInput,[tid]:''});
  };
  const startEdit = t => setEditing({ id:t.id, title:t.title, priority:t.priority||'medium', due:t.due||'', tags:t.tags||[], timeBlock:t.timeBlock??'', pomWork:t.pomWork??25, pomBreak:t.pomBreak??5 });
  const saveEdit = e => {
    e.preventDefault();
    if(!editing.title.trim()) return;
    update('tasks', state.tasks.map(t=>t.id===editing.id?{...t,title:editing.title,priority:editing.priority,due:editing.due,tags:editing.tags||[],timeBlock:editing.timeBlock?Number(editing.timeBlock):null,pomWork:Number(editing.pomWork)||25,pomBreak:Number(editing.pomBreak)||5,updated:Date.now()}:t));
    const newTags = (editing.tags||[]).filter(tg=>!state.tags.includes(tg));
    if (newTags.length) update('tags',[...state.tags,...newTags]);
    setEditing(null);
  };
  const startEditSub = (tid,s) => setEditingSub({ tid, sid:s.id, title:s.title });
  const saveEditSub = e => {
    e.preventDefault();
    if(!editingSub.title.trim()) return;
    update('tasks', state.tasks.map(t=>t.id===editingSub.tid?{...t,subtasks:t.subtasks.map(s=>s.id===editingSub.sid?{...s,title:editingSub.title}:s),updated:Date.now()}:t));
    setEditingSub(null);
  };
  const delSub = (tid,sid) => update('tasks', state.tasks.map(t=>t.id===tid?{...t,subtasks:t.subtasks.filter(s=>s.id!==sid),updated:Date.now()}:t));

  const updateTaskNotes = (id, text) =>
    update('tasks', state.tasks.map(t => t.id===id ? {...t, taskNotes:text, updated:Date.now()} : t));

  const promoteToNote = t => {
    const subList = (t.subtasks||[]).map(s=>`- [${s.done?'x':' '}] ${s.title}`).join('\n');
    const parts = [];
    if (t.taskNotes) parts.push(t.taskNotes);
    if (subList) parts.push(`## Checklist\n\n${subList}`);
    const body = parts.join('\n\n');
    const n = {id:uid(),emoji:'📝',title:t.title,body,tags:t.tags||[],links:[],images:[],files:[],folderId:null,created:Date.now(),updated:Date.now()};
    update('notes',[n,...state.notes]);
    update('ui',{...state.ui,view:'notes',noteId:n.id});
  };

  const PRIO_ORDER = { high:0, medium:1, low:2, none:3 };
  const byPrio = arr => [...arr].sort((a,b)=>(PRIO_ORDER[a.priority||'none']??3)-(PRIO_ORDER[b.priority||'none']??3));
  const taskFilter = t => !tagFilter || (t.tags||[]).includes(tagFilter);
  const taskTagRanked = useMemo(()=>tagCounts(state.tasks), [state.tasks]);
  const taskTagCounts = useMemo(()=>new Map(taskTagRanked), [taskTagRanked]);
  const allTaskTags   = useMemo(()=>taskTagRanked.map(([t])=>t), [taskTagRanked]);

  const groups = [
    { label:'Today',    items: byPrio(state.tasks.filter(t=>!t.done&&t.due===todayKey()&&taskFilter(t))) },
    { label:'Upcoming', items: byPrio(state.tasks.filter(t=>!t.done&&t.due&&t.due!==todayKey()&&taskFilter(t))) },
    { label:'No date',  items: byPrio(state.tasks.filter(t=>!t.done&&!t.due&&taskFilter(t))) },
    { label:'Done',     items: state.tasks.filter(t=>t.done&&taskFilter(t)) },
  ];
  const visibleIds = groups.flatMap(g=>g.items.map(t=>t.id));
  const allVisibleSelected = visibleIds.length>0 && visibleIds.every(id=>selectedTaskIds.has(id));
  const toggleSelectAll = () => setSelectedTaskIds(allVisibleSelected ? new Set() : new Set(visibleIds));

  return (
    <div style={{flex:1,overflow:'auto',padding:isMobile?'20px 14px':'28px 32px'}} className="scrollbar">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:allTaskTags.length?10:20}}>
        <h1 style={{fontFamily:'Fraunces,serif',fontSize:isMobile?22:26,fontWeight:600}}>Tasks</h1>
        {visibleIds.length>0&&(
          <button onClick={toggleSelectAll}
            style={{background:'none',border:'1px solid var(--border)',borderRadius:7,color:allVisibleSelected?'var(--accent)':'var(--text-secondary)',padding:'5px 10px',cursor:'pointer',fontSize:isMobile?11:12,flexShrink:0}}>
            {allVisibleSelected?'Deselect all':'Select all'}
          </button>
        )}
      </div>
      {allTaskTags.length>0&&(
        <div style={{marginBottom:18}}>
          <TagFilterBar tags={allTaskTags} counts={taskTagCounts} value={tagFilter} onChange={setTagFilter}/>
        </div>
      )}

      {/* add task */}
      <form onSubmit={addTask} style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center',marginBottom:24,background:'var(--bg-surface-2)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:'9px 10px 9px 16px',boxShadow:'var(--shadow-1),inset 0 1px 0 var(--hairline)'}}>
        <input className="input" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="New task…" style={{flex:'1 1 160px',minWidth:0,background:'transparent',border:'none',padding:0,fontSize:14}}/>
        <div style={{display:'flex',gap:8,flexShrink:0,flexWrap:'wrap',...(isMobile?{width:'100%'}:{})}}>
          <select value={newPrio} onChange={e=>setNewPrio(e.target.value)} style={{background:'var(--fill)',border:'1px solid var(--hairline)',borderRadius:'var(--r-pill)',color:PRIO[newPrio],fontSize:12,fontWeight:600,padding:'6px 10px',cursor:'pointer',outline:'none',fontFamily:'Manrope,sans-serif'}}>
            {Object.keys(PRIO).map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <DateField value={newDue} onChange={setNewDue} placeholder="Due date"/>
          <button className="btn-primary" type="submit" style={{padding:'7px 18px',fontSize:13,flexShrink:0}}>Add</button>
          {(newTitle||newDue)&&(
            <button type="button" onClick={cancelAdd} className="btn-ghost" style={{padding:'7px 14px',fontSize:13,flexShrink:0}}>Cancel</button>
          )}
        </div>
        {newTitle&&(
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',width:'100%',borderTop:'1px solid var(--border)',paddingTop:7,marginTop:1}}>
            {(newTags||[]).map(tg=>(
              <span key={tg} className="tag" style={{background:`${tagColor(tg)}22`,color:tagColor(tg),fontSize:11,padding:'3px 8px',borderRadius:99}}>
                {tg}<span onClick={()=>setNewTags(newTags.filter(x=>x!==tg))} style={{cursor:'pointer',marginLeft:3,opacity:.7}}>×</span>
              </span>
            ))}
            <TagEditor tags={newTags} allTags={taskOnlyTags} compact label="+ Tag"
              onChange={setNewTags}/>
            <div style={{flex:1}}/>
            <input type="number" min="1" value={newTimeBlock} onChange={e=>setNewTimeBlock(e.target.value)}
              placeholder="cap min" title="Time cap: max total minutes allowed"
              style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--warning)',fontSize:12,padding:'3px 7px',width:70,fontFamily:'Manrope,sans-serif'}}/>
            <input type="number" min="1" max="120" value={newPomWork} onChange={e=>setNewPomWork(e.target.value)}
              placeholder="work" title="Pomodoro focus duration (minutes)"
              style={{background:'var(--bg-surface)',border:'1px solid #818cf830',borderRadius:6,color:'var(--accent)',fontSize:12,padding:'3px 7px',width:54,fontFamily:'Manrope,sans-serif'}}/>
            <input type="number" min="1" max="60" value={newPomBreak} onChange={e=>setNewPomBreak(e.target.value)}
              placeholder="brk" title="Pomodoro break duration (minutes)"
              style={{background:'var(--bg-surface)',border:'1px solid #10b98130',borderRadius:6,color:'var(--success)',fontSize:12,padding:'3px 7px',width:46,fontFamily:'Manrope,sans-serif'}}/>
          </div>
        )}
      </form>

      {groups.map(g=>g.items.length===0?null:(
        <div key={g.label} style={{marginBottom:28}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:10}}>{g.label} <span style={{color:'var(--accent)'}}>({g.items.length})</span></div>
          {g.items.map(t=>(
            <div key={t.id} style={{marginBottom:6}}
              onContextMenu={e=>{e.preventDefault();setCtxMenu({x:e.clientX,y:e.clientY,id:t.id});}}>
              {editing&&editing.id===t.id ? (
                <form onSubmit={saveEdit} style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:8,background:'var(--modal-bg)',border:'1px solid var(--accent)'}}>
                  <input className="input" autoFocus value={editing.title} onChange={e=>setEditing({...editing,title:e.target.value})}
                    style={{flex:'1 1 140px',minWidth:0,background:'transparent',border:'none',padding:0,fontSize:13.5,color:'var(--text-primary)'}}/>
                  <div style={{display:'flex',gap:6,flexShrink:0,flexWrap:'wrap',...(isMobile?{width:'100%'}:{})}}>
                    <select value={editing.priority} onChange={e=>setEditing({...editing,priority:e.target.value})}
                      style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,color:PRIO[editing.priority],fontSize:12,padding:'3px 7px'}}>
                      {Object.keys(PRIO).map(p=><option key={p} value={p}>{p}</option>)}
                    </select>
                    <DateField value={editing.due} onChange={d=>setEditing({...editing,due:d})} placeholder="Due date"/>
                    <input type="number" min="1" value={editing.timeBlock} onChange={e=>setEditing({...editing,timeBlock:e.target.value})}
                      placeholder="cap (min)" title="Time cap: max total minutes allowed on this task"
                      style={{background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--warning)',fontSize:12,padding:'3px 7px',width:78}}/>
                    <input type="number" min="1" max="120" value={editing.pomWork} onChange={e=>setEditing({...editing,pomWork:e.target.value})}
                      placeholder="work" title="Pomodoro focus duration (minutes)"
                      style={{background:'var(--bg-surface)',border:'1px solid #818cf830',borderRadius:6,color:'var(--accent)',fontSize:12,padding:'3px 7px',width:56}}/>
                    <input type="number" min="1" max="60" value={editing.pomBreak} onChange={e=>setEditing({...editing,pomBreak:e.target.value})}
                      placeholder="break" title="Pomodoro break duration (minutes)"
                      style={{background:'var(--bg-surface)',border:'1px solid #10b98130',borderRadius:6,color:'var(--success)',fontSize:12,padding:'3px 7px',width:56}}/>
                    {/* tag management in edit */}
                    {(editing.tags||[]).map(tg=>(
                      <span key={tg} className="tag" style={{background:`${tagColor(tg)}22`,color:tagColor(tg),fontSize:11,padding:'3px 8px'}}>
                        {tg}<span onClick={()=>setEditing({...editing,tags:(editing.tags||[]).filter(x=>x!==tg)})} style={{cursor:'pointer',marginLeft:3,opacity:.7}}>×</span>
                      </span>
                    ))}
                    <TagEditor tags={editing.tags||[]} allTags={taskOnlyTags} compact
                      onChange={next=>setEditing({...editing,tags:next})}/>
                    <button className="btn-primary" type="submit" style={{padding:'4px 12px',fontSize:12}}>Save</button>
                    <button type="button" onClick={()=>setEditing(null)} style={{padding:'4px 10px',fontSize:12,background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',cursor:'pointer'}}>Cancel</button>
                  </div>
                </form>
              ) : (
                <div className="task-row" style={{display:'flex',alignItems:'center',gap:9,padding:'10px 13px',borderRadius:'var(--r-md)',background: selectedTaskIds.has(t.id)?'var(--accent-soft)':'var(--bg-surface-2)',border:`1px solid ${selectedTaskIds.has(t.id)?'var(--accent-ring)':t.blocked&&!t.done?'#f59e0b55':'var(--border)'}`,boxShadow:t.blocked&&!t.done?'inset 3px 0 0 var(--warning)':undefined,flexWrap:'wrap',transition:'background var(--dur) var(--ease),border-color var(--dur) var(--ease)'}}>
                  {/* select checkbox — bulk-edit affordance, see .task-sel */}
                  <span className={`tick task-sel${selectedTaskIds.has(t.id)?' on':''}`}
                    onClick={e=>toggleTaskSel(e,t.id)}
                    style={{width:15,height:15,borderRadius:4,flexShrink:0,opacity: selectedTaskIds.has(t.id)?1:undefined}}
                    title="Select">
                    {selectedTaskIds.has(t.id)&&<svg style={{width:8,height:8}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                  </span>
                  <span className={`tick${t.done?' on':''}`} onClick={()=>toggleTask(t.id)}>
                    {t.done&&<svg style={{width:10,height:10}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                  </span>
                  <span style={{fontSize:13.5,color:t.done?'var(--text-muted)':'var(--text-primary)',textDecoration:t.done?'line-through':'none',wordBreak:'break-word',overflowWrap:'anywhere',minWidth:0}}>{t.title}</span>
                  {t.blocked&&!t.done&&(
                    <span style={{fontSize:10,color:'var(--warning)',fontWeight:600,flexShrink:0,display:'flex',alignItems:'center',gap:3,background:'#f59e0b18',border:'1px solid #f59e0b33',borderRadius:99,padding:'2px 7px'}}>
                      <svg style={{width:9,height:9}} viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15" stroke="currentColor" strokeWidth="2.5"/></svg>
                      {t.blockedReason||'On hold'}
                    </span>
                  )}
                  {/* Capped: past two, tags stop labelling the row and start
                      competing with the title. The rest are reachable — and
                      removable — through this row's edit mode. */}
                  <TagChips tags={t.tags||[]} max={2} size={10} onPick={tg=>removeTaskTag(t.id,tg)}/>
                  {/* Quick tag edit — same picker as edit mode, so the row and
                      the form can't drift apart. Hidden until hover, like the
                      other row actions. */}
                  {!t.done&&(
                    <span className="task-tagbtn">
                      <TagEditor tags={t.tags||[]} allTags={taskOnlyTags} compact label="Tag"
                        onChange={next=>setTaskTags(t.id,next)}/>
                    </span>
                  )}
                  <div style={{flex:1}}/>
                  <span style={{width:8,height:8,borderRadius:99,background:PRIO[t.priority||'none'],flexShrink:0}}/>
                  {t.due&&(()=>{ const over = !t.done && t.due < todayKey(); const soon = !t.done && t.due === todayKey();
                    return <span style={{fontSize:11,fontWeight:over||soon?600:500,color:over?'var(--danger)':soon?'var(--warning)':'var(--text-secondary)',flexShrink:0,whiteSpace:'nowrap'}}
                      title={t.due}>{over?'Overdue · ':''}{friendlyDate(t.due)}</span>; })()}
                  {t.timeBlock&&<span style={{fontSize:10,color:'var(--warning)',display:'flex',alignItems:'center',gap:2,flexShrink:0}}
                    title={`Time cap: ${t.timeBlock}m${t.timeSpent?` · ${Math.round(t.timeSpent/60)}m spent`:''}`}>
                    <svg style={{width:9,height:9}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    {t.timeBlock}m
                  </span>}
                  {t.taskNotes&&!t.done&&(
                    <span style={{display:'flex',alignItems:'center',flexShrink:0,color:'var(--text-muted)'}} title="Has notes">
                      <svg style={{width:10,height:10}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    </span>
                  )}
                  <button onClick={()=>setExpanded({...expanded,[t.id]:!expanded[t.id]})} className="icon-btn"
                    style={{width:'auto',minWidth:30,gap:4,padding:'0 7px',color:expanded[t.id]?'var(--accent)':'var(--text-secondary)'}}
                    title={t.subtasks.length>0?`${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} subtasks`:'Add subtasks'}>
                    <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
                    {t.subtasks.length>0&&<span style={{fontSize:10,color:expanded[t.id]?'var(--accent)':'var(--text-muted)'}}>{t.subtasks.filter(s=>s.done).length}/{t.subtasks.length}</span>}
                  </button>
                  {!t.done&&(
                    <button onClick={()=>{
                      if(pom?.taskId===t.id) { pomPlayClick(pom,setPom,t); return; }
                      if(pom) pomStop(pom,setPom,state.tasks,update,state.tasks.find(x=>x.id===pom.taskId));
                      if(t.timeBlock){
                        const capSecs=t.timeBlock*60, endsAt=Date.now()+capSecs*1000;
                        const next={taskId:t.id,mode:'cap',phase:'work',remaining:capSecs,endsAt,
                          sessionsDone:0,workSecs:capSecs,breakSecs:0,paused:false,awaitingStart:false};
                        setPom(next);
                        schedulePomodoroNotification(buildPomNotif(next,t));
                      } else {
                        const workSecs=(t.pomWork??25)*60, endsAt=Date.now()+workSecs*1000;
                        const next={taskId:t.id,mode:'pomodoro',phase:'work',remaining:workSecs,endsAt,
                          sessionsDone:0,workSecs,breakSecs:(t.pomBreak??5)*60,paused:false,awaitingStart:false};
                        setPom(next);
                        schedulePomodoroNotification(buildPomNotif(next,t));
                      }
                    }} className="icon-btn"
                      title={pom?.taskId===t.id?(pom.awaitingStart?'Start next phase':pom.paused?'Resume timer':'Pause timer'):(t.timeBlock?`Start ${t.timeBlock}m cap timer`:'Start pomodoro')}
                      style={{color:pom?.taskId===t.id?(pom.awaitingStart||pom.paused?'var(--warning)':'var(--success)'):'var(--text-muted)'}}>
                      {pom?.taskId===t.id&&!pom.paused&&!pom.awaitingStart
                        ? <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        : <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                      }
                    </button>
                  )}
                  {!t.done&&(
                    <div style={{position:'relative'}}>
                      <button
                        onClick={()=>{
                          if(t.blocked){
                            update('tasks',state.tasks.map(t2=>t2.id===t.id?{...t2,blocked:false,blockedReason:'',updated:Date.now()}:t2));
                          } else {
                            setBlockerEdit(blockerEdit?.id===t.id?null:{id:t.id,reason:''});
                          }
                        }}
                        className="icon-btn"
                        title={t.blocked?`On hold${t.blockedReason?': '+t.blockedReason:''} — click to remove flag`:'Flag as on hold / waiting'}
                        style={{color:t.blocked?'var(--warning)':'var(--text-muted)'}}>
                        <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill={t.blocked?'currentColor':'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                          <line x1="4" y1="22" x2="4" y2="15"/>
                        </svg>
                      </button>
                      {blockerEdit?.id===t.id&&(
                        <div style={{position:'absolute',right:0,top:'calc(100% + 4px)',zIndex:60,background:'var(--bg-surface)',border:'1px solid var(--border-strong)',borderRadius:10,padding:'12px',minWidth:210,boxShadow:'0 8px 24px rgba(0,0,0,.5)'}}>
                          <div style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:8}}>Flag as on hold</div>
                          <input autoFocus placeholder="Waiting for… (optional)"
                            value={blockerEdit.reason}
                            onChange={e=>setBlockerEdit({...blockerEdit,reason:e.target.value})}
                            onKeyDown={e=>{
                              if(e.key==='Enter'){e.preventDefault();update('tasks',state.tasks.map(t2=>t2.id===t.id?{...t2,blocked:true,blockedReason:blockerEdit.reason,updated:Date.now()}:t2));setBlockerEdit(null);}
                              if(e.key==='Escape')setBlockerEdit(null);
                            }}
                            style={{width:'100%',background:'var(--bg-surface-2)',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-primary)',fontSize:12,padding:'5px 8px',outline:'none',fontFamily:'Manrope,sans-serif',boxSizing:'border-box'}}/>
                          <div style={{display:'flex',gap:6,marginTop:8}}>
                            <button onClick={()=>{update('tasks',state.tasks.map(t2=>t2.id===t.id?{...t2,blocked:true,blockedReason:blockerEdit.reason,updated:Date.now()}:t2));setBlockerEdit(null);}}
                              className="btn-primary" style={{fontSize:11,padding:'4px 12px'}}>Flag it</button>
                            <button onClick={()=>setBlockerEdit(null)}
                              style={{background:'none',border:'1px solid var(--border-strong)',borderRadius:6,color:'var(--text-secondary)',fontSize:11,padding:'4px 10px',cursor:'pointer'}}>Cancel</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                  {!t.done&&(
                    <button onClick={()=>startEdit(t)} className="icon-btn" title="Edit task">
                      <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                  )}
                  <button onClick={()=>delTask(t.id)} className="icon-btn danger" title="Delete task">
                    <svg style={{width:13,height:13}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                  </button>
                </div>
              )}
              {expanded[t.id]&&(
                <div style={{paddingLeft:32,marginTop:4}}>
                  {/* subtasks */}
                  {t.subtasks.map(s=>(
                    <div key={s.id}>
                      {editingSub&&editingSub.tid===t.id&&editingSub.sid===s.id ? (

                          <span className={`tick${s.done?' on':''}`} onClick={()=>toggleSub(t.id,s.id)} style={{width:14,height:14,borderRadius:4}}>
                            {s.done&&<svg style={{width:8,height:8}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                          </span>
                          <span style={{flex:1,fontSize:12.5,color:s.done?'var(--text-muted)':'var(--text-tertiary)',textDecoration:s.done?'line-through':'none'}}>{s.title}</span>

                            <button onClick={()=>startEditSub(t.id,s)} className="del-btn" style={{color:'var(--text-muted)',padding:'2px 3px'}} title="Edit subtask">

                            </button>
